젝트: [입력]\n이번 시험 주소: [입력]\n준비 정보: 최신 앱, 게시 문서, 에듀집 등록 내용, 보완 요청이 있다면 그 원문\n현재 상황: [입력]\n사용할 가상 자료: [입력]\n현재 겪는 상황: 보완 요청을 받은 경우\n이미 한 행동과 나온 결과: [입력]\n\n요청 내용을 하나씩 대응해 줘. 표현 수정으로 해결되는 항목과 실제 기능 변경이 필요한 항목을 구분하고 먼저 수정 계획을 보여 줘.\n먼저 관련 코드·화면·설정에서 현재 상태를 확인하고 이 상황이 생긴 이유를 근거와 함께 설명해 줘. 현재 환경에서 확인할 수 없는 것은 따로 표시해 줘.\n이 활동에서 유지할 조건:\n1. 불일치 항목마다 문서를 고칠지 기능을 고칠지 선택안을 제시해 줘.\n2. 내가 선택한 방법으로 수정해 줘. 문서에는 실제 제공하는 기능과 확인한 운영 정보만 적어 줘.\n3. 관련 약관·방침·체크리스트·등록 설명을 같은 사실에 맞춰 함께 정리해 줘.\n\n진행 순서를 “지금 확인할 것 → 선택 가능한 방법 → 내가 승인할 변경 → 실행 후 다시 확인할 결과”로 정리해 줘. 앱에 필요 없는 기능을 추가하거나 검사를 끄는 방식으로 해결하지 마.\n재시험에서는 다음 조건을 포함해 줘:\n1. 수정한 기능을 가상 자료로 실행하고 설명과 다시 대조해 줘.\n2. 문서 링크와 적용일이 최신 게시본을 가리키는지 확인해 줘.\n수정이 필요하면 먼저 범위를 제안하고 내 확인 전 운영 설정을 바꾸지 마. 실제 학생 정보·비밀키·인증 토큰은 출력하지 말고 필요한 값은 가려 줘. 내 앱 또는 허락받은 시험 환경만 대상으로 해 줘.","next":"이 상황에 맞는 방법을 선택한 뒤 기본 진행의 구현 또는 재시험 단계로 돌아갑니다. 해당 없음이면 이유를 기록하고 다른 활동을 고릅니다."},{"id":"a28-locate","category":"확인 위치 도움","title":"안내된 화면이나 요청을 찾지 못할 때","when":"F12에 설명한 파일·요청이 없거나 확인할 곳을 모르겠을 때 보냅니다.","text":"활동: 문서와 실제 앱의 설명 일치시키기\n앱 이름과 프로젝트: [입력]\n이번 시험 주소: [입력]\n준비 정보: 최신 앱, 게시 문서, 에듀집 등록 내용, 보완 요청이 있다면 그 원문\n현재 상황: [입력]\n사용할 가상 자료: [입력]\n내가 보고 있는 주소와 창: [입력]\n누른 버튼 또는 실행한 동작: [입력]\n열어 둔 개발자 도구 탭과 필터: [입력 또는 모름]\n찾으려는 정보: [입력]\n현재 화면 또는 가린 오류 내용: [붙이기]\n\n참고 안내: 문서와 실제 앱을 나란히 열어 확인합니다. 전송·저장 설명은 Network와 서버 설정으로 근거를 보완합니다.\n이 안내가 체험 앱의 가상 자료인지 내 앱의 실제 동작인지 먼저 구분해 줘. 프로젝트에서 이 동작이 어떤 요청·파일·저장소로 연결되는지 찾아 줘.\nNetwork라면 동작 전에 열기, 기록 켜기, 목록 지우기, 필터 확인, 같은 동작 다시 하기, 새 요청 선택, Headers·Payload·Response 중 볼 위치를 실제 이름으로 알려 줘. 정적 파일이면 All 필터도 확인해 줘. 새 창을 열었다면 그 창에서 F12를 열어야 하는지 설명해 줘.\n브라우저 검사에서 막아 요청이 없거나 아직 동작을 실행하지 않은 경우도 구분해 줘. 서버에만 있는 정보는 F12에서 찾으라고 하지 말고 코드·관리 화면·시험 환경에서 확인할 방법을 제시해 줘.\n확인할 자료가 실제로 없으면 없다고 말하고 필요한 시험 준비를 설명해 줘. 캡처 요청에는 가려야 할 정보도 알려 줘. 실제 학생 정보·비밀키·인증 토큰은 출력하지 말고 필요한 값은 가려 줘. 내 앱 또는 허락받은 시험 환경만 대상으로 해 줘.","next":"정확한 위치를 찾은 뒤 해당 활동의 4번 프롬프트로 결과를 확인합니다. 없다는 사실 자체가 기대 결과인지 먼저 판단합니다."},{"id":"a28-error","category":"오류 해결","title":"예상과 다른 결과가 나올 때","when":"실행 오류, 정상 기능 실패, 예상한 차단이 되지 않는 경우에 보냅니다.","text":"활동: 문서와 실제 앱의 설명 일치시키기\n앱 이름과 프로젝트: [입력]\n이번 시험 주소: [입력]\n준비 정보: 최신 앱, 게시 문서, 에듀집 등록 내용, 보완 요청이 있다면 그 원문\n현재 상황: [입력]\n사용할 가상 자료: [입력]\n실행한 단계와 입력: [입력]\n기대한 결과: [입력]\n실제로 나온 결과: [입력]\n오류 문구: [비밀값을 가리고 붙이기]\n직전에 변경한 파일 또는 설정: [입력 또는 모름]\n\n원인을 추측해서 여러 곳을 한꺼번에 바꾸지 말고, 재현 조건과 현재 코드를 비교해 줘. 요청이 만들어지는지, 서버에 도착하는지, 검사와 반환·저장이 어디서 달라지는지 관련 단계만 확인해 줘.\n특히 다음 점검 기준을 다시 봐 줘:\n1. 문서에 적힌 기능과 정보 처리 방식을 실제 화면·설정·코드에서 확인해 줘. 항목마다 확인한 위치를 적어 줘.\n2. 없는 기능을 있다고 설명하거나 외부 전송을 누락한 부분을 찾아 줘.\n\n가능한 원인마다 그렇게 판단한 이유와 먼저 확인할 방법을 알려 줘. 운영 자료를 삭제하거나 권한·입력 검사를 전체 해제하는 방식은 사용하지 마. 수정이 필요하면 바꿀 내용을 먼저 제안하고 내가 승인한 뒤 적용해 줘.\n수정 후 같은 실패 조건과 다음 정상 조건을 모두 재시험해 줘:\n1. 수정한 기능을 가상 자료로 실행하고 설명과 다시 대조해 줘.\n2. 문서 링크와 적용일이 최신 게시본을 가리키는지 확인해 줘.\n3. 보완 사항의 각 항목에 확인 가능한 근거가 있는지 확인해 줘.\n4. 등록 승인이나 심의 통과를 보장하는 문장을 제거해 줘.\n완료 보고에는 실제 실행한 결과와 실행하지 못한 이유를 구분해 줘.","next":"실패 원인을 확인하고 승인한 수정만 적용합니다. 같은 실패 조건이 해결됐는지와 원래 정상 기능이 유지되는지 함께 봅니다."},{"id":"a28-finish","category":"활동 마무리","title":"확인 기록과 다음 점검 정리하기","when":"직접 시험을 확인한 뒤, 또는 해당 없음·추가 확인으로 종료할 때 보냅니다.","text":"활동: 문서와 실제 앱의 설명 일치시키기\n앱 이름과 프로젝트: [입력]\n이번 시험 주소: [입력]\n준비 정보: 최신 앱, 게시 문서, 에듀집 등록 내용, 보완 요청이 있다면 그 원문\n현재 상황: [입력]\n사용할 가상 자료: [입력]\n실제로 진행한 단계: [입력]\n확인한 결과 또는 아직 확인하지 못한 내용: [입력]\n\n이번 활동 기록을 Markdown으로 정리해 줘. 항목은 앱과 시험 버전, 점검한 기능, 발견한 문제와 위치, 승인한 수정, 시험 입력과 기대 결과, 실제 결과와 근거, 추가 확인할 일로 구성해 줘.\n앞으로 개발할 때 지킬 기준도 우리 앱의 실제 코드·설정 위치와 연결해 적어 줘:\n1. 불일치 항목마다 문서를 고칠지 기능을 고칠지 선택안을 제시해 줘.\n2. 내가 선택한 방법으로 수정해 줘. 문서에는 실제 제공하는 기능과 확인한 운영 정보만 적어 줘.\n3. 관련 약관·방침·체크리스트·등록 설명을 같은 사실에 맞춰 함께 정리해 줘.\n4. 보완 답변은 요청 내용·수정 내용·확인 위치·남은 확인 사항 순으로 작성해 줘.\n\n활동 상태는 확인 완료·추가 확인·해당 없음 중 근거에 맞게 적어 줘. 구현만 하고 시험하지 않았다면 확인 완료로 쓰지 마. 문제를 발견하지 못한 것과 충분히 검증한 것을 구분해 줘.\n다음 수정 때 다시 실행할 시험은 다음 내용을 바탕으로 정리해 줘:\n1. 수정한 기능을 가상 자료로 실행하고 설명과 다시 대조해 줘.\n2. 문서 링크와 적용일이 최신 게시본을 가리키는지 확인해 줘.\n보고서에 원문 학생 자료나 비밀값을 넣지 마. 이 기록만으로 학교 승인이나 앱 전체의 안전을 보장한다고 쓰지 마.","next":"기록을 자신의 프로젝트에 보관하고 필요한 다음 활동을 선택합니다. 새로운 대화를 시작할 때는 이 기록과 공통 시작 프롬프트를 함께 제공합니다."}]},{"id":29,"title":"푸터에 이용약관과 개인정보처리방침 게시","group":"학교 제출 자료","slides":"58~62","condition":"검토한 문서를 앱 화면에서 열 수 있게 할 때","inputs":"승인한 문서 본문, 적용일, 문의처, 기존 공통 화면 구조","inspect":["로그인 전·후 화면과 모바일에서 공통 푸터가 어디에 있는지 확인해 줘.","현재 약관·방침 링크가 실제 문서로 연결되는지 확인해 줘.","문서를 보기 위해 로그인해야 하는 구조나 빈 링크가 있는지 찾아 줘.","기존 앱의 글꼴·색·여백을 유지할 구현 위치를 제안해 줘."],"requirements":["검토가 끝난 약관과 방침을 별도 주소로 제공하고 푸터에 의미가 분명한 링크를 넣어 줘.","문서 본문은 임의로 요약·변경하지 말고 적용일·문의처를 제공된 값으로 표시해 줘.","로그인 전에도 읽을 수 있고 키보드·모바일에서 접근할 수 있게 해 줘.","문서 공개만으로 필요한 안내·동의 절차가 완료됐다고 표현하지 마. 수정 이력을 관리할 방법도 설명해 줘."],"tests":["로그아웃 상태에서 두 링크를 각각 열고 본문이 보이는지 확인해 줘.","문서 주소를 직접 입력하고 새로고침해도 정상 표시되는지 확인해 줘.","모바일과 키보드로 푸터 링크에 접근할 수 있는지 확인해 줘.","문서의 운영 주체·날짜·문의처와 제공 원문이 일치하는지 확인해 줘."],"location":"실제 웹앱의 아래쪽 푸터를 확인합니다. F12 → Network에서 문서 요청의 실패 여부를 보고, 로그인하지 않은 별도 창에서 직접 주소를 열어 봅니다.","links":["https://aiworld-ig.vercel.app/login.html"],"branches":[["푸터가 없는 앱인 경우","기존 화면을 전면 개편하지 말고 공통 레이아웃에 작고 읽기 쉬운 문서 링크 영역을 추가해 줘."],["링크를 누르면 404가 나는 경우","라우팅·배포 경로·직접 새로고침 처리를 확인해 줘. 문서 내용을 중복 복사하기 전에 주소와 배포 설정을 먼저 고쳐 줘."]],"prompts":[{"id":"a29-inspect","category":"기본 진행","title":"1 현재 상태부터 확인하기","when":"프로젝트를 연 뒤 처음 보냅니다. 파일을 고치기 전 단계입니다.","text":"활동: 푸터에 이용약관과 개인정보처리방침 게시\n앱 이름과 프로젝트: [입력]\n이번 시험 주소: [입력]\n준비 정보: 승인한 문서 본문, 적용일, 문의처, 기존 공통 화면 구조\n현재 상황: [입력]\n사용할 가상 자료: [입력]\n\n이 활동에 해당하는지부터 확인해 줘. 아직 파일이나 설정은 수정하지 마.\n1. 로그인 전·후 화면과 모바일에서 공통 푸터가 어디에 있는지 확인해 줘.\n2. 현재 약관·방침 링크가 실제 문서로 연결되는지 확인해 줘.\n3. 문서를 보기 위해 로그인해야 하는 구조나 빈 링크가 있는지 찾아 줘.\n4. 기존 앱의 글꼴·색·여백을 유지할 구현 위치를 제안해 줘.\n\n결과는 표로 정리해 줘. 표에는 확인 항목, 현재 동작, 근거가 있는 파일이나 설정 위치, 발견한 문제와 추가로 확인할 내용을 적어 줘. 코드에서 확인한 사실과 추정은 구분해 줘. 내가 직접 확인할 메뉴·버튼·파일 이름도 알려 줘. 파일을 읽지 못했다면 그 사실을 표시해 줘.\n실제 학생 정보·비밀키·인증 토큰은 출력하지 말고 필요한 값은 가려 줘. 내 앱 또는 허락받은 시험 환경만 대상으로 해 줘.\n참고할 확인 위치: 실제 웹앱의 아래쪽 푸터를 확인합니다. F12 → Network에서 문서 요청의 실패 여부를 보고, 로그인하지 않은 별도 창에서 직접 주소를 열어 봅니다.","next":"현재 구조와 해당 여부를 확인합니다. 모르는 정보는 먼저 확인하고, 수정이 필요하면 2번으로 진행합니다."},{"id":"a29-plan","category":"기본 진행","title":"2 수정 방법과 범위 정하기","when":"1번 답변에서 실제로 고칠 항목을 골랐을 때 보냅니다.","text":"활동: 푸터에 이용약관과 개인정보처리방침 게시\n앱 이름과 프로젝트: [입력]\n이번 시험 주소: [입력]\n준비 정보: 승인한 문서 본문, 적용일, 문의처, 기존 공통 화면 구조\n현재 상황: [입력]\n사용할 가상 자료: [입력]\n앞에서 확인한 문제와 근거: [1번 결과 중 해당 부분을 붙이기]\n이번에 고칠 항목: [입력]\n\n구현 전에 다음 조건으로 수정 계획을 만들어 줘.\n1. 검토가 끝난 약관과 방침을 별도 주소로 제공하고 푸터에 의미가 분명한 링크를 넣어 줘.\n2. 문서 본문은 임의로 요약·변경하지 말고 적용일·문의처를 제공된 값으로 표시해 줘.\n3. 로그인 전에도 읽을 수 있고 키보드·모바일에서 접근할 수 있게 해 줘.\n4. 문서 공개만으로 필요한 안내·동의 절차가 완료됐다고 표현하지 마. 수정 이력을 관리할 방법도 설명해 줘.\n\n기존 기능을 유지하면서 문제를 고칠 방법부터 제안해 줘. 방법이 여러 가지라면 필요한 서비스와 비용, 사용 방법이 달라지는 부분, 이전 상태로 되돌릴 방법을 비교해 줘. 반드시 고쳐야 할 부분과 선택해서 개선할 부분을 구분해 줘.\n변경할 파일, 학생 또는 교사 화면에서 달라질 부분, 필요한 관리 설정, 시험할 가상 입력을 순서대로 적어 줘. 서버가 없는 앱이라면 지금 할 수 있는 것과 서버가 필요한 것을 분리해 줘.\n아직 코드를 수정하거나 서비스를 만들지 마. 내가 결정해야 할 사항이 있으면 선택지와 차이를 설명하고 물어봐 줘.","next":"수정할 내용과 비용, 정보 수집·전송·보관 방식이 달라지는지 확인한 뒤 진행할 방법을 정합니다. 학교가 판단해야 하는 내용은 먼저 확인합니다."},{"id":"a29-implement","category":"기본 진행","title":"3 선택한 범위 구현하기","when":"수정 계획을 검토한 뒤 승인할 범위를 직접 적고 보냅니다.","text":"활동: 푸터에 이용약관과 개인정보처리방침 게시\n앱 이름과 프로젝트: [입력]\n이번 시험 주소: [입력]\n준비 정보: 승인한 문서 본문, 적용일, 문의처, 기존 공통 화면 구조\n현재 상황: [입력]\n사용할 가상 자료: [입력]\n승인한 수정안: [선택한 방법과 항목을 정확히 입력]\n수정할 파일 또는 기능 범위: [입력]\n이번에 제외할 것: [입력]\n\n위에 승인한 범위만 구현해 줘. 시작 전에 현재 변경 파일을 확인해 다른 작업을 보존해 줘.\n1. 검토가 끝난 약관과 방침을 별도 주소로 제공하고 푸터에 의미가 분명한 링크를 넣어 줘.\n2. 문서 본문은 임의로 요약·변경하지 말고 적용일·문의처를 제공된 값으로 표시해 줘.\n3. 로그인 전에도 읽을 수 있고 키보드·모바일에서 접근할 수 있게 해 줘.\n4. 문서 공개만으로 필요한 안내·동의 절차가 완료됐다고 표현하지 마. 수정 이력을 관리할 방법도 설명해 줘.\n\n한 부분씩 수정하고 실행 결과를 확인해 줘. 기존 디자인과 정상 기능은 유지해 줘. 새 서비스 생성·운영 자료 삭제·유료 호출·커밋·푸시·배포는 이 요청에 구체적으로 승인한 경우에만 실행해 줘. 요청하지 않은 변경이 필요하면 진행 전에 이유를 설명해 줘.\n수정 후 바꾼 파일과 이유, 실행한 검사, 아직 하지 못한 시험, 내가 누를 버튼 순서를 적어 줘. 실제 학생 정보·비밀키·인증 토큰은 출력하지 말고 필요한 값은 가려 줘. 내 앱 또는 허락받은 시험 환경만 대상으로 해 줘.","next":"빌드나 실행 오류가 없는지 확인한 뒤 4번으로 진행합니다. 허용해야 할 동작은 정상적으로 되고, 차단해야 할 동작은 막히는지 함께 시험합니다."},{"id":"a29-verify","category":"기본 진행","title":"4 수정 결과 직접 확인하기","when":"구현이 끝났거나 기존 기능이 안전하게 동작하는지 검증할 때 보냅니다.","text":"활동: 푸터에 이용약관과 개인정보처리방침 게시\n앱 이름과 프로젝트: [입력]\n이번 시험 주소: [입력]\n준비 정보: 승인한 문서 본문, 적용일, 문의처, 기존 공통 화면 구조\n현재 상황: [입력]\n사용할 가상 자료: [입력]\n이번 수정 내용: [입력 또는 기존 기능 검증]\n시험할 버전과 주소: [입력]\n\n다음 조건을 가상 자료로 다시 시험해 줘.\n1. 로그아웃 상태에서 두 링크를 각각 열고 본문이 보이는지 확인해 줘.\n2. 문서 주소를 직접 입력하고 새로고침해도 정상 표시되는지 확인해 줘.\n3. 모바일과 키보드로 푸터 링크에 접근할 수 있는지 확인해 줘.\n4. 문서의 운영 주체·날짜·문의처와 제공 원문이 일치하는지 확인해 줘.\n\n내가 직접 따라 할 수 있도록 준비 계정과 상태 → 클릭 또는 입력 → 확인할 실제 탭·요청·필드 → 기대 결과를 항목마다 적어 줘.\n확인할 위치: 실제 웹앱의 아래쪽 푸터를 확인합니다. F12 → Network에서 문서 요청의 실패 여부를 보고, 로그인하지 않은 별도 창에서 직접 주소를 열어 봅니다.\n자기 앱에서 이름이 다르면 코드와 실제 요청에서 맞는 이름을 찾아 줘. 실제로 존재하는지 확인하지 않은 요청명을 만들어 내지 마.\n허용해야 할 동작과 차단해야 할 동작을 함께 시험해 줘. 항목마다 실행 여부, 실제 결과, 확인한 화면이나 기록을 적고, 시험하지 못했다면 이유를 설명해 줘. 응답 코드와 실제로 받은 자료를 함께 확인하고, 저장 기능이 있다면 저장된 결과도 확인해 줘.\n이 활동을 완료해도 앱 전체의 안전이 보장된다고 표현하지 마. 실제 학생 정보·비밀키·인증 토큰은 출력하지 말고 필요한 값은 가려 줘. 내 앱 또는 허락받은 시험 환경만 대상으로 해 줘.","next":"기대 결과와 실제 결과가 같으면 활동 기록을 정리합니다. 다르면 “오류 해결” 프롬프트를 사용하고 같은 조건으로 재시험합니다."},{"id":"a29-branch1","category":"상황별 진행","title":"푸터가 없는 앱인 경우","when":"기본 순서로 진행하다가 이 상황에 해당하면 사용합니다.","text":"활동: 푸터에 이용약관과 개인정보처리방침 게시\n앱 이름과 프로젝트: [입력]\n이번 시험 주소: [입력]\n준비 정보: 승인한 문서 본문, 적용일, 문의처, 기존 공통 화면 구조\n현재 상황: [입력]\n사용할 가상 자료: [입력]\n현재 겪는 상황: 푸터가 없는 앱인 경우\n이미 한 행동과 나온 결과: [입력]\n\n기존 화면을 전면 개편하지 말고 공통 레이아웃에 작고 읽기 쉬운 문서 링크 영역을 추가해 줘.\n먼저 관련 코드·화면·설정에서 현재 상태를 확인하고 이 상황이 생긴 이유를 근거와 함께 설명해 줘. 현재 환경에서 확인할 수 없는 것은 따로 표시해 줘.\n이 활동에서 유지할 조건:\n1. 검토가 끝난 약관과 방침을 별도 주소로 제공하고 푸터에 의미가 분명한 링크를 넣어 줘.\n2. 문서 본문은 임의로 요약·변경하지 말고 적용일·문의처를 제공된 값으로 표시해 줘.\n3. 로그인 전에도 읽을 수 있고 키보드·모바일에서 접근할 수 있게 해 줘.\n\n진행 순서를 “지금 확인할 것 → 선택 가능한 방법 → 내가 승인할 변경 → 실행 후 다시 확인할 결과”로 정리해 줘. 앱에 필요 없는 기능을 추가하거나 검사를 끄는 방식으로 해결하지 마.\n재시험에서는 다음 조건을 포함해 줘:\n1. 로그아웃 상태에서 두 링크를 각각 열고 본문이 보이는지 확인해 줘.\n2. 문서 주소를 직접 입력하고 새로고침해도 정상 표시되는지 확인해 줘.\n수정이 필요하면 먼저 범위를 제안하고 내 확인 전 운영 설정을 바꾸지 마. 실제 학생 정보·비밀키·인증 토큰은 출력하지 말고 필요한 값은 가려 줘. 내 앱 또는 허락받은 시험 환경만 대상으로 해 줘.","next":"이 상황에 맞는 방법을 선택한 뒤 기본 진행의 구현 또는 재시험 단계로 돌아갑니다. 해당 없음이면 이유를 기록하고 다른 활동을 고릅니다."},{"id":"a29-branch2","category":"상황별 진행","title":"링크를 누르면 404가 나는 경우","when":"기본 순서로 진행하다가 이 상황에 해당하면 사용합니다.","text":"활동: 푸터에 이용약관과 개인정보처리방침 게시\n앱 이름과 프로젝트: [입력]\n이번 시험 주소: [입력]\n준비 정보: 승인한 문서 본문, 적용일, 문의처, 기존 공통 화면 구조\n현재 상황: [입력]\n사용할 가상 자료: [입력]\n현재 겪는 상황: 링크를 누르면 404가 나는 경우\n이미 한 행동과 나온 결과: [입력]\n\n라우팅·배포 경로·직접 새로고침 처리를 확인해 줘. 문서 내용을 중복 복사하기 전에 주소와 배포 설정을 먼저 고쳐 줘.\n먼저 관련 코드·화면·설정에서 현재 상태를 확인하고 이 상황이 생긴 이유를 근거와 함께 설명해 줘. 현재 환경에서 확인할 수 없는 것은 따로 표시해 줘.\n이 활동에서 유지할 조건:\n1. 검토가 끝난 약관과 방침을 별도 주소로 제공하고 푸터에 의미가 분명한 링크를 넣어 줘.\n2. 문서 본문은 임의로 요약·변경하지 말고 적용일·문의처를 제공된 값으로 표시해 줘.\n3. 로그인 전에도 읽을 수 있고 키보드·모바일에서 접근할 수 있게 해 줘.\n\n진행 순서를 “지금 확인할 것 → 선택 가능한 방법 → 내가 승인할 변경 → 실행 후 다시 확인할 결과”로 정리해 줘. 앱에 필요 없는 기능을 추가하거나 검사를 끄는 방식으로 해결하지 마.\n재시험에서는 다음 조건을 포함해 줘:\n1. 로그아웃 상태에서 두 링크를 각각 열고 본문이 보이는지 확인해 줘.\n2. 문서 주소를 직접 입력하고 새로고침해도 정상 표시되는지 확인해 줘.\n수정이 필요하면 먼저 범위를 제안하고 내 확인 전 운영 설정을 바꾸지 마. 실제 학생 정보·비밀키·인증 토큰은 출력하지 말고 필요한 값은 가려 줘. 내 앱 또는 허락받은 시험 환경만 대상으로 해 줘.","next":"이 상황에 맞는 방법을 선택한 뒤 기본 진행의 구현 또는 재시험 단계로 돌아갑니다. 해당 없음이면 이유를 기록하고 다른 활동을 고릅니다."},{"id":"a29-locate","category":"확인 위치 도움","title":"안내된 화면이나 요청을 찾지 못할 때","when":"F12에 설명한 파일·요청이 없거나 확인할 곳을 모르겠을 때 보냅니다.","text":"활동: 푸터에 이용약관과 개인정보처리방침 게시\n앱 이름과 프로젝트: [입력]\n이번 시험 주소: [입력]\n준비 정보: 승인한 문서 본문, 적용일, 문의처, 기존 공통 화면 구조\n현재 상황: [입력]\n사용할 가상 자료: [입력]\n내가 보고 있는 주소와 창: [입력]\n누른 버튼 또는 실행한 동작: [입력]\n열어 둔 개발자 도구 탭과 필터: [입력 또는 모름]\n찾으려는 정보: [입력]\n현재 화면 또는 가린 오류 내용: [붙이기]\n\n참고 안내: 실제 웹앱의 아래쪽 푸터를 확인합니다. F12 → Network에서 문서 요청의 실패 여부를 보고, 로그인하지 않은 별도 창에서 직접 주소를 열어 봅니다.\n이 안내가 체험 앱의 가상 자료인지 내 앱의 실제 동작인지 먼저 구분해 줘. 프로젝트에서 이 동작이 어떤 요청·파일·저장소로 연결되는지 찾아 줘.\nNetwork라면 동작 전에 열기, 기록 켜기, 목록 지우기, 필터 확인, 같은 동작 다시 하기, 새 요청 선택, Headers·Payload·Response 중 볼 위치를 실제 이름으로 알려 줘. 정적 파일이면 All 필터도 확인해 줘. 새 창을 열었다면 그 창에서 F12를 열어야 하는지 설명해 줘.\n브라우저 검사에서 막아 요청이 없거나 아직 동작을 실행하지 않은 경우도 구분해 줘. 서버에만 있는 정보는 F12에서 찾으라고 하지 말고 코드·관리 화면·시험 환경에서 확인할 방법을 제시해 줘.\n확인할 자료가 실제로 없으면 없다고 말하고 필요한 시험 준비를 설명해 줘. 캡처 요청에는 가려야 할 정보도 알려 줘. 실제 학생 정보·비밀키·인증 토큰은 출력하지 말고 필요한 값은 가려 줘. 내 앱 또는 허락받은 시험 환경만 대상으로 해 줘.","next":"정확한 위치를 찾은 뒤 해당 활동의 4번 프롬프트로 결과를 확인합니다. 없다는 사실 자체가 기대 결과인지 먼저 판단합니다."},{"id":"a29-error","category":"오류 해결","title":"예상과 다른 결과가 나올 때","when":"실행 오류, 정상 기능 실패, 예상한 차단이 되지 않는 경우에 보냅니다.","text":"활동: 푸터에 이용약관과 개인정보처리방침 게시\n앱 이름과 프로젝트: [입력]\n이번 시험 주소: [입력]\n준비 정보: 승인한 문서 본문, 적용일, 문의처, 기존 공통 화면 구조\n현재 상황: [입력]\n사용할 가상 자료: [입력]\n실행한 단계와 입력: [입력]\n기대한 결과: [입력]\n실제로 나온 결과: [입력]\n오류 문구: [비밀값을 가리고 붙이기]\n직전에 변경한 파일 또는 설정: [입력 또는 모름]\n\n원인을 추측해서 여러 곳을 한꺼번에 바꾸지 말고, 재현 조건과 현재 코드를 비교해 줘. 요청이 만들어지는지, 서버에 도착하는지, 검사와 반환·저장이 어디서 달라지는지 관련 단계만 확인해 줘.\n특히 다음 점검 기준을 다시 봐 줘:\n1. 로그인 전·후 화면과 모바일에서 공통 푸터가 어디에 있는지 확인해 줘.\n2. 현재 약관·방침 링크가 실제 문서로 연결되는지 확인해 줘.\n\n가능한 원인마다 그렇게 판단한 이유와 먼저 확인할 방법을 알려 줘. 운영 자료를 삭제하거나 권한·입력 검사를 전체 해제하는 방식은 사용하지 마. 수정이 필요하면 바꿀 내용을 먼저 제안하고 내가 승인한 뒤 적용해 줘.\n수정 후 같은 실패 조건과 다음 정상 조건을 모두 재시험해 줘:\n1. 로그아웃 상태에서 두 링크를 각각 열고 본문이 보이는지 확인해 줘.\n2. 문서 주소를 직접 입력하고 새로고침해도 정상 표시되는지 확인해 줘.\n3. 모바일과 키보드로 푸터 링크에 접근할 수 있는지 확인해 줘.\n4. 문서의 운영 주체·날짜·문의처와 제공 원문이 일치하는지 확인해 줘.\n완료 보고에는 실제 실행한 결과와 실행하지 못한 이유를 구분해 줘.","next":"실패 원인을 확인하고 승인한 수정만 적용합니다. 같은 실패 조건이 해결됐는지와 원래 정상 기능이 유지되는지 함께 봅니다."},{"id":"a29-finish","category":"활동 마무리","title":"확인 기록과 다음 점검 정리하기","when":"직접 시험을 확인한 뒤, 또는 해당 없음·추가 확인으로 종료할 때 보냅니다.","text":"활동: 푸터에 이용약관과 개인정보처리방침 게시\n앱 이름과 프로젝트: [입력]\n이번 시험 주소: [입력]\n준비 정보: 승인한 문서 본문, 적용일, 문의처, 기존 공통 화면 구조\n현재 상황: [입력]\n사용할 가상 자료: [입력]\n실제로 진행한 단계: [입력]\n확인한 결과 또는 아직 확인하지 못한 내용: [입력]\n\n이번 활동 기록을 Markdown으로 정리해 줘. 항목은 앱과 시험 버전, 점검한 기능, 발견한 문제와 위치, 승인한 수정, 시험 입력과 기대 결과, 실제 결과와 근거, 추가 확인할 일로 구성해 줘.\n앞으로 개발할 때 지킬 기준도 우리 앱의 실제 코드·설정 위치와 연결해 적어 줘:\n1. 검토가 끝난 약관과 방침을 별도 주소로 제공하고 푸터에 의미가 분명한 링크를 넣어 줘.\n2. 문서 본문은 임의로 요약·변경하지 말고 적용일·문의처를 제공된 값으로 표시해 줘.\n3. 로그인 전에도 읽을 수 있고 키보드·모바일에서 접근할 수 있게 해 줘.\n4. 문서 공개만으로 필요한 안내·동의 절차가 완료됐다고 표현하지 마. 수정 이력을 관리할 방법도 설명해 줘.\n\n활동 상태는 확인 완료·추가 확인·해당 없음 중 근거에 맞게 적어 줘. 구현만 하고 시험하지 않았다면 확인 완료로 쓰지 마. 문제를 발견하지 못한 것과 충분히 검증한 것을 구분해 줘.\n다음 수정 때 다시 실행할 시험은 다음 내용을 바탕으로 정리해 줘:\n1. 로그아웃 상태에서 두 링크를 각각 열고 본문이 보이는지 확인해 줘.\n2. 문서 주소를 직접 입력하고 새로고침해도 정상 표시되는지 확인해 줘.\n보고서에 원문 학생 자료나 비밀값을 넣지 마. 이 기록만으로 학교 승인이나 앱 전체의 안전을 보장한다고 쓰지 마.","next":"기록을 자신의 프로젝트에 보관하고 필요한 다음 활동을 선택합니다. 새로운 대화를 시작할 때는 이 기록과 공통 시작 프롬프트를 함께 제공합니다."}]},{"id":30,"title":"내 앱의 공급자 체크리스트 작성","group":"학교 제출 자료","slides":"49~57, 63","condition":"학교 확인용 선정기준 체크리스트를 준비할 때","inputs":"최신 공식 체크리스트 원본, 앱 정보, 약관·방침, 화면·설정 증빙","inspect":["제공한 공식 서식의 항목과 선택지를 그대로 읽고 임의로 항목 이름이나 기준을 바꾸지 마.","각 항목에 대응하는 실제 기능·처리 문서·관리 설정을 찾아 줘.","적합·부적합·추가 확인·해당 없음 등 판정은 공식 서식의 체계에 맞춰 사용하고 근거가 없는 적합 표시를 하지 마.","개발자가 답할 내용과 학교가 별도 확인할 내용을 구분해 줘."],"requirements":["항목별 답변 초안·근거 설명·증빙 파일 또는 URL·확인일을 정리해 줘.","화면 캡처가 필요하면 어떤 화면의 어느 요소가 해당 항목을 증명하는지 정확히 알려 줘.","학생 정보·키·계정이 보이는 증빙은 가리거나 가상 자료로 다시 준비하게 해 줘.","미충족 항목은 수정 계획과 재확인 방법을 적고 형식적인 체크로 넘기지 마."],"tests":["원본 서식의 항목 수와 순서가 작성본과 일치하는지 확인해 줘.","답변 문장마다 연결된 증빙이 실제 주장을 뒷받침하는지 확인해 줘.","링크가 열리고 캡처의 앱·기능·설명이 서로 맞는지 확인해 줘.","개발자 자기점검을 학교의 확인·심의 완료로 표현하지 않았는지 확인해 줘."],"location":"앱의 관련 화면과 설정을 항목별로 확인합니다. 개인정보·전송 항목은 Network와 관리 설정, 공개 안내는 푸터 문서로 증빙합니다. 항목별 근거가 다르므로 모든 증빙을 F12 화면으로 대신하지 않습니다.","links":["https://www.moe.go.kr/boardCnts/viewRenew.do?boardID=294&boardSeq=105007&lev=0&m=020","https://edzip.kr/"],"branches":[["공식 서식이 없는 경우","임의로 공식 체크리스트라고 만들지 마. 최신 서식을 찾을 공식 주소와 준비할 자료를 알려 주고 원본 확보 전에는 항목별 근거 목록만 만들어 줘."],["해당 없음이라고 쓰고 싶은 항목이 있는 경우","해당 없는 이유를 실제 기능과 적용 조건으로 설명해 줘. 단지 구현하지 않았다는 이유로 필수 보호 항목을 해당 없음으로 처리하지 마."]],"prompts":[{"id":"a30-inspect","category":"기본 진행","title":"1 현재 상태부터 확인하기","when":"프로젝트를 연 뒤 처음 보냅니다. 파일을 고치기 전 단계입니다.","text":"활동: 내 앱의 공급자 체크리스트 작성\n앱 이름과 프로젝트: [입력]\n이번 시험 주소: [입력]\n준비 정보: 최신 공식 체크리스트 원본, 앱 정보, 약관·방침, 화면·설정 증빙\n현재 상황: [입력]\n사용할 가상 자료: [입력]\n\n이 활동에 해당하는지부터 확인해 줘. 아직 파일이나 설정은 수정하지 마.\n1. 제공한 공식 서식의 항목과 선택지를 그대로 읽고 임의로 항목 이름이나 기준을 바꾸지 마.\n2. 각 항목에 대응하는 실제 기능·처리 문서·관리 설정을 찾아 줘.\n3. 적합·부적합·추가 확인·해당 없음 등 판정은 공식 서식의 체계에 맞춰 사용하고 근거가 없는 적합 표시를 하지 마.\n4. 개발자가 답할 내용과 학교가 별도 확인할 내용을 구분해 줘.\n\n결과는 표로 정리해 줘. 표에는 확인 항목, 현재 동작, 근거가 있는 파일이나 설정 위치, 발견한 문제와 추가로 확인할 내용을 적어 줘. 코드에서 확인한 사실과 추정은 구분해 줘. 내가 직접 확인할 메뉴·버튼·파일 이름도 알려 줘. 파일을 읽지 못했다면 그 사실을 표시해 줘.\n실제 학생 정보·비밀키·인증 토큰은 출력하지 말고 필요한 값은 가려 줘. 내 앱 또는 허락받은 시험 환경만 대상으로 해 줘.\n참고할 확인 위치: 앱의 관련 화면과 설정을 항목별로 확인합니다. 개인정보·전송 항목은 Network와 관리 설정, 공개 안내는 푸터 문서로 증빙합니다. 항목별 근거가 다르므로 모든 증빙을 F12 화면으로 대신하지 않습니다.","next":"현재 구조와 해당 여부를 확인합니다. 모르는 정보는 먼저 확인하고, 수정이 필요하면 2번으로 진행합니다."},{"id":"a30-plan","category":"기본 진행","title":"2 수정 방법과 범위 정하기","when":"1번 답변에서 실제로 고칠 항목을 골랐을 때 보냅니다.","text":"활동: 내 앱의 공급자 체크리스트 작성\n앱 이름과 프로젝트: [입력]\n이번 시험 주소: [입력]\n준비 정보: 최신 공식 체크리스트 원본, 앱 정보, 약관·방침, 화면·설정 증빙\n현재 상황: [입력]\n사용할 가상 자료: [입력]\n앞에서 확인한 문제와 근거: [1번 결과 중 해당 부분을 붙이기]\n이번에 고칠 항목: [입력]\n\n구현 전에 다음 조건으로 수정 계획을 만들어 줘.\n1. 항목별 답변 초안·근거 설명·증빙 파일 또는 URL·확인일을 정리해 줘.\n2. 화면 캡처가 필요하면 어떤 화면의 어느 요소가 해당 항목을 증명하는지 정확히 알려 줘.\n3. 학생 정보·키·계정이 보이는 증빙은 가리거나 가상 자료로 다시 준비하게 해 줘.\n4. 미충족 항목은 수정 계획과 재확인 방법을 적고 형식적인 체크로 넘기지 마.\n\n기존 기능을 유지하면서 문제를 고칠 방법부터 제안해 줘. 방법이 여러 가지라면 필요한 서비스와 비용, 사용 방법이 달라지는 부분, 이전 상태로 되돌릴 방법을 비교해 줘. 반드시 고쳐야 할 부분과 선택해서 개선할 부분을 구분해 줘.\n변경할 파일, 학생 또는 교사 화면에서 달라질 부분, 필요한 관리 설정, 시험할 가상 입력을 순서대로 적어 줘. 서버가 없는 앱이라면 지금 할 수 있는 것과 서버가 필요한 것을 분리해 줘.\n아직 코드를 수정하거나 서비스를 만들지 마. 내가 결정해야 할 사항이 있으면 선택지와 차이를 설명하고 물어봐 줘.","next":"수정할 내용과 비용, 정보 수집·전송·보관 방식이 달라지는지 확인한 뒤 진행할 방법을 정합니다. 학교가 판단해야 하는 내용은 먼저 확인합니다."},{"id":"a30-implement","category":"기본 진행","title":"3 선택한 범위 구현하기","when":"수정 계획을 검토한 뒤 승인할 범위를 직접 적고 보냅니다.","text":"활동: 내 앱의 공급자 체크리스트 작성\n앱 이름과 프로젝트: [입력]\n이번 시험 주소: [입력]\n준비 정보: 최신 공식 체크리스트 원본, 앱 정보, 약관·방침, 화면·설정 증빙\n현재 상황: [입력]\n사용할 가상 자료: [입력]\n승인한 수정안: [선택한 방법과 항목을 정확히 입력]\n수정할 파일 또는 기능 범위: [입력]\n이번에 제외할 것: [입력]\n\n위에 승인한 범위만 구현해 줘. 시작 전에 현재 변경 파일을 확인해 다른 작업을 보존해 줘.\n1. 항목별 답변 초안·근거 설명·증빙 파일 또는 URL·확인일을 정리해 줘.\n2. 화면 캡처가 필요하면 어떤 화면의 어느 요소가 해당 항목을 증명하는지 정확히 알려 줘.\n3. 학생 정보·키·계정이 보이는 증빙은 가리거나 가상 자료로 다시 준비하게 해 줘.\n4. 미충족 항목은 수정 계획과 재확인 방법을 적고 형식적인 체크로 넘기지 마.\n\n한 부분씩 수정하고 실행 결과를 확인해 줘. 기존 디자인과 정상 기능은 유지해 줘. 새 서비스 생성·운영 자료 삭제·유료 호출·커밋·푸시·배포는 이 요청에 구체적으로 승인한 경우에만 실행해 줘. 요청하지 않은 변경이 필요하면 진행 전에 이유를 설명해 줘.\n수정 후 바꾼 파일과 이유, 실행한 검사, 아직 하지 못한 시험, 내가 누를 버튼 순서를 적어 줘. 실제 학생 정보·비밀키·인증 토큰은 출력하지 말고 필요한 값은 가려 줘. 내 앱 또는 허락받은 시험 환경만 대상으로 해 줘.","next":"빌드나 실행 오류가 없는지 확인한 뒤 4번으로 진행합니다. 허용해야 할 동작은 정상적으로 되고, 차단해야 할 동작은 막히는지 함께 시험합니다."},{"id":"a30-verify","category":"기본 진행","title":"4 수정 결과 직접 확인하기","when":"구현이 끝났거나 기존 기능이 안전하게 동작하는지 검증할 때 보냅니다.","text":"활동: 내 앱의 공급자 체크리스트 작성\n앱 이름과 프로젝트: [입력]\n이번 시험 주소: [입력]\n준비 정보: 최신 공식 체크리스트 원본, 앱 정보, 약관·방침, 화면·설정 증빙\n현재 상황: [입력]\n사용할 가상 자료: [입력]\n이번 수정 내용: [입력 또는 기존 기능 검증]\n시험할 버전과 주소: [입력]\n\n다음 조건을 가상 자료로 다시 시험해 줘.\n1. 원본 서식의 항목 수와 순서가 작성본과 일치하는지 확인해 줘.\n2. 답변 문장마다 연결된 증빙이 실제 주장을 뒷받침하는지 확인해 줘.\n3. 링크가 열리고 캡처의 앱·기능·설명이 서로 맞는지 확인해 줘.\n4. 개발자 자기점검을 학교의 확인·심의 완료로 표현하지 않았는지 확인해 줘.\n\n내가 직접 따라 할 수 있도록 준비 계정과 상태 → 클릭 또는 입력 → 확인할 실제 탭·요청·필드 → 기대 결과를 항목마다 적어 줘.\n확인할 위치: 앱의 관련 화면과 설정을 항목별로 확인합니다. 개인정보·전송 항목은 Network와 관리 설정, 공개 안내는 푸터 문서로 증빙합니다. 항목별 근거가 다르므로 모든 증빙을 F12 화면으로 대신하지 않습니다.\n자기 앱에서 이름이 다르면 코드와 실제 요청에서 맞는 이름을 찾아 줘. 실제로 존재하는지 확인하지 않은 요청명을 만들어 내지 마.\n허용해야 할 동작과 차단해야 할 동작을 함께 시험해 줘. 항목마다 실행 여부, 실제 결과, 확인한 화면이나 기록을 적고, 시험하지 못했다면 이유를 설명해 줘. 응답 코드와 실제로 받은 자료를 함께 확인하고, 저장 기능이 있다면 저장된 결과도 확인해 줘.\n이 활동을 완료해도 앱 전체의 안전이 보장된다고 표현하지 마. 실제 학생 정보·비밀키·인증 토큰은 출력하지 말고 필요한 값은 가려 줘. 내 앱 또는 허락받은 시험 환경만 대상으로 해 줘.","next":"기대 결과와 실제 결과가 같으면 활동 기록을 정리합니다. 다르면 “오류 해결” 프롬프트를 사용하고 같은 조건으로 재시험합니다."},{"id":"a30-branch1","category":"상황별 진행","title":"공식 서식이 없는 경우","when":"기본 순서로 진행하다가 이 상황에 해당하면 사용합니다.","text":"활동: 내 앱의 공급자 체크리스트 작성\n앱 이름과 프로젝트: [입력]\n이번 시험 주소: [입력]\n준비 정보: 최신 공식 체크리스트 원본, 앱 정보, 약관·방침, 화면·설정 증빙\n현재 상황: [입력]\n사용할 가상 자료: [입력]\n현재 겪는 상황: 공식 서식이 없는 경우\n이미 한 행동과 나온 결과: [입력]\n\n임의로 공식 체크리스트라고 만들지 마. 최신 서식을 찾을 공식 주소와 준비할 자료를 알려 주고 원본 확보 전에는 항목별 근거 목록만 만들어 줘.\n먼저 관련 코드·화면·설정에서 현재 상태를 확인하고 이 상황이 생긴 이유를 근거와 함께 설명해 줘. 현재 환경에서 확인할 수 없는 것은 따로 표시해 줘.\n이 활동에서 유지할 조건:\n1. 항목별 답변 초안·근거 설명·증빙 파일 또는 URL·확인일을 정리해 줘.\n2. 화면 캡처가 필요하면 어떤 화면의 어느 요소가 해당 항목을 증명하는지 정확히 알려 줘.\n3. 학생 정보·키·계정이 보이는 증빙은 가리거나 가상 자료로 다시 준비하게 해 줘.\n\n진행 순서를 “지금 확인할 것 → 선택 가능한 방법 → 내가 승인할 변경 → 실행 후 다시 확인할 결과”로 정리해 줘. 앱에 필요 없는 기능을 추가하거나 검사를 끄는 방식으로 해결하지 마.\n재시험에서는 다음 조건을 포함해 줘:\n1. 원본 서식의 항목 수와 순서가 작성본과 일치하는지 확인해 줘.\n2. 답변 문장마다 연결된 증빙이 실제 주장을 뒷받침하는지 확인해 줘.\n수정이 필요하면 먼저 범위를 제안하고 내 확인 전 운영 설정을 바꾸지 마. 실제 학생 정보·비밀키·인증 토큰은 출력하지 말고 필요한 값은 가려 줘. 내 앱 또는 허락받은 시험 환경만 대상으로 해 줘.","next":"이 상황에 맞는 방법을 선택한 뒤 기본 진행의 구현 또는 재시험 단계로 돌아갑니다. 해당 없음이면 이유를 기록하고 다른 활동을 고릅니다."},{"id":"a30-branch2","category":"상황별 진행","title":"해당 없음이라고 쓰고 싶은 항목이 있는 경우","when":"기본 순서로 진행하다가 이 상황에 해당하면 사용합니다.","text":"활동: 내 앱의 공급자 체크리스트 작성\n앱 이름과 프로젝트: [입력]\n이번 시험 주소: [입력]\n준비 정보: 최신 공식 체크리스트 원본, 앱 정보, 약관·방침, 화면·설정 증빙\n현재 상황: [입력]\n사용할 가상 자료: [입력]\n현재 겪는 상황: 해당 없음이라고 쓰고 싶은 항목이 있는 경우\n이미 한 행동과 나온 결과: [입력]\n\n해당 없는 이유를 실제 기능과 적용 조건으로 설명해 줘. 단지 구현하지 않았다는 이유로 필수 보호 항목을 해당 없음으로 처리하지 마.\n먼저 관련 코드·화면·설정에서 현재 상태를 확인하고 이 상황이 생긴 이유를 근거와 함께 설명해 줘. 현재 환경에서 확인할 수 없는 것은 따로 표시해 줘.\n이 활동에서 유지할 조건:\n1. 항목별 답변 초안·근거 설명·증빙 파일 또는 URL·확인일을 정리해 줘.\n2. 화면 캡처가 필요하면 어떤 화면의 어느 요소가 해당 항목을 증명하는지 정확히 알려 줘.\n3. 학생 정보·키·계정이 보이는 증빙은 가리거나 가상 자료로 다시 준비하게 해 줘.\n\n진행 순서를 “지금 확인할 것 → 선택 가능한 방법 → 내가 승인할 변경 → 실행 후 다시 확인할 결과”로 정리해 줘. 앱에 필요 없는 기능을 추가하거나 검사를 끄는 방식으로 해결하지 마.\n재시험에서는 다음 조건을 포함해 줘:\n1. 원본 서식의 항목 수와 순서가 작성본과 일치하는지 확인해 줘.\n2. 답변 문장마다 연결된 증빙이 실제 주장을 뒷받침하는지 확인해 줘.\n수정이 필요하면 먼저 범위를 제안하고 내 확인 전 운영 설정을 바꾸지 마. 실제 학생 정보·비밀키·인증 토큰은 출력하지 말고 필요한 값은 가려 줘. 내 앱 또는 허락받은 시험 환경만 대상으로 해 줘.","next":"이 상황에 맞는 방법을 선택한 뒤 기본 진행의 구현 또는 재시험 단계로 돌아갑니다. 해당 없음이면 이유를 기록하고 다른 활동을 고릅니다."},{"id":"a30-locate","category":"확인 위치 도움","title":"필요한 서식이나 근거 자료를 찾지 못할 때","when":"공식 서식, 운영 정보, 항목별 증빙이 없거나 서로 다를 때 보냅니다.","text":"활동: 내 앱의 공급자 체크리스트 작성\n앱 이름과 프로젝트: [입력]\n이번 시험 주소: [입력]\n준비 정보: 최신 공식 체크리스트 원본, 앱 정보, 약관·방침, 화면·설정 증빙\n현재 상황: [입력]\n사용할 가상 자료: [입력]\n찾지 못한 자료 또는 항목: [입력]\n현재 가진 문서의 이름과 발행일: [입력]\n학교 또는 담당자가 요청한 내용: [입력]\n\n앱의 관련 화면과 설정을 항목별로 확인합니다. 개인정보·전송 항목은 Network와 관리 설정, 공개 안내는 푸터 문서로 증빙합니다. 항목별 근거가 다르므로 모든 증빙을 F12 화면으로 대신하지 않습니다.\n이 활동의 서식과 적용 여부는 학교 안내와 공식 문서에서 확인하도록 안내해 줘. F12에서 확인할 수 있는 내용과 구분해 줘.\n제공한 자료에서 해당 항목의 원문과 적용 대상을 찾아 줘. 자료가 없으면 최신 원본을 구할 공식 기관·메뉴·링크와 검색어를 알려 줘. 접근하지 못한 문서를 읽었다고 하거나 학교가 요구하지 않은 서식을 공식 양식처럼 만들지 마.\n각 항목을 문서에서 확인할 것, 앱의 실제 동작으로 증명할 것, 운영자 또는 학교에 물을 것으로 구분해 줘.\n준비된 자료만으로 답할 수 있는 부분과 추가로 필요한 부분을 나누고, 문의할 질문을 구체적으로 작성해 줘. 참고용 예시를 복사했다면 우리 앱과 다른 사실도 표시해 줘.\n실제 학생 정보·비밀키·인증 토큰은 출력하지 말고 필요한 값은 가려 줘. 내 앱 또는 허락받은 시험 환경만 대상으로 해 줘.","next":"공식 서식과 실제 운영 정보를 확보한 뒤 2번의 작성 범위 결정으로 돌아갑니다. 확인하지 못한 항목을 임의로 채우지 않습니다."},{"id":"a30-error","category":"오류 해결","title":"작성 내용이 사실이나 서식과 맞지 않을 때","when":"누락, 항목 불일치, 근거 없는 판정 또는 보완 요청을 발견했을 때 보냅니다.","text":"활동: 내 앱의 공급자 체크리스트 작성\n앱 이름과 프로젝트: [입력]\n이번 시험 주소: [입력]\n준비 정보: 최신 공식 체크리스트 원본, 앱 정보, 약관·방침, 화면·설정 증빙\n현재 상황: [입력]\n사용할 가상 자료: [입력]\n문제가 있는 문장 또는 항목: [입력]\n비교할 공식 서식과 실제 운영 사실: [입력]\n보완 요청이 있다면 그 원문: [입력]\n\n다음 기준으로 현재 자료의 차이를 확인해 줘.\n1. 제공한 공식 서식의 항목과 선택지를 그대로 읽고 임의로 항목 이름이나 기준을 바꾸지 마.\n2. 각 항목에 대응하는 실제 기능·처리 문서·관리 설정을 찾아 줘.\n3. 적합·부적합·추가 확인·해당 없음 등 판정은 공식 서식의 체계에 맞춰 사용하고 근거가 없는 적합 표시를 하지 마.\n4. 개발자가 답할 내용과 학교가 별도 확인할 내용을 구분해 줘.\n표현 문제, 실제 기능과의 차이, 근거 부족, 학교 확인이 필요한 사항을 구분해 줘. 서식 원문이나 법적 의미를 바꾸지 말고 필요한 최소 수정안을 보여 줘.\n운영 사실을 확인하지 못했으면 없음 또는 적합이라고 채우지 마. 내가 승인한 문서 수정만 적용하고 앱 코드나 운영 설정을 바꾸지 마.\n수정 후 다음 항목을 다시 대조해 줘.\n1. 원본 서식의 항목 수와 순서가 작성본과 일치하는지 확인해 줘.\n2. 답변 문장마다 연결된 증빙이 실제 주장을 뒷받침하는지 확인해 줘.\n3. 링크가 열리고 캡처의 앱·기능·설명이 서로 맞는지 확인해 줘.\n4. 개발자 자기점검을 학교의 확인·심의 완료로 표현하지 않았는지 확인해 줘.\n수정한 문장, 근거 자료, 아직 답하지 못한 질문을 함께 제시해 줘. 실제 제출이나 외부 발송은 하지 마.","next":"실패 원인을 확인하고 승인한 수정만 적용합니다. 같은 실패 조건이 해결됐는지와 원래 정상 기능이 유지되는지 함께 봅니다."},{"id":"a30-finish","category":"활동 마무리","title":"확인 기록과 다음 점검 정리하기","when":"직접 시험을 확인한 뒤, 또는 해당 없음·추가 확인으로 종료할 때 보냅니다.","text":"활동: 내 앱의 공급자 체크리스트 작성\n앱 이름과 프로젝트: [입력]\n이번 시험 주소: [입력]\n준비 정보: 최신 공식 체크리스트 원본, 앱 정보, 약관·방침, 화면·설정 증빙\n현재 상황: [입력]\n사용할 가상 자료: [입력]\n실제로 진행한 단계: [입력]\n확인한 결과 또는 아직 확인하지 못한 내용: [입력]\n\n이번 활동 기록을 Markdown으로 정리해 줘. 항목은 앱과 시험 버전, 점검한 기능, 발견한 문제와 위치, 승인한 수정, 시험 입력과 기대 결과, 실제 결과와 근거, 추가 확인할 일로 구성해 줘.\n앞으로 개발할 때 지킬 기준도 우리 앱의 실제 코드·설정 위치와 연결해 적어 줘:\n1. 항목별 답변 초안·근거 설명·증빙 파일 또는 URL·확인일을 정리해 줘.\n2. 화면 캡처가 필요하면 어떤 화면의 어느 요소가 해당 항목을 증명하는지 정확히 알려 줘.\n3. 학생 정보·키·계정이 보이는 증빙은 가리거나 가상 자료로 다시 준비하게 해 줘.\n4. 미충족 항목은 수정 계획과 재확인 방법을 적고 형식적인 체크로 넘기지 마.\n\n활동 상태는 확인 완료·추가 확인·해당 없음 중 근거에 맞게 적어 줘. 구현만 하고 시험하지 않았다면 확인 완료로 쓰지 마. 문제를 발견하지 못한 것과 충분히 검증한 것을 구분해 줘.\n다음 수정 때 다시 실행할 시험은 다음 내용을 바탕으로 정리해 줘:\n1. 원본 서식의 항목 수와 순서가 작성본과 일치하는지 확인해 줘.\n2. 답변 문장마다 연결된 증빙이 실제 주장을 뒷받침하는지 확인해 줘.\n보고서에 원문 학생 자료나 비밀값을 넣지 마. 이 기록만으로 학교 승인이나 앱 전체의 안전을 보장한다고 쓰지 마.","next":"기록을 자신의 프로젝트에 보관하고 필요한 다음 활동을 선택합니다. 새로운 대화를 시작할 때는 이 기록과 공통 시작 프롬프트를 함께 제공합니다."}]},{"id":31,"title":"학교 제출 자료 묶음 준비","group":"학교 제출 자료","slides":"47~49, 64","condition":"작성한 자료를 학교 담당자에게 전달하기 전","inputs":"학교 요구 서식, 기본 정보, 체크리스트, 문서 링크, 증빙","inspect":["학교가 요구한 서류 목록과 현재 준비한 파일을 대조해 줘.","앱 이름·주소·버전·운영 주체가 모든 문서에서 같은지 확인해 줘.","학습 목적과 대상, 개인정보 처리 설명, 미확인 사항이 구분되어 있는지 확인해 줘.","담당자가 개발 도구 없이 확인할 수 있는 링크와 캡처가 있는지 확인해 줘."],"requirements":["기본 정보·기능 설명·공급자 체크리스트·약관과 방침·증빙 목록을 학교 요구 순서로 묶어 줘.","누락된 자료와 학교가 확인할 질문은 별도 목록으로 짧게 정리해 줘.","담당 교사와 학교운영위원회의 확인·심의를 대신하는 승인 문구를 만들지 마.","실제 제출·이메일 발송·외부 공유는 내가 요청하기 전 실행하지 마."],"tests":["문서 간 기능·수집 항목·보관 설명이 같은지 확인해 줘.","로그인 없이 보여 줄 공개 자료와 권한이 필요한 증빙을 구분해 줘.","증빙에서 실제 학생과 비밀정보가 노출되지 않는지 확인해 줘.","파일명·링크·적용일을 마지막으로 확인하고 전달할 자료 목록을 만들어 줘."],"location":"문서 묶음과 링크를 실제로 열어 확인합니다. 제출 절차와 확정 판단은 학교 안내에 따릅니다.","links":["https://www.moe.go.kr/boardCnts/viewRenew.do?boardID=294&boardSeq=105007&lev=0&m=020"],"branches":[["학교 양식이 별도로 있는 경우","그 양식의 항목과 순서를 유지해 줘. 기존 내용을 대응해 옮기고 추가 자료는 부록으로 분리해 줘."],["검토가 끝나지 않은 항목이 있는 경우","아직 확인하지 못한 이유와 확인할 사람, 필요한 자료를 적어 담당자에게 전달할 수 있게 해 줘. 해당 항목은 검토 완료로 표시하지 마."]],"prompts":[{"id":"a31-inspect","category":"기본 진행","title":"1 현재 상태부터 확인하기","when":"프로젝트를 연 뒤 처음 보냅니다. 파일을 고치기 전 단계입니다.","text":"활동: 학교 제출 자료 묶음 준비\n앱 이름과 프로젝트: [입력]\n이번 시험 주소: [입력]\n준비 정보: 학교 요구 서식, 기본 정보, 체크리스트, 문서 링크, 증빙\n현재 상황: [입력]\n사용할 가상 자료: [입력]\n\n이 활동에 해당하는지부터 확인해 줘. 아직 파일이나 설정은 수정하지 마.\n1. 학교가 요구한 서류 목록과 현재 준비한 파일을 대조해 줘.\n2. 앱 이름·주소·버전·운영 주체가 모든 문서에서 같은지 확인해 줘.\n3. 학습 목적과 대상, 개인정보 처리 설명, 미확인 사항이 구분되어 있는지 확인해 줘.\n4. 담당자가 개발 도구 없이 확인할 수 있는 링크와 캡처가 있는지 확인해 줘.\n\n결과는 표로 정리해 줘. 표에는 확인 항목, 현재 동작, 근거가 있는 파일이나 설정 위치, 발견한 문제와 추가로 확인할 내용을 적어 줘. 코드에서 확인한 사실과 추정은 구분해 줘. 내가 직접 확인할 메뉴·버튼·파일 이름도 알려 줘. 파일을 읽지 못했다면 그 사실을 표시해 줘.\n실제 학생 정보·비밀키·인증 토큰은 출력하지 말고 필요한 값은 가려 줘. 내 앱 또는 허락받은 시험 환경만 대상으로 해 줘.\n참고할 확인 위치: 문서 묶음과 링크를 실제로 열어 확인합니다. 제출 절차와 확정 판단은 학교 안내에 따릅니다.","next":"현재 구조와 해당 여부를 확인합니다. 모르는 정보는 먼저 확인하고, 수정이 필요하면 2번으로 진행합니다."},{"id":"a31-plan","category":"기본 진행","title":"2 수정 방법과 범위 정하기","when":"1번 답변에서 실제로 고칠 항목을 골랐을 때 보냅니다.","text":"활동: 학교 제출 자료 묶음 준비\n앱 이름과 프로젝트: [입력]\n이번 시험 주소: [입력]\n준비 정보: 학교 요구 서식, 기본 정보, 체크리스트, 문서 링크, 증빙\n현재 상황: [입력]\n사용할 가상 자료: [입력]\n앞에서 확인한 문제와 근거: [1번 결과 중 해당 부분을 붙이기]\n이번에 고칠 항목: [입력]\n\n구현 전에 다음 조건으로 수정 계획을 만들어 줘.\n1. 기본 정보·기능 설명·공급자 체크리스트·약관과 방침·증빙 목록을 학교 요구 순서로 묶어 줘.\n2. 누락된 자료와 학교가 확인할 질문은 별도 목록으로 짧게 정리해 줘.\n3. 담당 교사와 학교운영위원회의 확인·심의를 대신하는 승인 문구를 만들지 마.\n4. 실제 제출·이메일 발송·외부 공유는 내가 요청하기 전 실행하지 마.\n\n기존 기능을 유지하면서 문제를 고칠 방법부터 제안해 줘. 방법이 여러 가지라면 필요한 서비스와 비용, 사용 방법이 달라지는 부분, 이전 상태로 되돌릴 방법을 비교해 줘. 반드시 고쳐야 할 부분과 선택해서 개선할 부분을 구분해 줘.\n변경할 파일, 학생 또는 교사 화면에서 달라질 부분, 필요한 관리 설정, 시험할 가상 입력을 순서대로 적어 줘. 서버가 없는 앱이라면 지금 할 수 있는 것과 서버가 필요한 것을 분리해 줘.\n아직 코드를 수정하거나 서비스를 만들지 마. 내가 결정해야 할 사항이 있으면 선택지와 차이를 설명하고 물어봐 줘.","next":"수정할 내용과 비용, 정보 수집·전송·보관 방식이 달라지는지 확인한 뒤 진행할 방법을 정합니다. 학교가 판단해야 하는 내용은 먼저 확인합니다."},{"id":"a31-implement","category":"기본 진행","title":"3 선택한 범위 구현하기","when":"수정 계획을 검토한 뒤 승인할 범위를 직접 적고 보냅니다.","text":"활동: 학교 제출 자료 묶음 준비\n앱 이름과 프로젝트: [입력]\n이번 시험 주소: [입력]\n준비 정보: 학교 요구 서식, 기본 정보, 체크리스트, 문서 링크, 증빙\n현재 상황: [입력]\n사용할 가상 자료: [입력]\n승인한 수정안: [선택한 방법과 항목을 정확히 입력]\n수정할 파일 또는 기능 범위: [입력]\n이번에 제외할 것: [입력]\n\n위에 승인한 범위만 구현해 줘. 시작 전에 현재 변경 파일을 확인해 다른 작업을 보존해 줘.\n1. 기본 정보·기능 설명·공급자 체크리스트·약관과 방침·증빙 목록을 학교 요구 순서로 묶어 줘.\n2. 누락된 자료와 학교가 확인할 질문은 별도 목록으로 짧게 정리해 줘.\n3. 담당 교사와 학교운영위원회의 확인·심의를 대신하는 승인 문구를 만들지 마.\n4. 실제 제출·이메일 발송·외부 공유는 내가 요청하기 전 실행하지 마.\n\n한 부분씩 수정하고 실행 결과를 확인해 줘. 기존 디자인과 정상 기능은 유지해 줘. 새 서비스 생성·운영 자료 삭제·유료 호출·커밋·푸시·배포는 이 요청에 구체적으로 승인한 경우에만 실행해 줘. 요청하지 않은 변경이 필요하면 진행 전에 이유를 설명해 줘.\n수정 후 바꾼 파일과 이유, 실행한 검사, 아직 하지 못한 시험, 내가 누를 버튼 순서를 적어 줘. 실제 학생 정보·비밀키·인증 토큰은 출력하지 말고 필요한 값은 가려 줘. 내 앱 또는 허락받은 시험 환경만 대상으로 해 줘.","next":"빌드나 실행 오류가 없는지 확인한 뒤 4번으로 진행합니다. 허용해야 할 동작은 정상적으로 되고, 차단해야 할 동작은 막히는지 함께 시험합니다."},{"id":"a31-verify","category":"기본 진행","title":"4 수정 결과 직접 확인하기","when":"구현이 끝났거나 기존 기능이 안전하게 동작하는지 검증할 때 보냅니다.","text":"활동: 학교 제출 자료 묶음 준비\n앱 이름과 프로젝트: [입력]\n이번 시험 주소: [입력]\n준비 정보: 학교 요구 서식, 기본 정보, 체크리스트, 문서 링크, 증빙\n현재 상황: [입력]\n사용할 가상 자료: [입력]\n이번 수정 내용: [입력 또는 기존 기능 검증]\n시험할 버전과 주소: [입력]\n\n다음 조건을 가상 자료로 다시 시험해 줘.\n1. 문서 간 기능·수집 항목·보관 설명이 같은지 확인해 줘.\n2. 로그인 없이 보여 줄 공개 자료와 권한이 필요한 증빙을 구분해 줘.\n3. 증빙에서 실제 학생과 비밀정보가 노출되지 않는지 확인해 줘.\n4. 파일명·링크·적용일을 마지막으로 확인하고 전달할 자료 목록을 만들어 줘.\n\n내가 직접 따라 할 수 있도록 준비 계정과 상태 → 클릭 또는 입력 → 확인할 실제 탭·요청·필드 → 기대 결과를 항목마다 적어 줘.\n확인할 위치: 문서 묶음과 링크를 실제로 열어 확인합니다. 제출 절차와 확정 판단은 학교 안내에 따릅니다.\n자기 앱에서 이름이 다르면 코드와 실제 요청에서 맞는 이름을 찾아 줘. 실제로 존재하는지 확인하지 않은 요청명을 만들어 내지 마.\n허용해야 할 동작과 차단해야 할 동작을 함께 시험해 줘. 항목마다 실행 여부, 실제 결과, 확인한 화면이나 기록을 적고, 시험하지 못했다면 이유를 설명해 줘. 응답 코드와 실제로 받은 자료를 함께 확인하고, 저장 기능이 있다면 저장된 결과도 확인해 줘.\n이 활동을 완료해도 앱 전체의 안전이 보장된다고 표현하지 마. 실제 학생 정보·비밀키·인증 토큰은 출력하지 말고 필요한 값은 가려 줘. 내 앱 또는 허락받은 시험 환경만 대상으로 해 줘.","next":"기대 결과와 실제 결과가 같으면 활동 기록을 정리합니다. 다르면 “오류 해결” 프롬프트를 사용하고 같은 조건으로 재시험합니다."},{"id":"a31-branch1","category":"상황별 진행","title":"학교 양식이 별도로 있는 경우","when":"기본 순서로 진행하다가 이 상황에 해당하면 사용합니다.","text":"활동: 학교 제출 자료 묶음 준비\n앱 이름과 프로젝트: [입력]\n이번 시험 주소: [입력]\n준비 정보: 학교 요구 서식, 기본 정보, 체크리스트, 문서 링크, 증빙\n현재 상황: [입력]\n사용할 가상 자료: [입력]\n현재 겪는 상황: 학교 양식이 별도로 있는 경우\n이미 한 행동과 나온 결과: [입력]\n\n그 양식의 항목과 순서를 유지해 줘. 기존 내용을 대응해 옮기고 추가 자료는 부록으로 분리해 줘.\n먼저 관련 코드·화면·설정에서 현재 상태를 확인하고 이 상황이 생긴 이유를 근거와 함께 설명해 줘. 현재 환경에서 확인할 수 없는 것은 따로 표시해 줘.\n이 활동에서 유지할 조건:\n1. 기본 정보·기능 설명·공급자 체크리스트·약관과 방침·증빙 목록을 학교 요구 순서로 묶어 줘.\n2. 누락된 자료와 학교가 확인할 질문은 별도 목록으로 짧게 정리해 줘.\n3. 담당 교사와 학교운영위원회의 확인·심의를 대신하는 승인 문구를 만들지 마.\n\n진행 순서를 “지금 확인할 것 → 선택 가능한 방법 → 내가 승인할 변경 → 실행 후 다시 확인할 결과”로 정리해 줘. 앱에 필요 없는 기능을 추가하거나 검사를 끄는 방식으로 해결하지 마.\n재시험에서는 다음 조건을 포함해 줘:\n1. 문서 간 기능·수집 항목·보관 설명이 같은지 확인해 줘.\n2. 로그인 없이 보여 줄 공개 자료와 권한이 필요한 증빙을 구분해 줘.\n수정이 필요하면 먼저 범위를 제안하고 내 확인 전 운영 설정을 바꾸지 마. 실제 학생 정보·비밀키·인증 토큰은 출력하지 말고 필요한 값은 가려 줘. 내 앱 또는 허락받은 시험 환경만 대상으로 해 줘.","next":"이 상황에 맞는 방법을 선택한 뒤 기본 진행의 구현 또는 재시험 단계로 돌아갑니다. 해당 없음이면 이유를 기록하고 다른 활동을 고릅니다."},{"id":"a31-branch2","category":"상황별 진행","title":"검토가 끝나지 않은 항목이 있는 경우","when":"기본 순서로 진행하다가 이 상황에 해당하면 사용합니다.","text":"활동: 학교 제출 자료 묶음 준비\n앱 이름과 프로젝트: [입력]\n이번 시험 주소: [입력]\n준비 정보: 학교 요구 서식, 기본 정보, 체크리스트, 문서 링크, 증빙\n현재 상황: [입력]\n사용할 가상 자료: [입력]\n현재 겪는 상황: 검토가 끝나지 않은 항목이 있는 경우\n이미 한 행동과 나온 결과: [입력]\n\n아직 확인하지 못한 이유와 확인할 사람, 필요한 자료를 적어 담당자에게 전달할 수 있게 해 줘. 해당 항목은 검토 완료로 표시하지 마.\n먼저 관련 코드·화면·설정에서 현재 상태를 확인하고 이 상황이 생긴 이유를 근거와 함께 설명해 줘. 현재 환경에서 확인할 수 없는 것은 따로 표시해 줘.\n이 활동에서 유지할 조건:\n1. 기본 정보·기능 설명·공급자 체크리스트·약관과 방침·증빙 목록을 학교 요구 순서로 묶어 줘.\n2. 누락된 자료와 학교가 확인할 질문은 별도 목록으로 짧게 정리해 줘.\n3. 담당 교사와 학교운영위원회의 확인·심의를 대신하는 승인 문구를 만들지 마.\n\n진행 순서를 “지금 확인할 것 → 선택 가능한 방법 → 내가 승인할 변경 → 실행 후 다시 확인할 결과”로 정리해 줘. 앱에 필요 없는 기능을 추가하거나 검사를 끄는 방식으로 해결하지 마.\n재시험에서는 다음 조건을 포함해 줘:\n1. 문서 간 기능·수집 항목·보관 설명이 같은지 확인해 줘.\n2. 로그인 없이 보여 줄 공개 자료와 권한이 필요한 증빙을 구분해 줘.\n수정이 필요하면 먼저 범위를 제안하고 내 확인 전 운영 설정을 바꾸지 마. 실제 학생 정보·비밀키·인증 토큰은 출력하지 말고 필요한 값은 가려 줘. 내 앱 또는 허락받은 시험 환경만 대상으로 해 줘.","next":"이 상황에 맞는 방법을 선택한 뒤 기본 진행의 구현 또는 재시험 단계로 돌아갑니다. 해당 없음이면 이유를 기록하고 다른 활동을 고릅니다."},{"id":"a31-locate","category":"확인 위치 도움","title":"필요한 서식이나 근거 자료를 찾지 못할 때","when":"공식 서식, 운영 정보, 항목별 증빙이 없거나 서로 다를 때 보냅니다.","text":"활동: 학교 제출 자료 묶음 준비\n앱 이름과 프로젝트: [입력]\n이번 시험 주소: [입력]\n준비 정보: 학교 요구 서식, 기본 정보, 체크리스트, 문서 링크, 증빙\n현재 상황: [입력]\n사용할 가상 자료: [입력]\n찾지 못한 자료 또는 항목: [입력]\n현재 가진 문서의 이름과 발행일: [입력]\n학교 또는 담당자가 요청한 내용: [입력]\n\n문서 묶음과 링크를 실제로 열어 확인합니다. 제출 절차와 확정 판단은 학교 안내에 따릅니다.\n이 활동의 서식과 적용 여부는 학교 안내와 공식 문서에서 확인하도록 안내해 줘. F12에서 확인할 수 있는 내용과 구분해 줘.\n제공한 자료에서 해당 항목의 원문과 적용 대상을 찾아 줘. 자료가 없으면 최신 원본을 구할 공식 기관·메뉴·링크와 검색어를 알려 줘. 접근하지 못한 문서를 읽었다고 하거나 학교가 요구하지 않은 서식을 공식 양식처럼 만들지 마.\n각 항목을 문서에서 확인할 것, 앱의 실제 동작으로 증명할 것, 운영자 또는 학교에 물을 것으로 구분해 줘.\n준비된 자료만으로 답할 수 있는 부분과 추가로 필요한 부분을 나누고, 문의할 질문을 구체적으로 작성해 줘. 참고용 예시를 복사했다면 우리 앱과 다른 사실도 표시해 줘.\n실제 학생 정보·비밀키·인증 토큰은 출력하지 말고 필요한 값은 가려 줘. 내 앱 또는 허락받은 시험 환경만 대상으로 해 줘.","next":"공식 서식과 실제 운영 정보를 확보한 뒤 2번의 작성 범위 결정으로 돌아갑니다. 확인하지 못한 항목을 임의로 채우지 않습니다."},{"id":"a31-error","category":"오류 해결","title":"작성 내용이 사실이나 서식과 맞지 않을 때","when":"누락, 항목 불일치, 근거 없는 판정 또는 보완 요청을 발견했을 때 보냅니다.","text":"활동: 학교 제출 자료 묶음 준비\n앱 이름과 프로젝트: [입력]\n이번 시험 주소: [입력]\n준비 정보: 학교 요구 서식, 기본 정보, 체크리스트, 문서 링크, 증빙\n현재 상황: [입력]\n사용할 가상 자료: [입력]\n문제가 있는 문장 또는 항목: [입력]\n비교할 공식 서식과 실제 운영 사실: [입력]\n보완 요청이 있다면 그 원문: [입력]\n\n다음 기준으로 현재 자료의 차이를 확인해 줘.\n1. 학교가 요구한 서류 목록과 현재 준비한 파일을 대조해 줘.\n2. 앱 이름·주소·버전·운영 주체가 모든 문서에서 같은지 확인해 줘.\n3. 학습 목적과 대상, 개인정보 처리 설명, 미확인 사항이 구분되어 있는지 확인해 줘.\n4. 담당자가 개발 도구 없이 확인할 수 있는 링크와 캡처가 있는지 확인해 줘.\n표현 문제, 실제 기능과의 차이, 근거 부족, 학교 확인이 필요한 사항을 구분해 줘. 서식 원문이나 법적 의미를 바꾸지 말고 필요한 최소 수정안을 보여 줘.\n운영 사실을 확인하지 못했으면 없음 또는 적합이라고 채우지 마. 내가 승인한 문서 수정만 적용하고 앱 코드나 운영 설정을 바꾸지 마.\n수정 후 다음 항목을 다시 대조해 줘.\n1. 문서 간 기능·수집 항목·보관 설명이 같은지 확인해 줘.\n2. 로그인 없이 보여 줄 공개 자료와 권한이 필요한 증빙을 구분해 줘.\n3. 증빙에서 실제 학생과 비밀정보가 노출되지 않는지 확인해 줘.\n4. 파일명·링크·적용일을 마지막으로 확인하고 전달할 자료 목록을 만들어 줘.\n수정한 문장, 근거 자료, 아직 답하지 못한 질문을 함께 제시해 줘. 실제 제출이나 외부 발송은 하지 마.","next":"실패 원인을 확인하고 승인한 수정만 적용합니다. 같은 실패 조건이 해결됐는지와 원래 정상 기능이 유지되는지 함께 봅니다."},{"id":"a31-finish","category":"활동 마무리","title":"확인 기록과 다음 점검 정리하기","when":"직접 시험을 확인한 뒤, 또는 해당 없음·추가 확인으로 종료할 때 보냅니다.","text":"활동: 학교 제출 자료 묶음 준비\n앱 이름과 프로젝트: [입력]\n이번 시험 주소: [입력]\n준비 정보: 학교 요구 서식, 기본 정보, 체크리스트, 문서 링크, 증빙\n현재 상황: [입력]\n사용할 가상 자료: [입력]\n실제로 진행한 단계: [입력]\n확인한 결과 또는 아직 확인하지 못한 내용: [입력]\n\n이번 활동 기록을 Markdown으로 정리해 줘. 항목은 앱과 시험 버전, 점검한 기능, 발견한 문제와 위치, 승인한 수정, 시험 입력과 기대 결과, 실제 결과와 근거, 추가 확인할 일로 구성해 줘.\n앞으로 개발할 때 지킬 기준도 우리 앱의 실제 코드·설정 위치와 연결해 적어 줘:\n1. 기본 정보·기능 설명·공급자 체크리스트·약관과 방침·증빙 목록을 학교 요구 순서로 묶어 줘.\n2. 누락된 자료와 학교가 확인할 질문은 별도 목록으로 짧게 정리해 줘.\n3. 담당 교사와 학교운영위원회의 확인·심의를 대신하는 승인 문구를 만들지 마.\n4. 실제 제출·이메일 발송·외부 공유는 내가 요청하기 전 실행하지 마.\n\n활동 상태는 확인 완료·추가 확인·해당 없음 중 근거에 맞게 적어 줘. 구현만 하고 시험하지 않았다면 확인 완료로 쓰지 마. 문제를 발견하지 못한 것과 충분히 검증한 것을 구분해 줘.\n다음 수정 때 다시 실행할 시험은 다음 내용을 바탕으로 정리해 줘:\n1. 문서 간 기능·수집 항목·보관 설명이 같은지 확인해 줘.\n2. 로그인 없이 보여 줄 공개 자료와 권한이 필요한 증빙을 구분해 줘.\n보고서에 원문 학생 자료나 비밀값을 넣지 마. 이 기록만으로 학교 승인이나 앱 전체의 안전을 보장한다고 쓰지 마.","next":"기록을 자신의 프로젝트에 보관하고 필요한 다음 활동을 선택합니다. 새로운 대화를 시작할 때는 이 기록과 공통 시작 프롬프트를 함께 제공합니다."}]},{"id":32,"title":"여러 수업 앱을 모은 포털 만들기","group":"포털 운영","slides":"65~68","condition":"여러 앱을 한 곳에서 안내할 필요가 있는 경우","inputs":"포털 이름, 앱별 주소·대상·기능·안내·로그인 여부, 기존 디자인","inspect":["현재 앱 목록과 사용 목적을 정리하고 하나의 메뉴로 묶으면 편리한 부분을 확인해 줘.","단순 외부 링크 모음인지 공통 로그인과 자료를 처리하는 포털인지 구분해 줘.","각 연결 앱의 운영 주체·전송 정보·약관·방침을 어디서 확인하는지 정리해 줘.","링크 주소나 설명에 토큰·학생 식별정보가 포함되지 않는지 확인해 줘."],"requirements":["기존 디자인에 맞춰 앱 이름·수업 용도·대상·열기 버튼·필요한 사전 안내를 제공해 줘.","우선 링크 중심의 최소 포털을 만들고 필요 없는 통합 계정이나 DB를 새로 추가하지 마.","포털이 직접 처리하는 정보와 연결 앱의 처리를 구분해 안내하고 각 문서 링크를 제공해 줘.","포털의 실제 구성과 사용 범위가 학교에 설명한 내용과 일치하도록 기본 정보와 목록을 관리해 줘."],"tests":["각 앱 카드의 이름·설명·주소가 실제 앱과 일치하는지 확인해 줘.","로그인 필요한 앱은 그 사실을 알 수 있고 잘못된 로그인 상태로 자료가 노출되지 않는지 확인해 줘.","작은 화면과 키보드에서 원하는 앱을 찾아 열 수 있는지 확인해 줘.","포털 약관·방침과 연결 앱 안내가 서로 혼동되지 않는지 확인해 줘."],"location":"포털에서 각 카드를 직접 열어 실제 앱과 비교합니다. Network로 외부 요청을 확인하되 링크로 새 창을 연 앱의 통신은 해당 창의 F12에서 봅니다.","links":["https://aiworld-ig.vercel.app/"],"branches":[["이미 aiworld 같은 포털이 있는 경우","새 포털을 만들지 말고 기존 카드·분류·안내·문서 링크의 누락을 찾아 필요한 부분만 수정해 줘."],["앱이 하나뿐인 경우","포털을 반드시 만들 필요가 있는지 확인해 줘. 필요 없다면 현재 앱에 이용 안내와 문서 링크만 정리해 줘."]],"prompts":[{"id":"a32-inspect","category":"기본 진행","title":"1 현재 상태부터 확인하기","when":"프로젝트를 연 뒤 처음 보냅니다. 파일을 고치기 전 단계입니다.","text":"활동: 여러 수업 앱을 모은 포털 만들기\n앱 이름과 프로젝트: [입력]\n이번 시험 주소: [입력]\n준비 정보: 포털 이름, 앱별 주소·대상·기능·안내·로그인 여부, 기존 디자인\n현재 상황: [입력]\n사용할 가상 자료: [입력]\n\n이 활동에 해당하는지부터 확인해 줘. 아직 파일이나 설정은 수정하지 마.\n1. 현재 앱 목록과 사용 목적을 정리하고 하나의 메뉴로 묶으면 편리한 부분을 확인해 줘.\n2. 단순 외부 링크 모음인지 공통 로그인과 자료를 처리하는 포털인지 구분해 줘.\n3. 각 연결 앱의 운영 주체·전송 정보·약관·방침을 어디서 확인하는지 정리해 줘.\n4. 링크 주소나 설명에 토큰·학생 식별정보가 포함되지 않는지 확인해 줘.\n\n결과는 표로 정리해 줘. 표에는 확인 항목, 현재 동작, 근거가 있는 파일이나 설정 위치, 발견한 문제와 추가로 확인할 내용을 적어 줘. 코드에서 확인한 사실과 추정은 구분해 줘. 내가 직접 확인할 메뉴·버튼·파일 이름도 알려 줘. 파일을 읽지 못했다면 그 사실을 표시해 줘.\n실제 학생 정보·비밀키·인증 토큰은 출력하지 말고 필요한 값은 가려 줘. 내 앱 또는 허락받은 시험 환경만 대상으로 해 줘.\n참고할 확인 위치: 포털에서 각 카드를 직접 열어 실제 앱과 비교합니다. Network로 외부 요청을 확인하되 링크로 새 창을 연 앱의 통신은 해당 창의 F12에서 봅니다.","next":"현재 구조와 해당 여부를 확인합니다. 모르는 정보는 먼저 확인하고, 수정이 필요하면 2번으로 진행합니다."},{"id":"a32-plan","category":"기본 진행","title":"2 수정 방법과 범위 정하기","when":"1번 답변에서 실제로 고칠 항목을 골랐을 때 보냅니다.","text":"활동: 여러 수업 앱을 모은 포털 만들기\n앱 이름과 프로젝트: [입력]\n이번 시험 주소: [입력]\n준비 정보: 포털 이름, 앱별 주소·대상·기능·안내·로그인 여부, 기존 디자인\n현재 상황: [입력]\n사용할 가상 자료: [입력]\n앞에서 확인한 문제와 근거: [1번 결과 중 해당 부분을 붙이기]\n이번에 고칠 항목: [입력]\n\n구현 전에 다음 조건으로 수정 계획을 만들어 줘.\n1. 기존 디자인에 맞춰 앱 이름·수업 용도·대상·열기 버튼·필요한 사전 안내를 제공해 줘.\n2. 우선 링크 중심의 최소 포털을 만들고 필요 없는 통합 계정이나 DB를 새로 추가하지 마.\n3. 포털이 직접 처리하는 정보와 연결 앱의 처리를 구분해 안내하고 각 문서 링크를 제공해 줘.\n4. 포털의 실제 구성과 사용 범위가 학교에 설명한 내용과 일치하도록 기본 정보와 목록을 관리해 줘.\n\n기존 기능을 유지하면서 문제를 고칠 방법부터 제안해 줘. 방법이 여러 가지라면 필요한 서비스와 비용, 사용 방법이 달라지는 부분, 이전 상태로 되돌릴 방법을 비교해 줘. 반드시 고쳐야 할 부분과 선택해서 개선할 부분을 구분해 줘.\n변경할 파일, 학생 또는 교사 화면에서 달라질 부분, 필요한 관리 설정, 시험할 가상 입력을 순서대로 적어 줘. 서버가 없는 앱이라면 지금 할 수 있는 것과 서버가 필요한 것을 분리해 줘.\n아직 코드를 수정하거나 서비스를 만들지 마. 내가 결정해야 할 사항이 있으면 선택지와 차이를 설명하고 물어봐 줘.","next":"수정할 내용과 비용, 정보 수집·전송·보관 방식이 달라지는지 확인한 뒤 진행할 방법을 정합니다. 학교가 판단해야 하는 내용은 먼저 확인합니다."},{"id":"a32-implement","category":"기본 진행","title":"3 선택한 범위 구현하기","when":"수정 계획을 검토한 뒤 승인할 범위를 직접 적고 보냅니다.","text":"활동: 여러 수업 앱을 모은 포털 만들기\n앱 이름과 프로젝트: [입력]\n이번 시험 주소: [입력]\n준비 정보: 포털 이름, 앱별 주소·대상·기능·안내·로그인 여부, 기존 디자인\n현재 상황: [입력]\n사용할 가상 자료: [입력]\n승인한 수정안: [선택한 방법과 항목을 정확히 입력]\n수정할 파일 또는 기능 범위: [입력]\n이번에 제외할 것: [입력]\n\n위에 승인한 범위만 구현해 줘. 시작 전에 현재 변경 파일을 확인해 다른 작업을 보존해 줘.\n1. 기존 디자인에 맞춰 앱 이름·수업 용도·대상·열기 버튼·필요한 사전 안내를 제공해 줘.\n2. 우선 링크 중심의 최소 포털을 만들고 필요 없는 통합 계정이나 DB를 새로 추가하지 마.\n3. 포털이 직접 처리하는 정보와 연결 앱의 처리를 구분해 안내하고 각 문서 링크를 제공해 줘.\n4. 포털의 실제 구성과 사용 범위가 학교에 설명한 내용과 일치하도록 기본 정보와 목록을 관리해 줘.\n\n한 부분씩 수정하고 실행 결과를 확인해 줘. 기존 디자인과 정상 기능은 유지해 줘. 새 서비스 생성·운영 자료 삭제·유료 호출·커밋·푸시·배포는 이 요청에 구체적으로 승인한 경우에만 실행해 줘. 요청하지 않은 변경이 필요하면 진행 전에 이유를 설명해 줘.\n수정 후 바꾼 파일과 이유, 실행한 검사, 아직 하지 못한 시험, 내가 누를 버튼 순서를 적어 줘. 실제 학생 정보·비밀키·인증 토큰은 출력하지 말고 필요한 값은 가려 줘. 내 앱 또는 허락받은 시험 환경만 대상으로 해 줘.","next":"빌드나 실행 오류가 없는지 확인한 뒤 4번으로 진행합니다. 허용해야 할 동작은 정상적으로 되고, 차단해야 할 동작은 막히는지 함께 시험합니다."},{"id":"a32-verify","category":"기본 진행","title":"4 수정 결과 직접 확인하기","when":"구현이 끝났거나 기존 기능이 안전하게 동작하는지 검증할 때 보냅니다.","text":"활동: 여러 수업 앱을 모은 포털 만들기\n앱 이름과 프로젝트: [입력]\n이번 시험 주소: [입력]\n준비 정보: 포털 이름, 앱별 주소·대상·기능·안내·로그인 여부, 기존 디자인\n현재 상황: [입력]\n사용할 가상 자료: [입력]\n이번 수정 내용: [입력 또는 기존 기능 검증]\n시험할 버전과 주소: [입력]\n\n다음 조건을 가상 자료로 다시 시험해 줘.\n1. 각 앱 카드의 이름·설명·주소가 실제 앱과 일치하는지 확인해 줘.\n2. 로그인 필요한 앱은 그 사실을 알 수 있고 잘못된 로그인 상태로 자료가 노출되지 않는지 확인해 줘.\n3. 작은 화면과 키보드에서 원하는 앱을 찾아 열 수 있는지 확인해 줘.\n4. 포털 약관·방침과 연결 앱 안내가 서로 혼동되지 않는지 확인해 줘.\n\n내가 직접 따라 할 수 있도록 준비 계정과 상태 → 클릭 또는 입력 → 확인할 실제 탭·요청·필드 → 기대 결과를 항목마다 적어 줘.\n확인할 위치: 포털에서 각 카드를 직접 열어 실제 앱과 비교합니다. Network로 외부 요청을 확인하되 링크로 새 창을 연 앱의 통신은 해당 창의 F12에서 봅니다.\n자기 앱에서 이름이 다르면 코드와 실제 요청에서 맞는 이름을 찾아 줘. 실제로 존재하는지 확인하지 않은 요청명을 만들어 내지 마.\n허용해야 할 동작과 차단해야 할 동작을 함께 시험해 줘. 항목마다 실행 여부, 실제 결과, 확인한 화면이나 기록을 적고, 시험하지 못했다면 이유를 설명해 줘. 응답 코드와 실제로 받은 자료를 함께 확인하고, 저장 기능이 있다면 저장된 결과도 확인해 줘.\n이 활동을 완료해도 앱 전체의 안전이 보장된다고 표현하지 마. 실제 학생 정보·비밀키·인증 토큰은 출력하지 말고 필요한 값은 가려 줘. 내 앱 또는 허락받은 시험 환경만 대상으로 해 줘.","next":"기대 결과와 실제 결과가 같으면 활동 기록을 정리합니다. 다르면 “오류 해결” 프롬프트를 사용하고 같은 조건으로 재시험합니다."},{"id":"a32-branch1","category":"상황별 진행","title":"이미 aiworld 같은 포털이 있는 경우","when":"기본 순서로 진행하다가 이 상황에 해당하면 사용합니다.","text":"활동: 여러 수업 앱을 모은 포털 만들기\n앱 이름과 프로젝트: [입력]\n이번 시험 주소: [입력]\n준비 정보: 포털 이름, 앱별 주소·대상·기능·안내·로그인 여부, 기존 디자인\n현재 상황: [입력]\n사용할 가상 자료: [입력]\n현재 겪는 상황: 이미 aiworld 같은 포털이 있는 경우\n이미 한 행동과 나온 결과: [입력]\n\n새 포털을 만들지 말고 기존 카드·분류·안내·문서 링크의 누락을 찾아 필요한 부분만 수정해 줘.\n먼저 관련 코드·화면·설정에서 현재 상태를 확인하고 이 상황이 생긴 이유를 근거와 함께 설명해 줘. 현재 환경에서 확인할 수 없는 것은 따로 표시해 줘.\n이 활동에서 유지할 조건:\n1. 기존 디자인에 맞춰 앱 이름·수업 용도·대상·열기 버튼·필요한 사전 안내를 제공해 줘.\n2. 우선 링크 중심의 최소 포털을 만들고 필요 없는 통합 계정이나 DB를 새로 추가하지 마.\n3. 포털이 직접 처리하는 정보와 연결 앱의 처리를 구분해 안내하고 각 문서 링크를 제공해 줘.\n\n진행 순서를 “지금 확인할 것 → 선택 가능한 방법 → 내가 승인할 변경 → 실행 후 다시 확인할 결과”로 정리해 줘. 앱에 필요 없는 기능을 추가하거나 검사를 끄는 방식으로 해결하지 마.\n재시험에서는 다음 조건을 포함해 줘:\n1. 각 앱 카드의 이름·설명·주소가 실제 앱과 일치하는지 확인해 줘.\n2. 로그인 필요한 앱은 그 사실을 알 수 있고 잘못된 로그인 상태로 자료가 노출되지 않는지 확인해 줘.\n수정이 필요하면 먼저 범위를 제안하고 내 확인 전 운영 설정을 바꾸지 마. 실제 학생 정보·비밀키·인증 토큰은 출력하지 말고 필요한 값은 가려 줘. 내 앱 또는 허락받은 시험 환경만 대상으로 해 줘.","next":"이 상황에 맞는 방법을 선택한 뒤 기본 진행의 구현 또는 재시험 단계로 돌아갑니다. 해당 없음이면 이유를 기록하고 다른 활동을 고릅니다."},{"id":"a32-branch2","category":"상황별 진행","title":"앱이 하나뿐인 경우","when":"기본 순서로 진행하다가 이 상황에 해당하면 사용합니다.","text":"활동: 여러 수업 앱을 모은 포털 만들기\n앱 이름과 프로젝트: [입력]\n이번 시험 주소: [입력]\n준비 정보: 포털 이름, 앱별 주소·대상·기능·안내·로그인 여부, 기존 디자인\n현재 상황: [입력]\n사용할 가상 자료: [입력]\n현재 겪는 상황: 앱이 하나뿐인 경우\n이미 한 행동과 나온 결과: [입력]\n\n포털을 반드시 만들 필요가 있는지 확인해 줘. 필요 없다면 현재 앱에 이용 안내와 문서 링크만 정리해 줘.\n먼저 관련 코드·화면·설정에서 현재 상태를 확인하고 이 상황이 생긴 이유를 근거와 함께 설명해 줘. 현재 환경에서 확인할 수 없는 것은 따로 표시해 줘.\n이 활동에서 유지할 조건:\n1. 기존 디자인에 맞춰 앱 이름·수업 용도·대상·열기 버튼·필요한 사전 안내를 제공해 줘.\n2. 우선 링크 중심의 최소 포털을 만들고 필요 없는 통합 계정이나 DB를 새로 추가하지 마.\n3. 포털이 직접 처리하는 정보와 연결 앱의 처리를 구분해 안내하고 각 문서 링크를 제공해 줘.\n\n진행 순서를 “지금 확인할 것 → 선택 가능한 방법 → 내가 승인할 변경 → 실행 후 다시 확인할 결과”로 정리해 줘. 앱에 필요 없는 기능을 추가하거나 검사를 끄는 방식으로 해결하지 마.\n재시험에서는 다음 조건을 포함해 줘:\n1. 각 앱 카드의 이름·설명·주소가 실제 앱과 일치하는지 확인해 줘.\n2. 로그인 필요한 앱은 그 사실을 알 수 있고 잘못된 로그인 상태로 자료가 노출되지 않는지 확인해 줘.\n수정이 필요하면 먼저 범위를 제안하고 내 확인 전 운영 설정을 바꾸지 마. 실제 학생 정보·비밀키·인증 토큰은 출력하지 말고 필요한 값은 가려 줘. 내 앱 또는 허락받은 시험 환경만 대상으로 해 줘.","next":"이 상황에 맞는 방법을 선택한 뒤 기본 진행의 구현 또는 재시험 단계로 돌아갑니다. 해당 없음이면 이유를 기록하고 다른 활동을 고릅니다."},{"id":"a32-locate","category":"확인 위치 도움","title":"안내된 화면이나 요청을 찾지 못할 때","when":"F12에 설명한 파일·요청이 없거나 확인할 곳을 모르겠을 때 보냅니다.","text":"활동: 여러 수업 앱을 모은 포털 만들기\n앱 이름과 프로젝트: [입력]\n이번 시험 주소: [입력]\n준비 정보: 포털 이름, 앱별 주소·대상·기능·안내·로그인 여부, 기존 디자인\n현재 상황: [입력]\n사용할 가상 자료: [입력]\n내가 보고 있는 주소와 창: [입력]\n누른 버튼 또는 실행한 동작: [입력]\n열어 둔 개발자 도구 탭과 필터: [입력 또는 모름]\n찾으려는 정보: [입력]\n현재 화면 또는 가린 오류 내용: [붙이기]\n\n참고 안내: 포털에서 각 카드를 직접 열어 실제 앱과 비교합니다. Network로 외부 요청을 확인하되 링크로 새 창을 연 앱의 통신은 해당 창의 F12에서 봅니다.\n이 안내가 체험 앱의 가상 자료인지 내 앱의 실제 동작인지 먼저 구분해 줘. 프로젝트에서 이 동작이 어떤 요청·파일·저장소로 연결되는지 찾아 줘.\nNetwork라면 동작 전에 열기, 기록 켜기, 목록 지우기, 필터 확인, 같은 동작 다시 하기, 새 요청 선택, Headers·Payload·Response 중 볼 위치를 실제 이름으로 알려 줘. 정적 파일이면 All 필터도 확인해 줘. 새 창을 열었다면 그 창에서 F12를 열어야 하는지 설명해 줘.\n브라우저 검사에서 막아 요청이 없거나 아직 동작을 실행하지 않은 경우도 구분해 줘. 서버에만 있는 정보는 F12에서 찾으라고 하지 말고 코드·관리 화면·시험 환경에서 확인할 방법을 제시해 줘.\n확인할 자료가 실제로 없으면 없다고 말하고 필요한 시험 준비를 설명해 줘. 캡처 요청에는 가려야 할 정보도 알려 줘. 실제 학생 정보·비밀키·인증 토큰은 출력하지 말고 필요한 값은 가려 줘. 내 앱 또는 허락받은 시험 환경만 대상으로 해 줘.","next":"정확한 위치를 찾은 뒤 해당 활동의 4번 프롬프트로 결과를 확인합니다. 없다는 사실 자체가 기대 결과인지 먼저 판단합니다."},{"id":"a32-error","category":"오류 해결","title":"예상과 다른 결과가 나올 때","when":"실행 오류, 정상 기능 실패, 예상한 차단이 되지 않는 경우에 보냅니다.","text":"활동: 여러 수업 앱을 모은 포털 만들기\n앱 이름과 프로젝트: [입력]\n이번 시험 주소: [입력]\n준비 정보: 포털 이름, 앱별 주소·대상·기능·안내·로그인 여부, 기존 디자인\n현재 상황: [입력]\n사용할 가상 자료: [입력]\n실행한 단계와 입력: [입력]\n기대한 결과: [입력]\n실제로 나온 결과: [입력]\n오류 문구: [비밀값을 가리고 붙이기]\n직전에 변경한 파일 또는 설정: [입력 또는 모름]\n\n원인을 추측해서 여러 곳을 한꺼번에 바꾸지 말고, 재현 조건과 현재 코드를 비교해 줘. 요청이 만들어지는지, 서버에 도착하는지, 검사와 반환·저장이 어디서 달라지는지 관련 단계만 확인해 줘.\n특히 다음 점검 기준을 다시 봐 줘:\n1. 현재 앱 목록과 사용 목적을 정리하고 하나의 메뉴로 묶으면 편리한 부분을 확인해 줘.\n2. 단순 외부 링크 모음인지 공통 로그인과 자료를 처리하는 포털인지 구분해 줘.\n\n가능한 원인마다 그렇게 판단한 이유와 먼저 확인할 방법을 알려 줘. 운영 자료를 삭제하거나 권한·입력 검사를 전체 해제하는 방식은 사용하지 마. 수정이 필요하면 바꿀 내용을 먼저 제안하고 내가 승인한 뒤 적용해 줘.\n수정 후 같은 실패 조건과 다음 정상 조건을 모두 재시험해 줘:\n1. 각 앱 카드의 이름·설명·주소가 실제 앱과 일치하는지 확인해 줘.\n2. 로그인 필요한 앱은 그 사실을 알 수 있고 잘못된 로그인 상태로 자료가 노출되지 않는지 확인해 줘.\n3. 작은 화면과 키보드에서 원하는 앱을 찾아 열 수 있는지 확인해 줘.\n4. 포털 약관·방침과 연결 앱 안내가 서로 혼동되지 않는지 확인해 줘.\n완료 보고에는 실제 실행한 결과와 실행하지 못한 이유를 구분해 줘.","next":"실패 원인을 확인하고 승인한 수정만 적용합니다. 같은 실패 조건이 해결됐는지와 원래 정상 기능이 유지되는지 함께 봅니다."},{"id":"a32-finish","category":"활동 마무리","title":"확인 기록과 다음 점검 정리하기","when":"직접 시험을 확인한 뒤, 또는 해당 없음·추가 확인으로 종료할 때 보냅니다.","text":"활동: 여러 수업 앱을 모은 포털 만들기\n앱 이름과 프로젝트: [입력]\n이번 시험 주소: [입력]\n준비 정보: 포털 이름, 앱별 주소·대상·기능·안내·로그인 여부, 기존 디자인\n현재 상황: [입력]\n사용할 가상 자료: [입력]\n실제로 진행한 단계: [입력]\n확인한 결과 또는 아직 확인하지 못한 내용: [입력]\n\n이번 활동 기록을 Markdown으로 정리해 줘. 항목은 앱과 시험 버전, 점검한 기능, 발견한 문제와 위치, 승인한 수정, 시험 입력과 기대 결과, 실제 결과와 근거, 추가 확인할 일로 구성해 줘.\n앞으로 개발할 때 지킬 기준도 우리 앱의 실제 코드·설정 위치와 연결해 적어 줘:\n1. 기존 디자인에 맞춰 앱 이름·수업 용도·대상·열기 버튼·필요한 사전 안내를 제공해 줘.\n2. 우선 링크 중심의 최소 포털을 만들고 필요 없는 통합 계정이나 DB를 새로 추가하지 마.\n3. 포털이 직접 처리하는 정보와 연결 앱의 처리를 구분해 안내하고 각 문서 링크를 제공해 줘.\n4. 포털의 실제 구성과 사용 범위가 학교에 설명한 내용과 일치하도록 기본 정보와 목록을 관리해 줘.\n\n활동 상태는 확인 완료·추가 확인·해당 없음 중 근거에 맞게 적어 줘. 구현만 하고 시험하지 않았다면 확인 완료로 쓰지 마. 문제를 발견하지 못한 것과 충분히 검증한 것을 구분해 줘.\n다음 수정 때 다시 실행할 시험은 다음 내용을 바탕으로 정리해 줘:\n1. 각 앱 카드의 이름·설명·주소가 실제 앱과 일치하는지 확인해 줘.\n2. 로그인 필요한 앱은 그 사실을 알 수 있고 잘못된 로그인 상태로 자료가 노출되지 않는지 확인해 줘.\n보고서에 원문 학생 자료나 비밀값을 넣지 마. 이 기록만으로 학교 승인이나 앱 전체의 안전을 보장한다고 쓰지 마.","next":"기록을 자신의 프로젝트에 보관하고 필요한 다음 활동을 선택합니다. 새로운 대화를 시작할 때는 이 기록과 공통 시작 프롬프트를 함께 제공합니다."}]},{"id":33,"title":"포털의 앱 목록과 안내 갱신","group":"포털 운영","slides":"65~68","condition":"기존 포털에 링크를 추가하거나 앱 설명을 바꾸는 경우","inputs":"현재 포털 목록, 변경할 링크·설명·기능, 기존 학교 제출 자료","inspect":["이번 변경이 이름·설명·링크의 단순 정리인지 실제 정보 처리·대상·서비스 범위 변화인지 구분해 줘.","추가하는 앱의 실제 주소·기능·운영 주체·개인정보 처리를 확인해 줘.","기존 안내나 학교 제출 자료와 달라지는 사실을 찾아 줘.","적용되는 공식 안내가 있으면 정확한 근거를 확인하고 일반적 업데이트를 자동 재심의 의무로 확대 해석하지 마."],"requirements":["선택한 카드와 링크만 수정하고 불필요한 기능을 추가하지 마.","실제 변경된 범위에 맞춰 이용 안내·앱 목록·관련 문서를 함께 갱신해 줘.","변경일·변경 내용·달라진 처리 여부를 관리자가 확인할 기록으로 남겨 줘.","새 소프트웨어 선정 등 별도 확인이 필요한지 모호하면 사실관계와 질문만 정리해 줘. 회피 가능 또는 재심의 필수라고 근거 없이 단정하지 마."],"tests":["수정한 링크와 기존 링크가 각각 정상 동작하는지 확인해 줘.","카드 설명과 연결 앱의 실제 첫 화면·기능이 맞는지 확인해 줘.","새 링크에 로그인 토큰이나 개인식별정보가 없는지 확인해 줘.","문서 갱신 범위가 실제 변경 범위와 일치하는지 확인해 줘."],"location":"포털 카드와 연결 앱을 직접 확인하고 이전 목록과 변경분을 비교합니다. 운영·학교 확인 사항은 실제 변경 내용과 현재 공식 안내를 바탕으로 판단합니다.","links":["https://aiworld-ig.vercel.app/","https://www.moe.go.kr/boardCnts/viewRenew.do?boardID=294&boardSeq=105007&lev=0&m=020"],"branches":[["단순 링크 추가인 경우","링크 추가 자체와 연결된 앱의 실제 처리를 구분해 줘. 일반적인 링크 관리에 근거 없는 새 의무를 붙이지 말고 설명·주소·처리 정보의 정확성을 확인해 줘."],["새로운 개인정보 처리 기능이 포함된 경우","달라진 항목·목적·외부 전송·보관을 구체적으로 정리하고 기존 안내와 제출 자료에서 확인할 부분을 제시해 줘."]],"prompts":[{"id":"a33-inspect","category":"기본 진행","title":"1 현재 상태부터 확인하기","when":"프로젝트를 연 뒤 처음 보냅니다. 파일을 고치기 전 단계입니다.","text":"활동: 포털의 앱 목록과 안내 갱신\n앱 이름과 프로젝트: [입력]\n이번 시험 주소: [입력]\n준비 정보: 현재 포털 목록, 변경할 링크·설명·기능, 기존 학교 제출 자료\n현재 상황: [입력]\n사용할 가상 자료: [입력]\n\n이 활동에 해당하는지부터 확인해 줘. 아직 파일이나 설정은 수정하지 마.\n1. 이번 변경이 이름·설명·링크의 단순 정리인지 실제 정보 처리·대상·서비스 범위 변화인지 구분해 줘.\n2. 추가하는 앱의 실제 주소·기능·운영 주체·개인정보 처리를 확인해 줘.\n3. 기존 안내나 학교 제출 자료와 달라지는 사실을 찾아 줘.\n4. 적용되는 공식 안내가 있으면 정확한 근거를 확인하고 일반적 업데이트를 자동 재심의 의무로 확대 해석하지 마.\n\n결과는 표로 정리해 줘. 표에는 확인 항목, 현재 동작, 근거가 있는 파일이나 설정 위치, 발견한 문제와 추가로 확인할 내용을 적어 줘. 코드에서 확인한 사실과 추정은 구분해 줘. 내가 직접 확인할 메뉴·버튼·파일 이름도 알려 줘. 파일을 읽지 못했다면 그 사실을 표시해 줘.\n실제 학생 정보·비밀키·인증 토큰은 출력하지 말고 필요한 값은 가려 줘. 내 앱 또는 허락받은 시험 환경만 대상으로 해 줘.\n참고할 확인 위치: 포털 카드와 연결 앱을 직접 확인하고 이전 목록과 변경분을 비교합니다. 운영·학교 확인 사항은 실제 변경 내용과 현재 공식 안내를 바탕으로 판단합니다.","next":"현재 구조와 해당 여부를 확인합니다. 모르는 정보는 먼저 확인하고, 수정이 필요하면 2번으로 진행합니다."},{"id":"a33-plan","category":"기본 진행","title":"2 수정 방법과 범위 정하기","when":"1번 답변에서 실제로 고칠 항목을 골랐을 때 보냅니다.","text":"활동: 포털의 앱 목록과 안내 갱신\n앱 이름과 프로젝트: [입력]\n이번 시험 주소: [입력]\n준비 정보: 현재 포털 목록, 변경할 링크·설명·기능, 기존 학교 제출 자료\n현재 상황: [입력]\n사용할 가상 자료: [입력]\n앞에서 확인한 문제와 근거: [1번 결과 중 해당 부분을 붙이기]\n이번에 고칠 항목: [입력]\n\n구현 전에 다음 조건으로 수정 계획을 만들어 줘.\n1. 선택한 카드와 링크만 수정하고 불필요한 기능을 추가하지 마.\n2. 실제 변경된 범위에 맞춰 이용 안내·앱 목록·관련 문서를 함께 갱신해 줘.\n3. 변경일·변경 내용·달라진 처리 여부를 관리자가 확인할 기록으로 남겨 줘.\n4. 새 소프트웨어 선정 등 별도 확인이 필요한지 모호하면 사실관계와 질문만 정리해 줘. 회피 가능 또는 재심의 필수라고 근거 없이 단정하지 마.\n\n기존 기능을 유지하면서 문제를 고칠 방법부터 제안해 줘. 방법이 여러 가지라면 필요한 서비스와 비용, 사용 방법이 달라지는 부분, 이전 상태로 되돌릴 방법을 비교해 줘. 반드시 고쳐야 할 부분과 선택해서 개선할 부분을 구분해 줘.\n변경할 파일, 학생 또는 교사 화면에서 달라질 부분, 필요한 관리 설정, 시험할 가상 입력을 순서대로 적어 줘. 서버가 없는 앱이라면 지금 할 수 있는 것과 서버가 필요한 것을 분리해 줘.\n아직 코드를 수정하거나 서비스를 만들지 마. 내가 결정해야 할 사항이 있으면 선택지와 차이를 설명하고 물어봐 줘.","next":"수정할 내용과 비용, 정보 수집·전송·보관 방식이 달라지는지 확인한 뒤 진행할 방법을 정합니다. 학교가 판단해야 하는 내용은 먼저 확인합니다."},{"id":"a33-implement","category":"기본 진행","title":"3 선택한 범위 구현하기","when":"수정 계획을 검토한 뒤 승인할 범위를 직접 적고 보냅니다.","text":"활동: 포털의 앱 목록과 안내 갱신\n앱 이름과 프로젝트: [입력]\n이번 시험 주소: [입력]\n준비 정보: 현재 포털 목록, 변경할 링크·설명·기능, 기존 학교 제출 자료\n현재 상황: [입력]\n사용할 가상 자료: [입력]\n승인한 수정안: [선택한 방법과 항목을 정확히 입력]\n수정할 파일 또는 기능 범위: [입력]\n이번에 제외할 것: [입력]\n\n위에 승인한 범위만 구현해 줘. 시작 전에 현재 변경 파일을 확인해 다른 작업을 보존해 줘.\n1. 선택한 카드와 링크만 수정하고 불필요한 기능을 추가하지 마.\n2. 실제 변경된 범위에 맞춰 이용 안내·앱 목록·관련 문서를 함께 갱신해 줘.\n3. 변경일·변경 내용·달라진 처리 여부를 관리자가 확인할 기록으로 남겨 줘.\n4. 새 소프트웨어 선정 등 별도 확인이 필요한지 모호하면 사실관계와 질문만 정리해 줘. 회피 가능 또는 재심의 필수라고 근거 없이 단정하지 마.\n\n한 부분씩 수정하고 실행 결과를 확인해 줘. 기존 디자인과 정상 기능은 유지해 줘. 새 서비스 생성·운영 자료 삭제·유료 호출·커밋·푸시·배포는 이 요청에 구체적으로 승인한 경우에만 실행해 줘. 요청하지 않은 변경이 필요하면 진행 전에 이유를 설명해 줘.\n수정 후 바꾼 파일과 이유, 실행한 검사, 아직 하지 못한 시험, 내가 누를 버튼 순서를 적어 줘. 실제 학생 정보·비밀키·인증 토큰은 출력하지 말고 필요한 값은 가려 줘. 내 앱 또는 허락받은 시험 환경만 대상으로 해 줘.","next":"빌드나 실행 오류가 없는지 확인한 뒤 4번으로 진행합니다. 허용해야 할 동작은 정상적으로 되고, 차단해야 할 동작은 막히는지 함께 시험합니다."},{"id":"a33-verify","category":"기본 진행","title":"4 수정 결과 직접 확인하기","when":"구현이 끝났거나 기존 기능이 안전하게 동작하는지 검증할 때 보냅니다.","text":"활동: 포털의 앱 목록과 안내 갱신\n앱 이름과 프로젝트: [입력]\n이번 시험 주소: [입력]\n준비 정보: 현재 포털 목록, 변경할 링크·설명·기능, 기존 학교 제출 자료\n현재 상황: [입력]\n사용할 가상 자료: [입력]\n이번 수정 내용: [입력 또는 기존 기능 검증]\n시험할 버전과 주소: [입력]\n\n다음 조건을 가상 자료로 다시 시험해 줘.\n1. 수정한 링크와 기존 링크가 각각 정상 동작하는지 확인해 줘.\n2. 카드 설명과 연결 앱의 실제 첫 화면·기능이 맞는지 확인해 줘.\n3. 새 링크에 로그인 토큰이나 개인식별정보가 없는지 확인해 줘.\n4. 문서 갱신 범위가 실제 변경 범위와 일치하는지 확인해 줘.\n\n내가 직접 따라 할 수 있도록 준비 계정과 상태 → 클릭 또는 입력 → 확인할 실제 탭·요청·필드 → 기대 결과를 항목마다 적어 줘.\n확인할 위치: 포털 카드와 연결 앱을 직접 확인하고 이전 목록과 변경분을 비교합니다. 운영·학교 확인 사항은 실제 변경 내용과 현재 공식 안내를 바탕으로 판단합니다.\n자기 앱에서 이름이 다르면 코드와 실제 요청에서 맞는 이름을 찾아 줘. 실제로 존재하는지 확인하지 않은 요청명을 만들어 내지 마.\n허용해야 할 동작과 차단해야 할 동작을 함께 시험해 줘. 항목마다 실행 여부, 실제 결과, 확인한 화면이나 기록을 적고, 시험하지 못했다면 이유를 설명해 줘. 응답 코드와 실제로 받은 자료를 함께 확인하고, 저장 기능이 있다면 저장된 결과도 확인해 줘.\n이 활동을 완료해도 앱 전체의 안전이 보장된다고 표현하지 마. 실제 학생 정보·비밀키·인증 토큰은 출력하지 말고 필요한 값은 가려 줘. 내 앱 또는 허락받은 시험 환경만 대상으로 해 줘.","next":"기대 결과와 실제 결과가 같으면 활동 기록을 정리합니다. 다르면 “오류 해결” 프롬프트를 사용하고 같은 조건으로 재시험합니다."},{"id":"a33-branch1","category":"상황별 진행","title":"단순 링크 추가인 경우","when":"기본 순서로 진행하다가 이 상황에 해당하면 사용합니다.","text":"활동: 포털의 앱 목록과 안내 갱신\n앱 이름과 프로젝트: [입력]\n이번 시험 주소: [입력]\n준비 정보: 현재 포털 목록, 변경할 링크·설명·기능, 기존 학교 제출 자료\n현재 상황: [입력]\n사용할 가상 자료: [입력]\n현재 겪는 상황: 단순 링크 추가인 경우\n이미 한 행동과 나온 결과: [입력]\n\n링크 추가 자체와 연결된 앱의 실제 처리를 구분해 줘. 일반적인 링크 관리에 근거 없는 새 의무를 붙이지 말고 설명·주소·처리 정보의 정확성을 확인해 줘.\n먼저 관련 코드·화면·설정에서 현재 상태를 확인하고 이 상황이 생긴 이유를 근거와 함께 설명해 줘. 현재 환경에서 확인할 수 없는 것은 따로 표시해 줘.\n이 활동에서 유지할 조건:\n1. 선택한 카드와 링크만 수정하고 불필요한 기능을 추가하지 마.\n2. 실제 변경된 범위에 맞춰 이용 안내·앱 목록·관련 문서를 함께 갱신해 줘.\n3. 변경일·변경 내용·달라진 처리 여부를 관리자가 확인할 기록으로 남겨 줘.\n\n진행 순서를 “지금 확인할 것 → 선택 가능한 방법 → 내가 승인할 변경 → 실행 후 다시 확인할 결과”로 정리해 줘. 앱에 필요 없는 기능을 추가하거나 검사를 끄는 방식으로 해결하지 마.\n재시험에서는 다음 조건을 포함해 줘:\n1. 수정한 링크와 기존 링크가 각각 정상 동작하는지 확인해 줘.\n2. 카드 설명과 연결 앱의 실제 첫 화면·기능이 맞는지 확인해 줘.\n수정이 필요하면 먼저 범위를 제안하고 내 확인 전 운영 설정을 바꾸지 마. 실제 학생 정보·비밀키·인증 토큰은 출력하지 말고 필요한 값은 가려 줘. 내 앱 또는 허락받은 시험 환경만 대상으로 해 줘.","next":"이 상황에 맞는 방법을 선택한 뒤 기본 진행의 구현 또는 재시험 단계로 돌아갑니다. 해당 없음이면 이유를 기록하고 다른 활동을 고릅니다."},{"id":"a33-branch2","category":"상황별 진행","title":"새로운 개인정보 처리 기능이 포함된 경우","when":"기본 순서로 진행하다가 이 상황에 해당하면 사용합니다.","text":"활동: 포털의 앱 목록과 안내 갱신\n앱 이름과 프로젝트: [입력]\n이번 시험 주소: [입력]\n준비 정보: 현재 포털 목록, 변경할 링크·설명·기능, 기존 학교 제출 자료\n현재 상황: [입력]\n사용할 가상 자료: [입력]\n현재 겪는 상황: 새로운 개인정보 처리 기능이 포함된 경우\n이미 한 행동과 나온 결과: [입력]\n\n달라진 항목·목적·외부 전송·보관을 구체적으로 정리하고 기존 안내와 제출 자료에서 확인할 부분을 제시해 줘.\n먼저 관련 코드·화면·설정에서 현재 상태를 확인하고 이 상황이 생긴 이유를 근거와 함께 설명해 줘. 현재 환경에서 확인할 수 없는 것은 따로 표시해 줘.\n이 활동에서 유지할 조건:\n1. 선택한 카드와 링크만 수정하고 불필요한 기능을 추가하지 마.\n2. 실제 변경된 범위에 맞춰 이용 안내·앱 목록·관련 문서를 함께 갱신해 줘.\n3. 변경일·변경 내용·달라진 처리 여부를 관리자가 확인할 기록으로 남겨 줘.\n\n진행 순서를 “지금 확인할 것 → 선택 가능한 방법 → 내가 승인할 변경 → 실행 후 다시 확인할 결과”로 정리해 줘. 앱에 필요 없는 기능을 추가하거나 검사를 끄는 방식으로 해결하지 마.\n재시험에서는 다음 조건을 포함해 줘:\n1. 수정한 링크와 기존 링크가 각각 정상 동작하는지 확인해 줘.\n2. 카드 설명과 연결 앱의 실제 첫 화면·기능이 맞는지 확인해 줘.\n수정이 필요하면 먼저 범위를 제안하고 내 확인 전 운영 설정을 바꾸지 마. 실제 학생 정보·비밀키·인증 토큰은 출력하지 말고 필요한 값은 가려 줘. 내 앱 또는 허락받은 시험 환경만 대상으로 해 줘.","next":"이 상황에 맞는 방법을 선택한 뒤 기본 진행의 구현 또는 재시험 단계로 돌아갑니다. 해당 없음이면 이유를 기록하고 다른 활동을 고릅니다."},{"id":"a33-locate","category":"확인 위치 도움","title":"안내된 화면이나 요청을 찾지 못할 때","when":"F12에 설명한 파일·요청이 없거나 확인할 곳을 모르겠을 때 보냅니다.","text":"활동: 포털의 앱 목록과 안내 갱신\n앱 이름과 프로젝트: [입력]\n이번 시험 주소: [입력]\n준비 정보: 현재 포털 목록, 변경할 링크·설명·기능, 기존 학교 제출 자료\n현재 상황: [입력]\n사용할 가상 자료: [입력]\n내가 보고 있는 주소와 창: [입력]\n누른 버튼 또는 실행한 동작: [입력]\n열어 둔 개발자 도구 탭과 필터: [입력 또는 모름]\n찾으려는 정보: [입력]\n현재 화면 또는 가린 오류 내용: [붙이기]\n\n참고 안내: 포털 카드와 연결 앱을 직접 확인하고 이전 목록과 변경분을 비교합니다. 운영·학교 확인 사항은 실제 변경 내용과 현재 공식 안내를 바탕으로 판단합니다.\n이 안내가 체험 앱의 가상 자료인지 내 앱의 실제 동작인지 먼저 구분해 줘. 프로젝트에서 이 동작이 어떤 요청·파일·저장소로 연결되는지 찾아 줘.\nNetwork라면 동작 전에 열기, 기록 켜기, 목록 지우기, 필터 확인, 같은 동작 다시 하기, 새 요청 선택, Headers·Payload·Response 중 볼 위치를 실제 이름으로 알려 줘. 정적 파일이면 All 필터도 확인해 줘. 새 창을 열었다면 그 창에서 F12를 열어야 하는지 설명해 줘.\n브라우저 검사에서 막아 요청이 없거나 아직 동작을 실행하지 않은 경우도 구분해 줘. 서버에만 있는 정보는 F12에서 찾으라고 하지 말고 코드·관리 화면·시험 환경에서 확인할 방법을 제시해 줘.\n확인할 자료가 실제로 없으면 없다고 말하고 필요한 시험 준비를 설명해 줘. 캡처 요청에는 가려야 할 정보도 알려 줘. 실제 학생 정보·비밀키·인증 토큰은 출력하지 말고 필요한 값은 가려 줘. 내 앱 또는 허락받은 시험 환경만 대상으로 해 줘.","next":"정확한 위치를 찾은 뒤 해당 활동의 4번 프롬프트로 결과를 확인합니다. 없다는 사실 자체가 기대 결과인지 먼저 판단합니다."},{"id":"a33-error","category":"오류 해결","title":"예상과 다른 결과가 나올 때","when":"실행 오류, 정상 기능 실패, 예상한 차단이 되지 않는 경우에 보냅니다.","text":"활동: 포털의 앱 목록과 안내 갱신\n앱 이름과 프로젝트: [입력]\n이번 시험 주소: [입력]\n준비 정보: 현재 포털 목록, 변경할 링크·설명·기능, 기존 학교 제출 자료\n현재 상황: [입력]\n사용할 가상 자료: [입력]\n실행한 단계와 입력: [입력]\n기대한 결과: [입력]\n실제로 나온 결과: [입력]\n오류 문구: [비밀값을 가리고 붙이기]\n직전에 변경한 파일 또는 설정: [입력 또는 모름]\n\n원인을 추측해서 여러 곳을 한꺼번에 바꾸지 말고, 재현 조건과 현재 코드를 비교해 줘. 요청이 만들어지는지, 서버에 도착하는지, 검사와 반환·저장이 어디서 달라지는지 관련 단계만 확인해 줘.\n특히 다음 점검 기준을 다시 봐 줘:\n1. 이번 변경이 이름·설명·링크의 단순 정리인지 실제 정보 처리·대상·서비스 범위 변화인지 구분해 줘.\n2. 추가하는 앱의 실제 주소·기능·운영 주체·개인정보 처리를 확인해 줘.\n\n가능한 원인마다 그렇게 판단한 이유와 먼저 확인할 방법을 알려 줘. 운영 자료를 삭제하거나 권한·입력 검사를 전체 해제하는 방식은 사용하지 마. 수정이 필요하면 바꿀 내용을 먼저 제안하고 내가 승인한 뒤 적용해 줘.\n수정 후 같은 실패 조건과 다음 정상 조건을 모두 재시험해 줘:\n1. 수정한 링크와 기존 링크가 각각 정상 동작하는지 확인해 줘.\n2. 카드 설명과 연결 앱의 실제 첫 화면·기능이 맞는지 확인해 줘.\n3. 새 링크에 로그인 토큰이나 개인식별정보가 없는지 확인해 줘.\n4. 문서 갱신 범위가 실제 변경 범위와 일치하는지 확인해 줘.\n완료 보고에는 실제 실행한 결과와 실행하지 못한 이유를 구분해 줘.","next":"실패 원인을 확인하고 승인한 수정만 적용합니다. 같은 실패 조건이 해결됐는지와 원래 정상 기능이 유지되는지 함께 봅니다."},{"id":"a33-finish","category":"활동 마무리","title":"확인 기록과 다음 점검 정리하기","when":"직접 시험을 확인한 뒤, 또는 해당 없음·추가 확인으로 종료할 때 보냅니다.","text":"활동: 포털의 앱 목록과 안내 갱신\n앱 이름과 프로젝트: [입력]\n이번 시험 주소: [입력]\n준비 정보: 현재 포털 목록, 변경할 링크·설명·기능, 기존 학교 제출 자료\n현재 상황: [입력]\n사용할 가상 자료: [입력]\n실제로 진행한 단계: [입력]\n확인한 결과 또는 아직 확인하지 못한 내용: [입력]\n\n이번 활동 기록을 Markdown으로 정리해 줘. 항목은 앱과 시험 버전, 점검한 기능, 발견한 문제와 위치, 승인한 수정, 시험 입력과 기대 결과, 실제 결과와 근거, 추가 확인할 일로 구성해 줘.\n앞으로 개발할 때 지킬 기준도 우리 앱의 실제 코드·설정 위치와 연결해 적어 줘:\n1. 선택한 카드와 링크만 수정하고 불필요한 기능을 추가하지 마.\n2. 실제 변경된 범위에 맞춰 이용 안내·앱 목록·관련 문서를 함께 갱신해 줘.\n3. 변경일·변경 내용·달라진 처리 여부를 관리자가 확인할 기록으로 남겨 줘.\n4. 새 소프트웨어 선정 등 별도 확인이 필요한지 모호하면 사실관계와 질문만 정리해 줘. 회피 가능 또는 재심의 필수라고 근거 없이 단정하지 마.\n\n활동 상태는 확인 완료·추가 확인·해당 없음 중 근거에 맞게 적어 줘. 구현만 하고 시험하지 않았다면 확인 완료로 쓰지 마. 문제를 발견하지 못한 것과 충분히 검증한 것을 구분해 줘.\n다음 수정 때 다시 실행할 시험은 다음 내용을 바탕으로 정리해 줘:\n1. 수정한 링크와 기존 링크가 각각 정상 동작하는지 확인해 줘.\n2. 카드 설명과 연결 앱의 실제 첫 화면·기능이 맞는지 확인해 줘.\n보고서에 원문 학생 자료나 비밀값을 넣지 마. 이 기록만으로 학교 승인이나 앱 전체의 안전을 보장한다고 쓰지 마.","next":"기록을 자신의 프로젝트에 보관하고 필요한 다음 활동을 선택합니다. 새로운 대화를 시작할 때는 이 기록과 공통 시작 프롬프트를 함께 제공합니다."}]},{"id":34,"title":"프로젝트 전체를 AI로 보안 점검","group":"마지막 점검과 배포","slides":"24~27","condition":"개별 활동 후 전체 누락을 확인할 때","inputs":"프로젝트, 적용한 활동 목록, 시험 계정, 현재 문서","inspect":["기능 목록을 기준으로 인증·권한·키·입력·출력·파일·요청 제한·저장·외부 전송을 점검해 줘.","각 지적에 파일 경로·함수·실제 요청 또는 화면 근거를 붙여 줘.","문제가 생기는 조건과 영향, 먼저 고쳐야 할 이유를 설명해 줘. 개선을 권하는 사항과 확인된 보안 취약점은 구분해 줘.","코드가 없거나 관리 권한이 필요한 영역은 확인하지 못했다고 쓰고 안전으로 처리하지 마."],"requirements":["높은 위험부터 작은 수정 단위로 나누고 기존 수업 흐름에 미치는 영향을 알려 줘.","내가 승인한 항목만 수정하고 관련 없는 파일과 기능은 유지해 줘.","각 수정에 재현 시험과 재발 방지 시험을 함께 제안해 줘.","자동 도구의 결과를 그대로 최종 결론으로 옮기지 말고 실제 적용 경로를 확인해 줘."],"tests":["수정 전 재현 조건을 같은 가상 자료로 다시 실행해 줘.","차단되어야 할 행동과 허용되어야 할 정상 행동을 함께 시험해 줘.","키와 개인정보가 코드·빌드 파일·응답에 노출되지 않는지 재확인해 줘.","확인 완료·추가 확인·해당 없음과 그 근거를 항목별로 보고해 줘."],"location":"소스 코드·시험 실행·브라우저 요청·관리 설정을 함께 확인합니다. F12는 브라우저에 도달한 정보와 요청을 보는 도구이며 전체 보안 검사 도구를 대신하지 않습니다.","links":["https://webapp-security-lab.vercel.app/#/apply","https://webapp-security-lab.vercel.app/#/checklist"],"branches":[["프로젝트가 커서 한 번에 검토하기 어려운 경우","라우트와 기능별로 검토 범위를 나눠 줘. 이번에 확인한 파일과 아직 확인하지 않은 파일을 누적 목록으로 관리해 줘."],["AI가 문제 없다고만 답한 경우","확인한 파일·실행한 시험·검토하지 못한 설정을 구체적으로 제시해 줘. 근거 없는 안전 결론은 철회하고 확인 수준별로 다시 보고해 줘."]],"prompts":[{"id":"a34-inspect","category":"기본 진행","title":"1 현재 상태부터 확인하기","when":"프로젝트를 연 뒤 처음 보냅니다. 파일을 고치기 전 단계입니다.","text":"활동: 프로젝트 전체를 AI로 보안 점검\n앱 이름과 프로젝트: [입력]\n이번 시험 주소: [입력]\n준비 정보: 프로젝트, 적용한 활동 목록, 시험 계정, 현재 문서\n현재 상황: [입력]\n사용할 가상 자료: [입력]\n\n이 활동에 해당하는지부터 확인해 줘. 아직 파일이나 설정은 수정하지 마.\n1. 기능 목록을 기준으로 인증·권한·키·입력·출력·파일·요청 제한·저장·외부 전송을 점검해 줘.\n2. 각 지적에 파일 경로·함수·실제 요청 또는 화면 근거를 붙여 줘.\n3. 문제가 생기는 조건과 영향, 먼저 고쳐야 할 이유를 설명해 줘. 개선을 권하는 사항과 확인된 보안 취약점은 구분해 줘.\n4. 코드가 없거나 관리 권한이 필요한 영역은 확인하지 못했다고 쓰고 안전으로 처리하지 마.\n\n결과는 표로 정리해 줘. 표에는 확인 항목, 현재 동작, 근거가 있는 파일이나 설정 위치, 발견한 문제와 추가로 확인할 내용을 적어 줘. 코드에서 확인한 사실과 추정은 구분해 줘. 내가 직접 확인할 메뉴·버튼·파일 이름도 알려 줘. 파일을 읽지 못했다면 그 사실을 표시해 줘.\n실제 학생 정보·비밀키·인증 토큰은 출력하지 말고 필요한 값은 가려 줘. 내 앱 또는 허락받은 시험 환경만 대상으로 해 줘.\n참고할 확인 위치: 소스 코드·시험 실행·브라우저 요청·관리 설정을 함께 확인합니다. F12는 브라우저에 도달한 정보와 요청을 보는 도구이며 전체 보안 검사 도구를 대신하지 않습니다.","next":"현재 구조와 해당 여부를 확인합니다. 모르는 정보는 먼저 확인하고, 수정이 필요하면 2번으로 진행합니다."},{"id":"a34-plan","category":"기본 진행","title":"2 수정 방법과 범위 정하기","when":"1번 답변에서 실제로 고칠 항목을 골랐을 때 보냅니다.","text":"활동: 프로젝트 전체를 AI로 보안 점검\n앱 이름과 프로젝트: [입력]\n이번 시험 주소: [입력]\n준비 정보: 프로젝트, 적용한 활동 목록, 시험 계정, 현재 문서\n현재 상황: [입력]\n사용할 가상 자료: [입력]\n앞에서 확인한 문제와 근거: [1번 결과 중 해당 부분을 붙이기]\n이번에 고칠 항목: [입력]\n\n구현 전에 다음 조건으로 수정 계획을 만들어 줘.\n1. 높은 위험부터 작은 수정 단위로 나누고 기존 수업 흐름에 미치는 영향을 알려 줘.\n2. 내가 승인한 항목만 수정하고 관련 없는 파일과 기능은 유지해 줘.\n3. 각 수정에 재현 시험과 재발 방지 시험을 함께 제안해 줘.\n4. 자동 도구의 결과를 그대로 최종 결론으로 옮기지 말고 실제 적용 경로를 확인해 줘.\n\n기존 기능을 유지하면서 문제를 고칠 방법부터 제안해 줘. 방법이 여러 가지라면 필요한 서비스와 비용, 사용 방법이 달라지는 부분, 이전 상태로 되돌릴 방법을 비교해 줘. 반드시 고쳐야 할 부분과 선택해서 개선할 부분을 구분해 줘.\n변경할 파일, 학생 또는 교사 화면에서 달라질 부분, 필요한 관리 설정, 시험할 가상 입력을 순서대로 적어 줘. 서버가 없는 앱이라면 지금 할 수 있는 것과 서버가 필요한 것을 분리해 줘.\n아직 코드를 수정하거나 서비스를 만들지 마. 내가 결정해야 할 사항이 있으면 선택지와 차이를 설명하고 물어봐 줘.","next":"수정할 내용과 비용, 정보 수집·전송·보관 방식이 달라지는지 확인한 뒤 진행할 방법을 정합니다. 학교가 판단해야 하는 내용은 먼저 확인합니다."},{"id":"a34-implement","category":"기본 진행","title":"3 선택한 범위 구현하기","when":"수정 계획을 검토한 뒤 승인할 범위를 직접 적고 보냅니다.","text":"활동: 프로젝트 전체를 AI로 보안 점검\n앱 이름과 프로젝트: [입력]\n이번 시험 주소: [입력]\n준비 정보: 프로젝트, 적용한 활동 목록, 시험 계정, 현재 문서\n현재 상황: [입력]\n사용할 가상 자료: [입력]\n승인한 수정안: [선택한 방법과 항목을 정확히 입력]\n수정할 파일 또는 기능 범위: [입력]\n이번에 제외할 것: [입력]\n\n위에 승인한 범위만 구현해 줘. 시작 전에 현재 변경 파일을 확인해 다른 작업을 보존해 줘.\n1. 높은 위험부터 작은 수정 단위로 나누고 기존 수업 흐름에 미치는 영향을 알려 줘.\n2. 내가 승인한 항목만 수정하고 관련 없는 파일과 기능은 유지해 줘.\n3. 각 수정에 재현 시험과 재발 방지 시험을 함께 제안해 줘.\n4. 자동 도구의 결과를 그대로 최종 결론으로 옮기지 말고 실제 적용 경로를 확인해 줘.\n\n한 부분씩 수정하고 실행 결과를 확인해 줘. 기존 디자인과 정상 기능은 유지해 줘. 새 서비스 생성·운영 자료 삭제·유료 호출·커밋·푸시·배포는 이 요청에 구체적으로 승인한 경우에만 실행해 줘. 요청하지 않은 변경이 필요하면 진행 전에 이유를 설명해 줘.\n수정 후 바꾼 파일과 이유, 실행한 검사, 아직 하지 못한 시험, 내가 누를 버튼 순서를 적어 줘. 실제 학생 정보·비밀키·인증 토큰은 출력하지 말고 필요한 값은 가려 줘. 내 앱 또는 허락받은 시험 환경만 대상으로 해 줘.","next":"빌드나 실행 오류가 없는지 확인한 뒤 4번으로 진행합니다. 허용해야 할 동작은 정상적으로 되고, 차단해야 할 동작은 막히는지 함께 시험합니다."},{"id":"a34-verify","category":"기본 진행","title":"4 수정 결과 직접 확인하기","when":"구현이 끝났거나 기존 기능이 안전하게 동작하는지 검증할 때 보냅니다.","text":"활동: 프로젝트 전체를 AI로 보안 점검\n앱 이름과 프로젝트: [입력]\n이번 시험 주소: [입력]\n준비 정보: 프로젝트, 적용한 활동 목록, 시험 계정, 현재 문서\n현재 상황: [입력]\n사용할 가상 자료: [입력]\n이번 수정 내용: [입력 또는 기존 기능 검증]\n시험할 버전과 주소: [입력]\n\n다음 조건을 가상 자료로 다시 시험해 줘.\n1. 수정 전 재현 조건을 같은 가상 자료로 다시 실행해 줘.\n2. 차단되어야 할 행동과 허용되어야 할 정상 행동을 함께 시험해 줘.\n3. 키와 개인정보가 코드·빌드 파일·응답에 노출되지 않는지 재확인해 줘.\n4. 확인 완료·추가 확인·해당 없음과 그 근거를 항목별로 보고해 줘.\n\n내가 직접 따라 할 수 있도록 준비 계정과 상태 → 클릭 또는 입력 → 확인할 실제 탭·요청·필드 → 기대 결과를 항목마다 적어 줘.\n확인할 위치: 소스 코드·시험 실행·브라우저 요청·관리 설정을 함께 확인합니다. F12는 브라우저에 도달한 정보와 요청을 보는 도구이며 전체 보안 검사 도구를 대신하지 않습니다.\n자기 앱에서 이름이 다르면 코드와 실제 요청에서 맞는 이름을 찾아 줘. 실제로 존재하는지 확인하지 않은 요청명을 만들어 내지 마.\n허용해야 할 동작과 차단해야 할 동작을 함께 시험해 줘. 항목마다 실행 여부, 실제 결과, 확인한 화면이나 기록을 적고, 시험하지 못했다면 이유를 설명해 줘. 응답 코드와 실제로 받은 자료를 함께 확인하고, 저장 기능이 있다면 저장된 결과도 확인해 줘.\n이 활동을 완료해도 앱 전체의 안전이 보장된다고 표현하지 마. 실제 학생 정보·비밀키·인증 토큰은 출력하지 말고 필요한 값은 가려 줘. 내 앱 또는 허락받은 시험 환경만 대상으로 해 줘.","next":"기대 결과와 실제 결과가 같으면 활동 기록을 정리합니다. 다르면 “오류 해결” 프롬프트를 사용하고 같은 조건으로 재시험합니다."},{"id":"a34-branch1","category":"상황별 진행","title":"프로젝트가 커서 한 번에 검토하기 어려운 경우","when":"기본 순서로 진행하다가 이 상황에 해당하면 사용합니다.","text":"활동: 프로젝트 전체를 AI로 보안 점검\n앱 이름과 프로젝트: [입력]\n이번 시험 주소: [입력]\n준비 정보: 프로젝트, 적용한 활동 목록, 시험 계정, 현재 문서\n현재 상황: [입력]\n사용할 가상 자료: [입력]\n현재 겪는 상황: 프로젝트가 커서 한 번에 검토하기 어려운 경우\n이미 한 행동과 나온 결과: [입력]\n\n라우트와 기능별로 검토 범위를 나눠 줘. 이번에 확인한 파일과 아직 확인하지 않은 파일을 누적 목록으로 관리해 줘.\n먼저 관련 코드·화면·설정에서 현재 상태를 확인하고 이 상황이 생긴 이유를 근거와 함께 설명해 줘. 현재 환경에서 확인할 수 없는 것은 따로 표시해 줘.\n이 활동에서 유지할 조건:\n1. 높은 위험부터 작은 수정 단위로 나누고 기존 수업 흐름에 미치는 영향을 알려 줘.\n2. 내가 승인한 항목만 수정하고 관련 없는 파일과 기능은 유지해 줘.\n3. 각 수정에 재현 시험과 재발 방지 시험을 함께 제안해 줘.\n\n진행 순서를 “지금 확인할 것 → 선택 가능한 방법 → 내가 승인할 변경 → 실행 후 다시 확인할 결과”로 정리해 줘. 앱에 필요 없는 기능을 추가하거나 검사를 끄는 방식으로 해결하지 마.\n재시험에서는 다음 조건을 포함해 줘:\n1. 수정 전 재현 조건을 같은 가상 자료로 다시 실행해 줘.\n2. 차단되어야 할 행동과 허용되어야 할 정상 행동을 함께 시험해 줘.\n수정이 필요하면 먼저 범위를 제안하고 내 확인 전 운영 설정을 바꾸지 마. 실제 학생 정보·비밀키·인증 토큰은 출력하지 말고 필요한 값은 가려 줘. 내 앱 또는 허락받은 시험 환경만 대상으로 해 줘.","next":"이 상황에 맞는 방법을 선택한 뒤 기본 진행의 구현 또는 재시험 단계로 돌아갑니다. 해당 없음이면 이유를 기록하고 다른 활동을 고릅니다."},{"id":"a34-branch2","category":"상황별 진행","title":"AI가 문제 없다고만 답한 경우","when":"기본 순서로 진행하다가 이 상황에 해당하면 사용합니다.","text":"활동: 프로젝트 전체를 AI로 보안 점검\n앱 이름과 프로젝트: [입력]\n이번 시험 주소: [입력]\n준비 정보: 프로젝트, 적용한 활동 목록, 시험 계정, 현재 문서\n현재 상황: [입력]\n사용할 가상 자료: [입력]\n현재 겪는 상황: AI가 문제 없다고만 답한 경우\n이미 한 행동과 나온 결과: [입력]\n\n확인한 파일·실행한 시험·검토하지 못한 설정을 구체적으로 제시해 줘. 근거 없는 안전 결론은 철회하고 확인 수준별로 다시 보고해 줘.\n먼저 관련 코드·화면·설정에서 현재 상태를 확인하고 이 상황이 생긴 이유를 근거와 함께 설명해 줘. 현재 환경에서 확인할 수 없는 것은 따로 표시해 줘.\n이 활동에서 유지할 조건:\n1. 높은 위험부터 작은 수정 단위로 나누고 기존 수업 흐름에 미치는 영향을 알려 줘.\n2. 내가 승인한 항목만 수정하고 관련 없는 파일과 기능은 유지해 줘.\n3. 각 수정에 재현 시험과 재발 방지 시험을 함께 제안해 줘.\n\n진행 순서를 “지금 확인할 것 → 선택 가능한 방법 → 내가 승인할 변경 → 실행 후 다시 확인할 결과”로 정리해 줘. 앱에 필요 없는 기능을 추가하거나 검사를 끄는 방식으로 해결하지 마.\n재시험에서는 다음 조건을 포함해 줘:\n1. 수정 전 재현 조건을 같은 가상 자료로 다시 실행해 줘.\n2. 차단되어야 할 행동과 허용되어야 할 정상 행동을 함께 시험해 줘.\n수정이 필요하면 먼저 범위를 제안하고 내 확인 전 운영 설정을 바꾸지 마. 실제 학생 정보·비밀키·인증 토큰은 출력하지 말고 필요한 값은 가려 줘. 내 앱 또는 허락받은 시험 환경만 대상으로 해 줘.","next":"이 상황에 맞는 방법을 선택한 뒤 기본 진행의 구현 또는 재시험 단계로 돌아갑니다. 해당 없음이면 이유를 기록하고 다른 활동을 고릅니다."},{"id":"a34-locate","category":"확인 위치 도움","title":"안내된 화면이나 요청을 찾지 못할 때","when":"F12에 설명한 파일·요청이 없거나 확인할 곳을 모르겠을 때 보냅니다.","text":"활동: 프로젝트 전체를 AI로 보안 점검\n앱 이름과 프로젝트: [입력]\n이번 시험 주소: [입력]\n준비 정보: 프로젝트, 적용한 활동 목록, 시험 계정, 현재 문서\n현재 상황: [입력]\n사용할 가상 자료: [입력]\n내가 보고 있는 주소와 창: [입력]\n누른 버튼 또는 실행한 동작: [입력]\n열어 둔 개발자 도구 탭과 필터: [입력 또는 모름]\n찾으려는 정보: [입력]\n현재 화면 또는 가린 오류 내용: [붙이기]\n\n참고 안내: 소스 코드·시험 실행·브라우저 요청·관리 설정을 함께 확인합니다. F12는 브라우저에 도달한 정보와 요청을 보는 도구이며 전체 보안 검사 도구를 대신하지 않습니다.\n이 안내가 체험 앱의 가상 자료인지 내 앱의 실제 동작인지 먼저 구분해 줘. 프로젝트에서 이 동작이 어떤 요청·파일·저장소로 연결되는지 찾아 줘.\nNetwork라면 동작 전에 열기, 기록 켜기, 목록 지우기, 필터 확인, 같은 동작 다시 하기, 새 요청 선택, Headers·Payload·Response 중 볼 위치를 실제 이름으로 알려 줘. 정적 파일이면 All 필터도 확인해 줘. 새 창을 열었다면 그 창에서 F12를 열어야 하는지 설명해 줘.\n브라우저 검사에서 막아 요청이 없거나 아직 동작을 실행하지 않은 경우도 구분해 줘. 서버에만 있는 정보는 F12에서 찾으라고 하지 말고 코드·관리 화면·시험 환경에서 확인할 방법을 제시해 줘.\n확인할 자료가 실제로 없으면 없다고 말하고 필요한 시험 준비를 설명해 줘. 캡처 요청에는 가려야 할 정보도 알려 줘. 실제 학생 정보·비밀키·인증 토큰은 출력하지 말고 필요한 값은 가려 줘. 내 앱 또는 허락받은 시험 환경만 대상으로 해 줘.","next":"정확한 위치를 찾은 뒤 해당 활동의 4번 프롬프트로 결과를 확인합니다. 없다는 사실 자체가 기대 결과인지 먼저 판단합니다."},{"id":"a34-error","category":"오류 해결","title":"예상과 다른 결과가 나올 때","when":"실행 오류, 정상 기능 실패, 예상한 차단이 되지 않는 경우에 보냅니다.","text":"활동: 프로젝트 전체를 AI로 보안 점검\n앱 이름과 프로젝트: [입력]\n이번 시험 주소: [입력]\n준비 정보: 프로젝트, 적용한 활동 목록, 시험 계정, 현재 문서\n현재 상황: [입력]\n사용할 가상 자료: [입력]\n실행한 단계와 입력: [입력]\n기대한 결과: [입력]\n실제로 나온 결과: [입력]\n오류 문구: [비밀값을 가리고 붙이기]\n직전에 변경한 파일 또는 설정: [입력 또는 모름]\n\n원인을 추측해서 여러 곳을 한꺼번에 바꾸지 말고, 재현 조건과 현재 코드를 비교해 줘. 요청이 만들어지는지, 서버에 도착하는지, 검사와 반환·저장이 어디서 달라지는지 관련 단계만 확인해 줘.\n특히 다음 점검 기준을 다시 봐 줘:\n1. 기능 목록을 기준으로 인증·권한·키·입력·출력·파일·요청 제한·저장·외부 전송을 점검해 줘.\n2. 각 지적에 파일 경로·함수·실제 요청 또는 화면 근거를 붙여 줘.\n\n가능한 원인마다 그렇게 판단한 이유와 먼저 확인할 방법을 알려 줘. 운영 자료를 삭제하거나 권한·입력 검사를 전체 해제하는 방식은 사용하지 마. 수정이 필요하면 바꿀 내용을 먼저 제안하고 내가 승인한 뒤 적용해 줘.\n수정 후 같은 실패 조건과 다음 정상 조건을 모두 재시험해 줘:\n1. 수정 전 재현 조건을 같은 가상 자료로 다시 실행해 줘.\n2. 차단되어야 할 행동과 허용되어야 할 정상 행동을 함께 시험해 줘.\n3. 키와 개인정보가 코드·빌드 파일·응답에 노출되지 않는지 재확인해 줘.\n4. 확인 완료·추가 확인·해당 없음과 그 근거를 항목별로 보고해 줘.\n완료 보고에는 실제 실행한 결과와 실행하지 못한 이유를 구분해 줘.","next":"실패 원인을 확인하고 승인한 수정만 적용합니다. 같은 실패 조건이 해결됐는지와 원래 정상 기능이 유지되는지 함께 봅니다."},{"id":"a34-finish","category":"활동 마무리","title":"확인 기록과 다음 점검 정리하기","when":"직접 시험을 확인한 뒤, 또는 해당 없음·추가 확인으로 종료할 때 보냅니다.","text":"활동: 프로젝트 전체를 AI로 보안 점검\n앱 이름과 프로젝트: [입력]\n이번 시험 주소: [입력]\n준비 정보: 프로젝트, 적용한 활동 목록, 시험 계정, 현재 문서\n현재 상황: [입력]\n사용할 가상 자료: [입력]\n실제로 진행한 단계: [입력]\n확인한 결과 또는 아직 확인하지 못한 내용: [입력]\n\n이번 활동 기록을 Markdown으로 정리해 줘. 항목은 앱과 시험 버전, 점검한 기능, 발견한 문제와 위치, 승인한 수정, 시험 입력과 기대 결과, 실제 결과와 근거, 추가 확인할 일로 구성해 줘.\n앞으로 개발할 때 지킬 기준도 우리 앱의 실제 코드·설정 위치와 연결해 적어 줘:\n1. 높은 위험부터 작은 수정 단위로 나누고 기존 수업 흐름에 미치는 영향을 알려 줘.\n2. 내가 승인한 항목만 수정하고 관련 없는 파일과 기능은 유지해 줘.\n3. 각 수정에 재현 시험과 재발 방지 시험을 함께 제안해 줘.\n4. 자동 도구의 결과를 그대로 최종 결론으로 옮기지 말고 실제 적용 경로를 확인해 줘.\n\n활동 상태는 확인 완료·추가 확인·해당 없음 중 근거에 맞게 적어 줘. 구현만 하고 시험하지 않았다면 확인 완료로 쓰지 마. 문제를 발견하지 못한 것과 충분히 검증한 것을 구분해 줘.\n다음 수정 때 다시 실행할 시험은 다음 내용을 바탕으로 정리해 줘:\n1. 수정 전 재현 조건을 같은 가상 자료로 다시 실행해 줘.\n2. 차단되어야 할 행동과 허용되어야 할 정상 행동을 함께 시험해 줘.\n보고서에 원문 학생 자료나 비밀값을 넣지 마. 이 기록만으로 학교 승인이나 앱 전체의 안전을 보장한다고 쓰지 마.","next":"기록을 자신의 프로젝트에 보관하고 필요한 다음 활동을 선택합니다. 새로운 대화를 시작할 때는 이 기록과 공통 시작 프롬프트를 함께 제공합니다."}]},{"id":35,"title":"AI가 지적한 문제를 확인하고 다시 시험","group":"마지막 점검과 배포","slides":"26~28","condition":"AI 점검 결과를 실제 수정으로 연결할 때","inputs":"지적 항목, 관련 코드, 가상 재현 자료, 승인할 수정 범위","inspect":["지적한 코드가 현재 실행되는지와 공격 또는 오류가 발생할 조건을 확인해 줘.","관련 없는 코드 조각이나 과거 파일을 근거로 오탐했는지 확인해 줘.","안전한 시험 환경에서 재현 가능한 최소 단계와 예상 결과를 제시해 줘.","재현하지 못했을 때 곧바로 오탐이라고 단정하지 말고 확인하지 못한 조건을 설명해 줘."],"requirements":["확인된 원인과 직접 관련된 부분만 수정해 줘.","수정으로 사라질 기능이나 바뀔 사용자 흐름을 먼저 설명해 줘.","기존 정상 기능의 회귀 시험을 함께 추가해 줘.","미해결 부분이 있으면 숨기지 말고 추가 자료와 다음 확인 방법을 알려 줘."],"tests":["같은 입력과 같은 계정 조건으로 수정 전후 결과를 비교해 줘.","한 경로만 고치고 비슷한 다른 경로는 남아 있는지 확인해 줘.","응답 코드뿐 아니라 실제 반환 자료와 저장 변경을 확인해 줘.","수정 파일·시험 방법·실제 결과·남은 확인 항목을 정리해 줘."],"location":"지적한 화면이나 요청을 직접 재현합니다. Network의 상태 코드·Response와 서버 측 근거를 함께 기록하고 민감한 원문은 보고서에서 제외합니다.","links":[],"branches":[["수정 후 다른 기능이 고장 난 경우","변경 파일과 실패한 정상 동작을 비교하고 원인을 좁혀 줘. 전체 프로젝트를 이전 상태로 덮어쓰지 말고 문제 변경만 되돌리는 대안을 제시해 줘."],["다른 AI의 의견이 상반되는 경우","각 AI가 지적한 내용을 같은 코드·버전·시험 조건으로 확인해 줘. 실제 확인한 결과와 아직 추정하는 내용을 구분해 설명해 줘."]],"prompts":[{"id":"a35-inspect","category":"기본 진행","title":"1 현재 상태부터 확인하기","when":"프로젝트를 연 뒤 처음 보냅니다. 파일을 고치기 전 단계입니다.","text":"활동: AI가 지적한 문제를 확인하고 다시 시험\n앱 이름과 프로젝트: [입력]\n이번 시험 주소: [입력]\n준비 정보: 지적 항목, 관련 코드, 가상 재현 자료, 승인할 수정 범위\n현재 상황: [입력]\n사용할 가상 자료: [입력]\n\n이 활동에 해당하는지부터 확인해 줘. 아직 파일이나 설정은 수정하지 마.\n1. 지적한 코드가 현재 실행되는지와 공격 또는 오류가 발생할 조건을 확인해 줘.\n2. 관련 없는 코드 조각이나 과거 파일을 근거로 오탐했는지 확인해 줘.\n3. 안전한 시험 환경에서 재현 가능한 최소 단계와 예상 결과를 제시해 줘.\n4. 재현하지 못했을 때 곧바로 오탐이라고 단정하지 말고 확인하지 못한 조건을 설명해 줘.\n\n결과는 표로 정리해 줘. 표에는 확인 항목, 현재 동작, 근거가 있는 파일이나 설정 위치, 발견한 문제와 추가로 확인할 내용을 적어 줘. 코드에서 확인한 사실과 추정은 구분해 줘. 내가 직접 확인할 메뉴·버튼·파일 이름도 알려 줘. 파일을 읽지 못했다면 그 사실을 표시해 줘.\n실제 학생 정보·비밀키·인증 토큰은 출력하지 말고 필요한 값은 가려 줘. 내 앱 또는 허락받은 시험 환경만 대상으로 해 줘.\n참고할 확인 위치: 지적한 화면이나 요청을 직접 재현합니다. Network의 상태 코드·Response와 서버 측 근거를 함께 기록하고 민감한 원문은 보고서에서 제외합니다.","next":"현재 구조와 해당 여부를 확인합니다. 모르는 정보는 먼저 확인하고, 수정이 필요하면 2번으로 진행합니다."},{"id":"a35-plan","category":"기본 진행","title":"2 수정 방법과 범위 정하기","when":"1번 답변에서 실제로 고칠 항목을 골랐을 때 보냅니다.","text":"활동: AI가 지적한 문제를 확인하고 다시 시험\n앱 이름과 프로젝트: [입력]\n이번 시험 주소: [입력]\n준비 정보: 지적 항목, 관련 코드, 가상 재현 자료, 승인할 수정 범위\n현재 상황: [입력]\n사용할 가상 자료: [입력]\n앞에서 확인한 문제와 근거: [1번 결과 중 해당 부분을 붙이기]\n이번에 고칠 항목: [입력]\n\n구현 전에 다음 조건으로 수정 계획을 만들어 줘.\n1. 확인된 원인과 직접 관련된 부분만 수정해 줘.\n2. 수정으로 사라질 기능이나 바뀔 사용자 흐름을 먼저 설명해 줘.\n3. 기존 정상 기능의 회귀 시험을 함께 추가해 줘.\n4. 미해결 부분이 있으면 숨기지 말고 추가 자료와 다음 확인 방법을 알려 줘.\n\n기존 기능을 유지하면서 문제를 고칠 방법부터 제안해 줘. 방법이 여러 가지라면 필요한 서비스와 비용, 사용 방법이 달라지는 부분, 이전 상태로 되돌릴 방법을 비교해 줘. 반드시 고쳐야 할 부분과 선택해서 개선할 부분을 구분해 줘.\n변경할 파일, 학생 또는 교사 화면에서 달라질 부분, 필요한 관리 설정, 시험할 가상 입력을 순서대로 적어 줘. 서버가 없는 앱이라면 지금 할 수 있는 것과 서버가 필요한 것을 분리해 줘.\n아직 코드를 수정하거나 서비스를 만들지 마. 내가 결정해야 할 사항이 있으면 선택지와 차이를 설명하고 물어봐 줘.","next":"수정할 내용과 비용, 정보 수집·전송·보관 방식이 달라지는지 확인한 뒤 진행할 방법을 정합니다. 학교가 판단해야 하는 내용은 먼저 확인합니다."},{"id":"a35-implement","category":"기본 진행","title":"3 선택한 범위 구현하기","when":"수정 계획을 검토한 뒤 승인할 범위를 직접 적고 보냅니다.","text":"활동: AI가 지적한 문제를 확인하고 다시 시험\n앱 이름과 프로젝트: [입력]\n이번 시험 주소: [입력]\n준비 정보: 지적 항목, 관련 코드, 가상 재현 자료, 승인할 수정 범위\n현재 상황: [입력]\n사용할 가상 자료: [입력]\n승인한 수정안: [선택한 방법과 항목을 정확히 입력]\n수정할 파일 또는 기능 범위: [입력]\n이번에 제외할 것: [입력]\n\n위에 승인한 범위만 구현해 줘. 시작 전에 현재 변경 파일을 확인해 다른 작업을 보존해 줘.\n1. 확인된 원인과 직접 관련된 부분만 수정해 줘.\n2. 수정으로 사라질 기능이나 바뀔 사용자 흐름을 먼저 설명해 줘.\n3. 기존 정상 기능의 회귀 시험을 함께 추가해 줘.\n4. 미해결 부분이 있으면 숨기지 말고 추가 자료와 다음 확인 방법을 알려 줘.\n\n한 부분씩 수정하고 실행 결과를 확인해 줘. 기존 디자인과 정상 기능은 유지해 줘. 새 서비스 생성·운영 자료 삭제·유료 호출·커밋·푸시·배포는 이 요청에 구체적으로 승인한 경우에만 실행해 줘. 요청하지 않은 변경이 필요하면 진행 전에 이유를 설명해 줘.\n수정 후 바꾼 파일과 이유, 실행한 검사, 아직 하지 못한 시험, 내가 누를 버튼 순서를 적어 줘. 실제 학생 정보·비밀키·인증 토큰은 출력하지 말고 필요한 값은 가려 줘. 내 앱 또는 허락받은 시험 환경만 대상으로 해 줘.","next":"빌드나 실행 오류가 없는지 확인한 뒤 4번으로 진행합니다. 허용해야 할 동작은 정상적으로 되고, 차단해야 할 동작은 막히는지 함께 시험합니다."},{"id":"a35-verify","category":"기본 진행","title":"4 수정 결과 직접 확인하기","when":"구현이 끝났거나 기존 기능이 안전하게 동작하는지 검증할 때 보냅니다.","text":"활동: AI가 지적한 문제를 확인하고 다시 시험\n앱 이름과 프로젝트: [입력]\n이번 시험 주소: [입력]\n준비 정보: 지적 항목, 관련 코드, 가상 재현 자료, 승인할 수정 범위\n현재 상황: [입력]\n사용할 가상 자료: [입력]\n이번 수정 내용: [입력 또는 기존 기능 검증]\n시험할 버전과 주소: [입력]\n\n다음 조건을 가상 자료로 다시 시험해 줘.\n1. 같은 입력과 같은 계정 조건으로 수정 전후 결과를 비교해 줘.\n2. 한 경로만 고치고 비슷한 다른 경로는 남아 있는지 확인해 줘.\n3. 응답 코드뿐 아니라 실제 반환 자료와 저장 변경을 확인해 줘.\n4. 수정 파일·시험 방법·실제 결과·남은 확인 항목을 정리해 줘.\n\n내가 직접 따라 할 수 있도록 준비 계정과 상태 → 클릭 또는 입력 → 확인할 실제 탭·요청·필드 → 기대 결과를 항목마다 적어 줘.\n확인할 위치: 지적한 화면이나 요청을 직접 재현합니다. Network의 상태 코드·Response와 서버 측 근거를 함께 기록하고 민감한 원문은 보고서에서 제외합니다.\n자기 앱에서 이름이 다르면 코드와 실제 요청에서 맞는 이름을 찾아 줘. 실제로 존재하는지 확인하지 않은 요청명을 만들어 내지 마.\n허용해야 할 동작과 차단해야 할 동작을 함께 시험해 줘. 항목마다 실행 여부, 실제 결과, 확인한 화면이나 기록을 적고, 시험하지 못했다면 이유를 설명해 줘. 응답 코드와 실제로 받은 자료를 함께 확인하고, 저장 기능이 있다면 저장된 결과도 확인해 줘.\n이 활동을 완료해도 앱 전체의 안전이 보장된다고 표현하지 마. 실제 학생 정보·비밀키·인증 토큰은 출력하지 말고 필요한 값은 가려 줘. 내 앱 또는 허락받은 시험 환경만 대상으로 해 줘.","next":"기대 결과와 실제 결과가 같으면 활동 기록을 정리합니다. 다르면 “오류 해결” 프롬프트를 사용하고 같은 조건으로 재시험합니다."},{"id":"a35-branch1","category":"상황별 진행","title":"수정 후 다른 기능이 고장 난 경우","when":"기본 순서로 진행하다가 이 상황에 해당하면 사용합니다.","text":"활동: AI가 지적한 문제를 확인하고 다시 시험\n앱 이름과 프로젝트: [입력]\n이번 시험 주소: [입력]\n준비 정보: 지적 항목, 관련 코드, 가상 재현 자료, 승인할 수정 범위\n현재 상황: [입력]\n사용할 가상 자료: [입력]\n현재 겪는 상황: 수정 후 다른 기능이 고장 난 경우\n이미 한 행동과 나온 결과: [입력]\n\n변경 파일과 실패한 정상 동작을 비교하고 원인을 좁혀 줘. 전체 프로젝트를 이전 상태로 덮어쓰지 말고 문제 변경만 되돌리는 대안을 제시해 줘.\n먼저 관련 코드·화면·설정에서 현재 상태를 확인하고 이 상황이 생긴 이유를 근거와 함께 설명해 줘. 현재 환경에서 확인할 수 없는 것은 따로 표시해 줘.\n이 활동에서 유지할 조건:\n1. 확인된 원인과 직접 관련된 부분만 수정해 줘.\n2. 수정으로 사라질 기능이나 바뀔 사용자 흐름을 먼저 설명해 줘.\n3. 기존 정상 기능의 회귀 시험을 함께 추가해 줘.\n\n진행 순서를 “지금 확인할 것 → 선택 가능한 방법 → 내가 승인할 변경 → 실행 후 다시 확인할 결과”로 정리해 줘. 앱에 필요 없는 기능을 추가하거나 검사를 끄는 방식으로 해결하지 마.\n재시험에서는 다음 조건을 포함해 줘:\n1. 같은 입력과 같은 계정 조건으로 수정 전후 결과를 비교해 줘.\n2. 한 경로만 고치고 비슷한 다른 경로는 남아 있는지 확인해 줘.\n수정이 필요하면 먼저 범위를 제안하고 내 확인 전 운영 설정을 바꾸지 마. 실제 학생 정보·비밀키·인증 토큰은 출력하지 말고 필요한 값은 가려 줘. 내 앱 또는 허락받은 시험 환경만 대상으로 해 줘.","next":"이 상황에 맞는 방법을 선택한 뒤 기본 진행의 구현 또는 재시험 단계로 돌아갑니다. 해당 없음이면 이유를 기록하고 다른 활동을 고릅니다."},{"id":"a35-branch2","category":"상황별 진행","title":"다른 AI의 의견이 상반되는 경우","when":"기본 순서로 진행하다가 이 상황에 해당하면 사용합니다.","text":"활동: AI가 지적한 문제를 확인하고 다시 시험\n앱 이름과 프로젝트: [입력]\n이번 시험 주소: [입력]\n준비 정보: 지적 항목, 관련 코드, 가상 재현 자료, 승인할 수정 범위\n현재 상황: [입력]\n사용할 가상 자료: [입력]\n현재 겪는 상황: 다른 AI의 의견이 상반되는 경우\n이미 한 행동과 나온 결과: [입력]\n\n각 AI가 지적한 내용을 같은 코드·버전·시험 조건으로 확인해 줘. 실제 확인한 결과와 아직 추정하는 내용을 구분해 설명해 줘.\n먼저 관련 코드·화면·설정에서 현재 상태를 확인하고 이 상황이 생긴 이유를 근거와 함께 설명해 줘. 현재 환경에서 확인할 수 없는 것은 따로 표시해 줘.\n이 활동에서 유지할 조건:\n1. 확인된 원인과 직접 관련된 부분만 수정해 줘.\n2. 수정으로 사라질 기능이나 바뀔 사용자 흐름을 먼저 설명해 줘.\n3. 기존 정상 기능의 회귀 시험을 함께 추가해 줘.\n\n진행 순서를 “지금 확인할 것 → 선택 가능한 방법 → 내가 승인할 변경 → 실행 후 다시 확인할 결과”로 정리해 줘. 앱에 필요 없는 기능을 추가하거나 검사를 끄는 방식으로 해결하지 마.\n재시험에서는 다음 조건을 포함해 줘:\n1. 같은 입력과 같은 계정 조건으로 수정 전후 결과를 비교해 줘.\n2. 한 경로만 고치고 비슷한 다른 경로는 남아 있는지 확인해 줘.\n수정이 필요하면 먼저 범위를 제안하고 내 확인 전 운영 설정을 바꾸지 마. 실제 학생 정보·비밀키·인증 토큰은 출력하지 말고 필요한 값은 가려 줘. 내 앱 또는 허락받은 시험 환경만 대상으로 해 줘.","next":"이 상황에 맞는 방법을 선택한 뒤 기본 진행의 구현 또는 재시험 단계로 돌아갑니다. 해당 없음이면 이유를 기록하고 다른 활동을 고릅니다."},{"id":"a35-locate","category":"확인 위치 도움","title":"안내된 화면이나 요청을 찾지 못할 때","when":"F12에 설명한 파일·요청이 없거나 확인할 곳을 모르겠을 때 보냅니다.","text":"활동: AI가 지적한 문제를 확인하고 다시 시험\n앱 이름과 프로젝트: [입력]\n이번 시험 주소: [입력]\n준비 정보: 지적 항목, 관련 코드, 가상 재현 자료, 승인할 수정 범위\n현재 상황: [입력]\n사용할 가상 자료: [입력]\n내가 보고 있는 주소와 창: [입력]\n누른 버튼 또는 실행한 동작: [입력]\n열어 둔 개발자 도구 탭과 필터: [입력 또는 모름]\n찾으려는 정보: [입력]\n현재 화면 또는 가린 오류 내용: [붙이기]\n\n참고 안내: 지적한 화면이나 요청을 직접 재현합니다. Network의 상태 코드·Response와 서버 측 근거를 함께 기록하고 민감한 원문은 보고서에서 제외합니다.\n이 안내가 체험 앱의 가상 자료인지 내 앱의 실제 동작인지 먼저 구분해 줘. 프로젝트에서 이 동작이 어떤 요청·파일·저장소로 연결되는지 찾아 줘.\nNetwork라면 동작 전에 열기, 기록 켜기, 목록 지우기, 필터 확인, 같은 동작 다시 하기, 새 요청 선택, Headers·Payload·Response 중 볼 위치를 실제 이름으로 알려 줘. 정적 파일이면 All 필터도 확인해 줘. 새 창을 열었다면 그 창에서 F12를 열어야 하는지 설명해 줘.\n브라우저 검사에서 막아 요청이 없거나 아직 동작을 실행하지 않은 경우도 구분해 줘. 서버에만 있는 정보는 F12에서 찾으라고 하지 말고 코드·관리 화면·시험 환경에서 확인할 방법을 제시해 줘.\n확인할 자료가 실제로 없으면 없다고 말하고 필요한 시험 준비를 설명해 줘. 캡처 요청에는 가려야 할 정보도 알려 줘. 실제 학생 정보·비밀키·인증 토큰은 출력하지 말고 필요한 값은 가려 줘. 내 앱 또는 허락받은 시험 환경만 대상으로 해 줘.","next":"정확한 위치를 찾은 뒤 해당 활동의 4번 프롬프트로 결과를 확인합니다. 없다는 사실 자체가 기대 결과인지 먼저 판단합니다."},{"id":"a35-error","category":"오류 해결","title":"예상과 다른 결과가 나올 때","when":"실행 오류, 정상 기능 실패, 예상한 차단이 되지 않는 경우에 보냅니다.","text":"활동: AI가 지적한 문제를 확인하고 다시 시험\n앱 이름과 프로젝트: [입력]\n이번 시험 주소: [입력]\n준비 정보: 지적 항목, 관련 코드, 가상 재현 자료, 승인할 수정 범위\n현재 상황: [입력]\n사용할 가상 자료: [입력]\n실행한 단계와 입력: [입력]\n기대한 결과: [입력]\n실제로 나온 결과: [입력]\n오류 문구: [비밀값을 가리고 붙이기]\n직전에 변경한 파일 또는 설정: [입력 또는 모름]\n\n원인을 추측해서 여러 곳을 한꺼번에 바꾸지 말고, 재현 조건과 현재 코드를 비교해 줘. 요청이 만들어지는지, 서버에 도착하는지, 검사와 반환·저장이 어디서 달라지는지 관련 단계만 확인해 줘.\n특히 다음 점검 기준을 다시 봐 줘:\n1. 지적한 코드가 현재 실행되는지와 공격 또는 오류가 발생할 조건을 확인해 줘.\n2. 관련 없는 코드 조각이나 과거 파일을 근거로 오탐했는지 확인해 줘.\n\n가능한 원인마다 그렇게 판단한 이유와 먼저 확인할 방법을 알려 줘. 운영 자료를 삭제하거나 권한·입력 검사를 전체 해제하는 방식은 사용하지 마. 수정이 필요하면 바꿀 내용을 먼저 제안하고 내가 승인한 뒤 적용해 줘.\n수정 후 같은 실패 조건과 다음 정상 조건을 모두 재시험해 줘:\n1. 같은 입력과 같은 계정 조건으로 수정 전후 결과를 비교해 줘.\n2. 한 경로만 고치고 비슷한 다른 경로는 남아 있는지 확인해 줘.\n3. 응답 코드뿐 아니라 실제 반환 자료와 저장 변경을 확인해 줘.\n4. 수정 파일·시험 방법·실제 결과·남은 확인 항목을 정리해 줘.\n완료 보고에는 실제 실행한 결과와 실행하지 못한 이유를 구분해 줘.","next":"실패 원인을 확인하고 승인한 수정만 적용합니다. 같은 실패 조건이 해결됐는지와 원래 정상 기능이 유지되는지 함께 봅니다."},{"id":"a35-finish","category":"활동 마무리","title":"확인 기록과 다음 점검 정리하기","when":"직접 시험을 확인한 뒤, 또는 해당 없음·추가 확인으로 종료할 때 보냅니다.","text":"활동: AI가 지적한 문제를 확인하고 다시 시험\n앱 이름과 프로젝트: [입력]\n이번 시험 주소: [입력]\n준비 정보: 지적 항목, 관련 코드, 가상 재현 자료, 승인할 수정 범위\n현재 상황: [입력]\n사용할 가상 자료: [입력]\n실제로 진행한 단계: [입력]\n확인한 결과 또는 아직 확인하지 못한 내용: [입력]\n\n이번 활동 기록을 Markdown으로 정리해 줘. 항목은 앱과 시험 버전, 점검한 기능, 발견한 문제와 위치, 승인한 수정, 시험 입력과 기대 결과, 실제 결과와 근거, 추가 확인할 일로 구성해 줘.\n앞으로 개발할 때 지킬 기준도 우리 앱의 실제 코드·설정 위치와 연결해 적어 줘:\n1. 확인된 원인과 직접 관련된 부분만 수정해 줘.\n2. 수정으로 사라질 기능이나 바뀔 사용자 흐름을 먼저 설명해 줘.\n3. 기존 정상 기능의 회귀 시험을 함께 추가해 줘.\n4. 미해결 부분이 있으면 숨기지 말고 추가 자료와 다음 확인 방법을 알려 줘.\n\n활동 상태는 확인 완료·추가 확인·해당 없음 중 근거에 맞게 적어 줘. 구현만 하고 시험하지 않았다면 확인 완료로 쓰지 마. 문제를 발견하지 못한 것과 충분히 검증한 것을 구분해 줘.\n다음 수정 때 다시 실행할 시험은 다음 내용을 바탕으로 정리해 줘:\n1. 같은 입력과 같은 계정 조건으로 수정 전후 결과를 비교해 줘.\n2. 한 경로만 고치고 비슷한 다른 경로는 남아 있는지 확인해 줘.\n보고서에 원문 학생 자료나 비밀값을 넣지 마. 이 기록만으로 학교 승인이나 앱 전체의 안전을 보장한다고 쓰지 마.","next":"기록을 자신의 프로젝트에 보관하고 필요한 다음 활동을 선택합니다. 새로운 대화를 시작할 때는 이 기록과 공통 시작 프롬프트를 함께 제공합니다."}]},{"id":36,"title":"변경 내용을 저장하고 배포 환경 확인","group":"마지막 점검과 배포","slides":"28, 69","condition":"검증한 수정 내용을 GitHub와 Vercel에 반영할 때","inputs":"대상 저장소·브랜치·Vercel 프로젝트, 변경 파일, 시험 결과, 배포 승인 범위","inspect":["현재 저장소와 브랜치, 수정 파일, 원격 저장소를 읽기 전용으로 확인해 줘.","새 파일과 변경 내용에 키·실제 학생 자료·불필요한 캡처·임시 파일이 포함되는지 확인해 줘.","Vercel 프로젝트와 연결 브랜치, 미리보기·운영 환경의 환경 변수 이름과 범위만 확인해 줘. 값은 출력하지 마.","푸시가 자동 운영 배포로 이어지는지 확인하고 영향과 되돌릴 방법을 설명해 줘."],"requirements":["내가 지정한 변경 파일만 커밋 대상으로 선택하고 다른 작업의 변경을 덮어쓰거나 포함하지 마.","커밋 메시지에 실제 변경과 검증 내용을 담고 비밀정보를 넣지 마.","푸시·배포는 내가 지정한 대상과 범위를 확인한 뒤 명시적으로 요청했을 때만 실행해 줘.","새 유료 서비스 생성·환경 변수 교체·운영 자료 삭제가 필요하면 그 작업은 별도로 확인해 줘."],"tests":["빌드와 관련 테스트를 실행하고 실패가 남아 있으면 완료라고 하지 마.","승인 후 배포했다면 배포 결과와 실제 URL을 확인해 줘.","배포된 앱에서 로그인·권한·문서 링크·수정 기능을 가상 자료로 재시험해 줘.","배포 버전과 커밋을 연결하고 롤백이 필요한 경우의 구체적 절차를 설명해 줘."],"location":"프로젝트 터미널의 Git 상태와 Vercel 배포 화면을 확인합니다. 배포 후 F12에서 실제 사이트의 요청·오류를 다시 확인합니다. 로컬 성공만으로 운영 성공을 판단하지 않습니다.","links":["https://vercel.com/docs/deployments"],"branches":[["Git을 아직 연결하지 않은 경우","기존 파일을 보존한 채 저장소 초기화·비공개 여부·제외 파일·원격 연결 계획을 제시해 줘. 새 저장소 생성과 외부 업로드는 내가 선택한 뒤 실행해 줘."],["로컬에서는 되는데 배포에서 실패하는 경우","배포 로그·환경 변수 이름과 적용 범위·빌드 명령·경로 대소문자·직접 URL 새로고침을 확인해 줘. 비밀값을 보여 달라고 하지 마."],["수정 전 버전으로 되돌려야 하는 경우","대상 커밋과 배포, 자료 구조 변경 여부를 먼저 확인해 줘. 강제 푸시나 전체 초기화 대신 영향이 작은 복구 방법을 제시하고 승인 후 실행해 줘."]],"prompts":[{"id":"a36-inspect","category":"기본 진행","title":"1 현재 상태부터 확인하기","when":"프로젝트를 연 뒤 처음 보냅니다. 파일을 고치기 전 단계입니다.","text":"활동: 변경 내용을 저장하고 배포 환경 확인\n앱 이름과 프로젝트: [입력]\n이번 시험 주소: [입력]\n준비 정보: 대상 저장소·브랜치·Vercel 프로젝트, 변경 파일, 시험 결과, 배포 승인 범위\n현재 상황: [입력]\n사용할 가상 자료: [입력]\n\n이 활동에 해당하는지부터 확인해 줘. 아직 파일이나 설정은 수정하지 마.\n1. 현재 저장소와 브랜치, 수정 파일, 원격 저장소를 읽기 전용으로 확인해 줘.\n2. 새 파일과 변경 내용에 키·실제 학생 자료·불필요한 캡처·임시 파일이 포함되는지 확인해 줘.\n3. Vercel 프로젝트와 연결 브랜치, 미리보기·운영 환경의 환경 변수 이름과 범위만 확인해 줘. 값은 출력하지 마.\n4. 푸시가 자동 운영 배포로 이어지는지 확인하고 영향과 되돌릴 방법을 설명해 줘.\n\n결과는 표로 정리해 줘. 표에는 확인 항목, 현재 동작, 근거가 있는 파일이나 설정 위치, 발견한 문제와 추가로 확인할 내용을 적어 줘. 코드에서 확인한 사실과 추정은 구분해 줘. 내가 직접 확인할 메뉴·버튼·파일 이름도 알려 줘. 파일을 읽지 못했다면 그 사실을 표시해 줘.\n실제 학생 정보·비밀키·인증 토큰은 출력하지 말고 필요한 값은 가려 줘. 내 앱 또는 허락받은 시험 환경만 대상으로 해 줘.\n참고할 확인 위치: 프로젝트 터미널의 Git 상태와 Vercel 배포 화면을 확인합니다. 배포 후 F12에서 실제 사이트의 요청·오류를 다시 확인합니다. 로컬 성공만으로 운영 성공을 판단하지 않습니다.","next":"현재 구조와 해당 여부를 확인합니다. 모르는 정보는 먼저 확인하고, 수정이 필요하면 2번으로 진행합니다."},{"id":"a36-plan","category":"기본 진행","title":"2 수정 방법과 범위 정하기","when":"1번 답변에서 실제로 고칠 항목을 골랐을 때 보냅니다.","text":"활동: 변경 내용을 저장하고 배포 환경 확인\n앱 이름과 프로젝트: [입력]\n이번 시험 주소: [입력]\n준비 정보: 대상 저장소·브랜치·Vercel 프로젝트, 변경 파일, 시험 결과, 배포 승인 범위\n현재 상황: [입력]\n사용할 가상 자료: [입력]\n앞에서 확인한 문제와 근거: [1번 결과 중 해당 부분을 붙이기]\n이번에 고칠 항목: [입력]\n\n구현 전에 다음 조건으로 수정 계획을 만들어 줘.\n1. 내가 지정한 변경 파일만 커밋 대상으로 선택하고 다른 작업의 변경을 덮어쓰거나 포함하지 마.\n2. 커밋 메시지에 실제 변경과 검증 내용을 담고 비밀정보를 넣지 마.\n3. 푸시·배포는 내가 지정한 대상과 범위를 확인한 뒤 명시적으로 요청했을 때만 실행해 줘.\n4. 새 유료 서비스 생성·환경 변수 교체·운영 자료 삭제가 필요하면 그 작업은 별도로 확인해 줘.\n\n기존 기능을 유지하면서 문제를 고칠 방법부터 제안해 줘. 방법이 여러 가지라면 필요한 서비스와 비용, 사용 방법이 달라지는 부분, 이전 상태로 되돌릴 방법을 비교해 줘. 반드시 고쳐야 할 부분과 선택해서 개선할 부분을 구분해 줘.\n변경할 파일, 학생 또는 교사 화면에서 달라질 부분, 필요한 관리 설정, 시험할 가상 입력을 순서대로 적어 줘. 서버가 없는 앱이라면 지금 할 수 있는 것과 서버가 필요한 것을 분리해 줘.\n아직 코드를 수정하거나 서비스를 만들지 마. 내가 결정해야 할 사항이 있으면 선택지와 차이를 설명하고 물어봐 줘.","next":"수정할 내용과 비용, 정보 수집·전송·보관 방식이 달라지는지 확인한 뒤 진행할 방법을 정합니다. 학교가 판단해야 하는 내용은 먼저 확인합니다."},{"id":"a36-implement","category":"기본 진행","title":"3 선택한 범위 구현하기","when":"수정 계획을 검토한 뒤 승인할 범위를 직접 적고 보냅니다.","text":"활동: 변경 내용을 저장하고 배포 환경 확인\n앱 이름과 프로젝트: [입력]\n이번 시험 주소: [입력]\n준비 정보: 대상 저장소·브랜치·Vercel 프로젝트, 변경 파일, 시험 결과, 배포 승인 범위\n현재 상황: [입력]\n사용할 가상 자료: [입력]\n승인한 수정안: [선택한 방법과 항목을 정확히 입력]\n수정할 파일 또는 기능 범위: [입력]\n이번에 제외할 것: [입력]\n\n위에 승인한 범위만 구현해 줘. 시작 전에 현재 변경 파일을 확인해 다른 작업을 보존해 줘.\n1. 내가 지정한 변경 파일만 커밋 대상으로 선택하고 다른 작업의 변경을 덮어쓰거나 포함하지 마.\n2. 커밋 메시지에 실제 변경과 검증 내용을 담고 비밀정보를 넣지 마.\n3. 푸시·배포는 내가 지정한 대상과 범위를 확인한 뒤 명시적으로 요청했을 때만 실행해 줘.\n4. 새 유료 서비스 생성·환경 변수 교체·운영 자료 삭제가 필요하면 그 작업은 별도로 확인해 줘.\n\n한 부분씩 수정하고 실행 결과를 확인해 줘. 기존 디자인과 정상 기능은 유지해 줘. 새 서비스 생성·운영 자료 삭제·유료 호출·커밋·푸시·배포는 이 요청에 구체적으로 승인한 경우에만 실행해 줘. 요청하지 않은 변경이 필요하면 진행 전에 이유를 설명해 줘.\n수정 후 바꾼 파일과 이유, 실행한 검사, 아직 하지 못한 시험, 내가 누를 버튼 순서를 적어 줘. 실제 학생 정보·비밀키·인증 토큰은 출력하지 말고 필요한 값은 가려 줘. 내 앱 또는 허락받은 시험 환경만 대상으로 해 줘.","next":"빌드나 실행 오류가 없는지 확인한 뒤 4번으로 진행합니다. 허용해야 할 동작은 정상적으로 되고, 차단해야 할 동작은 막히는지 함께 시험합니다."},{"id":"a36-verify","category":"기본 진행","title":"4 수정 결과 직접 확인하기","when":"구현이 끝났거나 기존 기능이 안전하게 동작하는지 검증할 때 보냅니다.","text":"활동: 변경 내용을 저장하고 배포 환경 확인\n앱 이름과 프로젝트: [입력]\n이번 시험 주소: [입력]\n준비 정보: 대상 저장소·브랜치·Vercel 프로젝트, 변경 파일, 시험 결과, 배포 승인 범위\n현재 상황: [입력]\n사용할 가상 자료: [입력]\n이번 수정 내용: [입력 또는 기존 기능 검증]\n시험할 버전과 주소: [입력]\n\n다음 조건을 가상 자료로 다시 시험해 줘.\n1. 빌드와 관련 테스트를 실행하고 실패가 남아 있으면 완료라고 하지 마.\n2. 승인 후 배포했다면 배포 결과와 실제 URL을 확인해 줘.\n3. 배포된 앱에서 로그인·권한·문서 링크·수정 기능을 가상 자료로 재시험해 줘.\n4. 배포 버전과 커밋을 연결하고 롤백이 필요한 경우의 구체적 절차를 설명해 줘.\n\n내가 직접 따라 할 수 있도록 준비 계정과 상태 → 클릭 또는 입력 → 확인할 실제 탭·요청·필드 → 기대 결과를 항목마다 적어 줘.\n확인할 위치: 프로젝트 터미널의 Git 상태와 Vercel 배포 화면을 확인합니다. 배포 후 F12에서 실제 사이트의 요청·오류를 다시 확인합니다. 로컬 성공만으로 운영 성공을 판단하지 않습니다.\n자기 앱에서 이름이 다르면 코드와 실제 요청에서 맞는 이름을 찾아 줘. 실제로 존재하는지 확인하지 않은 요청명을 만들어 내지 마.\n허용해야 할 동작과 차단해야 할 동작을 함께 시험해 줘. 항목마다 실행 여부, 실제 결과, 확인한 화면이나 기록을 적고, 시험하지 못했다면 이유를 설명해 줘. 응답 코드와 실제로 받은 자료를 함께 확인하고, 저장 기능이 있다면 저장된 결과도 확인해 줘.\n이 활동을 완료해도 앱 전체의 안전이 보장된다고 표현하지 마. 실제 학생 정보·비밀키·인증 토큰은 출력하지 말고 필요한 값은 가려 줘. 내 앱 또는 허락받은 시험 환경만 대상으로 해 줘.","next":"기대 결과와 실제 결과가 같으면 활동 기록을 정리합니다. 다르면 “오류 해결” 프롬프트를 사용하고 같은 조건으로 재시험합니다."},{"id":"a36-branch1","category":"상황별 진행","title":"Git을 아직 연결하지 않은 경우","when":"기본 순서로 진행하다가 이 상황에 해당하면 사용합니다.","text":"활동: 변경 내용을 저장하고 배포 환경 확인\n앱 이름과 프로젝트: [입력]\n이번 시험 주소: [입력]\n준비 정보: 대상 저장소·브랜치·Vercel 프로젝트, 변경 파일, 시험 결과, 배포 승인 범위\n현재 상황: [입력]\n사용할 가상 자료: [입력]\n현재 겪는 상황: Git을 아직 연결하지 않은 경우\n이미 한 행동과 나온 결과: [입력]\n\n기존 파일을 보존한 채 저장소 초기화·비공개 여부·제외 파일·원격 연결 계획을 제시해 줘. 새 저장소 생성과 외부 업로드는 내가 선택한 뒤 실행해 줘.\n먼저 관련 코드·화면·설정에서 현재 상태를 확인하고 이 상황이 생긴 이유를 근거와 함께 설명해 줘. 현재 환경에서 확인할 수 없는 것은 따로 표시해 줘.\n이 활동에서 유지할 조건:\n1. 내가 지정한 변경 파일만 커밋 대상으로 선택하고 다른 작업의 변경을 덮어쓰거나 포함하지 마.\n
