\n현재 화면 또는 가린 오류 내용: [붙이기]\n\n참고 안내: #/errors에서 F12 → Network → Fetch/XHR → lab?action=errors 필터 → 목록 지우기 → 자료 불러오기 → 새 요청 → Response의 log.key와 log.rawInput 확인. 다음 안내에서 수정한 앱을 실행해 log.code만 보이는지 비교합니다. Headers에서는 상태를 확인합니다.\n이 안내가 체험 앱의 가상 자료인지 내 앱의 실제 동작인지 먼저 구분해 줘. 프로젝트에서 이 동작이 어떤 요청·파일·저장소로 연결되는지 찾아 줘.\nNetwork라면 동작 전에 열기, 기록 켜기, 목록 지우기, 필터 확인, 같은 동작 다시 하기, 새 요청 선택, Headers·Payload·Response 중 볼 위치를 실제 이름으로 알려 줘. 정적 파일이면 All 필터도 확인해 줘. 새 창을 열었다면 그 창에서 F12를 열어야 하는지 설명해 줘.\n브라우저 검사에서 막아 요청이 없거나 아직 동작을 실행하지 않은 경우도 구분해 줘. 서버에만 있는 정보는 F12에서 찾으라고 하지 말고 코드·관리 화면·시험 환경에서 확인할 방법을 제시해 줘.\n확인할 자료가 실제로 없으면 없다고 말하고 필요한 시험 준비를 설명해 줘. 캡처 요청에는 가려야 할 정보도 알려 줘. 실제 학생 정보·비밀키·인증 토큰은 출력하지 말고 필요한 값은 가려 줘. 내 앱 또는 허락받은 시험 환경만 대상으로 해 줘.","next":"정확한 위치를 찾은 뒤 해당 활동의 4번 프롬프트로 결과를 확인합니다. 없다는 사실 자체가 기대 결과인지 먼저 판단합니다."},{"id":"a7-error","category":"오류 해결","title":"예상과 다른 결과가 나올 때","when":"실행 오류, 정상 기능 실패, 예상한 차단이 되지 않는 경우에 보냅니다.","text":"활동: 오류 응답과 기록의 비밀정보 제거\n앱 이름과 프로젝트: [입력]\n이번 시험 주소: [입력]\n준비 정보: 실패를 재현할 가상 입력, 오류 처리 파일, 기록 서비스\n현재 상황: [입력]\n사용할 가상 자료: [입력]\n실행한 단계와 입력: [입력]\n기대한 결과: [입력]\n실제로 나온 결과: [입력]\n오류 문구: [비밀값을 가리고 붙이기]\n직전에 변경한 파일 또는 설정: [입력 또는 모름]\n\n원인을 추측해서 여러 곳을 한꺼번에 바꾸지 말고, 재현 조건과 현재 코드를 비교해 줘. 요청이 만들어지는지, 서버에 도착하는지, 검사와 반환·저장이 어디서 달라지는지 관련 단계만 확인해 줘.\n특히 다음 점검 기준을 다시 봐 줘:\n1. 오류 응답을 만드는 코드와 브라우저 콘솔·서버 로그·오류 수집 서비스에 기록하는 내용을 찾아 줘.\n2. 키, 로그인 토큰, 학생 입력 원문, 내부 파일 경로가 사용자에게 전달되는지 확인해 줘.\n\n가능한 원인마다 그렇게 판단한 이유와 먼저 확인할 방법을 알려 줘. 운영 자료를 삭제하거나 권한·입력 검사를 전체 해제하는 방식은 사용하지 마. 수정이 필요하면 바꿀 내용을 먼저 제안하고 내가 승인한 뒤 적용해 줘.\n수정 후 같은 실패 조건과 다음 정상 조건을 모두 재시험해 줘:\n1. 수정 전과 같은 가상 오류를 발생시키고 Response 전체에서 key와 rawInput에 해당하는 값이 빠졌는지 확인해 줘.\n2. 500이 계속 나와도 의도한 실패 상황인지 구분하고 비밀정보 제거와 기능 오류 수정을 별도로 평가해 줘.\n3. 브라우저 Console과 승인된 시험용 서버 로그도 확인해 줘.\n4. 사용자 안내는 읽을 수 있고 담당자가 오류를 구분할 수 있는지 확인해 줘.\n완료 보고에는 실제 실행한 결과와 실행하지 못한 이유를 구분해 줘.","next":"실패 원인을 확인하고 승인한 수정만 적용합니다. 같은 실패 조건이 해결됐는지와 원래 정상 기능이 유지되는지 함께 봅니다."},{"id":"a7-finish","category":"활동 마무리","title":"확인 기록과 다음 점검 정리하기","when":"직접 시험을 확인한 뒤, 또는 해당 없음·추가 확인으로 종료할 때 보냅니다.","text":"활동: 오류 응답과 기록의 비밀정보 제거\n앱 이름과 프로젝트: [입력]\n이번 시험 주소: [입력]\n준비 정보: 실패를 재현할 가상 입력, 오류 처리 파일, 기록 서비스\n현재 상황: [입력]\n사용할 가상 자료: [입력]\n실제로 진행한 단계: [입력]\n확인한 결과 또는 아직 확인하지 못한 내용: [입력]\n\n이번 활동 기록을 Markdown으로 정리해 줘. 항목은 앱과 시험 버전, 점검한 기능, 발견한 문제와 위치, 승인한 수정, 시험 입력과 기대 결과, 실제 결과와 근거, 추가 확인할 일로 구성해 줘.\n앞으로 개발할 때 지킬 기준도 우리 앱의 실제 코드·설정 위치와 연결해 적어 줘:\n1. 사용자에게는 이해할 수 있는 오류 안내와 문의용 구분값만 보여 주도록 해 줘.\n2. 서버 기록에서도 비밀키와 학생 원문을 기본적으로 제외하고 필요한 필드만 허용해 줘.\n3. 민감한 값을 가리는 처리가 모든 오류 경로에 적용되는지 확인하고 정상 처리 정보를 지우지 마.\n4. 운영 기록 접근 권한과 보관 기간은 실제 정책을 받아 적용하고 기간을 임의로 정하지 마.\n\n활동 상태는 확인 완료·추가 확인·해당 없음 중 근거에 맞게 적어 줘. 구현만 하고 시험하지 않았다면 확인 완료로 쓰지 마. 문제를 발견하지 못한 것과 충분히 검증한 것을 구분해 줘.\n다음 수정 때 다시 실행할 시험은 다음 내용을 바탕으로 정리해 줘:\n1. 수정 전과 같은 가상 오류를 발생시키고 Response 전체에서 key와 rawInput에 해당하는 값이 빠졌는지 확인해 줘.\n2. 500이 계속 나와도 의도한 실패 상황인지 구분하고 비밀정보 제거와 기능 오류 수정을 별도로 평가해 줘.\n보고서에 원문 학생 자료나 비밀값을 넣지 마. 이 기록만으로 학교 승인이나 앱 전체의 안전을 보장한다고 쓰지 마.","next":"기록을 자신의 프로젝트에 보관하고 필요한 다음 활동을 선택합니다. 새로운 대화를 시작할 때는 이 기록과 공통 시작 프롬프트를 함께 제공합니다."}]},{"id":8,"title":"로그인과 AI 요청 횟수 제한","group":"공통 보안 점검","slides":"25, 추가 체험","condition":"반복 요청으로 비용이나 서비스 장애가 생길 수 있는 경우","inputs":"요청 종류, 승인할 제한 횟수와 기간, 재시도 안내","inspect":["로그인 시도와 외부 AI 호출을 어디서 제한하는지 찾아 줘. 버튼 비활성화와 서버 제한을 구분해 줘.","로그아웃·새 창·다른 서버 인스턴스에서 제한이 초기화되는지 확인할 계획을 세워 줘.","자동 재시도, 중복 클릭, 주기적 호출로 요청이 늘어나는 경로를 찾아 줘.","학교 공유 인터넷에서 IP 하나로 제한하면 정상 학생까지 막힐 가능성을 설명해 줘."],"requirements":["사용자·요청 종류·전체 비용을 고려해 제한 기준을 제안하고 횟수와 기간은 내가 결정하게 해 줘.","배포 구조에 맞는 서버측 제한을 사용하고 메모리 변수만으로 여러 인스턴스를 통제한다고 주장하지 마.","초과 시 기다릴 시간과 다시 시도할 방법을 안내하고, 무제한 자동 재시도는 막아 줘.","알림 기준과 비용 발생 가능성을 설명하고 유료 저장소 추가는 먼저 확인받아 줘."],"tests":["승인된 소수의 가상 요청으로 정상 허용과 초과 거절을 확인해 줘. 부하 공격처럼 대량 요청하지 마.","제한된 요청이 실제 AI 호출까지 진행되지 않는지 모의 호출 수로 확인해 줘.","제한 기간 경과 뒤 재시도가 가능한지 시험해 줘.","학급의 정상 사용자 여러 명을 모두 막지 않는지 가상 계정으로 확인해 줘."],"location":"#/rate에서 F12 → Network → Fetch/XHR → lab?action=rate → 반복 요청 실행 → 각 요청의 상태와 Response 비교. 연습은 세 번 허용 뒤 네 번째 429와 Retry-After를 보여 주지만, 실제 앱의 기준은 별도로 정합니다.","links":["https://webapp-security-lab.vercel.app/#/rate"],"branches":[["사용자 계정이 없을 때","IP·세션·전체 한도를 조합하는 대안을 제시하고 각각의 한계와 개인정보 영향을 설명해 줘. 사용자 추적 기능을 임의로 추가하지 마."],["이미 정상 사용자가 차단될 때","어떤 사용자가 언제 차단됐는지와 제한 횟수를 계산하는 기간을 확인해 줘. 공유 IP, 중복 재시도, 요청 횟수를 셀 때 사용자를 구분하는 값이 원인인지 조사해 줘. 모든 제한을 끄는 방식으로 고치지 마."]],"prompts":[{"id":"a8-inspect","category":"기본 진행","title":"1 현재 상태부터 확인하기","when":"프로젝트를 연 뒤 처음 보냅니다. 파일을 고치기 전 단계입니다.","text":"활동: 로그인과 AI 요청 횟수 제한\n앱 이름과 프로젝트: [입력]\n이번 시험 주소: [입력]\n준비 정보: 요청 종류, 승인할 제한 횟수와 기간, 재시도 안내\n현재 상황: [입력]\n사용할 가상 자료: [입력]\n\n이 활동에 해당하는지부터 확인해 줘. 아직 파일이나 설정은 수정하지 마.\n1. 로그인 시도와 외부 AI 호출을 어디서 제한하는지 찾아 줘. 버튼 비활성화와 서버 제한을 구분해 줘.\n2. 로그아웃·새 창·다른 서버 인스턴스에서 제한이 초기화되는지 확인할 계획을 세워 줘.\n3. 자동 재시도, 중복 클릭, 주기적 호출로 요청이 늘어나는 경로를 찾아 줘.\n4. 학교 공유 인터넷에서 IP 하나로 제한하면 정상 학생까지 막힐 가능성을 설명해 줘.\n\n결과는 표로 정리해 줘. 표에는 확인 항목, 현재 동작, 근거가 있는 파일이나 설정 위치, 발견한 문제와 추가로 확인할 내용을 적어 줘. 코드에서 확인한 사실과 추정은 구분해 줘. 내가 직접 확인할 메뉴·버튼·파일 이름도 알려 줘. 파일을 읽지 못했다면 그 사실을 표시해 줘.\n실제 학생 정보·비밀키·인증 토큰은 출력하지 말고 필요한 값은 가려 줘. 내 앱 또는 허락받은 시험 환경만 대상으로 해 줘.\n참고할 확인 위치: #/rate에서 F12 → Network → Fetch/XHR → lab?action=rate → 반복 요청 실행 → 각 요청의 상태와 Response 비교. 연습은 세 번 허용 뒤 네 번째 429와 Retry-After를 보여 주지만, 실제 앱의 기준은 별도로 정합니다.","next":"현재 구조와 해당 여부를 확인합니다. 모르는 정보는 먼저 확인하고, 수정이 필요하면 2번으로 진행합니다."},{"id":"a8-plan","category":"기본 진행","title":"2 수정 방법과 범위 정하기","when":"1번 답변에서 실제로 고칠 항목을 골랐을 때 보냅니다.","text":"활동: 로그인과 AI 요청 횟수 제한\n앱 이름과 프로젝트: [입력]\n이번 시험 주소: [입력]\n준비 정보: 요청 종류, 승인할 제한 횟수와 기간, 재시도 안내\n현재 상황: [입력]\n사용할 가상 자료: [입력]\n앞에서 확인한 문제와 근거: [1번 결과 중 해당 부분을 붙이기]\n이번에 고칠 항목: [입력]\n\n구현 전에 다음 조건으로 수정 계획을 만들어 줘.\n1. 사용자·요청 종류·전체 비용을 고려해 제한 기준을 제안하고 횟수와 기간은 내가 결정하게 해 줘.\n2. 배포 구조에 맞는 서버측 제한을 사용하고 메모리 변수만으로 여러 인스턴스를 통제한다고 주장하지 마.\n3. 초과 시 기다릴 시간과 다시 시도할 방법을 안내하고, 무제한 자동 재시도는 막아 줘.\n4. 알림 기준과 비용 발생 가능성을 설명하고 유료 저장소 추가는 먼저 확인받아 줘.\n\n기존 기능을 유지하면서 문제를 고칠 방법부터 제안해 줘. 방법이 여러 가지라면 필요한 서비스와 비용, 사용 방법이 달라지는 부분, 이전 상태로 되돌릴 방법을 비교해 줘. 반드시 고쳐야 할 부분과 선택해서 개선할 부분을 구분해 줘.\n변경할 파일, 학생 또는 교사 화면에서 달라질 부분, 필요한 관리 설정, 시험할 가상 입력을 순서대로 적어 줘. 서버가 없는 앱이라면 지금 할 수 있는 것과 서버가 필요한 것을 분리해 줘.\n아직 코드를 수정하거나 서비스를 만들지 마. 내가 결정해야 할 사항이 있으면 선택지와 차이를 설명하고 물어봐 줘.","next":"수정할 내용과 비용, 정보 수집·전송·보관 방식이 달라지는지 확인한 뒤 진행할 방법을 정합니다. 학교가 판단해야 하는 내용은 먼저 확인합니다."},{"id":"a8-implement","category":"기본 진행","title":"3 선택한 범위 구현하기","when":"수정 계획을 검토한 뒤 승인할 범위를 직접 적고 보냅니다.","text":"활동: 로그인과 AI 요청 횟수 제한\n앱 이름과 프로젝트: [입력]\n이번 시험 주소: [입력]\n준비 정보: 요청 종류, 승인할 제한 횟수와 기간, 재시도 안내\n현재 상황: [입력]\n사용할 가상 자료: [입력]\n승인한 수정안: [선택한 방법과 항목을 정확히 입력]\n수정할 파일 또는 기능 범위: [입력]\n이번에 제외할 것: [입력]\n\n위에 승인한 범위만 구현해 줘. 시작 전에 현재 변경 파일을 확인해 다른 작업을 보존해 줘.\n1. 사용자·요청 종류·전체 비용을 고려해 제한 기준을 제안하고 횟수와 기간은 내가 결정하게 해 줘.\n2. 배포 구조에 맞는 서버측 제한을 사용하고 메모리 변수만으로 여러 인스턴스를 통제한다고 주장하지 마.\n3. 초과 시 기다릴 시간과 다시 시도할 방법을 안내하고, 무제한 자동 재시도는 막아 줘.\n4. 알림 기준과 비용 발생 가능성을 설명하고 유료 저장소 추가는 먼저 확인받아 줘.\n\n한 부분씩 수정하고 실행 결과를 확인해 줘. 기존 디자인과 정상 기능은 유지해 줘. 새 서비스 생성·운영 자료 삭제·유료 호출·커밋·푸시·배포는 이 요청에 구체적으로 승인한 경우에만 실행해 줘. 요청하지 않은 변경이 필요하면 진행 전에 이유를 설명해 줘.\n수정 후 바꾼 파일과 이유, 실행한 검사, 아직 하지 못한 시험, 내가 누를 버튼 순서를 적어 줘. 실제 학생 정보·비밀키·인증 토큰은 출력하지 말고 필요한 값은 가려 줘. 내 앱 또는 허락받은 시험 환경만 대상으로 해 줘.","next":"빌드나 실행 오류가 없는지 확인한 뒤 4번으로 진행합니다. 허용해야 할 동작은 정상적으로 되고, 차단해야 할 동작은 막히는지 함께 시험합니다."},{"id":"a8-verify","category":"기본 진행","title":"4 수정 결과 직접 확인하기","when":"구현이 끝났거나 기존 기능이 안전하게 동작하는지 검증할 때 보냅니다.","text":"활동: 로그인과 AI 요청 횟수 제한\n앱 이름과 프로젝트: [입력]\n이번 시험 주소: [입력]\n준비 정보: 요청 종류, 승인할 제한 횟수와 기간, 재시도 안내\n현재 상황: [입력]\n사용할 가상 자료: [입력]\n이번 수정 내용: [입력 또는 기존 기능 검증]\n시험할 버전과 주소: [입력]\n\n다음 조건을 가상 자료로 다시 시험해 줘.\n1. 승인된 소수의 가상 요청으로 정상 허용과 초과 거절을 확인해 줘. 부하 공격처럼 대량 요청하지 마.\n2. 제한된 요청이 실제 AI 호출까지 진행되지 않는지 모의 호출 수로 확인해 줘.\n3. 제한 기간 경과 뒤 재시도가 가능한지 시험해 줘.\n4. 학급의 정상 사용자 여러 명을 모두 막지 않는지 가상 계정으로 확인해 줘.\n\n내가 직접 따라 할 수 있도록 준비 계정과 상태 → 클릭 또는 입력 → 확인할 실제 탭·요청·필드 → 기대 결과를 항목마다 적어 줘.\n확인할 위치: #/rate에서 F12 → Network → Fetch/XHR → lab?action=rate → 반복 요청 실행 → 각 요청의 상태와 Response 비교. 연습은 세 번 허용 뒤 네 번째 429와 Retry-After를 보여 주지만, 실제 앱의 기준은 별도로 정합니다.\n자기 앱에서 이름이 다르면 코드와 실제 요청에서 맞는 이름을 찾아 줘. 실제로 존재하는지 확인하지 않은 요청명을 만들어 내지 마.\n허용해야 할 동작과 차단해야 할 동작을 함께 시험해 줘. 항목마다 실행 여부, 실제 결과, 확인한 화면이나 기록을 적고, 시험하지 못했다면 이유를 설명해 줘. 응답 코드와 실제로 받은 자료를 함께 확인하고, 저장 기능이 있다면 저장된 결과도 확인해 줘.\n이 활동을 완료해도 앱 전체의 안전이 보장된다고 표현하지 마. 실제 학생 정보·비밀키·인증 토큰은 출력하지 말고 필요한 값은 가려 줘. 내 앱 또는 허락받은 시험 환경만 대상으로 해 줘.","next":"기대 결과와 실제 결과가 같으면 활동 기록을 정리합니다. 다르면 “오류 해결” 프롬프트를 사용하고 같은 조건으로 재시험합니다."},{"id":"a8-branch1","category":"상황별 진행","title":"사용자 계정이 없을 때","when":"기본 순서로 진행하다가 이 상황에 해당하면 사용합니다.","text":"활동: 로그인과 AI 요청 횟수 제한\n앱 이름과 프로젝트: [입력]\n이번 시험 주소: [입력]\n준비 정보: 요청 종류, 승인할 제한 횟수와 기간, 재시도 안내\n현재 상황: [입력]\n사용할 가상 자료: [입력]\n현재 겪는 상황: 사용자 계정이 없을 때\n이미 한 행동과 나온 결과: [입력]\n\nIP·세션·전체 한도를 조합하는 대안을 제시하고 각각의 한계와 개인정보 영향을 설명해 줘. 사용자 추적 기능을 임의로 추가하지 마.\n먼저 관련 코드·화면·설정에서 현재 상태를 확인하고 이 상황이 생긴 이유를 근거와 함께 설명해 줘. 현재 환경에서 확인할 수 없는 것은 따로 표시해 줘.\n이 활동에서 유지할 조건:\n1. 사용자·요청 종류·전체 비용을 고려해 제한 기준을 제안하고 횟수와 기간은 내가 결정하게 해 줘.\n2. 배포 구조에 맞는 서버측 제한을 사용하고 메모리 변수만으로 여러 인스턴스를 통제한다고 주장하지 마.\n3. 초과 시 기다릴 시간과 다시 시도할 방법을 안내하고, 무제한 자동 재시도는 막아 줘.\n\n진행 순서를 “지금 확인할 것 → 선택 가능한 방법 → 내가 승인할 변경 → 실행 후 다시 확인할 결과”로 정리해 줘. 앱에 필요 없는 기능을 추가하거나 검사를 끄는 방식으로 해결하지 마.\n재시험에서는 다음 조건을 포함해 줘:\n1. 승인된 소수의 가상 요청으로 정상 허용과 초과 거절을 확인해 줘. 부하 공격처럼 대량 요청하지 마.\n2. 제한된 요청이 실제 AI 호출까지 진행되지 않는지 모의 호출 수로 확인해 줘.\n수정이 필요하면 먼저 범위를 제안하고 내 확인 전 운영 설정을 바꾸지 마. 실제 학생 정보·비밀키·인증 토큰은 출력하지 말고 필요한 값은 가려 줘. 내 앱 또는 허락받은 시험 환경만 대상으로 해 줘.","next":"이 상황에 맞는 방법을 선택한 뒤 기본 진행의 구현 또는 재시험 단계로 돌아갑니다. 해당 없음이면 이유를 기록하고 다른 활동을 고릅니다."},{"id":"a8-branch2","category":"상황별 진행","title":"이미 정상 사용자가 차단될 때","when":"기본 순서로 진행하다가 이 상황에 해당하면 사용합니다.","text":"활동: 로그인과 AI 요청 횟수 제한\n앱 이름과 프로젝트: [입력]\n이번 시험 주소: [입력]\n준비 정보: 요청 종류, 승인할 제한 횟수와 기간, 재시도 안내\n현재 상황: [입력]\n사용할 가상 자료: [입력]\n현재 겪는 상황: 이미 정상 사용자가 차단될 때\n이미 한 행동과 나온 결과: [입력]\n\n어떤 사용자가 언제 차단됐는지와 제한 횟수를 계산하는 기간을 확인해 줘. 공유 IP, 중복 재시도, 요청 횟수를 셀 때 사용자를 구분하는 값이 원인인지 조사해 줘. 모든 제한을 끄는 방식으로 고치지 마.\n먼저 관련 코드·화면·설정에서 현재 상태를 확인하고 이 상황이 생긴 이유를 근거와 함께 설명해 줘. 현재 환경에서 확인할 수 없는 것은 따로 표시해 줘.\n이 활동에서 유지할 조건:\n1. 사용자·요청 종류·전체 비용을 고려해 제한 기준을 제안하고 횟수와 기간은 내가 결정하게 해 줘.\n2. 배포 구조에 맞는 서버측 제한을 사용하고 메모리 변수만으로 여러 인스턴스를 통제한다고 주장하지 마.\n3. 초과 시 기다릴 시간과 다시 시도할 방법을 안내하고, 무제한 자동 재시도는 막아 줘.\n\n진행 순서를 “지금 확인할 것 → 선택 가능한 방법 → 내가 승인할 변경 → 실행 후 다시 확인할 결과”로 정리해 줘. 앱에 필요 없는 기능을 추가하거나 검사를 끄는 방식으로 해결하지 마.\n재시험에서는 다음 조건을 포함해 줘:\n1. 승인된 소수의 가상 요청으로 정상 허용과 초과 거절을 확인해 줘. 부하 공격처럼 대량 요청하지 마.\n2. 제한된 요청이 실제 AI 호출까지 진행되지 않는지 모의 호출 수로 확인해 줘.\n수정이 필요하면 먼저 범위를 제안하고 내 확인 전 운영 설정을 바꾸지 마. 실제 학생 정보·비밀키·인증 토큰은 출력하지 말고 필요한 값은 가려 줘. 내 앱 또는 허락받은 시험 환경만 대상으로 해 줘.","next":"이 상황에 맞는 방법을 선택한 뒤 기본 진행의 구현 또는 재시험 단계로 돌아갑니다. 해당 없음이면 이유를 기록하고 다른 활동을 고릅니다."},{"id":"a8-locate","category":"확인 위치 도움","title":"안내된 화면이나 요청을 찾지 못할 때","when":"F12에 설명한 파일·요청이 없거나 확인할 곳을 모르겠을 때 보냅니다.","text":"활동: 로그인과 AI 요청 횟수 제한\n앱 이름과 프로젝트: [입력]\n이번 시험 주소: [입력]\n준비 정보: 요청 종류, 승인할 제한 횟수와 기간, 재시도 안내\n현재 상황: [입력]\n사용할 가상 자료: [입력]\n내가 보고 있는 주소와 창: [입력]\n누른 버튼 또는 실행한 동작: [입력]\n열어 둔 개발자 도구 탭과 필터: [입력 또는 모름]\n찾으려는 정보: [입력]\n현재 화면 또는 가린 오류 내용: [붙이기]\n\n참고 안내: #/rate에서 F12 → Network → Fetch/XHR → lab?action=rate → 반복 요청 실행 → 각 요청의 상태와 Response 비교. 연습은 세 번 허용 뒤 네 번째 429와 Retry-After를 보여 주지만, 실제 앱의 기준은 별도로 정합니다.\n이 안내가 체험 앱의 가상 자료인지 내 앱의 실제 동작인지 먼저 구분해 줘. 프로젝트에서 이 동작이 어떤 요청·파일·저장소로 연결되는지 찾아 줘.\nNetwork라면 동작 전에 열기, 기록 켜기, 목록 지우기, 필터 확인, 같은 동작 다시 하기, 새 요청 선택, Headers·Payload·Response 중 볼 위치를 실제 이름으로 알려 줘. 정적 파일이면 All 필터도 확인해 줘. 새 창을 열었다면 그 창에서 F12를 열어야 하는지 설명해 줘.\n브라우저 검사에서 막아 요청이 없거나 아직 동작을 실행하지 않은 경우도 구분해 줘. 서버에만 있는 정보는 F12에서 찾으라고 하지 말고 코드·관리 화면·시험 환경에서 확인할 방법을 제시해 줘.\n확인할 자료가 실제로 없으면 없다고 말하고 필요한 시험 준비를 설명해 줘. 캡처 요청에는 가려야 할 정보도 알려 줘. 실제 학생 정보·비밀키·인증 토큰은 출력하지 말고 필요한 값은 가려 줘. 내 앱 또는 허락받은 시험 환경만 대상으로 해 줘.","next":"정확한 위치를 찾은 뒤 해당 활동의 4번 프롬프트로 결과를 확인합니다. 없다는 사실 자체가 기대 결과인지 먼저 판단합니다."},{"id":"a8-error","category":"오류 해결","title":"예상과 다른 결과가 나올 때","when":"실행 오류, 정상 기능 실패, 예상한 차단이 되지 않는 경우에 보냅니다.","text":"활동: 로그인과 AI 요청 횟수 제한\n앱 이름과 프로젝트: [입력]\n이번 시험 주소: [입력]\n준비 정보: 요청 종류, 승인할 제한 횟수와 기간, 재시도 안내\n현재 상황: [입력]\n사용할 가상 자료: [입력]\n실행한 단계와 입력: [입력]\n기대한 결과: [입력]\n실제로 나온 결과: [입력]\n오류 문구: [비밀값을 가리고 붙이기]\n직전에 변경한 파일 또는 설정: [입력 또는 모름]\n\n원인을 추측해서 여러 곳을 한꺼번에 바꾸지 말고, 재현 조건과 현재 코드를 비교해 줘. 요청이 만들어지는지, 서버에 도착하는지, 검사와 반환·저장이 어디서 달라지는지 관련 단계만 확인해 줘.\n특히 다음 점검 기준을 다시 봐 줘:\n1. 로그인 시도와 외부 AI 호출을 어디서 제한하는지 찾아 줘. 버튼 비활성화와 서버 제한을 구분해 줘.\n2. 로그아웃·새 창·다른 서버 인스턴스에서 제한이 초기화되는지 확인할 계획을 세워 줘.\n\n가능한 원인마다 그렇게 판단한 이유와 먼저 확인할 방법을 알려 줘. 운영 자료를 삭제하거나 권한·입력 검사를 전체 해제하는 방식은 사용하지 마. 수정이 필요하면 바꿀 내용을 먼저 제안하고 내가 승인한 뒤 적용해 줘.\n수정 후 같은 실패 조건과 다음 정상 조건을 모두 재시험해 줘:\n1. 승인된 소수의 가상 요청으로 정상 허용과 초과 거절을 확인해 줘. 부하 공격처럼 대량 요청하지 마.\n2. 제한된 요청이 실제 AI 호출까지 진행되지 않는지 모의 호출 수로 확인해 줘.\n3. 제한 기간 경과 뒤 재시도가 가능한지 시험해 줘.\n4. 학급의 정상 사용자 여러 명을 모두 막지 않는지 가상 계정으로 확인해 줘.\n완료 보고에는 실제 실행한 결과와 실행하지 못한 이유를 구분해 줘.","next":"실패 원인을 확인하고 승인한 수정만 적용합니다. 같은 실패 조건이 해결됐는지와 원래 정상 기능이 유지되는지 함께 봅니다."},{"id":"a8-finish","category":"활동 마무리","title":"확인 기록과 다음 점검 정리하기","when":"직접 시험을 확인한 뒤, 또는 해당 없음·추가 확인으로 종료할 때 보냅니다.","text":"활동: 로그인과 AI 요청 횟수 제한\n앱 이름과 프로젝트: [입력]\n이번 시험 주소: [입력]\n준비 정보: 요청 종류, 승인할 제한 횟수와 기간, 재시도 안내\n현재 상황: [입력]\n사용할 가상 자료: [입력]\n실제로 진행한 단계: [입력]\n확인한 결과 또는 아직 확인하지 못한 내용: [입력]\n\n이번 활동 기록을 Markdown으로 정리해 줘. 항목은 앱과 시험 버전, 점검한 기능, 발견한 문제와 위치, 승인한 수정, 시험 입력과 기대 결과, 실제 결과와 근거, 추가 확인할 일로 구성해 줘.\n앞으로 개발할 때 지킬 기준도 우리 앱의 실제 코드·설정 위치와 연결해 적어 줘:\n1. 사용자·요청 종류·전체 비용을 고려해 제한 기준을 제안하고 횟수와 기간은 내가 결정하게 해 줘.\n2. 배포 구조에 맞는 서버측 제한을 사용하고 메모리 변수만으로 여러 인스턴스를 통제한다고 주장하지 마.\n3. 초과 시 기다릴 시간과 다시 시도할 방법을 안내하고, 무제한 자동 재시도는 막아 줘.\n4. 알림 기준과 비용 발생 가능성을 설명하고 유료 저장소 추가는 먼저 확인받아 줘.\n\n활동 상태는 확인 완료·추가 확인·해당 없음 중 근거에 맞게 적어 줘. 구현만 하고 시험하지 않았다면 확인 완료로 쓰지 마. 문제를 발견하지 못한 것과 충분히 검증한 것을 구분해 줘.\n다음 수정 때 다시 실행할 시험은 다음 내용을 바탕으로 정리해 줘:\n1. 승인된 소수의 가상 요청으로 정상 허용과 초과 거절을 확인해 줘. 부하 공격처럼 대량 요청하지 마.\n2. 제한된 요청이 실제 AI 호출까지 진행되지 않는지 모의 호출 수로 확인해 줘.\n보고서에 원문 학생 자료나 비밀값을 넣지 마. 이 기록만으로 학교 승인이나 앱 전체의 안전을 보장한다고 쓰지 마.","next":"기록을 자신의 프로젝트에 보관하고 필요한 다음 활동을 선택합니다. 새로운 대화를 시작할 때는 이 기록과 공통 시작 프롬프트를 함께 제공합니다."}]},{"id":9,"title":"사용량과 대기 서버 비용 점검","group":"공통 보안 점검","slides":"14","condition":"배포·데이터베이스·AI 등 과금 가능한 서비스를 사용하는 경우","inputs":"서비스와 요금제, 사용량 화면, 비밀정보를 가린 청구 내역","inspect":["코드와 배포 설정에서 과금 가능한 서비스, 자동 호출, 예약 작업, 실시간 구독을 찾아 줘.","사용 요청 비용과 최소 인스턴스·항상 실행 설정 같은 대기 비용을 구분해 줘.","제공한 청구 내역을 항목별로 읽고 실제 비용과 추정 비용을 구분해 줘. 다른 기간 금액을 중복 합산하지 마.","생태전환 좌석예약 사례를 내 앱의 현재 원인으로 단정하지 말고 내 설정에서 근거를 찾아 줘."],"requirements":["사용하지 않는 호출과 중복 재시도부터 줄이는 방안을 제시해 줘.","대기 설정을 낮출 때 첫 응답 지연이나 기능 중단 영향이 있는지 설명하고 내 선택을 기다려 줘.","예산 알림과 강제 사용 중단을 구분해 줘. 알림이 있다고 요금이 자동 차단된다고 쓰지 마.","변경할 설정·예상 효과·되돌리는 방법을 보여 주고 결제·요금제·운영 서비스를 자동으로 바꾸지 마."],"tests":["승인한 변경이 실제 대상 프로젝트에 적용됐는지 값과 시각을 확인해 줘.","학생이 사용하는 기능이 계속 동작하는지 소수의 가상 요청으로 시험해 줘.","청구 반영 지연을 고려해 나중에 확인할 사용량 항목과 비교 기간을 적어 줘.","실제 사용량을 확인하기 전에는 절감 금액을 예상치로 표시하고, 계산에 사용한 요금과 요청 횟수 등의 조건을 적어 줘."],"location":"제공사의 Billing·Usage·배포 설정과 AI 사용량 화면에서 확인합니다. F12는 반복 요청을 찾는 데 도움이 되지만 서버 대기 요금과 전체 청구액을 보여 주지는 않습니다.","links":["https://webapp-security-lab.vercel.app/#/review/billing","https://vercel.com/docs/spend-management"],"branches":[["아직 비용이 나온 적이 없을 때","현재 무료 범위와 초과 시 과금 조건을 공식 자료에서 확인해 줘. 무료라는 이유만으로 위험 없음으로 처리하지 마."],["이미 예상보다 큰 청구가 발생했을 때","기간과 서비스별 청구 근거를 정리하고 비정상 사용 여부를 확인할 순서를 제시해 줘. 환불이나 감면을 보장하지 말고 문의용 사실관계 초안만 작성해 줘."]],"prompts":[{"id":"a9-inspect","category":"기본 진행","title":"1 현재 상태부터 확인하기","when":"프로젝트를 연 뒤 처음 보냅니다. 파일을 고치기 전 단계입니다.","text":"활동: 사용량과 대기 서버 비용 점검\n앱 이름과 프로젝트: [입력]\n이번 시험 주소: [입력]\n준비 정보: 서비스와 요금제, 사용량 화면, 비밀정보를 가린 청구 내역\n현재 상황: [입력]\n사용할 가상 자료: [입력]\n\n이 활동에 해당하는지부터 확인해 줘. 아직 파일이나 설정은 수정하지 마.\n1. 코드와 배포 설정에서 과금 가능한 서비스, 자동 호출, 예약 작업, 실시간 구독을 찾아 줘.\n2. 사용 요청 비용과 최소 인스턴스·항상 실행 설정 같은 대기 비용을 구분해 줘.\n3. 제공한 청구 내역을 항목별로 읽고 실제 비용과 추정 비용을 구분해 줘. 다른 기간 금액을 중복 합산하지 마.\n4. 생태전환 좌석예약 사례를 내 앱의 현재 원인으로 단정하지 말고 내 설정에서 근거를 찾아 줘.\n\n결과는 표로 정리해 줘. 표에는 확인 항목, 현재 동작, 근거가 있는 파일이나 설정 위치, 발견한 문제와 추가로 확인할 내용을 적어 줘. 코드에서 확인한 사실과 추정은 구분해 줘. 내가 직접 확인할 메뉴·버튼·파일 이름도 알려 줘. 파일을 읽지 못했다면 그 사실을 표시해 줘.\n실제 학생 정보·비밀키·인증 토큰은 출력하지 말고 필요한 값은 가려 줘. 내 앱 또는 허락받은 시험 환경만 대상으로 해 줘.\n참고할 확인 위치: 제공사의 Billing·Usage·배포 설정과 AI 사용량 화면에서 확인합니다. F12는 반복 요청을 찾는 데 도움이 되지만 서버 대기 요금과 전체 청구액을 보여 주지는 않습니다.","next":"현재 구조와 해당 여부를 확인합니다. 모르는 정보는 먼저 확인하고, 수정이 필요하면 2번으로 진행합니다."},{"id":"a9-plan","category":"기본 진행","title":"2 수정 방법과 범위 정하기","when":"1번 답변에서 실제로 고칠 항목을 골랐을 때 보냅니다.","text":"활동: 사용량과 대기 서버 비용 점검\n앱 이름과 프로젝트: [입력]\n이번 시험 주소: [입력]\n준비 정보: 서비스와 요금제, 사용량 화면, 비밀정보를 가린 청구 내역\n현재 상황: [입력]\n사용할 가상 자료: [입력]\n앞에서 확인한 문제와 근거: [1번 결과 중 해당 부분을 붙이기]\n이번에 고칠 항목: [입력]\n\n구현 전에 다음 조건으로 수정 계획을 만들어 줘.\n1. 사용하지 않는 호출과 중복 재시도부터 줄이는 방안을 제시해 줘.\n2. 대기 설정을 낮출 때 첫 응답 지연이나 기능 중단 영향이 있는지 설명하고 내 선택을 기다려 줘.\n3. 예산 알림과 강제 사용 중단을 구분해 줘. 알림이 있다고 요금이 자동 차단된다고 쓰지 마.\n4. 변경할 설정·예상 효과·되돌리는 방법을 보여 주고 결제·요금제·운영 서비스를 자동으로 바꾸지 마.\n\n기존 기능을 유지하면서 문제를 고칠 방법부터 제안해 줘. 방법이 여러 가지라면 필요한 서비스와 비용, 사용 방법이 달라지는 부분, 이전 상태로 되돌릴 방법을 비교해 줘. 반드시 고쳐야 할 부분과 선택해서 개선할 부분을 구분해 줘.\n변경할 파일, 학생 또는 교사 화면에서 달라질 부분, 필요한 관리 설정, 시험할 가상 입력을 순서대로 적어 줘. 서버가 없는 앱이라면 지금 할 수 있는 것과 서버가 필요한 것을 분리해 줘.\n아직 코드를 수정하거나 서비스를 만들지 마. 내가 결정해야 할 사항이 있으면 선택지와 차이를 설명하고 물어봐 줘.","next":"수정할 내용과 비용, 정보 수집·전송·보관 방식이 달라지는지 확인한 뒤 진행할 방법을 정합니다. 학교가 판단해야 하는 내용은 먼저 확인합니다."},{"id":"a9-implement","category":"기본 진행","title":"3 선택한 범위 구현하기","when":"수정 계획을 검토한 뒤 승인할 범위를 직접 적고 보냅니다.","text":"활동: 사용량과 대기 서버 비용 점검\n앱 이름과 프로젝트: [입력]\n이번 시험 주소: [입력]\n준비 정보: 서비스와 요금제, 사용량 화면, 비밀정보를 가린 청구 내역\n현재 상황: [입력]\n사용할 가상 자료: [입력]\n승인한 수정안: [선택한 방법과 항목을 정확히 입력]\n수정할 파일 또는 기능 범위: [입력]\n이번에 제외할 것: [입력]\n\n위에 승인한 범위만 구현해 줘. 시작 전에 현재 변경 파일을 확인해 다른 작업을 보존해 줘.\n1. 사용하지 않는 호출과 중복 재시도부터 줄이는 방안을 제시해 줘.\n2. 대기 설정을 낮출 때 첫 응답 지연이나 기능 중단 영향이 있는지 설명하고 내 선택을 기다려 줘.\n3. 예산 알림과 강제 사용 중단을 구분해 줘. 알림이 있다고 요금이 자동 차단된다고 쓰지 마.\n4. 변경할 설정·예상 효과·되돌리는 방법을 보여 주고 결제·요금제·운영 서비스를 자동으로 바꾸지 마.\n\n한 부분씩 수정하고 실행 결과를 확인해 줘. 기존 디자인과 정상 기능은 유지해 줘. 새 서비스 생성·운영 자료 삭제·유료 호출·커밋·푸시·배포는 이 요청에 구체적으로 승인한 경우에만 실행해 줘. 요청하지 않은 변경이 필요하면 진행 전에 이유를 설명해 줘.\n수정 후 바꾼 파일과 이유, 실행한 검사, 아직 하지 못한 시험, 내가 누를 버튼 순서를 적어 줘. 실제 학생 정보·비밀키·인증 토큰은 출력하지 말고 필요한 값은 가려 줘. 내 앱 또는 허락받은 시험 환경만 대상으로 해 줘.","next":"빌드나 실행 오류가 없는지 확인한 뒤 4번으로 진행합니다. 허용해야 할 동작은 정상적으로 되고, 차단해야 할 동작은 막히는지 함께 시험합니다."},{"id":"a9-verify","category":"기본 진행","title":"4 수정 결과 직접 확인하기","when":"구현이 끝났거나 기존 기능이 안전하게 동작하는지 검증할 때 보냅니다.","text":"활동: 사용량과 대기 서버 비용 점검\n앱 이름과 프로젝트: [입력]\n이번 시험 주소: [입력]\n준비 정보: 서비스와 요금제, 사용량 화면, 비밀정보를 가린 청구 내역\n현재 상황: [입력]\n사용할 가상 자료: [입력]\n이번 수정 내용: [입력 또는 기존 기능 검증]\n시험할 버전과 주소: [입력]\n\n다음 조건을 가상 자료로 다시 시험해 줘.\n1. 승인한 변경이 실제 대상 프로젝트에 적용됐는지 값과 시각을 확인해 줘.\n2. 학생이 사용하는 기능이 계속 동작하는지 소수의 가상 요청으로 시험해 줘.\n3. 청구 반영 지연을 고려해 나중에 확인할 사용량 항목과 비교 기간을 적어 줘.\n4. 실제 사용량을 확인하기 전에는 절감 금액을 예상치로 표시하고, 계산에 사용한 요금과 요청 횟수 등의 조건을 적어 줘.\n\n내가 직접 따라 할 수 있도록 준비 계정과 상태 → 클릭 또는 입력 → 확인할 실제 탭·요청·필드 → 기대 결과를 항목마다 적어 줘.\n확인할 위치: 제공사의 Billing·Usage·배포 설정과 AI 사용량 화면에서 확인합니다. F12는 반복 요청을 찾는 데 도움이 되지만 서버 대기 요금과 전체 청구액을 보여 주지는 않습니다.\n자기 앱에서 이름이 다르면 코드와 실제 요청에서 맞는 이름을 찾아 줘. 실제로 존재하는지 확인하지 않은 요청명을 만들어 내지 마.\n허용해야 할 동작과 차단해야 할 동작을 함께 시험해 줘. 항목마다 실행 여부, 실제 결과, 확인한 화면이나 기록을 적고, 시험하지 못했다면 이유를 설명해 줘. 응답 코드와 실제로 받은 자료를 함께 확인하고, 저장 기능이 있다면 저장된 결과도 확인해 줘.\n이 활동을 완료해도 앱 전체의 안전이 보장된다고 표현하지 마. 실제 학생 정보·비밀키·인증 토큰은 출력하지 말고 필요한 값은 가려 줘. 내 앱 또는 허락받은 시험 환경만 대상으로 해 줘.","next":"기대 결과와 실제 결과가 같으면 활동 기록을 정리합니다. 다르면 “오류 해결” 프롬프트를 사용하고 같은 조건으로 재시험합니다."},{"id":"a9-branch1","category":"상황별 진행","title":"아직 비용이 나온 적이 없을 때","when":"기본 순서로 진행하다가 이 상황에 해당하면 사용합니다.","text":"활동: 사용량과 대기 서버 비용 점검\n앱 이름과 프로젝트: [입력]\n이번 시험 주소: [입력]\n준비 정보: 서비스와 요금제, 사용량 화면, 비밀정보를 가린 청구 내역\n현재 상황: [입력]\n사용할 가상 자료: [입력]\n현재 겪는 상황: 아직 비용이 나온 적이 없을 때\n이미 한 행동과 나온 결과: [입력]\n\n현재 무료 범위와 초과 시 과금 조건을 공식 자료에서 확인해 줘. 무료라는 이유만으로 위험 없음으로 처리하지 마.\n먼저 관련 코드·화면·설정에서 현재 상태를 확인하고 이 상황이 생긴 이유를 근거와 함께 설명해 줘. 현재 환경에서 확인할 수 없는 것은 따로 표시해 줘.\n이 활동에서 유지할 조건:\n1. 사용하지 않는 호출과 중복 재시도부터 줄이는 방안을 제시해 줘.\n2. 대기 설정을 낮출 때 첫 응답 지연이나 기능 중단 영향이 있는지 설명하고 내 선택을 기다려 줘.\n3. 예산 알림과 강제 사용 중단을 구분해 줘. 알림이 있다고 요금이 자동 차단된다고 쓰지 마.\n\n진행 순서를 “지금 확인할 것 → 선택 가능한 방법 → 내가 승인할 변경 → 실행 후 다시 확인할 결과”로 정리해 줘. 앱에 필요 없는 기능을 추가하거나 검사를 끄는 방식으로 해결하지 마.\n재시험에서는 다음 조건을 포함해 줘:\n1. 승인한 변경이 실제 대상 프로젝트에 적용됐는지 값과 시각을 확인해 줘.\n2. 학생이 사용하는 기능이 계속 동작하는지 소수의 가상 요청으로 시험해 줘.\n수정이 필요하면 먼저 범위를 제안하고 내 확인 전 운영 설정을 바꾸지 마. 실제 학생 정보·비밀키·인증 토큰은 출력하지 말고 필요한 값은 가려 줘. 내 앱 또는 허락받은 시험 환경만 대상으로 해 줘.","next":"이 상황에 맞는 방법을 선택한 뒤 기본 진행의 구현 또는 재시험 단계로 돌아갑니다. 해당 없음이면 이유를 기록하고 다른 활동을 고릅니다."},{"id":"a9-branch2","category":"상황별 진행","title":"이미 예상보다 큰 청구가 발생했을 때","when":"기본 순서로 진행하다가 이 상황에 해당하면 사용합니다.","text":"활동: 사용량과 대기 서버 비용 점검\n앱 이름과 프로젝트: [입력]\n이번 시험 주소: [입력]\n준비 정보: 서비스와 요금제, 사용량 화면, 비밀정보를 가린 청구 내역\n현재 상황: [입력]\n사용할 가상 자료: [입력]\n현재 겪는 상황: 이미 예상보다 큰 청구가 발생했을 때\n이미 한 행동과 나온 결과: [입력]\n\n기간과 서비스별 청구 근거를 정리하고 비정상 사용 여부를 확인할 순서를 제시해 줘. 환불이나 감면을 보장하지 말고 문의용 사실관계 초안만 작성해 줘.\n먼저 관련 코드·화면·설정에서 현재 상태를 확인하고 이 상황이 생긴 이유를 근거와 함께 설명해 줘. 현재 환경에서 확인할 수 없는 것은 따로 표시해 줘.\n이 활동에서 유지할 조건:\n1. 사용하지 않는 호출과 중복 재시도부터 줄이는 방안을 제시해 줘.\n2. 대기 설정을 낮출 때 첫 응답 지연이나 기능 중단 영향이 있는지 설명하고 내 선택을 기다려 줘.\n3. 예산 알림과 강제 사용 중단을 구분해 줘. 알림이 있다고 요금이 자동 차단된다고 쓰지 마.\n\n진행 순서를 “지금 확인할 것 → 선택 가능한 방법 → 내가 승인할 변경 → 실행 후 다시 확인할 결과”로 정리해 줘. 앱에 필요 없는 기능을 추가하거나 검사를 끄는 방식으로 해결하지 마.\n재시험에서는 다음 조건을 포함해 줘:\n1. 승인한 변경이 실제 대상 프로젝트에 적용됐는지 값과 시각을 확인해 줘.\n2. 학생이 사용하는 기능이 계속 동작하는지 소수의 가상 요청으로 시험해 줘.\n수정이 필요하면 먼저 범위를 제안하고 내 확인 전 운영 설정을 바꾸지 마. 실제 학생 정보·비밀키·인증 토큰은 출력하지 말고 필요한 값은 가려 줘. 내 앱 또는 허락받은 시험 환경만 대상으로 해 줘.","next":"이 상황에 맞는 방법을 선택한 뒤 기본 진행의 구현 또는 재시험 단계로 돌아갑니다. 해당 없음이면 이유를 기록하고 다른 활동을 고릅니다."},{"id":"a9-locate","category":"확인 위치 도움","title":"안내된 화면이나 요청을 찾지 못할 때","when":"F12에 설명한 파일·요청이 없거나 확인할 곳을 모르겠을 때 보냅니다.","text":"활동: 사용량과 대기 서버 비용 점검\n앱 이름과 프로젝트: [입력]\n이번 시험 주소: [입력]\n준비 정보: 서비스와 요금제, 사용량 화면, 비밀정보를 가린 청구 내역\n현재 상황: [입력]\n사용할 가상 자료: [입력]\n내가 보고 있는 주소와 창: [입력]\n누른 버튼 또는 실행한 동작: [입력]\n열어 둔 개발자 도구 탭과 필터: [입력 또는 모름]\n찾으려는 정보: [입력]\n현재 화면 또는 가린 오류 내용: [붙이기]\n\n참고 안내: 제공사의 Billing·Usage·배포 설정과 AI 사용량 화면에서 확인합니다. F12는 반복 요청을 찾는 데 도움이 되지만 서버 대기 요금과 전체 청구액을 보여 주지는 않습니다.\n이 안내가 체험 앱의 가상 자료인지 내 앱의 실제 동작인지 먼저 구분해 줘. 프로젝트에서 이 동작이 어떤 요청·파일·저장소로 연결되는지 찾아 줘.\nNetwork라면 동작 전에 열기, 기록 켜기, 목록 지우기, 필터 확인, 같은 동작 다시 하기, 새 요청 선택, Headers·Payload·Response 중 볼 위치를 실제 이름으로 알려 줘. 정적 파일이면 All 필터도 확인해 줘. 새 창을 열었다면 그 창에서 F12를 열어야 하는지 설명해 줘.\n브라우저 검사에서 막아 요청이 없거나 아직 동작을 실행하지 않은 경우도 구분해 줘. 서버에만 있는 정보는 F12에서 찾으라고 하지 말고 코드·관리 화면·시험 환경에서 확인할 방법을 제시해 줘.\n확인할 자료가 실제로 없으면 없다고 말하고 필요한 시험 준비를 설명해 줘. 캡처 요청에는 가려야 할 정보도 알려 줘. 실제 학생 정보·비밀키·인증 토큰은 출력하지 말고 필요한 값은 가려 줘. 내 앱 또는 허락받은 시험 환경만 대상으로 해 줘.","next":"정확한 위치를 찾은 뒤 해당 활동의 4번 프롬프트로 결과를 확인합니다. 없다는 사실 자체가 기대 결과인지 먼저 판단합니다."},{"id":"a9-error","category":"오류 해결","title":"예상과 다른 결과가 나올 때","when":"실행 오류, 정상 기능 실패, 예상한 차단이 되지 않는 경우에 보냅니다.","text":"활동: 사용량과 대기 서버 비용 점검\n앱 이름과 프로젝트: [입력]\n이번 시험 주소: [입력]\n준비 정보: 서비스와 요금제, 사용량 화면, 비밀정보를 가린 청구 내역\n현재 상황: [입력]\n사용할 가상 자료: [입력]\n실행한 단계와 입력: [입력]\n기대한 결과: [입력]\n실제로 나온 결과: [입력]\n오류 문구: [비밀값을 가리고 붙이기]\n직전에 변경한 파일 또는 설정: [입력 또는 모름]\n\n원인을 추측해서 여러 곳을 한꺼번에 바꾸지 말고, 재현 조건과 현재 코드를 비교해 줘. 요청이 만들어지는지, 서버에 도착하는지, 검사와 반환·저장이 어디서 달라지는지 관련 단계만 확인해 줘.\n특히 다음 점검 기준을 다시 봐 줘:\n1. 코드와 배포 설정에서 과금 가능한 서비스, 자동 호출, 예약 작업, 실시간 구독을 찾아 줘.\n2. 사용 요청 비용과 최소 인스턴스·항상 실행 설정 같은 대기 비용을 구분해 줘.\n\n가능한 원인마다 그렇게 판단한 이유와 먼저 확인할 방법을 알려 줘. 운영 자료를 삭제하거나 권한·입력 검사를 전체 해제하는 방식은 사용하지 마. 수정이 필요하면 바꿀 내용을 먼저 제안하고 내가 승인한 뒤 적용해 줘.\n수정 후 같은 실패 조건과 다음 정상 조건을 모두 재시험해 줘:\n1. 승인한 변경이 실제 대상 프로젝트에 적용됐는지 값과 시각을 확인해 줘.\n2. 학생이 사용하는 기능이 계속 동작하는지 소수의 가상 요청으로 시험해 줘.\n3. 청구 반영 지연을 고려해 나중에 확인할 사용량 항목과 비교 기간을 적어 줘.\n4. 실제 사용량을 확인하기 전에는 절감 금액을 예상치로 표시하고, 계산에 사용한 요금과 요청 횟수 등의 조건을 적어 줘.\n완료 보고에는 실제 실행한 결과와 실행하지 못한 이유를 구분해 줘.","next":"실패 원인을 확인하고 승인한 수정만 적용합니다. 같은 실패 조건이 해결됐는지와 원래 정상 기능이 유지되는지 함께 봅니다."},{"id":"a9-finish","category":"활동 마무리","title":"확인 기록과 다음 점검 정리하기","when":"직접 시험을 확인한 뒤, 또는 해당 없음·추가 확인으로 종료할 때 보냅니다.","text":"활동: 사용량과 대기 서버 비용 점검\n앱 이름과 프로젝트: [입력]\n이번 시험 주소: [입력]\n준비 정보: 서비스와 요금제, 사용량 화면, 비밀정보를 가린 청구 내역\n현재 상황: [입력]\n사용할 가상 자료: [입력]\n실제로 진행한 단계: [입력]\n확인한 결과 또는 아직 확인하지 못한 내용: [입력]\n\n이번 활동 기록을 Markdown으로 정리해 줘. 항목은 앱과 시험 버전, 점검한 기능, 발견한 문제와 위치, 승인한 수정, 시험 입력과 기대 결과, 실제 결과와 근거, 추가 확인할 일로 구성해 줘.\n앞으로 개발할 때 지킬 기준도 우리 앱의 실제 코드·설정 위치와 연결해 적어 줘:\n1. 사용하지 않는 호출과 중복 재시도부터 줄이는 방안을 제시해 줘.\n2. 대기 설정을 낮출 때 첫 응답 지연이나 기능 중단 영향이 있는지 설명하고 내 선택을 기다려 줘.\n3. 예산 알림과 강제 사용 중단을 구분해 줘. 알림이 있다고 요금이 자동 차단된다고 쓰지 마.\n4. 변경할 설정·예상 효과·되돌리는 방법을 보여 주고 결제·요금제·운영 서비스를 자동으로 바꾸지 마.\n\n활동 상태는 확인 완료·추가 확인·해당 없음 중 근거에 맞게 적어 줘. 구현만 하고 시험하지 않았다면 확인 완료로 쓰지 마. 문제를 발견하지 못한 것과 충분히 검증한 것을 구분해 줘.\n다음 수정 때 다시 실행할 시험은 다음 내용을 바탕으로 정리해 줘:\n1. 승인한 변경이 실제 대상 프로젝트에 적용됐는지 값과 시각을 확인해 줘.\n2. 학생이 사용하는 기능이 계속 동작하는지 소수의 가상 요청으로 시험해 줘.\n보고서에 원문 학생 자료나 비밀값을 넣지 마. 이 기록만으로 학교 승인이나 앱 전체의 안전을 보장한다고 쓰지 마.","next":"기록을 자신의 프로젝트에 보관하고 필요한 다음 활동을 선택합니다. 새로운 대화를 시작할 때는 이 기록과 공통 시작 프롬프트를 함께 제공합니다."}]},{"id":10,"title":"입력 필터링과 재입력 안내 만들기","group":"추가 보안 점검","slides":"21~23","condition":"학생이나 사용자의 글을 입력받는 경우","inputs":"검사할 입력창, 금지할 정보 유형, 허용 예시, 학교의 대응 기준","inspect":["입력창별로 검사 위치와 전송 경로를 찾아 줘. 브라우저 검사와 서버 검사를 구분해 줘.","명백한 개인정보, 금칙어, 길이 제한, 문맥 판단이 필요한 표현을 나눠 현재 처리 방식을 확인해 줘.","입력 차단 때 작성한 글이 지워지는지, 이유와 고치는 방법을 알려 주는지 확인해 줘.","교과 학습이나 인용 문장이 잘못 차단될 수 있는 경우와 우회 입력을 함께 제시해 줘."],"requirements":["브라우저에서는 전화번호처럼 형식으로 확인할 수 있는 개인정보와 입력 형식을 먼저 검사해 줘. 작성한 글은 유지하고 고칠 부분을 안내해 줘.","서버는 브라우저 검사를 건너뛴 요청도 다시 검사하고 통과한 최소 정보만 다음 단계로 보내게 해 줘.","문맥 검사에 외부 서비스를 쓰려면 승인된 서비스와 개인정보 처리 조건을 먼저 확인받아 줘. 승인되지 않은 서비스로 위험 입력을 보내지 마.","경미·불확실 신호와 위기 신호의 대응을 구분하고, 단순 감지 횟수로 자동 처벌하지 마."],"tests":["준비한 연락처 표식, 정상 문장, 길이 초과 문장, 학습 목적 인용문으로 각각 시험해 줘.","브라우저 검사만 건너뛴 요청도 서버에서 거절되는지 가상 환경에서 확인해 줘.","차단된 글은 수정할 수 있고 허용 문장은 정상 전달되는지 확인해 줘.","검사 서비스 장애 시 정책에 맞게 외부 전송을 멈추는지 확인하고, 검사 불가를 안전함으로 표시하지 마."],"location":"#/input에서 첫 브라우저 차단 단계에는 Network 요청이 생기지 않습니다. 직접 보내기 단계부터 F12 → Network → Fetch/XHR → lab?action=input → Payload와 Response를 확인합니다. forwarded와 externalRequests를 비교하며, 이 연습은 외부 AI를 실제 호출하지 않습니다.","links":["https://webapp-security-lab.vercel.app/#/input","https://cheatsheetseries.owasp.org/cheatsheets/Input_Validation_Cheat_Sheet.html"],"branches":[["필터 기능이 전혀 없을 때","최소 길이·명백한 개인정보·재입력 안내부터 추가할 계획을 세워 줘. 문맥을 완벽하게 판별한다고 약속하지 말고 기존 입력 기능을 유지해 줘."],["정상 문장이 계속 차단될 때","비식별 예시 문장별 감지 규칙과 이유를 정리해 줘. 규칙 수정, 교사 확인, 예외 처리 중 적절한 방법을 비교하고 전체 검사를 꺼 버리지 마."],["외부 유해성 분류 서비스를 사용할 수 없을 때","로컬에서 확인 가능한 범위와 사람 확인이 필요한 범위를 명시해 줘. 확인하지 못한 문맥까지 통과 판정하지 말고 승인된 대체 안내를 제안해 줘."]],"prompts":[{"id":"a10-inspect","category":"기본 진행","title":"1 현재 상태부터 확인하기","when":"프로젝트를 연 뒤 처음 보냅니다. 파일을 고치기 전 단계입니다.","text":"활동: 입력 필터링과 재입력 안내 만들기\n앱 이름과 프로젝트: [입력]\n이번 시험 주소: [입력]\n준비 정보: 검사할 입력창, 금지할 정보 유형, 허용 예시, 학교의 대응 기준\n현재 상황: [입력]\n사용할 가상 자료: [입력]\n\n이 활동에 해당하는지부터 확인해 줘. 아직 파일이나 설정은 수정하지 마.\n1. 입력창별로 검사 위치와 전송 경로를 찾아 줘. 브라우저 검사와 서버 검사를 구분해 줘.\n2. 명백한 개인정보, 금칙어, 길이 제한, 문맥 판단이 필요한 표현을 나눠 현재 처리 방식을 확인해 줘.\n3. 입력 차단 때 작성한 글이 지워지는지, 이유와 고치는 방법을 알려 주는지 확인해 줘.\n4. 교과 학습이나 인용 문장이 잘못 차단될 수 있는 경우와 우회 입력을 함께 제시해 줘.\n\n결과는 표로 정리해 줘. 표에는 확인 항목, 현재 동작, 근거가 있는 파일이나 설정 위치, 발견한 문제와 추가로 확인할 내용을 적어 줘. 코드에서 확인한 사실과 추정은 구분해 줘. 내가 직접 확인할 메뉴·버튼·파일 이름도 알려 줘. 파일을 읽지 못했다면 그 사실을 표시해 줘.\n실제 학생 정보·비밀키·인증 토큰은 출력하지 말고 필요한 값은 가려 줘. 내 앱 또는 허락받은 시험 환경만 대상으로 해 줘.\n참고할 확인 위치: #/input에서 첫 브라우저 차단 단계에는 Network 요청이 생기지 않습니다. 직접 보내기 단계부터 F12 → Network → Fetch/XHR → lab?action=input → Payload와 Response를 확인합니다. forwarded와 externalRequests를 비교하며, 이 연습은 외부 AI를 실제 호출하지 않습니다.","next":"현재 구조와 해당 여부를 확인합니다. 모르는 정보는 먼저 확인하고, 수정이 필요하면 2번으로 진행합니다."},{"id":"a10-plan","category":"기본 진행","title":"2 수정 방법과 범위 정하기","when":"1번 답변에서 실제로 고칠 항목을 골랐을 때 보냅니다.","text":"활동: 입력 필터링과 재입력 안내 만들기\n앱 이름과 프로젝트: [입력]\n이번 시험 주소: [입력]\n준비 정보: 검사할 입력창, 금지할 정보 유형, 허용 예시, 학교의 대응 기준\n현재 상황: [입력]\n사용할 가상 자료: [입력]\n앞에서 확인한 문제와 근거: [1번 결과 중 해당 부분을 붙이기]\n이번에 고칠 항목: [입력]\n\n구현 전에 다음 조건으로 수정 계획을 만들어 줘.\n1. 브라우저에서는 전화번호처럼 형식으로 확인할 수 있는 개인정보와 입력 형식을 먼저 검사해 줘. 작성한 글은 유지하고 고칠 부분을 안내해 줘.\n2. 서버는 브라우저 검사를 건너뛴 요청도 다시 검사하고 통과한 최소 정보만 다음 단계로 보내게 해 줘.\n3. 문맥 검사에 외부 서비스를 쓰려면 승인된 서비스와 개인정보 처리 조건을 먼저 확인받아 줘. 승인되지 않은 서비스로 위험 입력을 보내지 마.\n4. 경미·불확실 신호와 위기 신호의 대응을 구분하고, 단순 감지 횟수로 자동 처벌하지 마.\n\n기존 기능을 유지하면서 문제를 고칠 방법부터 제안해 줘. 방법이 여러 가지라면 필요한 서비스와 비용, 사용 방법이 달라지는 부분, 이전 상태로 되돌릴 방법을 비교해 줘. 반드시 고쳐야 할 부분과 선택해서 개선할 부분을 구분해 줘.\n변경할 파일, 학생 또는 교사 화면에서 달라질 부분, 필요한 관리 설정, 시험할 가상 입력을 순서대로 적어 줘. 서버가 없는 앱이라면 지금 할 수 있는 것과 서버가 필요한 것을 분리해 줘.\n아직 코드를 수정하거나 서비스를 만들지 마. 내가 결정해야 할 사항이 있으면 선택지와 차이를 설명하고 물어봐 줘.","next":"수정할 내용과 비용, 정보 수집·전송·보관 방식이 달라지는지 확인한 뒤 진행할 방법을 정합니다. 학교가 판단해야 하는 내용은 먼저 확인합니다."},{"id":"a10-implement","category":"기본 진행","title":"3 선택한 범위 구현하기","when":"수정 계획을 검토한 뒤 승인할 범위를 직접 적고 보냅니다.","text":"활동: 입력 필터링과 재입력 안내 만들기\n앱 이름과 프로젝트: [입력]\n이번 시험 주소: [입력]\n준비 정보: 검사할 입력창, 금지할 정보 유형, 허용 예시, 학교의 대응 기준\n현재 상황: [입력]\n사용할 가상 자료: [입력]\n승인한 수정안: [선택한 방법과 항목을 정확히 입력]\n수정할 파일 또는 기능 범위: [입력]\n이번에 제외할 것: [입력]\n\n위에 승인한 범위만 구현해 줘. 시작 전에 현재 변경 파일을 확인해 다른 작업을 보존해 줘.\n1. 브라우저에서는 전화번호처럼 형식으로 확인할 수 있는 개인정보와 입력 형식을 먼저 검사해 줘. 작성한 글은 유지하고 고칠 부분을 안내해 줘.\n2. 서버는 브라우저 검사를 건너뛴 요청도 다시 검사하고 통과한 최소 정보만 다음 단계로 보내게 해 줘.\n3. 문맥 검사에 외부 서비스를 쓰려면 승인된 서비스와 개인정보 처리 조건을 먼저 확인받아 줘. 승인되지 않은 서비스로 위험 입력을 보내지 마.\n4. 경미·불확실 신호와 위기 신호의 대응을 구분하고, 단순 감지 횟수로 자동 처벌하지 마.\n\n한 부분씩 수정하고 실행 결과를 확인해 줘. 기존 디자인과 정상 기능은 유지해 줘. 새 서비스 생성·운영 자료 삭제·유료 호출·커밋·푸시·배포는 이 요청에 구체적으로 승인한 경우에만 실행해 줘. 요청하지 않은 변경이 필요하면 진행 전에 이유를 설명해 줘.\n수정 후 바꾼 파일과 이유, 실행한 검사, 아직 하지 못한 시험, 내가 누를 버튼 순서를 적어 줘. 실제 학생 정보·비밀키·인증 토큰은 출력하지 말고 필요한 값은 가려 줘. 내 앱 또는 허락받은 시험 환경만 대상으로 해 줘.","next":"빌드나 실행 오류가 없는지 확인한 뒤 4번으로 진행합니다. 허용해야 할 동작은 정상적으로 되고, 차단해야 할 동작은 막히는지 함께 시험합니다."},{"id":"a10-verify","category":"기본 진행","title":"4 수정 결과 직접 확인하기","when":"구현이 끝났거나 기존 기능이 안전하게 동작하는지 검증할 때 보냅니다.","text":"활동: 입력 필터링과 재입력 안내 만들기\n앱 이름과 프로젝트: [입력]\n이번 시험 주소: [입력]\n준비 정보: 검사할 입력창, 금지할 정보 유형, 허용 예시, 학교의 대응 기준\n현재 상황: [입력]\n사용할 가상 자료: [입력]\n이번 수정 내용: [입력 또는 기존 기능 검증]\n시험할 버전과 주소: [입력]\n\n다음 조건을 가상 자료로 다시 시험해 줘.\n1. 준비한 연락처 표식, 정상 문장, 길이 초과 문장, 학습 목적 인용문으로 각각 시험해 줘.\n2. 브라우저 검사만 건너뛴 요청도 서버에서 거절되는지 가상 환경에서 확인해 줘.\n3. 차단된 글은 수정할 수 있고 허용 문장은 정상 전달되는지 확인해 줘.\n4. 검사 서비스 장애 시 정책에 맞게 외부 전송을 멈추는지 확인하고, 검사 불가를 안전함으로 표시하지 마.\n\n내가 직접 따라 할 수 있도록 준비 계정과 상태 → 클릭 또는 입력 → 확인할 실제 탭·요청·필드 → 기대 결과를 항목마다 적어 줘.\n확인할 위치: #/input에서 첫 브라우저 차단 단계에는 Network 요청이 생기지 않습니다. 직접 보내기 단계부터 F12 → Network → Fetch/XHR → lab?action=input → Payload와 Response를 확인합니다. forwarded와 externalRequests를 비교하며, 이 연습은 외부 AI를 실제 호출하지 않습니다.\n자기 앱에서 이름이 다르면 코드와 실제 요청에서 맞는 이름을 찾아 줘. 실제로 존재하는지 확인하지 않은 요청명을 만들어 내지 마.\n허용해야 할 동작과 차단해야 할 동작을 함께 시험해 줘. 항목마다 실행 여부, 실제 결과, 확인한 화면이나 기록을 적고, 시험하지 못했다면 이유를 설명해 줘. 응답 코드와 실제로 받은 자료를 함께 확인하고, 저장 기능이 있다면 저장된 결과도 확인해 줘.\n이 활동을 완료해도 앱 전체의 안전이 보장된다고 표현하지 마. 실제 학생 정보·비밀키·인증 토큰은 출력하지 말고 필요한 값은 가려 줘. 내 앱 또는 허락받은 시험 환경만 대상으로 해 줘.","next":"기대 결과와 실제 결과가 같으면 활동 기록을 정리합니다. 다르면 “오류 해결” 프롬프트를 사용하고 같은 조건으로 재시험합니다."},{"id":"a10-branch1","category":"상황별 진행","title":"필터 기능이 전혀 없을 때","when":"기본 순서로 진행하다가 이 상황에 해당하면 사용합니다.","text":"활동: 입력 필터링과 재입력 안내 만들기\n앱 이름과 프로젝트: [입력]\n이번 시험 주소: [입력]\n준비 정보: 검사할 입력창, 금지할 정보 유형, 허용 예시, 학교의 대응 기준\n현재 상황: [입력]\n사용할 가상 자료: [입력]\n현재 겪는 상황: 필터 기능이 전혀 없을 때\n이미 한 행동과 나온 결과: [입력]\n\n최소 길이·명백한 개인정보·재입력 안내부터 추가할 계획을 세워 줘. 문맥을 완벽하게 판별한다고 약속하지 말고 기존 입력 기능을 유지해 줘.\n먼저 관련 코드·화면·설정에서 현재 상태를 확인하고 이 상황이 생긴 이유를 근거와 함께 설명해 줘. 현재 환경에서 확인할 수 없는 것은 따로 표시해 줘.\n이 활동에서 유지할 조건:\n1. 브라우저에서는 전화번호처럼 형식으로 확인할 수 있는 개인정보와 입력 형식을 먼저 검사해 줘. 작성한 글은 유지하고 고칠 부분을 안내해 줘.\n2. 서버는 브라우저 검사를 건너뛴 요청도 다시 검사하고 통과한 최소 정보만 다음 단계로 보내게 해 줘.\n3. 문맥 검사에 외부 서비스를 쓰려면 승인된 서비스와 개인정보 처리 조건을 먼저 확인받아 줘. 승인되지 않은 서비스로 위험 입력을 보내지 마.\n\n진행 순서를 “지금 확인할 것 → 선택 가능한 방법 → 내가 승인할 변경 → 실행 후 다시 확인할 결과”로 정리해 줘. 앱에 필요 없는 기능을 추가하거나 검사를 끄는 방식으로 해결하지 마.\n재시험에서는 다음 조건을 포함해 줘:\n1. 준비한 연락처 표식, 정상 문장, 길이 초과 문장, 학습 목적 인용문으로 각각 시험해 줘.\n2. 브라우저 검사만 건너뛴 요청도 서버에서 거절되는지 가상 환경에서 확인해 줘.\n수정이 필요하면 먼저 범위를 제안하고 내 확인 전 운영 설정을 바꾸지 마. 실제 학생 정보·비밀키·인증 토큰은 출력하지 말고 필요한 값은 가려 줘. 내 앱 또는 허락받은 시험 환경만 대상으로 해 줘.","next":"이 상황에 맞는 방법을 선택한 뒤 기본 진행의 구현 또는 재시험 단계로 돌아갑니다. 해당 없음이면 이유를 기록하고 다른 활동을 고릅니다."},{"id":"a10-branch2","category":"상황별 진행","title":"정상 문장이 계속 차단될 때","when":"기본 순서로 진행하다가 이 상황에 해당하면 사용합니다.","text":"활동: 입력 필터링과 재입력 안내 만들기\n앱 이름과 프로젝트: [입력]\n이번 시험 주소: [입력]\n준비 정보: 검사할 입력창, 금지할 정보 유형, 허용 예시, 학교의 대응 기준\n현재 상황: [입력]\n사용할 가상 자료: [입력]\n현재 겪는 상황: 정상 문장이 계속 차단될 때\n이미 한 행동과 나온 결과: [입력]\n\n비식별 예시 문장별 감지 규칙과 이유를 정리해 줘. 규칙 수정, 교사 확인, 예외 처리 중 적절한 방법을 비교하고 전체 검사를 꺼 버리지 마.\n먼저 관련 코드·화면·설정에서 현재 상태를 확인하고 이 상황이 생긴 이유를 근거와 함께 설명해 줘. 현재 환경에서 확인할 수 없는 것은 따로 표시해 줘.\n이 활동에서 유지할 조건:\n1. 브라우저에서는 전화번호처럼 형식으로 확인할 수 있는 개인정보와 입력 형식을 먼저 검사해 줘. 작성한 글은 유지하고 고칠 부분을 안내해 줘.\n2. 서버는 브라우저 검사를 건너뛴 요청도 다시 검사하고 통과한 최소 정보만 다음 단계로 보내게 해 줘.\n3. 문맥 검사에 외부 서비스를 쓰려면 승인된 서비스와 개인정보 처리 조건을 먼저 확인받아 줘. 승인되지 않은 서비스로 위험 입력을 보내지 마.\n\n진행 순서를 “지금 확인할 것 → 선택 가능한 방법 → 내가 승인할 변경 → 실행 후 다시 확인할 결과”로 정리해 줘. 앱에 필요 없는 기능을 추가하거나 검사를 끄는 방식으로 해결하지 마.\n재시험에서는 다음 조건을 포함해 줘:\n1. 준비한 연락처 표식, 정상 문장, 길이 초과 문장, 학습 목적 인용문으로 각각 시험해 줘.\n2. 브라우저 검사만 건너뛴 요청도 서버에서 거절되는지 가상 환경에서 확인해 줘.\n수정이 필요하면 먼저 범위를 제안하고 내 확인 전 운영 설정을 바꾸지 마. 실제 학생 정보·비밀키·인증 토큰은 출력하지 말고 필요한 값은 가려 줘. 내 앱 또는 허락받은 시험 환경만 대상으로 해 줘.","next":"이 상황에 맞는 방법을 선택한 뒤 기본 진행의 구현 또는 재시험 단계로 돌아갑니다. 해당 없음이면 이유를 기록하고 다른 활동을 고릅니다."},{"id":"a10-branch3","category":"상황별 진행","title":"외부 유해성 분류 서비스를 사용할 수 없을 때","when":"기본 순서로 진행하다가 이 상황에 해당하면 사용합니다.","text":"활동: 입력 필터링과 재입력 안내 만들기\n앱 이름과 프로젝트: [입력]\n이번 시험 주소: [입력]\n준비 정보: 검사할 입력창, 금지할 정보 유형, 허용 예시, 학교의 대응 기준\n현재 상황: [입력]\n사용할 가상 자료: [입력]\n현재 겪는 상황: 외부 유해성 분류 서비스를 사용할 수 없을 때\n이미 한 행동과 나온 결과: [입력]\n\n로컬에서 확인 가능한 범위와 사람 확인이 필요한 범위를 명시해 줘. 확인하지 못한 문맥까지 통과 판정하지 말고 승인된 대체 안내를 제안해 줘.\n먼저 관련 코드·화면·설정에서 현재 상태를 확인하고 이 상황이 생긴 이유를 근거와 함께 설명해 줘. 현재 환경에서 확인할 수 없는 것은 따로 표시해 줘.\n이 활동에서 유지할 조건:\n1. 브라우저에서는 전화번호처럼 형식으로 확인할 수 있는 개인정보와 입력 형식을 먼저 검사해 줘. 작성한 글은 유지하고 고칠 부분을 안내해 줘.\n2. 서버는 브라우저 검사를 건너뛴 요청도 다시 검사하고 통과한 최소 정보만 다음 단계로 보내게 해 줘.\n3. 문맥 검사에 외부 서비스를 쓰려면 승인된 서비스와 개인정보 처리 조건을 먼저 확인받아 줘. 승인되지 않은 서비스로 위험 입력을 보내지 마.\n\n진행 순서를 “지금 확인할 것 → 선택 가능한 방법 → 내가 승인할 변경 → 실행 후 다시 확인할 결과”로 정리해 줘. 앱에 필요 없는 기능을 추가하거나 검사를 끄는 방식으로 해결하지 마.\n재시험에서는 다음 조건을 포함해 줘:\n1. 준비한 연락처 표식, 정상 문장, 길이 초과 문장, 학습 목적 인용문으로 각각 시험해 줘.\n2. 브라우저 검사만 건너뛴 요청도 서버에서 거절되는지 가상 환경에서 확인해 줘.\n수정이 필요하면 먼저 범위를 제안하고 내 확인 전 운영 설정을 바꾸지 마. 실제 학생 정보·비밀키·인증 토큰은 출력하지 말고 필요한 값은 가려 줘. 내 앱 또는 허락받은 시험 환경만 대상으로 해 줘.","next":"이 상황에 맞는 방법을 선택한 뒤 기본 진행의 구현 또는 재시험 단계로 돌아갑니다. 해당 없음이면 이유를 기록하고 다른 활동을 고릅니다."},{"id":"a10-locate","category":"확인 위치 도움","title":"안내된 화면이나 요청을 찾지 못할 때","when":"F12에 설명한 파일·요청이 없거나 확인할 곳을 모르겠을 때 보냅니다.","text":"활동: 입력 필터링과 재입력 안내 만들기\n앱 이름과 프로젝트: [입력]\n이번 시험 주소: [입력]\n준비 정보: 검사할 입력창, 금지할 정보 유형, 허용 예시, 학교의 대응 기준\n현재 상황: [입력]\n사용할 가상 자료: [입력]\n내가 보고 있는 주소와 창: [입력]\n누른 버튼 또는 실행한 동작: [입력]\n열어 둔 개발자 도구 탭과 필터: [입력 또는 모름]\n찾으려는 정보: [입력]\n현재 화면 또는 가린 오류 내용: [붙이기]\n\n참고 안내: #/input에서 첫 브라우저 차단 단계에는 Network 요청이 생기지 않습니다. 직접 보내기 단계부터 F12 → Network → Fetch/XHR → lab?action=input → Payload와 Response를 확인합니다. forwarded와 externalRequests를 비교하며, 이 연습은 외부 AI를 실제 호출하지 않습니다.\n이 안내가 체험 앱의 가상 자료인지 내 앱의 실제 동작인지 먼저 구분해 줘. 프로젝트에서 이 동작이 어떤 요청·파일·저장소로 연결되는지 찾아 줘.\nNetwork라면 동작 전에 열기, 기록 켜기, 목록 지우기, 필터 확인, 같은 동작 다시 하기, 새 요청 선택, Headers·Payload·Response 중 볼 위치를 실제 이름으로 알려 줘. 정적 파일이면 All 필터도 확인해 줘. 새 창을 열었다면 그 창에서 F12를 열어야 하는지 설명해 줘.\n브라우저 검사에서 막아 요청이 없거나 아직 동작을 실행하지 않은 경우도 구분해 줘. 서버에만 있는 정보는 F12에서 찾으라고 하지 말고 코드·관리 화면·시험 환경에서 확인할 방법을 제시해 줘.\n확인할 자료가 실제로 없으면 없다고 말하고 필요한 시험 준비를 설명해 줘. 캡처 요청에는 가려야 할 정보도 알려 줘. 실제 학생 정보·비밀키·인증 토큰은 출력하지 말고 필요한 값은 가려 줘. 내 앱 또는 허락받은 시험 환경만 대상으로 해 줘.","next":"정확한 위치를 찾은 뒤 해당 활동의 4번 프롬프트로 결과를 확인합니다. 없다는 사실 자체가 기대 결과인지 먼저 판단합니다."},{"id":"a10-error","category":"오류 해결","title":"예상과 다른 결과가 나올 때","when":"실행 오류, 정상 기능 실패, 예상한 차단이 되지 않는 경우에 보냅니다.","text":"활동: 입력 필터링과 재입력 안내 만들기\n앱 이름과 프로젝트: [입력]\n이번 시험 주소: [입력]\n준비 정보: 검사할 입력창, 금지할 정보 유형, 허용 예시, 학교의 대응 기준\n현재 상황: [입력]\n사용할 가상 자료: [입력]\n실행한 단계와 입력: [입력]\n기대한 결과: [입력]\n실제로 나온 결과: [입력]\n오류 문구: [비밀값을 가리고 붙이기]\n직전에 변경한 파일 또는 설정: [입력 또는 모름]\n\n원인을 추측해서 여러 곳을 한꺼번에 바꾸지 말고, 재현 조건과 현재 코드를 비교해 줘. 요청이 만들어지는지, 서버에 도착하는지, 검사와 반환·저장이 어디서 달라지는지 관련 단계만 확인해 줘.\n특히 다음 점검 기준을 다시 봐 줘:\n1. 입력창별로 검사 위치와 전송 경로를 찾아 줘. 브라우저 검사와 서버 검사를 구분해 줘.\n2. 명백한 개인정보, 금칙어, 길이 제한, 문맥 판단이 필요한 표현을 나눠 현재 처리 방식을 확인해 줘.\n\n가능한 원인마다 그렇게 판단한 이유와 먼저 확인할 방법을 알려 줘. 운영 자료를 삭제하거나 권한·입력 검사를 전체 해제하는 방식은 사용하지 마. 수정이 필요하면 바꿀 내용을 먼저 제안하고 내가 승인한 뒤 적용해 줘.\n수정 후 같은 실패 조건과 다음 정상 조건을 모두 재시험해 줘:\n1. 준비한 연락처 표식, 정상 문장, 길이 초과 문장, 학습 목적 인용문으로 각각 시험해 줘.\n2. 브라우저 검사만 건너뛴 요청도 서버에서 거절되는지 가상 환경에서 확인해 줘.\n3. 차단된 글은 수정할 수 있고 허용 문장은 정상 전달되는지 확인해 줘.\n4. 검사 서비스 장애 시 정책에 맞게 외부 전송을 멈추는지 확인하고, 검사 불가를 안전함으로 표시하지 마.\n완료 보고에는 실제 실행한 결과와 실행하지 못한 이유를 구분해 줘.","next":"실패 원인을 확인하고 승인한 수정만 적용합니다. 같은 실패 조건이 해결됐는지와 원래 정상 기능이 유지되는지 함께 봅니다."},{"id":"a10-finish","category":"활동 마무리","title":"확인 기록과 다음 점검 정리하기","when":"직접 시험을 확인한 뒤, 또는 해당 없음·추가 확인으로 종료할 때 보냅니다.","text":"활동: 입력 필터링과 재입력 안내 만들기\n앱 이름과 프로젝트: [입력]\n이번 시험 주소: [입력]\n준비 정보: 검사할 입력창, 금지할 정보 유형, 허용 예시, 학교의 대응 기준\n현재 상황: [입력]\n사용할 가상 자료: [입력]\n실제로 진행한 단계: [입력]\n확인한 결과 또는 아직 확인하지 못한 내용: [입력]\n\n이번 활동 기록을 Markdown으로 정리해 줘. 항목은 앱과 시험 버전, 점검한 기능, 발견한 문제와 위치, 승인한 수정, 시험 입력과 기대 결과, 실제 결과와 근거, 추가 확인할 일로 구성해 줘.\n앞으로 개발할 때 지킬 기준도 우리 앱의 실제 코드·설정 위치와 연결해 적어 줘:\n1. 브라우저에서는 전화번호처럼 형식으로 확인할 수 있는 개인정보와 입력 형식을 먼저 검사해 줘. 작성한 글은 유지하고 고칠 부분을 안내해 줘.\n2. 서버는 브라우저 검사를 건너뛴 요청도 다시 검사하고 통과한 최소 정보만 다음 단계로 보내게 해 줘.\n3. 문맥 검사에 외부 서비스를 쓰려면 승인된 서비스와 개인정보 처리 조건을 먼저 확인받아 줘. 승인되지 않은 서비스로 위험 입력을 보내지 마.\n4. 경미·불확실 신호와 위기 신호의 대응을 구분하고, 단순 감지 횟수로 자동 처벌하지 마.\n\n활동 상태는 확인 완료·추가 확인·해당 없음 중 근거에 맞게 적어 줘. 구현만 하고 시험하지 않았다면 확인 완료로 쓰지 마. 문제를 발견하지 못한 것과 충분히 검증한 것을 구분해 줘.\n다음 수정 때 다시 실행할 시험은 다음 내용을 바탕으로 정리해 줘:\n1. 준비한 연락처 표식, 정상 문장, 길이 초과 문장, 학습 목적 인용문으로 각각 시험해 줘.\n2. 브라우저 검사만 건너뛴 요청도 서버에서 거절되는지 가상 환경에서 확인해 줘.\n보고서에 원문 학생 자료나 비밀값을 넣지 마. 이 기록만으로 학교 승인이나 앱 전체의 안전을 보장한다고 쓰지 마.","next":"기록을 자신의 프로젝트에 보관하고 필요한 다음 활동을 선택합니다. 새로운 대화를 시작할 때는 이 기록과 공통 시작 프롬프트를 함께 제공합니다."}]},{"id":11,"title":"입력한 글의 코드 실행 방지","group":"추가 보안 점검","slides":"추가 체험 XSS","condition":"게시글·댓글·AI 답변을 화면에 표시하는 경우","inputs":"출력 화면, 허용할 글 서식, 준비된 무해한 시험 문자열","inspect":["사용자 입력이나 AI 답변을 HTML로 직접 넣는 부분과 위험한 DOM 조작을 찾아 줘.","단순 텍스트, Markdown, 허용된 서식, 링크를 구분해 어떤 처리가 필요한지 설명해 줘.","HTML의 입력 검사와 출력 위치에 맞는 안전한 표시 처리를 구분해 줘.","저장된 글을 다른 사용자가 열었을 때도 같은 문제가 발생할 수 있는지 확인해 줘."],"requirements":["입력한 내용은 기본적으로 글자로 표시해 줘. 서식이 꼭 필요하다면 위험한 HTML을 제거하는 검증된 도구를 사용해 허용한 서식만 표시해 줘.","링크의 위험한 주소 형식과 HTML 속성 처리도 확인해 줘.","정상적인 학생 글과 AI 답변의 가독성을 유지하며 원시 HTML 허용 범위를 최소화해 줘.","정규식 하나로 모든 실행 위험이 해결된다고 설명하지 말고 라이브러리와 사용 위치를 명시해 줘."],"tests":["연습 앱이 제공하는 무해한 시험 문자열로 수정 전후를 비교해 줘.","직접 입력과 저장 후 재열람, 교사 화면에서 모두 코드가 실행되지 않는지 확인해 줘.","허용한 글 서식과 정상 링크는 계속 작동하는지 확인해 줘.","테스트는 허가된 로컬·연습 앱에 한정하고 실제 쿠키나 데이터를 읽는 문자열을 만들지 마."],"location":"#/xss에서 준비된 글을 표시하고 결과를 비교합니다. Elements는 만들어진 화면 구조를 보여 줍니다. 코드 실행 방지 여부는 화면 동작과 렌더링 코드로 확인하며 Network 응답만으로 결론 내리지 않습니다.","links":["https://webapp-security-lab.vercel.app/#/xss","https://cheatsheetseries.owasp.org/cheatsheets/Cross_Site_Scripting_Prevention_Cheat_Sheet.html"],"branches":[["서식 있는 글을 꼭 허용해야 할 때","허용할 HTML 태그와 속성의 용도를 설명하고 내가 선택하도록 목록을 보여 줘. 허용할 서식과 제거할 내용을 정한 뒤 각각의 예시로 시험해 줘."],["사용자 입력을 표시하지 않는 앱","외부 데이터와 AI 답변도 없는지 확인한 뒤 해당 없음을 기록해 줘. 체험을 위해 게시판을 새로 만들지 마."]],"prompts":[{"id":"a11-inspect","category":"기본 진행","title":"1 현재 상태부터 확인하기","when":"프로젝트를 연 뒤 처음 보냅니다. 파일을 고치기 전 단계입니다.","text":"활동: 입력한 글의 코드 실행 방지\n앱 이름과 프로젝트: [입력]\n이번 시험 주소: [입력]\n준비 정보: 출력 화면, 허용할 글 서식, 준비된 무해한 시험 문자열\n현재 상황: [입력]\n사용할 가상 자료: [입력]\n\n이 활동에 해당하는지부터 확인해 줘. 아직 파일이나 설정은 수정하지 마.\n1. 사용자 입력이나 AI 답변을 HTML로 직접 넣는 부분과 위험한 DOM 조작을 찾아 줘.\n2. 단순 텍스트, Markdown, 허용된 서식, 링크를 구분해 어떤 처리가 필요한지 설명해 줘.\n3. HTML의 입력 검사와 출력 위치에 맞는 안전한 표시 처리를 구분해 줘.\n4. 저장된 글을 다른 사용자가 열었을 때도 같은 문제가 발생할 수 있는지 확인해 줘.\n\n결과는 표로 정리해 줘. 표에는 확인 항목, 현재 동작, 근거가 있는 파일이나 설정 위치, 발견한 문제와 추가로 확인할 내용을 적어 줘. 코드에서 확인한 사실과 추정은 구분해 줘. 내가 직접 확인할 메뉴·버튼·파일 이름도 알려 줘. 파일을 읽지 못했다면 그 사실을 표시해 줘.\n실제 학생 정보·비밀키·인증 토큰은 출력하지 말고 필요한 값은 가려 줘. 내 앱 또는 허락받은 시험 환경만 대상으로 해 줘.\n참고할 확인 위치: #/xss에서 준비된 글을 표시하고 결과를 비교합니다. Elements는 만들어진 화면 구조를 보여 줍니다. 코드 실행 방지 여부는 화면 동작과 렌더링 코드로 확인하며 Network 응답만으로 결론 내리지 않습니다.","next":"현재 구조와 해당 여부를 확인합니다. 모르는 정보는 먼저 확인하고, 수정이 필요하면 2번으로 진행합니다."},{"id":"a11-plan","category":"기본 진행","title":"2 수정 방법과 범위 정하기","when":"1번 답변에서 실제로 고칠 항목을 골랐을 때 보냅니다.","text":"활동: 입력한 글의 코드 실행 방지\n앱 이름과 프로젝트: [입력]\n이번 시험 주소: [입력]\n준비 정보: 출력 화면, 허용할 글 서식, 준비된 무해한 시험 문자열\n현재 상황: [입력]\n사용할 가상 자료: [입력]\n앞에서 확인한 문제와 근거: [1번 결과 중 해당 부분을 붙이기]\n이번에 고칠 항목: [입력]\n\n구현 전에 다음 조건으로 수정 계획을 만들어 줘.\n1. 입력한 내용은 기본적으로 글자로 표시해 줘. 서식이 꼭 필요하다면 위험한 HTML을 제거하는 검증된 도구를 사용해 허용한 서식만 표시해 줘.\n2. 링크의 위험한 주소 형식과 HTML 속성 처리도 확인해 줘.\n3. 정상적인 학생 글과 AI 답변의 가독성을 유지하며 원시 HTML 허용 범위를 최소화해 줘.\n4. 정규식 하나로 모든 실행 위험이 해결된다고 설명하지 말고 라이브러리와 사용 위치를 명시해 줘.\n\n기존 기능을 유지하면서 문제를 고칠 방법부터 제안해 줘. 방법이 여러 가지라면 필요한 서비스와 비용, 사용 방법이 달라지는 부분, 이전 상태로 되돌릴 방법을 비교해 줘. 반드시 고쳐야 할 부분과 선택해서 개선할 부분을 구분해 줘.\n변경할 파일, 학생 또는 교사 화면에서 달라질 부분, 필요한 관리 설정, 시험할 가상 입력을 순서대로 적어 줘. 서버가 없는 앱이라면 지금 할 수 있는 것과 서버가 필요한 것을 분리해 줘.\n아직 코드를 수정하거나 서비스를 만들지 마. 내가 결정해야 할 사항이 있으면 선택지와 차이를 설명하고 물어봐 줘.","next":"수정할 내용과 비용, 정보 수집·전송·보관 방식이 달라지는지 확인한 뒤 진행할 방법을 정합니다. 학교가 판단해야 하는 내용은 먼저 확인합니다."},{"id":"a11-implement","category":"기본 진행","title":"3 선택한 범위 구현하기","when":"수정 계획을 검토한 뒤 승인할 범위를 직접 적고 보냅니다.","text":"활동: 입력한 글의 코드 실행 방지\n앱 이름과 프로젝트: [입력]\n이번 시험 주소: [입력]\n준비 정보: 출력 화면, 허용할 글 서식, 준비된 무해한 시험 문자열\n현재 상황: [입력]\n사용할 가상 자료: [입력]\n승인한 수정안: [선택한 방법과 항목을 정확히 입력]\n수정할 파일 또는 기능 범위: [입력]\n이번에 제외할 것: [입력]\n\n위에 승인한 범위만 구현해 줘. 시작 전에 현재 변경 파일을 확인해 다른 작업을 보존해 줘.\n1. 입력한 내용은 기본적으로 글자로 표시해 줘. 서식이 꼭 필요하다면 위험한 HTML을 제거하는 검증된 도구를 사용해 허용한 서식만 표시해 줘.\n2. 링크의 위험한 주소 형식과 HTML 속성 처리도 확인해 줘.\n3. 정상적인 학생 글과 AI 답변의 가독성을 유지하며 원시 HTML 허용 범위를 최소화해 줘.\n4. 정규식 하나로 모든 실행 위험이 해결된다고 설명하지 말고 라이브러리와 사용 위치를 명시해 줘.\n\n한 부분씩 수정하고 실행 결과를 확인해 줘. 기존 디자인과 정상 기능은 유지해 줘. 새 서비스 생성·운영 자료 삭제·유료 호출·커밋·푸시·배포는 이 요청에 구체적으로 승인한 경우에만 실행해 줘. 요청하지 않은 변경이 필요하면 진행 전에 이유를 설명해 줘.\n수정 후 바꾼 파일과 이유, 실행한 검사, 아직 하지 못한 시험, 내가 누를 버튼 순서를 적어 줘. 실제 학생 정보·비밀키·인증 토큰은 출력하지 말고 필요한 값은 가려 줘. 내 앱 또는 허락받은 시험 환경만 대상으로 해 줘.","next":"빌드나 실행 오류가 없는지 확인한 뒤 4번으로 진행합니다. 허용해야 할 동작은 정상적으로 되고, 차단해야 할 동작은 막히는지 함께 시험합니다."},{"id":"a11-verify","category":"기본 진행","title":"4 수정 결과 직접 확인하기","when":"구현이 끝났거나 기존 기능이 안전하게 동작하는지 검증할 때 보냅니다.","text":"활동: 입력한 글의 코드 실행 방지\n앱 이름과 프로젝트: [입력]\n이번 시험 주소: [입력]\n준비 정보: 출력 화면, 허용할 글 서식, 준비된 무해한 시험 문자열\n현재 상황: [입력]\n사용할 가상 자료: [입력]\n이번 수정 내용: [입력 또는 기존 기능 검증]\n시험할 버전과 주소: [입력]\n\n다음 조건을 가상 자료로 다시 시험해 줘.\n1. 연습 앱이 제공하는 무해한 시험 문자열로 수정 전후를 비교해 줘.\n2. 직접 입력과 저장 후 재열람, 교사 화면에서 모두 코드가 실행되지 않는지 확인해 줘.\n3. 허용한 글 서식과 정상 링크는 계속 작동하는지 확인해 줘.\n4. 테스트는 허가된 로컬·연습 앱에 한정하고 실제 쿠키나 데이터를 읽는 문자열을 만들지 마.\n\n내가 직접 따라 할 수 있도록 준비 계정과 상태 → 클릭 또는 입력 → 확인할 실제 탭·요청·필드 → 기대 결과를 항목마다 적어 줘.\n확인할 위치: #/xss에서 준비된 글을 표시하고 결과를 비교합니다. Elements는 만들어진 화면 구조를 보여 줍니다. 코드 실행 방지 여부는 화면 동작과 렌더링 코드로 확인하며 Network 응답만으로 결론 내리지 않습니다.\n자기 앱에서 이름이 다르면 코드와 실제 요청에서 맞는 이름을 찾아 줘. 실제로 존재하는지 확인하지 않은 요청명을 만들어 내지 마.\n허용해야 할 동작과 차단해야 할 동작을 함께 시험해 줘. 항목마다 실행 여부, 실제 결과, 확인한 화면이나 기록을 적고, 시험하지 못했다면 이유를 설명해 줘. 응답 코드와 실제로 받은 자료를 함께 확인하고, 저장 기능이 있다면 저장된 결과도 확인해 줘.\n이 활동을 완료해도 앱 전체의 안전이 보장된다고 표현하지 마. 실제 학생 정보·비밀키·인증 토큰은 출력하지 말고 필요한 값은 가려 줘. 내 앱 또는 허락받은 시험 환경만 대상으로 해 줘.","next":"기대 결과와 실제 결과가 같으면 활동 기록을 정리합니다. 다르면 “오류 해결” 프롬프트를 사용하고 같은 조건으로 재시험합니다."},{"id":"a11-branch1","category":"상황별 진행","title":"서식 있는 글을 꼭 허용해야 할 때","when":"기본 순서로 진행하다가 이 상황에 해당하면 사용합니다.","text":"활동: 입력한 글의 코드 실행 방지\n앱 이름과 프로젝트: [입력]\n이번 시험 주소: [입력]\n준비 정보: 출력 화면, 허용할 글 서식, 준비된 무해한 시험 문자열\n현재 상황: [입력]\n사용할 가상 자료: [입력]\n현재 겪는 상황: 서식 있는 글을 꼭 허용해야 할 때\n이미 한 행동과 나온 결과: [입력]\n\n허용할 HTML 태그와 속성의 용도를 설명하고 내가 선택하도록 목록을 보여 줘. 허용할 서식과 제거할 내용을 정한 뒤 각각의 예시로 시험해 줘.\n먼저 관련 코드·화면·설정에서 현재 상태를 확인하고 이 상황이 생긴 이유를 근거와 함께 설명해 줘. 현재 환경에서 확인할 수 없는 것은 따로 표시해 줘.\n이 활동에서 유지할 조건:\n1. 입력한 내용은 기본적으로 글자로 표시해 줘. 서식이 꼭 필요하다면 위험한 HTML을 제거하는 검증된 도구를 사용해 허용한 서식만 표시해 줘.\n2. 링크의 위험한 주소 형식과 HTML 속성 처리도 확인해 줘.\n3. 정상적인 학생 글과 AI 답변의 가독성을 유지하며 원시 HTML 허용 범위를 최소화해 줘.\n\n진행 순서를 “지금 확인할 것 → 선택 가능한 방법 → 내가 승인할 변경 → 실행 후 다시 확인할 결과”로 정리해 줘. 앱에 필요 없는 기능을 추가하거나 검사를 끄는 방식으로 해결하지 마.\n재시험에서는 다음 조건을 포함해 줘:\n1. 연습 앱이 제공하는 무해한 시험 문자열로 수정 전후를 비교해 줘.\n2. 직접 입력과 저장 후 재열람, 교사 화면에서 모두 코드가 실행되지 않는지 확인해 줘.\n수정이 필요하면 먼저 범위를 제안하고 내 확인 전 운영 설정을 바꾸지 마. 실제 학생 정보·비밀키·인증 토큰은 출력하지 말고 필요한 값은 가려 줘. 내 앱 또는 허락받은 시험 환경만 대상으로 해 줘.","next":"이 상황에 맞는 방법을 선택한 뒤 기본 진행의 구현 또는 재시험 단계로 돌아갑니다. 해당 없음이면 이유를 기록하고 다른 활동을 고릅니다."},{"id":"a11-branch2","category":"상황별 진행","title":"사용자 입력을 표시하지 않는 앱","when":"기본 순서로 진행하다가 이 상황에 해당하면 사용합니다.","text":"활동: 입력한 글의 코드 실행 방지\n앱 이름과 프로젝트: [입력]\n이번 시험 주소: [입력]\n준비 정보: 출력 화면, 허용할 글 서식, 준비된 무해한 시험 문자열\n현재 상황: [입력]\n사용할 가상 자료: [입력]\n현재 겪는 상황: 사용자 입력을 표시하지 않는 앱\n이미 한 행동과 나온 결과: [입력]\n\n외부 데이터와 AI 답변도 없는지 확인한 뒤 해당 없음을 기록해 줘. 체험을 위해 게시판을 새로 만들지 마.\n먼저 관련 코드·화면·설정에서 현재 상태를 확인하고 이 상황이 생긴 이유를 근거와 함께 설명해 줘. 현재 환경에서 확인할 수 없는 것은 따로 표시해 줘.\n이 활동에서 유지할 조건:\n1. 입력한 내용은 기본적으로 글자로 표시해 줘. 서식이 꼭 필요하다면 위험한 HTML을 제거하는 검증된 도구를 사용해 허용한 서식만 표시해 줘.\n2. 링크의 위험한 주소 형식과 HTML 속성 처리도 확인해 줘.\n3. 정상적인 학생 글과 AI 답변의 가독성을 유지하며 원시 HTML 허용 범위를 최소화해 줘.\n\n진행 순서를 “지금 확인할 것 → 선택 가능한 방법 → 내가 승인할 변경 → 실행 후 다시 확인할 결과”로 정리해 줘. 앱에 필요 없는 기능을 추가하거나 검사를 끄는 방식으로 해결하지 마.\n재시험에서는 다음 조건을 포함해 줘:\n1. 연습 앱이 제공하는 무해한 시험 문자열로 수정 전후를 비교해 줘.\n2. 직접 입력과 저장 후 재열람, 교사 화면에서 모두 코드가 실행되지 않는지 확인해 줘.\n수정이 필요하면 먼저 범위를 제안하고 내 확인 전 운영 설정을 바꾸지 마. 실제 학생 정보·비밀키·인증 토큰은 출력하지 말고 필요한 값은 가려 줘. 내 앱 또는 허락받은 시험 환경만 대상으로 해 줘.","next":"이 상황에 맞는 방법을 선택한 뒤 기본 진행의 구현 또는 재시험 단계로 돌아갑니다. 해당 없음이면 이유를 기록하고 다른 활동을 고릅니다."},{"id":"a11-locate","category":"확인 위치 도움","title":"안내된 화면이나 요청을 찾지 못할 때","when":"F12에 설명한 파일·요청이 없거나 확인할 곳을 모르겠을 때 보냅니다.","text":"활동: 입력한 글의 코드 실행 방지\n앱 이름과 프로젝트: [입력]\n이번 시험 주소: [입력]\n준비 정보: 출력 화면, 허용할 글 서식, 준비된 무해한 시험 문자열\n현재 상황: [입력]\n사용할 가상 자료: [입력]\n내가 보고 있는 주소와 창: [입력]\n누른 버튼 또는 실행한 동작: [입력]\n열어 둔 개발자 도구 탭과 필터: [입력 또는 모름]\n찾으려는 정보: [입력]\n현재 화면 또는 가린 오류 내용: [붙이기]\n\n참고 안내: #/xss에서 준비된 글을 표시하고 결과를 비교합니다. Elements는 만들어진 화면 구조를 보여 줍니다. 코드 실행 방지 여부는 화면 동작과 렌더링 코드로 확인하며 Network 응답만으로 결론 내리지 않습니다.\n이 안내가 체험 앱의 가상 자료인지 내 앱의 실제 동작인지 먼저 구분해 줘. 프로젝트에서 이 동작이 어떤 요청·파일·저장소로 연결되는지 찾아 줘.\nNetwork라면 동작 전에 열기, 기록 켜기, 목록 지우기, 필터 확인, 같은 동작 다시 하기, 새 요청 선택, Headers·Payload·Response 중 볼 위치를 실제 이름으로 알려 줘. 정적 파일이면 All 필터도 확인해 줘. 새 창을 열었다면 그 창에서 F12를 열어야 하는지 설명해 줘.\n브라우저 검사에서 막아 요청이 없거나 아직 동작을 실행하지 않은 경우도 구분해 줘. 서버에만 있는 정보는 F12에서 찾으라고 하지 말고 코드·관리 화면·시험 환경에서 확인할 방법을 제시해 줘.\n확인할 자료가 실제로 없으면 없다고 말하고 필요한 시험 준비를 설명해 줘. 캡처 요청에는 가려야 할 정보도 알려 줘. 실제 학생 정보·비밀키·인증 토큰은 출력하지 말고 필요한 값은 가려 줘. 내 앱 또는 허락받은 시험 환경만 대상으로 해 줘.","next":"정확한 위치를 찾은 뒤 해당 활동의 4번 프롬프트로 결과를 확인합니다. 없다는 사실 자체가 기대 결과인지 먼저 판단합니다."},{"id":"a11-error","category":"오류 해결","title":"예상과 다른 결과가 나올 때","when":"실행 오류, 정상 기능 실패, 예상한 차단이 되지 않는 경우에 보냅니다.","text":"활동: 입력한 글의 코드 실행 방지\n앱 이름과 프로젝트: [입력]\n이번 시험 주소: [입력]\n준비 정보: 출력 화면, 허용할 글 서식, 준비된 무해한 시험 문자열\n현재 상황: [입력]\n사용할 가상 자료: [입력]\n실행한 단계와 입력: [입력]\n기대한 결과: [입력]\n실제로 나온 결과: [입력]\n오류 문구: [비밀값을 가리고 붙이기]\n직전에 변경한 파일 또는 설정: [입력 또는 모름]\n\n원인을 추측해서 여러 곳을 한꺼번에 바꾸지 말고, 재현 조건과 현재 코드를 비교해 줘. 요청이 만들어지는지, 서버에 도착하는지, 검사와 반환·저장이 어디서 달라지는지 관련 단계만 확인해 줘.\n특히 다음 점검 기준을 다시 봐 줘:\n1. 사용자 입력이나 AI 답변을 HTML로 직접 넣는 부분과 위험한 DOM 조작을 찾아 줘.\n2. 단순 텍스트, Markdown, 허용된 서식, 링크를 구분해 어떤 처리가 필요한지 설명해 줘.\n\n가능한 원인마다 그렇게 판단한 이유와 먼저 확인할 방법을 알려 줘. 운영 자료를 삭제하거나 권한·입력 검사를 전체 해제하는 방식은 사용하지 마. 수정이 필요하면 바꿀 내용을 먼저 제안하고 내가 승인한 뒤 적용해 줘.\n수정 후 같은 실패 조건과 다음 정상 조건을 모두 재시험해 줘:\n1. 연습 앱이 제공하는 무해한 시험 문자열로 수정 전후를 비교해 줘.\n2. 직접 입력과 저장 후 재열람, 교사 화면에서 모두 코드가 실행되지 않는지 확인해 줘.\n3. 허용한 글 서식과 정상 링크는 계속 작동하는지 확인해 줘.\n4. 테스트는 허가된 로컬·연습 앱에 한정하고 실제 쿠키나 데이터를 읽는 문자열을 만들지 마.\n완료 보고에는 실제 실행한 결과와 실행하지 못한 이유를 구분해 줘.","next":"실패 원인을 확인하고 승인한 수정만 적용합니다. 같은 실패 조건이 해결됐는지와 원래 정상 기능이 유지되는지 함께 봅니다."},{"id":"a11-finish","category":"활동 마무리","title":"확인 기록과 다음 점검 정리하기","when":"직접 시험을 확인한 뒤, 또는 해당 없음·추가 확인으로 종료할 때 보냅니다.","text":"활동: 입력한 글의 코드 실행 방지\n앱 이름과 프로젝트: [입력]\n이번 시험 주소: [입력]\n준비 정보: 출력 화면, 허용할 글 서식, 준비된 무해한 시험 문자열\n현재 상황: [입력]\n사용할 가상 자료: [입력]\n실제로 진행한 단계: [입력]\n확인한 결과 또는 아직 확인하지 못한 내용: [입력]\n\n이번 활동 기록을 Markdown으로 정리해 줘. 항목은 앱과 시험 버전, 점검한 기능, 발견한 문제와 위치, 승인한 수정, 시험 입력과 기대 결과, 실제 결과와 근거, 추가 확인할 일로 구성해 줘.\n앞으로 개발할 때 지킬 기준도 우리 앱의 실제 코드·설정 위치와 연결해 적어 줘:\n1. 입력한 내용은 기본적으로 글자로 표시해 줘. 서식이 꼭 필요하다면 위험한 HTML을 제거하는 검증된 도구를 사용해 허용한 서식만 표시해 줘.\n2. 링크의 위험한 주소 형식과 HTML 속성 처리도 확인해 줘.\n3. 정상적인 학생 글과 AI 답변의 가독성을 유지하며 원시 HTML 허용 범위를 최소화해 줘.\n4. 정규식 하나로 모든 실행 위험이 해결된다고 설명하지 말고 라이브러리와 사용 위치를 명시해 줘.\n\n활동 상태는 확인 완료·추가 확인·해당 없음 중 근거에 맞게 적어 줘. 구현만 하고 시험하지 않았다면 확인 완료로 쓰지 마. 문제를 발견하지 못한 것과 충분히 검증한 것을 구분해 줘.\n다음 수정 때 다시 실행할 시험은 다음 내용을 바탕으로 정리해 줘:\n1. 연습 앱이 제공하는 무해한 시험 문자열로 수정 전후를 비교해 줘.\n2. 직접 입력과 저장 후 재열람, 교사 화면에서 모두 코드가 실행되지 않는지 확인해 줘.\n보고서에 원문 학생 자료나 비밀값을 넣지 마. 이 기록만으로 학교 승인이나 앱 전체의 안전을 보장한다고 쓰지 마.","next":"기록을 자신의 프로젝트에 보관하고 필요한 다음 활동을 선택합니다. 새로운 대화를 시작할 때는 이 기록과 공통 시작 프롬프트를 함께 제공합니다."}]},{"id":12,"title":"검색 입력과 데이터베이스 명령 분리","group":"추가 보안 점검","slides":"추가 체험 SQL 삽입","condition":"검색이나 데이터베이스 질의가 있는 경우","inputs":"검색 기능, 데이터베이스 종류, 가상 검색 자료","inspect":["검색 입력이 서버 질의에 연결되는 코드를 찾아 줘. 문자열 결합으로 SQL을 만드는 부분을 확인해 줘.","ORM이나 질의 도구를 사용하더라도 원시 SQL과 동적 정렬·열 이름 처리 경로를 별도로 확인해 줘.","검색 결과 접근 권한과 질의 안전성을 서로 다른 점검 항목으로 구분해 줘.","정적 예시 자료의 결과와 실제 데이터베이스 실행 결과를 혼동하지 않게 설명해 줘."],"requirements":["데이터 값은 매개변수로 전달하고 SQL 명령과 분리하도록 수정안을 제시해 줘.","매개변수로 처리할 수 없는 정렬 기준이나 필드 이름은 허용 목록에서 선택하게 해 줘.","데이터베이스 계정의 필요한 권한만 사용하고 오류에 질의나 자격 증명을 노출하지 마.","데이터베이스가 없다면 이 활동은 해당 없음으로 두고 새로 설치하지 마."],"tests":["일반 검색어, 따옴표가 들어간 이름, 빈 검색어로 정상 결과를 확인해 줘.","준비된 무해한 입력이 명령의 뜻을 바꾸지 않고 값으로 처리되는지 시험 환경에서 확인해 줘.","수정 후에도 학생별 조회 권한이 유지되는지 확인해 줘.","Network에서 본 결과와 서버 코드에서 확인한 매개변수 사용 근거를 나누어 보고해 줘."],"location":"#/sql에서 F12 → Network → Fetch/XHR → search-cases.json → Response를 봅니다. 연습은 준비된 검색 사례이며 실제 DB 질의를 실행하지 않습니다. 자기 앱은 서버의 질의 코드와 시험용 DB에서 확인합니다.","links":["https://webapp-security-lab.vercel.app/#/sql","https://cheatsheetseries.owasp.org/cheatsheets/SQL_Injection_Prevention_Cheat_Sheet.html"],"branches":[["NoSQL이나 외부 저장 API를 쓸 때","SQL 검사를 억지로 적용하지 말고 해당 저장 도구의 입력 조건·연산자 주입·접근 규칙을 공식 문서에 맞춰 점검해 줘."],["운영 데이터베이스만 있는 경우","운영 자료에 공격성 질의를 실행하지 마. 읽기 전용 코드 검토와 별도의 가상 시험 자료 준비 계획을 먼저 제시해 줘."]],"prompts":[{"id":"a12-inspect","category":"기본 진행","title":"1 현재 상태부터 확인하기","when":"프로젝트를 연 뒤 처음 보냅니다. 파일을 고치기 전 단계입니다.","text":"활동: 검색 입력과 데이터베이스 명령 분리\n앱 이름과 프로젝트: [입력]\n이번 시험 주소: [입력]\n준비 정보: 검색 기능, 데이터베이스 종류, 가상 검색 자료\n현재 상황: [입력]\n사용할 가상 자료: [입력]\n\n이 활동에 해당하는지부터 확인해 줘. 아직 파일이나 설정은 수정하지 마.\n1. 검색 입력이 서버 질의에 연결되는 코드를 찾아 줘. 문자열 결합으로 SQL을 만드는 부분을 확인해 줘.\n2. ORM이나 질의 도구를 사용하더라도 원시 SQL과 동적 정렬·열 이름 처리 경로를 별도로 확인해 줘.\n3. 검색 결과 접근 권한과 질의 안전성을 서로 다른 점검 항목으로 구분해 줘.\n4. 정적 예시 자료의 결과와 실제 데이터베이스 실행 결과를 혼동하지 않게 설명해 줘.\n\n결과는 표로 정리해 줘. 표에는 확인 항목, 현재 동작, 근거가 있는 파일이나 설정 위치, 발견한 문제와 추가로 확인할 내용을 적어 줘. 코드에서 확인한 사실과 추정은 구분해 줘. 내가 직접 확인할 메뉴·버튼·파일 이름도 알려 줘. 파일을 읽지 못했다면 그 사실을 표시해 줘.\n실제 학생 정보·비밀키·인증 토큰은 출력하지 말고 필요한 값은 가려 줘. 내 앱 또는 허락받은 시험 환경만 대상으로 해 줘.\n참고할 확인 위치: #/sql에서 F12 → Network → Fetch/XHR → search-cases.json → Response를 봅니다. 연습은 준비된 검색 사례이며 실제 DB 질의를 실행하지 않습니다. 자기 앱은 서버의 질의 코드와 시험용 DB에서 확인합니다.","next":"현재 구조와 해당 여부를 확인합니다. 모르는 정보는 먼저 확인하고, 수정이 필요하면 2번으로 진행합니다."},{"id":"a12-plan","category":"기본 진행","title":"2 수정 방법과 범위 정하기","when":"1번 답변에서 실제로 고칠 항목을 골랐을 때 보냅니다.","text":"활동: 검색 입력과 데이터베이스 명령 분리\n앱 이름과 프로젝트: [입력]\n이번 시험 주소: [입력]\n준비 정보: 검색 기능, 데이터베이스 종류, 가상 검색 자료\n현재 상황: [입력]\n사용할 가상 자료: [입력]\n앞에서 확인한 문제와 근거: [1번 결과 중 해당 부분을 붙이기]\n이번에 고칠 항목: [입력]\n\n구현 전에 다음 조건으로 수정 계획을 만들어 줘.\n1. 데이터 값은 매개변수로 전달하고 SQL 명령과 분리하도록 수정안을 제시해 줘.\n2. 매개변수로 처리할 수 없는 정렬 기준이나 필드 이름은 허용 목록에서 선택하게 해 줘.\n3. 데이터베이스 계정의 필요한 권한만 사용하고 오류에 질의나 자격 증명을 노출하지 마.\n4. 데이터베이스가 없다면 이 활동은 해당 없음으로 두고 새로 설치하지 마.\n\n기존 기능을 유지하면서 문제를 고칠 방법부터 제안해 줘. 방법이 여러 가지라면 필요한 서비스와 비용, 사용 방법이 달라지는 부분, 이전 상태로 되돌릴 방법을 비교해 줘. 반드시 고쳐야 할 부분과 선택해서 개선할 부분을 구분해 줘.\n변경할 파일, 학생 또는 교사 화면에서 달라질 부분, 필요한 관리 설정, 시험할 가상 입력을 순서대로 적어 줘. 서버가 없는 앱이라면 지금 할 수 있는 것과 서버가 필요한 것을 분리해 줘.\n아직 코드를 수정하거나 서비스를 만들지 마. 내가 결정해야 할 사항이 있으면 선택지와 차이를 설명하고 물어봐 줘.","next":"수정할 내용과 비용, 정보 수집·전송·보관 방식이 달라지는지 확인한 뒤 진행할 방법을 정합니다. 학교가 판단해야 하는 내용은 먼저 확인합니다."},{"id":"a12-implement","category":"기본 진행","title":"3 선택한 범위 구현하기","when":"수정 계획을 검토한 뒤 승인할 범위를 직접 적고 보냅니다.","text":"활동: 검색 입력과 데이터베이스 명령 분리\n앱 이름과 프로젝트: [입력]\n이번 시험 주소: [입력]\n준비 정보: 검색 기능, 데이터베이스 종류, 가상 검색 자료\n현재 상황: [입력]\n사용할 가상 자료: [입력]\n승인한 수정안: [선택한 방법과 항목을 정확히 입력]\n수정할 파일 또는 기능 범위: [입력]\n이번에 제외할 것: [입력]\n\n위에 승인한 범위만 구현해 줘. 시작 전에 현재 변경 파일을 확인해 다른 작업을 보존해 줘.\n1. 데이터 값은 매개변수로 전달하고 SQL 명령과 분리하도록 수정안을 제시해 줘.\n2. 매개변수로 처리할 수 없는 정렬 기준이나 필드 이름은 허용 목록에서 선택하게 해 줘.\n3. 데이터베이스 계정의 필요한 권한만 사용하고 오류에 질의나 자격 증명을 노출하지 마.\n4. 데이터베이스가 없다면 이 활동은 해당 없음으로 두고 새로 설치하지 마.\n\n한 부분씩 수정하고 실행 결과를 확인해 줘. 기존 디자인과 정상 기능은 유지해 줘. 새 서비스 생성·운영 자료 삭제·유료 호출·커밋·푸시·배포는 이 요청에 구체적으로 승인한 경우에만 실행해 줘. 요청하지 않은 변경이 필요하면 진행 전에 이유를 설명해 줘.\n수정 후 바꾼 파일과 이유, 실행한 검사, 아직 하지 못한 시험, 내가 누를 버튼 순서를 적어 줘. 실제 학생 정보·비밀키·인증 토큰은 출력하지 말고 필요한 값은 가려 줘. 내 앱 또는 허락받은 시험 환경만 대상으로 해 줘.","next":"빌드나 실행 오류가 없는지 확인한 뒤 4번으로 진행합니다. 허용해야 할 동작은 정상적으로 되고, 차단해야 할 동작은 막히는지 함께 시험합니다."},{"id":"a12-verify","category":"기본 진행","title":"4 수정 결과 직접 확인하기","when":"구현이 끝났거나 기존 기능이 안전하게 동작하는지 검증할 때 보냅니다.","text":"활동: 검색 입력과 데이터베이스 명령 분리\n앱 이름과 프로젝트: [입력]\n이번 시험 주소: [입력]\n준비 정보: 검색 기능, 데이터베이스 종류, 가상 검색 자료\n현재 상황: [입력]\n사용할 가상 자료: [입력]\n이번 수정 내용: [입력 또는 기존 기능 검증]\n시험할 버전과 주소: [입력]\n\n다음 조건을 가상 자료로 다시 시험해 줘.\n1. 일반 검색어, 따옴표가 들어간 이름, 빈 검색어로 정상 결과를 확인해 줘.\n2. 준비된 무해한 입력이 명령의 뜻을 바꾸지 않고 값으로 처리되는지 시험 환경에서 확인해 줘.\n3. 수정 후에도 학생별 조회 권한이 유지되는지 확인해 줘.\n4. Network에서 본 결과와 서버 코드에서 확인한 매개변수 사용 근거를 나누어 보고해 줘.\n\n내가 직접 따라 할 수 있도록 준비 계정과 상태 → 클릭 또는 입력 → 확인할 실제 탭·요청·필드 → 기대 결과를 항목마다 적어 줘.\n확인할 위치: #/sql에서 F12 → Network → Fetch/XHR → search-cases.json → Response를 봅니다. 연습은 준비된 검색 사례이며 실제 DB 질의를 실행하지 않습니다. 자기 앱은 서버의 질의 코드와 시험용 DB에서 확인합니다.\n자기 앱에서 이름이 다르면 코드와 실제 요청에서 맞는 이름을 찾아 줘. 실제로 존재하는지 확인하지 않은 요청명을 만들어 내지 마.\n허용해야 할 동작과 차단해야 할 동작을 함께 시험해 줘. 항목마다 실행 여부, 실제 결과, 확인한 화면이나 기록을 적고, 시험하지 못했다면 이유를 설명해 줘. 응답 코드와 실제로 받은 자료를 함께 확인하고, 저장 기능이 있다면 저장된 결과도 확인해 줘.\n이 활동을 완료해도 앱 전체의 안전이 보장된다고 표현하지 마. 실제 학생 정보·비밀키·인증 토큰은 출력하지 말고 필요한 값은 가려 줘. 내 앱 또는 허락받은 시험 환경만 대상으로 해 줘.","next":"기대 결과와 실제 결과가 같으면 활동 기록을 정리합니다. 다르면 “오류 해결” 프롬프트를 사용하고 같은 조건으로 재시험합니다."},{"id":"a12-branch1","category":"상황별 진행","title":"NoSQL이나 외부 저장 API를 쓸 때","when":"기본 순서로 진행하다가 이 상황에 해당하면 사용합니다.","text":"활동: 검색 입력과 데이터베이스 명령 분리\n앱 이름과 프로젝트: [입력]\n이번 시험 주소: [입력]\n준비 정보: 검색 기능, 데이터베이스 종류, 가상 검색 자료\n현재 상황: [입력]\n사용할 가상 자료: [입력]\n현재 겪는 상황: NoSQL이나 외부 저장 API를 쓸 때\n이미 한 행동과 나온 결과: [입력]\n\nSQL 검사를 억지로 적용하지 말고 해당 저장 도구의 입력 조건·연산자 주입·접근 규칙을 공식 문서에 맞춰 점검해 줘.\n먼저 관련 코드·화면·설정에서 현재 상태를 확인하고 이 상황이 생긴 이유를 근거와 함께 설명해 줘. 현재 환경에서 확인할 수 없는 것은 따로 표시해 줘.\n이 활동에서 유지할 조건:\n1. 데이터 값은 매개변수로 전달하고 SQL 명령과 분리하도록 수정안을 제시해 줘.\n2. 매개변수로 처리할 수 없는 정렬 기준이나 필드 이름은 허용 목록에서 선택하게 해 줘.\n3. 데이터베이스 계정의 필요한 권한만 사용하고 오류에 질의나 자격 증명을 노출하지 마.\n\n진행 순서를 “지금 확인할 것 → 선택 가능한 방법 → 내가 승인할 변경 → 실행 후 다시 확인할 결과”로 정리해 줘. 앱에 필요 없는 기능을 추가하거나 검사를 끄는 방식으로 해결하지 마.\n재시험에서는 다음 조건을 포함해 줘:\n1. 일반 검색어, 따옴표가 들어간 이름, 빈 검색어로 정상 결과를 확인해 줘.\n2. 준비된 무해한 입력이 명령의 뜻을 바꾸지 않고 값으로 처리되는지 시험 환경에서 확인해 줘.\n수정이 필요하면 먼저 범위를 제안하고 내 확인 전 운영 설정을 바꾸지 마. 실제 학생 정보·비밀키·인증 토큰은 출력하지 말고 필요한 값은 가려 줘. 내 앱 또는 허락받은 시험 환경만 대상으로 해 줘.","next":"이 상황에 맞는 방법을 선택한 뒤 기본 진행의 구현 또는 재시험 단계로 돌아갑니다. 해당 없음이면 이유를 기록하고 다른 활동을 고릅니다."},{"id":"a12-branch2","category":"상황별 진행","title":"운영 데이터베이스만 있는 경우","when":"기본 순서로 진행하다가 이 상황에 해당하면 사용합니다.","text":"활동: 검색 입력과 데이터베이스 명령 분리\n앱 이름과 프로젝트: [입력]\n이번 시험 주소: [입력]\n준비 정보: 검색 기능, 데이터베이스 종류, 가상 검색 자료\n현재 상황: [입력]\n사용할 가상 자료: [입력]\n현재 겪는 상황: 운영 데이터베이스만 있는 경우\n이미 한 행동과 나온 결과: [입력]\n\n운영 자료에 공격성 질의를 실행하지 마. 읽기 전용 코드 검토와 별도의 가상 시험 자료 준비 계획을 먼저 제시해 줘.\n먼저 관련 코드·화면·설정에서 현재 상태를 확인하고 이 상황이 생긴 이유를 근거와 함께 설명해 줘. 현재 환경에서 확인할 수 없는 것은 따로 표시해 줘.\n이 활동에서 유지할 조건:\n1. 데이터 값은 매개변수로 전달하고 SQL 명령과 분리하도록 수정안을 제시해 줘.\n2. 매개변수로 처리할 수 없는 정렬 기준이나 필드 이름은 허용 목록에서 선택하게 해 줘.\n3. 데이터베이스 계정의 필요한 권한만 사용하고 오류에 질의나 자격 증명을 노출하지 마.\n\n진행 순서를 “지금 확인할 것 → 선택 가능한 방법 → 내가 승인할 변경 → 실행 후 다시 확인할 결과”로 정리해 줘. 앱에 필요 없는 기능을 추가하거나 검사를 끄는 방식으로 해결하지 마.\n재시험에서는 다음 조건을 포함해 줘:\n1. 일반 검색어, 따옴표가 들어간 이름, 빈 검색어로 정상 결과를 확인해 줘.\n2. 준비된 무해한 입력이 명령의 뜻을 바꾸지 않고 값으로 처리되는지 시험 환경에서 확인해 줘.\n수정이 필요하면 먼저 범위를 제안하고 내 확인 전 운영 설정을 바꾸지 마. 실제 학생 정보·비밀키·인증 토큰은 출력하지 말고 필요한 값은 가려 줘. 내 앱 또는 허락받은 시험 환경만 대상으로 해 줘.","next":"이 상황에 맞는 방법을 선택한 뒤 기본 진행의 구현 또는 재시험 단계로 돌아갑니다. 해당 없음이면 이유를 기록하고 다른 활동을 고릅니다."},{"id":"a12-locate","category":"확인 위치 도움","title":"안내된 화면이나 요청을 찾지 못할 때","when":"F12에 설명한 파일·요청이 없거나 확인할 곳을 모르겠을 때 보냅니다.","text":"활동: 검색 입력과 데이터베이스 명령 분리\n앱 이름과 프로젝트: [입력]\n이번 시험 주소: [입력]\n준비 정보: 검색 기능, 데이터베이스 종류, 가상 검색 자료\n현재 상황: [입력]\n사용할 가상 자료: [입력]\n내가 보고 있는 주소와 창: [입력]\n누른 버튼 또는 실행한 동작: [입력]\n열어 둔 개발자 도구 탭과 필터: [입력 또는 모름]\n찾으려는 정보: [입력]\n현재 화면 또는 가린 오류 내용: [붙이기]\n\n참고 안내: #/sql에서 F12 → Network → Fetch/XHR → search-cases.json → Response를 봅니다. 연습은 준비된 검색 사례이며 실제 DB 질의를 실행하지 않습니다. 자기 앱은 서버의 질의 코드와 시험용 DB에서 확인합니다.\n이 안내가 체험 앱의 가상 자료인지 내 앱의 실제 동작인지 먼저 구분해 줘. 프로젝트에서 이 동작이 어떤 요청·파일·저장소로 연결되는지 찾아 줘.\nNetwork라면 동작 전에 열기, 기록 켜기, 목록 지우기, 필터 확인, 같은 동작 다시 하기, 새 요청 선택, Headers·Payload·Response 중 볼 위치를 실제 이름으로 알려 줘. 정적 파일이면 All 필터도 확인해 줘. 새 창을 열었다면 그 창에서 F12를 열어야 하는지 설명해 줘.\n브라우저 검사에서 막아 요청이 없거나 아직 동작을 실행하지 않은 경우도 구분해 줘. 서버에만 있는 정보는 F12에서 찾으라고 하지 말고 코드·관리 화면·시험 환경에서 확인할 방법을 제시해 줘.\n확인할 자료가 실제로 없으면 없다고 말하고 필요한 시험 준비를 설명해 줘. 캡처 요청에는 가려야 할 정보도 알려 줘. 실제 학생 정보·비밀키·인증 토큰은 출력하지 말고 필요한 값은 가려 줘. 내 앱 또는 허락받은 시험 환경만 대상으로 해 줘.","next":"정확한 위치를 찾은 뒤 해당 활동의 4번 프롬프트로 결과를 확인합니다. 없다는 사실 자체가 기대 결과인지 먼저 판단합니다."},{"id":"a12-error","category":"오류 해결","title":"예상과 다른 결과가 나올 때","when":"실행 오류, 정상 기능 실패, 예상한 차단이 되지 않는 경우에 보냅니다.","text":"활동: 검색 입력과 데이터베이스 명령 분리\n앱 이름과 프로젝트: [입력]\n이번 시험 주소: [입력]\n준비 정보: 검색 기능, 데이터베이스 종류, 가상 검색 자료\n현재 상황: [입력]\n사용할 가상 자료: [입력]\n실행한 단계와 입력: [입력]\n기대한 결과: [입력]\n실제로 나온 결과: [입력]\n오류 문구: [비밀값을 가리고 붙이기]\n직전에 변경한 파일 또는 설정: [입력 또는 모름]\n\n원인을 추측해서 여러 곳을 한꺼번에 바꾸지 말고, 재현 조건과 현재 코드를 비교해 줘. 요청이 만들어지는지, 서버에 도착하는지, 검사와 반환·저장이 어디서 달라지는지 관련 단계만 확인해 줘.\n특히 다음 점검 기준을 다시 봐 줘:\n1. 검색 입력이 서버 질의에 연결되는 코드를 찾아 줘. 문자열 결합으로 SQL을 만드는 부분을 확인해 줘.\n2. ORM이나 질의 도구를 사용하더라도 원시 SQL과 동적 정렬·열 이름 처리 경로를 별도로 확인해 줘.\n\n가능한 원인마다 그렇게 판단한 이유와 먼저 확인할 방법을 알려 줘. 운영 자료를 삭제하거나 권한·입력 검사를 전체 해제하는 방식은 사용하지 마. 수정이 필요하면 바꿀 내용을 먼저 제안하고 내가 승인한 뒤 적용해 줘.\n수정 후 같은 실패 조건과 다음 정상 조건을 모두 재시험해 줘:\n1. 일반 검색어, 따옴표가 들어간 이름, 빈 검색어로 정상 결과를 확인해 줘.\n2. 준비된 무해한 입력이 명령의 뜻을 바꾸지 않고 값으로 처리되는지 시험 환경에서 확인해 줘.\n3. 수정 후에도 학생별 조회 권한이 유지되는지 확인해 줘.\n4. Network에서 본 결과와 서버 코드에서 확인한 매개변수 사용 근거를 나누어 보고해 줘.\n완료 보고에는 실제 실행한 결과와 실행하지 못한 이유를 구분해 줘.","next":"실패 원인을 확인하고 승인한 수정만 적용합니다. 같은 실패 조건이 해결됐는지와 원래 정상 기능이 유지되는지 함께 봅니다."},{"id":"a12-finish","category":"활동 마무리","title":"확인 기록과 다음 점검 정리하기","when":"직접 시험을 확인한 뒤, 또는 해당 없음·추가 확인으로 종료할 때 보냅니다.","text":"활동: 검색 입력과 데이터베이스 명령 분리\n앱 이름과 프로젝트: [입력]\n이번 시험 주소: [입력]\n준비 정보: 검색 기능, 데이터베이스 종류, 가상 검색 자료\n현재 상황: [입력]\n사용할 가상 자료: [입력]\n실제로 진행한 단계: [입력]\n확인한 결과 또는 아직 확인하지 못한 내용: [입력]\n\n이번 활동 기록을 Markdown으로 정리해 줘. 항목은 앱과 시험 버전, 점검한 기능, 발견한 문제와 위치, 승인한 수정, 시험 입력과 기대 결과, 실제 결과와 근거, 추가 확인할 일로 구성해 줘.\n앞으로 개발할 때 지킬 기준도 우리 앱의 실제 코드·설정 위치와 연결해 적어 줘:\n1. 데이터 값은 매개변수로 전달하고 SQL 명령과 분리하도록 수정안을 제시해 줘.\n2. 매개변수로 처리할 수 없는 정렬 기준이나 필드 이름은 허용 목록에서 선택하게 해 줘.\n3. 데이터베이스 계정의 필요한 권한만 사용하고 오류에 질의나 자격 증명을 노출하지 마.\n4. 데이터베이스가 없다면 이 활동은 해당 없음으로 두고 새로 설치하지 마.\n\n활동 상태는 확인 완료·추가 확인·해당 없음 중 근거에 맞게 적어 줘. 구현만 하고 시험하지 않았다면 확인 완료로 쓰지 마. 문제를 발견하지 못한 것과 충분히 검증한 것을 구분해 줘.\n다음 수정 때 다시 실행할 시험은 다음 내용을 바탕으로 정리해 줘:\n1. 일반 검색어, 따옴표가 들어간 이름, 빈 검색어로 정상 결과를 확인해 줘.\n2. 준비된 무해한 입력이 명령의 뜻을 바꾸지 않고 값으로 처리되는지 시험 환경에서 확인해 줘.\n보고서에 원문 학생 자료나 비밀값을 넣지 마. 이 기록만으로 학교 승인이나 앱 전체의 안전을 보장한다고 쓰지 마.","next":"기록을 자신의 프로젝트에 보관하고 필요한 다음 활동을 선택합니다. 새로운 대화를 시작할 때는 이 기록과 공통 시작 프롬프트를 함께 제공합니다."}]},{"id":13,"title":"파일과 백업의 공개 범위 확인","group":"추가 보안 점검","slides":"25, 51, 57","condition":"파일 업로드·다운로드, 이미지 저장, 백업 파일이 있는 앱","inputs":"파일 종류, 저장 위치, 공개할 파일과 제한할 파일, 가상 시험 파일","inspect":["public 폴더와 저장소의 공개 주소에 백업·설정·학생 파일이 들어가는지 찾아 줘. 비밀 내용은 출력하지 말고 파일 위치와 노출 유형만 알려 줘.","파일 주소를 아는 사람과 로그인한 사용자에게 각각 어떤 접근 검사가 적용되는지 확인해 줘.","업로드 파일의 확장자·실제 형식·크기·이름을 어디서 검사하는지 확인해 줘. 브라우저 검사와 서버 검사를 구분해 줘.","삭제한 파일의 원본·공유 주소·캐시가 어떻게 처리되는지 확인해 줘."],"requirements":["보호할 자료는 공개 정적 폴더에서 제외하고 서버에서 사용자와 파일 소유 관계를 확인한 뒤 내려주도록 설계해 줘.","공유가 필요한 파일은 공유 대상·기간·취소 방법을 정해 줘. 주소가 복잡하다는 이유만으로 비공개라고 판단하지 마.","허용한 형식과 크기를 서버에서 검사하고 저장 이름은 충돌하지 않게 만들어 줘. 사용자가 보낸 경로를 그대로 저장 경로로 쓰지 마.","기존 공개 자료를 옮기거나 삭제하는 작업은 대상과 영향 목록을 먼저 제시하고 내가 승인한 항목만 처리해 줘."],"tests":["가상 파일로 로그인 전·소유자·다른 학생·교사의 다운로드 결과를 비교해 줘.","허용하지 않은 형식과 너무 큰 시험 파일이 저장 전에 차단되는지 확인해 줘.","공유를 취소한 뒤 새 요청이 거부되는지 확인하고 이미 내려받은 사본까지 회수된다고 말하지 마.","정상 수업용 공개 이미지가 여전히 표시되는지 확인해 줘."],"location":"체험 앱의 파일 공개 활동에서 F12 → Network → Fetch/XHR를 연 뒤 파일 요청을 다시 실행합니다. 새 lab 요청의 Response에서 file 항목을 확인합니다. 자기 앱은 다운로드 요청의 Headers와 Response, 저장소 접근 설정을 함께 봅니다.","links":["https://webapp-security-lab.vercel.app/#/files","https://cheatsheetseries.owasp.org/cheatsheets/File_Upload_Cheat_Sheet.html"],"branches":[["파일을 모두 공개해도 되는 경우","공개 자료에 학생 정보·비밀 설정이 없는지 확인하고 공개 목적을 기록해 줘. 필요 없는 로그인 기능은 추가하지 마."],["이미 파일 주소가 외부에 공유된 경우","대상 파일과 공유 경로를 먼저 조사해 줘. 접근 제한·주소 만료·파일 교체의 효과와 한계를 나누어 설명하고 승인 전 파일을 삭제하지 마."]],"prompts":[{"id":"a13-inspect","category":"기본 진행","title":"1 현재 상태부터 확인하기","when":"프로젝트를 연 뒤 처음 보냅니다. 파일을 고치기 전 단계입니다.","text":"활동: 파일과 백업의 공개 범위 확인\n앱 이름과 프로젝트: [입력]\n이번 시험 주소: [입력]\n준비 정보: 파일 종류, 저장 위치, 공개할 파일과 제한할 파일, 가상 시험 파일\n현재 상황: [입력]\n사용할 가상 자료: [입력]\n\n이 활동에 해당하는지부터 확인해 줘. 아직 파일이나 설정은 수정하지 마.\n1. public 폴더와 저장소의 공개 주소에 백업·설정·학생 파일이 들어가는지 찾아 줘. 비밀 내용은 출력하지 말고 파일 위치와 노출 유형만 알려 줘.\n2. 파일 주소를 아는 사람과 로그인한 사용자에게 각각 어떤 접근 검사가 적용되는지 확인해 줘.\n3. 업로드 파일의 확장자·실제 형식·크기·이름을 어디서 검사하는지 확인해 줘. 브라우저 검사와 서버 검사를 구분해 줘.\n4. 삭제한 파일의 원본·공유 주소·캐시가 어떻게 처리되는지 확인해 줘.\n\n결과는 표로 정리해 줘. 표에는 확인 항목, 현재 동작, 근거가 있는 파일이나 설정 위치, 발견한 문제와 추가로 확인할 내용을 적어 줘. 코드에서 확인한 사실과 추정은 구분해 줘. 내가 직접 확인할 메뉴·버튼·파일 이름도 알려 줘. 파일을 읽지 못했다면 그 사실을 표시해 줘.\n실제 학생 정보·비밀키·인증 토큰은 출력하지 말고 필요한 값은 가려 줘. 내 앱 또는 허락받은 시험 환경만 대상으로 해 줘.\n참고할 확인 위치: 체험 앱의 파일 공개 활동에서 F12 → Network → Fetch/XHR를 연 뒤 파일 요청을 다시 실행합니다. 새 lab 요청의 Response에서 file 항목을 확인합니다. 자기 앱은 다운로드 요청의 Headers와 Response, 저장소 접근 설정을 함께 봅니다.","next":"현재 구조와 해당 여부를 확인합니다. 모르는 정보는 먼저 확인하고, 수정이 필요하면 2번으로 진행합니다."},{"id":"a13-plan","category":"기본 진행","title":"2 수정 방법과 범위 정하기","when":"1번 답변에서 실제로 고칠 항목을 골랐을 때 보냅니다.","text":"활동: 파일과 백업의 공개 범위 확인\n앱 이름과 프로젝트: [입력]\n이번 시험 주소: [입력]\n준비 정보: 파일 종류, 저장 위치, 공개할 파일과 제한할 파일, 가상 시험 파일\n현재 상황: [입력]\n사용할 가상 자료: [입력]\n앞에서 확인한 문제와 근거: [1번 결과 중 해당 부분을 붙이기]\n이번에 고칠 항목: [입력]\n\n구현 전에 다음 조건으로 수정 계획을 만들어 줘.\n1. 보호할 자료는 공개 정적 폴더에서 제외하고 서버에서 사용자와 파일 소유 관계를 확인한 뒤 내려주도록 설계해 줘.\n2. 공유가 필요한 파일은 공유 대상·기간·취소 방법을 정해 줘. 주소가 복잡하다는 이유만으로 비공개라고 판단하지 마.\n3. 허용한 형식과 크기를 서버에서 검사하고 저장 이름은 충돌하지 않게 만들어 줘. 사용자가 보낸 경로를 그대로 저장 경로로 쓰지 마.\n4. 기존 공개 자료를 옮기거나 삭제하는 작업은 대상과 영향 목록을 먼저 제시하고 내가 승인한 항목만 처리해 줘.\n\n기존 기능을 유지하면서 문제를 고칠 방법부터 제안해 줘. 방법이 여러 가지라면 필요한 서비스와 비용, 사용 방법이 달라지는 부분, 이전 상태로 되돌릴 방법을 비교해 줘. 반드시 고쳐야 할 부분과 선택해서 개선할 부분을 구분해 줘.\n변경할 파일, 학생 또는 교사 화면에서 달라질 부분, 필요한 관리 설정, 시험할 가상 입력을 순서대로 적어 줘. 서버가 없는 앱이라면 지금 할 수 있는 것과 서버가 필요한 것을 분리해 줘.\n아직 코드를 수정하거나 서비스를 만들지 마. 내가 결정해야 할 사항이 있으면 선택지와 차이를 설명하고 물어봐 줘.","next":"수정할 내용과 비용, 정보 수집·전송·보관 방식이 달라지는지 확인한 뒤 진행할 방법을 정합니다. 학교가 판단해야 하는 내용은 먼저 확인합니다."},{"id":"a13-implement","category":"기본 진행","title":"3 선택한 범위 구현하기","when":"수정 계획을 검토한 뒤 승인할 범위를 직접 적고 보냅니다.","text":"활동: 파일과 백업의 공개 범위 확인\n앱 이름과 프로젝트: [입력]\n이번 시험 주소: [입력]\n준비 정보: 파일 종류, 저장 위치, 공개할 파일과 제한할 파일, 가상 시험 파일\n현재 상황: [입력]\n사용할 가상 자료: [입력]\n승인한 수정안: [선택한 방법과 항목을 정확히 입력]\n수정할 파일 또는 기능 범위: [입력]\n이번에 제외할 것: [입력]\n\n위에 승인한 범위만 구현해 줘. 시작 전에 현재 변경 파일을 확인해 다른 작업을 보존해 줘.\n1. 보호할 자료는 공개 정적 폴더에서 제외하고 서버에서 사용자와 파일 소유 관계를 확인한 뒤 내려주도록 설계해 줘.\n2. 공유가 필요한 파일은 공유 대상·기간·취소 방법을 정해 줘. 주소가 복잡하다는 이유만으로 비공개라고 판단하지 마.\n3. 허용한 형식과 크기를 서버에서 검사하고 저장 이름은 충돌하지 않게 만들어 줘. 사용자가 보낸 경로를 그대로 저장 경로로 쓰지 마.\n4. 기존 공개 자료를 옮기거나 삭제하는 작업은 대상과 영향 목록을 먼저 제시하고 내가 승인한 항목만 처리해 줘.\n\n한 부분씩 수정하고 실행 결과를 확인해 줘. 기존 디자인과 정상 기능은 유지해 줘. 새 서비스 생성·운영 자료 삭제·유료 호출·커밋·푸시·배포는 이 요청에 구체적으로 승인한 경우에만 실행해 줘. 요청하지 않은 변경이 필요하면 진행 전에 이유를 설명해 줘.\n수정 후 바꾼 파일과 이유, 실행한 검사, 아직 하지 못한 시험, 내가 누를 버튼 순서를 적어 줘. 실제 학생 정보·비밀키·인증 토큰은 출력하지 말고 필요한 값은 가려 줘. 내 앱 또는 허락받은 시험 환경만 대상으로 해 줘.","next":"빌드나 실행 오류가 없는지 확인한 뒤 4번으로 진행합니다. 허용해야 할 동작은 정상적으로 되고, 차단해야 할 동작은 막히는지 함께 시험합니다."},{"id":"a13-verify","category":"기본 진행","title":"4 수정 결과 직접 확인하기","when":"구현이 끝났거나 기존 기능이 안전하게 동작하는지 검증할 때 보냅니다.","text":"활동: 파일과 백업의 공개 범위 확인\n앱 이름과 프로젝트: [입력]\n이번 시험 주소: [입력]\n준비 정보: 파일 종류, 저장 위치, 공개할 파일과 제한할 파일, 가상 시험 파일\n현재 상황: [입력]\n사용할 가상 자료: [입력]\n이번 수정 내용: [입력 또는 기존 기능 검증]\n시험할 버전과 주소: [입력]\n\n다음 조건을 가상 자료로 다시 시험해 줘.\n1. 가상 파일로 로그인 전·소유자·다른 학생·교사의 다운로드 결과를 비교해 줘.\n2. 허용하지 않은 형식과 너무 큰 시험 파일이 저장 전에 차단되는지 확인해 줘.\n3. 공유를 취소한 뒤 새 요청이 거부되는지 확인하고 이미 내려받은 사본까지 회수된다고 말하지 마.\n4. 정상 수업용 공개 이미지가 여전히 표시되는지 확인해 줘.\n\n내가 직접 따라 할 수 있도록 준비 계정과 상태 → 클릭 또는 입력 → 확인할 실제 탭·요청·필드 → 기대 결과를 항목마다 적어 줘.\n확인할 위치: 체험 앱의 파일 공개 활동에서 F12 → Network → Fetch/XHR를 연 뒤 파일 요청을 다시 실행합니다. 새 lab 요청의 Response에서 file 항목을 확인합니다. 자기 앱은 다운로드 요청의 Headers와 Response, 저장소 접근 설정을 함께 봅니다.\n자기 앱에서 이름이 다르면 코드와 실제 요청에서 맞는 이름을 찾아 줘. 실제로 존재하는지 확인하지 않은 요청명을 만들어 내지 마.\n허용해야 할 동작과 차단해야 할 동작을 함께 시험해 줘. 항목마다 실행 여부, 실제 결과, 확인한 화면이나 기록을 적고, 시험하지 못했다면 이유를 설명해 줘. 응답 코드와 실제로 받은 자료를 함께 확인하고, 저장 기능이 있다면 저장된 결과도 확인해 줘.\n이 활동을 완료해도 앱 전체의 안전이 보장된다고 표현하지 마. 실제 학생 정보·비밀키·인증 토큰은 출력하지 말고 필요한 값은 가려 줘. 내 앱 또는 허락받은 시험 환경만 대상으로 해 줘.","next":"기대 결과와 실제 결과가 같으면 활동 기록을 정리합니다. 다르면 “오류 해결” 프롬프트를 사용하고 같은 조건으로 재시험합니다."},{"id":"a13-branch1","category":"상황별 진행","title":"파일을 모두 공개해도 되는 경우","when":"기본 순서로 진행하다가 이 상황에 해당하면 사용합니다.","text":"활동: 파일과 백업의 공개 범위 확인\n앱 이름과 프로젝트: [입력]\n이번 시험 주소: [입력]\n준비 정보: 파일 종류, 저장 위치, 공개할 파일과 제한할 파일, 가상 시험 파일\n현재 상황: [입력]\n사용할 가상 자료: [입력]\n현재 겪는 상황: 파일을 모두 공개해도 되는 경우\n이미 한 행동과 나온 결과: [입력]\n\n공개 자료에 학생 정보·비밀 설정이 없는지 확인하고 공개 목적을 기록해 줘. 필요 없는 로그인 기능은 추가하지 마.\n먼저 관련 코드·화면·설정에서 현재 상태를 확인하고 이 상황이 생긴 이유를 근거와 함께 설명해 줘. 현재 환경에서 확인할 수 없는 것은 따로 표시해 줘.\n이 활동에서 유지할 조건:\n1. 보호할 자료는 공개 정적 폴더에서 제외하고 서버에서 사용자와 파일 소유 관계를 확인한 뒤 내려주도록 설계해 줘.\n2. 공유가 필요한 파일은 공유 대상·기간·취소 방법을 정해 줘. 주소가 복잡하다는 이유만으로 비공개라고 판단하지 마.\n3. 허용한 형식과 크기를 서버에서 검사하고 저장 이름은 충돌하지 않게 만들어 줘. 사용자가 보낸 경로를 그대로 저장 경로로 쓰지 마.\n\n진행 순서를 “지금 확인할 것 → 선택 가능한 방법 → 내가 승인할 변경 → 실행 후 다시 확인할 결과”로 정리해 줘. 앱에 필요 없는 기능을 추가하거나 검사를 끄는 방식으로 해결하지 마.\n재시험에서는 다음 조건을 포함해 줘:\n1. 가상 파일로 로그인 전·소유자·다른 학생·교사의 다운로드 결과를 비교해 줘.\n2. 허용하지 않은 형식과 너무 큰 시험 파일이 저장 전에 차단되는지 확인해 줘.\n수정이 필요하면 먼저 범위를 제안하고 내 확인 전 운영 설정을 바꾸지 마. 실제 학생 정보·비밀키·인증 토큰은 출력하지 말고 필요한 값은 가려 줘. 내 앱 또는 허락받은 시험 환경만 대상으로 해 줘.","next":"이 상황에 맞는 방법을 선택한 뒤 기본 진행의 구현 또는 재시험 단계로 돌아갑니다. 해당 없음이면 이유를 기록하고 다른 활동을 고릅니다."},{"id":"a13-branch2","category":"상황별 진행","title":"이미 파일 주소가 외부에 공유된 경우","when":"기본 순서로 진행하다가 이 상황에 해당하면 사용합니다.","text":"활동: 파일과 백업의 공개 범위 확인\n앱 이름과 프로젝트: [입력]\n이번 시험 주소: [입력]\n준비 정보: 파일 종류, 저장 위치, 공개할 파일과 제한할 파일, 가상 시험 파일\n현재 상황: [입력]\n사용할 가상 자료: [입력]\n현재 겪는 상황: 이미 파일 주소가 외부에 공유된 경우\n이미 한 행동과 나온 결과: [입력]\n\n대상 파일과 공유 경로를 먼저 조사해 줘. 접근 제한·주소 만료·파일 교체의 효과와 한계를 나누어 설명하고 승인 전 파일을 삭제하지 마.\n먼저 관련 코드·화면·설정에서 현재 상태를 확인하고 이 상황이 생긴 이유를 근거와 함께 설명해 줘. 현재 환경에서 확인할 수 없는 것은 따로 표시해 줘.\n이 활동에서 유지할 조건:\n1. 보호할 자료는 공개 정적 폴더에서 제외하고 서버에서 사용자와 파일 소유 관계를 확인한 뒤 내려주도록 설계해 줘.\n2. 공유가 필요한 파일은 공유 대상·기간·취소 방법을 정해 줘. 주소가 복잡하다는 이유만으로 비공개라고 판단하지 마.\n3. 허용한 형식과 크기를 서버에서 검사하고 저장 이름은 충돌하지 않게 만들어 줘. 사용자가 보낸 경로를 그대로 저장 경로로 쓰지 마.\n\n진행 순서를 “지금 확인할 것 → 선택 가능한 방법 → 내가 승인할 변경 → 실행 후 다시 확인할 결과”로 정리해 줘. 앱에 필요 없는 기능을 추가하거나 검사를 끄는 방식으로 해결하지 마.\n재시험에서는 다음 조건을 포함해 줘:\n1. 가상 파일로 로그인 전·소유자·다른 학생·교사의 다운로드 결과를 비교해 줘.\n2. 허용하지 않은 형식과 너무 큰 시험 파일이 저장 전에 차단되는지 확인해 줘.\n수정이 필요하면 먼저 범위를 제안하고 내 확인 전 운영 설정을 바꾸지 마. 실제 학생 정보·비밀키·인증 토큰은 출력하지 말고 필요한 값은 가려 줘. 내 앱 또는 허락받은 시험 환경만 대상으로 해 줘.","next":"이 상황에 맞는 방법을 선택한 뒤 기본 진행의 구현 또는 재시험 단계로 돌아갑니다. 해당 없음이면 이유를 기록하고 다른 활동을 고릅니다."},{"id":"a13-locate","category":"확인 위치 도움","title":"안내된 화면이나 요청을 찾지 못할 때","when":"F12에 설명한 파일·요청이 없거나 확인할 곳을 모르겠을 때 보냅니다.","text":"활동: 파일과 백업의 공개 범위 확인\n앱 이름과 프로젝트: [입력]\n이번 시험 주소: [입력]\n준비 정보: 파일 종류, 저장 위치, 공개할 파일과 제한할 파일, 가상 시험 파일\n현재 상황: [입력]\n사용할 가상 자료: [입력]\n내가 보고 있는 주소와 창: [입력]\n누른 버튼 또는 실행한 동작: [입력]\n열어 둔 개발자 도구 탭과 필터: [입력 또는 모름]\n찾으려는 정보: [입력]\n현재 화면 또는 가린 오류 내용: [붙이기]\n\n참고 안내: 체험 앱의 파일 공개 활동에서 F12 → Network → Fetch/XHR를 연 뒤 파일 요청을 다시 실행합니다. 새 lab 요청의 Response에서 file 항목을 확인합니다. 자기 앱은 다운로드 요청의 Headers와 Response, 저장소 접근 설정을 함께 봅니다.\n이 안내가 체험 앱의 가상 자료인지 내 앱의 실제 동작인지 먼저 구분해 줘. 프로젝트에서 이 동작이 어떤 요청·파일·저장소로 연결되는지 찾아 줘.\nNetwork라면 동작 전에 열기, 기록 켜기, 목록 지우기, 필터 확인, 같은 동작 다시 하기, 새 요청 선택, Headers·Payload·Response 중 볼 위치를 실제 이름으로 알려 줘. 정적 파일이면 All 필터도 확인해 줘. 새 창을 열었다면 그 창에서 F12를 열어야 하는지 설명해 줘.\n브라우저 검사에서 막아 요청이 없거나 아직 동작을 실행하지 않은 경우도 구분해 줘. 서버에만 있는 정보는 F12에서 찾으라고 하지 말고 코드·관리 화면·시험 환경에서 확인할 방법을 제시해 줘.\n확인할 자료가 실제로 없으면 없다고 말하고 필요한 시험 준비를 설명해 줘. 캡처 요청에는 가려야 할 정보도 알려 줘. 실제 학생 정보·비밀키·인증 토큰은 출력하지 말고 필요한 값은 가려 줘. 내 앱 또는 허락받은 시험 환경만 대상으로 해 줘.","next":"정확한 위치를 찾은 뒤 해당 활동의 4번 프롬프트로 결과를 확인합니다. 없다는 사실 자체가 기대 결과인지 먼저 판단합니다."},{"id":"a13-error","category":"오류 해결","title":"예상과 다른 결과가 나올 때","when":"실행 오류, 정상 기능 실패, 예상한 차단이 되지 않는 경우에 보냅니다.","text":"활동: 파일과 백업의 공개 범위 확인\n앱 이름과 프로젝트: [입력]\n이번 시험 주소: [입력]\n준비 정보: 파일 종류, 저장 위치, 공개할 파일과 제한할 파일, 가상 시험 파일\n현재 상황: [입력]\n사용할 가상 자료: [입력]\n실행한 단계와 입력: [입력]\n기대한 결과: [입력]\n실제로 나온 결과: [입력]\n오류 문구: [비밀값을 가리고 붙이기]\n직전에 변경한 파일 또는 설정: [입력 또는 모름]\n\n원인을 추측해서 여러 곳을 한꺼번에 바꾸지 말고, 재현 조건과 현재 코드를 비교해 줘. 요청이 만들어지는지, 서버에 도착하는지, 검사와 반환·저장이 어디서 달라지는지 관련 단계만 확인해 줘.\n특히 다음 점검 기준을 다시 봐 줘:\n1. public 폴더와 저장소의 공개 주소에 백업·설정·학생 파일이 들어가는지 찾아 줘. 비밀 내용은 출력하지 말고 파일 위치와 노출 유형만 알려 줘.\n2. 파일 주소를 아는 사람과 로그인한 사용자에게 각각 어떤 접근 검사가 적용되는지 확인해 줘.\n\n가능한 원인마다 그렇게 판단한 이유와 먼저 확인할 방법을 알려 줘. 운영 자료를 삭제하거나 권한·입력 검사를 전체 해제하는 방식은 사용하지 마. 수정이 필요하면 바꿀 내용을 먼저 제안하고 내가 승인한 뒤 적용해 줘.\n수정 후 같은 실패 조건과 다음 정상 조건을 모두 재시험해 줘:\n1. 가상 파일로 로그인 전·소유자·다른 학생·교사의 다운로드 결과를 비교해 줘.\n2. 허용하지 않은 형식과 너무 큰 시험 파일이 저장 전에 차단되는지 확인해 줘.\n3. 공유를 취소한 뒤 새 요청이 거부되는지 확인하고 이미 내려받은 사본까지 회수된다고 말하지 마.\n4. 정상 수업용 공개 이미지가 여전히 표시되는지 확인해 줘.\n완료 보고에는 실제 실행한 결과와 실행하지 못한 이유를 구분해 줘.","next":"실패 원인을 확인하고 승인한 수정만 적용합니다. 같은 실패 조건이 해결됐는지와 원래 정상 기능이 유지되는지 함께 봅니다."},{"id":"a13-finish","category":"활동 마무리","title":"확인 기록과 다음 점검 정리하기","when":"직접 시험을 확인한 뒤, 또는 해당 없음·추가 확인으로 종료할 때 보냅니다.","text":"활동: 파일과 백업의 공개 범위 확인\n앱 이름과 프로젝트: [입력]\n이번 시험 주소: [입력]\n준비 정보: 파일 종류, 저장 위치, 공개할 파일과 제한할 파일, 가상 시험 파일\n현재 상황: [입력]\n사용할 가상 자료: [입력]\n실제로 진행한 단계: [입력]\n확인한 결과 또는 아직 확인하지 못한 내용: [입력]\n\n이번 활동 기록을 Markdown으로 정리해 줘. 항목은 앱과 시험 버전, 점검한 기능, 발견한 문제와 위치, 승인한 수정, 시험 입력과 기대 결과, 실제 결과와 근거, 추가 확인할 일로 구성해 줘.\n앞으로 개발할 때 지킬 기준도 우리 앱의 실제 코드·설정 위치와 연결해 적어 줘:\n1. 보호할 자료는 공개 정적 폴더에서 제외하고 서버에서 사용자와 파일 소유 관계를 확인한 뒤 내려주도록 설계해 줘.\n2. 공유가 필요한 파일은 공유 대상·기간·취소 방법을 정해 줘. 주소가 복잡하다는 이유만으로 비공개라고 판단하지 마.\n3. 허용한 형식과 크기를 서버에서 검사하고 저장 이름은 충돌하지 않게 만들어 줘. 사용자가 보낸 경로를 그대로 저장 경로로 쓰지 마.\n4. 기존 공개 자료를 옮기거나 삭제하는 작업은 대상과 영향 목록을 먼저 제시하고 내가 승인한 항목만 처리해 줘.\n\n활동 상태는 확인 완료·추가 확인·해당 없음 중 근거에 맞게 적어 줘. 구현만 하고 시험하지 않았다면 확인 완료로 쓰지 마. 문제를 발견하지 못한 것과 충분히 검증한 것을 구분해 줘.\n다음 수정 때 다시 실행할 시험은 다음 내용을 바탕으로 정리해 줘:\n1. 가상 파일로 로그인 전·소유자·다른 학생·교사의 다운로드 결과를 비교해 줘.\n2. 허용하지 않은 형식과 너무 큰 시험 파일이 저장 전에 차단되는지 확인해 줘.\n보고서에 원문 학생 자료나 비밀값을 넣지 마. 이 기록만으로 학교 승인이나 앱 전체의 안전을 보장한다고 쓰지 마.","next":"기록을 자신의 프로젝트에 보관하고 필요한 다음 활동을 선택합니다. 새로운 대화를 시작할 때는 이 기록과 공통 시작 프롬프트를 함께 제공합니다."}]},{"id":14,"title":"비밀번호 저장과 재설정 확인","group":"추가 보안 점검","slides":"6, 9, 25","condition":"직접 계정을 관리하거나 외부 로그인 서비스를 쓰는 앱","inputs":"로그인 제공 방식, 시험 계정, 재설정 기능 유무","inspect":["인증 제공 업체가 관리하는 비밀번호인지 앱이 직접 관리하는지 먼저 확인해 줘.","원문 비밀번호가 코드·DB·로그·응답에 저장되거나 출력되는지 값은 가린 채 점검해 줘.","직접 저장한다면 현재 해시 방식과 계정마다 다른 salt를 쓰는지 확인해 줘. salt는 같은 비밀번호라도 저장값이 달라지도록 해시 계산에 함께 사용하는 값이라는 설명도 덧붙여 줘. 단순 SHA 해시만으로 안전하게 저장한다고 판단하지 마.","재설정 링크의 만료·일회성·계정 존재 노출·재설정 후 세션 처리를 확인해 줘."],"requirements":["외부 인증 서비스를 사용 중이면 제공 기능을 우선 활용하고 비밀번호 저장 기능을 중복 제작하지 마.","직접 관리가 꼭 필요한 경우 검증된 비밀번호 전용 해시 라이브러리와 현재 공식 권장 설정을 검토해 줘.","재설정 토큰을 충분히 예측하기 어렵게 만들고 만료·일회 사용·요청 횟수 제한을 적용해 줘.","비밀번호가 원문으로 저장된 것을 발견하면 저장 방식을 고치는 작업과 함께 노출 범위 조사, 비밀번호 변경 안내 계획도 제시해 줘."],"tests":["같은 비밀번호로 만든 서로 다른 시험 계정의 저장값이 같은지 확인하되 실제 비밀번호와 해시 전체를 보고서에 싣지 마.","틀린 비밀번호·없는 계정에 대한 응답으로 계정 존재를 쉽게 구분할 수 있는지 확인해 줘.","만료되거나 이미 사용한 재설정 링크가 거부되는지 확인해 줘.","정상 로그인과 로그아웃, 재설정 이후 로그인이 되는지 가상 계정으로 확인해 줘."],"location":"체험 앱에서는 Network → password-record.json → Response로 원문 저장 예시를 봅니다. 해시 비교는 브라우저 계산 예시입니다. 자기 앱의 실제 저장 방식은 서버 코드나 인증 서비스 설정에서 확인하며 F12만으로 판단할 수 없습니다.","links":["https://webapp-security-lab.vercel.app/#/passwords","https://cheatsheetseries.owasp.org/cheatsheets/Password_Storage_Cheat_Sheet.html"],"branches":[["소셜 로그인만 쓰는 경우","앱이 비밀번호를 직접 받거나 저장하지 않는지 확인하고 인증 서비스의 세션·권한·계정 삭제 설정에 집중해 줘."],["비밀번호 원문 저장을 발견한 경우","시험 계정인지 실제 계정인지 먼저 구분해 줘. 원문 출력 없이 노출 위치와 기간을 조사하고 실제 사용자 대응은 운영 책임자 확인 후 진행하도록 계획해 줘."]],"prompts":[{"id":"a14-inspect","category":"기본 진행","title":"1 현재 상태부터 확인하기","when":"프로젝트를 연 뒤 처음 보냅니다. 파일을 고치기 전 단계입니다.","text":"활동: 비밀번호 저장과 재설정 확인\n앱 이름과 프로젝트: [입력]\n이번 시험 주소: [입력]\n준비 정보: 로그인 제공 방식, 시험 계정, 재설정 기능 유무\n현재 상황: [입력]\n사용할 가상 자료: [입력]\n\n이 활동에 해당하는지부터 확인해 줘. 아직 파일이나 설정은 수정하지 마.\n1. 인증 제공 업체가 관리하는 비밀번호인지 앱이 직접 관리하는지 먼저 확인해 줘.\n2. 원문 비밀번호가 코드·DB·로그·응답에 저장되거나 출력되는지 값은 가린 채 점검해 줘.\n3. 직접 저장한다면 현재 해시 방식과 계정마다 다른 salt를 쓰는지 확인해 줘. salt는 같은 비밀번호라도 저장값이 달라지도록 해시 계산에 함께 사용하는 값이라는 설명도 덧붙여 줘. 단순 SHA 해시만으로 안전하게 저장한다고 판단하지 마.\n4. 재설정 링크의 만료·일회성·계정 존재 노출·재설정 후 세션 처리를 확인해 줘.\n\n결과는 표로 정리해 줘. 표에는 확인 항목, 현재 동작, 근거가 있는 파일이나 설정 위치, 발견한 문제와 추가로 확인할 내용을 적어 줘. 코드에서 확인한 사실과 추정은 구분해 줘. 내가 직접 확인할 메뉴·버튼·파일 이름도 알려 줘. 파일을 읽지 못했다면 그 사실을 표시해 줘.\n실제 학생 정보·비밀키·인증 토큰은 출력하지 말고 필요한 값은 가려 줘. 내 앱 또는 허락받은 시험 환경만 대상으로 해 줘.\n참고할 확인 위치: 체험 앱에서는 Network → password-record.json → Response로 원문 저장 예시를 봅니다. 해시 비교는 브라우저 계산 예시입니다. 자기 앱의 실제 저장 방식은 서버 코드나 인증 서비스 설정에서 확인하며 F12만으로 판단할 수 없습니다.","next":"현재 구조와 해당 여부를 확인합니다. 모르는 정보는 먼저 확인하고, 수정이 필요하면 2번으로 진행합니다."},{"id":"a14-plan","category":"기본 진행","title":"2 수정 방법과 범위 정하기","when":"1번 답변에서 실제로 고칠 항목을 골랐을 때 보냅니다.","text":"활동: 비밀번호 저장과 재설정 확인\n앱 이름과 프로젝트: [입력]\n이번 시험 주소: [입력]\n준비 정보: 로그인 제공 방식, 시험 계정, 재설정 기능 유무\n현재 상황: [입력]\n사용할 가상 자료: [입력]\n앞에서 확인한 문제와 근거: [1번 결과 중 해당 부분을 붙이기]\n이번에 고칠 항목: [입력]\n\n구현 전에 다음 조건으로 수정 계획을 만들어 줘.\n1. 외부 인증 서비스를 사용 중이면 제공 기능을 우선 활용하고 비밀번호 저장 기능을 중복 제작하지 마.\n2. 직접 관리가 꼭 필요한 경우 검증된 비밀번호 전용 해시 라이브러리와 현재 공식 권장 설정을 검토해 줘.\n3. 재설정 토큰을 충분히 예측하기 어렵게 만들고 만료·일회 사용·요청 횟수 제한을 적용해 줘.\n4. 비밀번호가 원문으로 저장된 것을 발견하면 저장 방식을 고치는 작업과 함께 노출 범위 조사, 비밀번호 변경 안내 계획도 제시해 줘.\n\n기존 기능을 유지하면서 문제를 고칠 방법부터 제안해 줘. 방법이 여러 가지라면 필요한 서비스와 비용, 사용 방법이 달라지는 부분, 이전 상태로 되돌릴 방법을 비교해 줘. 반드시 고쳐야 할 부분과 선택해서 개선할 부분을 구분해 줘.\n변경할 파일, 학생 또는 교사 화면에서 달라질 부분, 필요한 관리 설정, 시험할 가상 입력을 순서대로 적어 줘. 서버가 없는 앱이라면 지금 할 수 있는 것과 서버가 필요한 것을 분리해 줘.\n아직 코드를 수정하거나 서비스를 만들지 마. 내가 결정해야 할 사항이 있으면 선택지와 차이를 설명하고 물어봐 줘.","next":"수정할 내용과 비용, 정보 수집·전송·보관 방식이 달라지는지 확인한 뒤 진행할 방법을 정합니다. 학교가 판단해야 하는 내용은 먼저 확인합니다."},{"id":"a14-implement","category":"기본 진행","title":"3 선택한 범위 구현하기","when":"수정 계획을 검토한 뒤 승인할 범위를 직접 적고 보냅니다.","text":"활동: 비밀번호 저장과 재설정 확인\n앱 이름과 프로젝트: [입력]\n이번 시험 주소: [입력]\n준비 정보: 로그인 제공 방식, 시험 계정, 재설정 기능 유무\n현재 상황: [입력]\n사용할 가상 자료: [입력]\n승인한 수정안: [선택한 방법과 항목을 정확히 입력]\n수정할 파일 또는 기능 범위: [입력]\n이번에 제외할 것: [입력]\n\n위에 승인한 범위만 구현해 줘. 시작 전에 현재 변경 파일을 확인해 다른 작업을 보존해 줘.\n1. 외부 인증 서비스를 사용 중이면 제공 기능을 우선 활용하고 비밀번호 저장 기능을 중복 제작하지 마.\n2. 직접 관리가 꼭 필요한 경우 검증된 비밀번호 전용 해시 라이브러리와 현재 공식 권장 설정을 검토해 줘.\n3. 재설정 토큰을 충분히 예측하기 어렵게 만들고 만료·일회 사용·요청 횟수 제한을 적용해 줘.\n4. 비밀번호가 원문으로 저장된 것을 발견하면 저장 방식을 고치는 작업과 함께 노출 범위 조사, 비밀번호 변경 안내 계획도 제시해 줘.\n\n한 부분씩 수정하고 실행 결과를 확인해 줘. 기존 디자인과 정상 기능은 유지해 줘. 새 서비스 생성·운영 자료 삭제·유료 호출·커밋·푸시·배포는 이 요청에 구체적으로 승인한 경우에만 실행해 줘. 요청하지 않은 변경이 필요하면 진행 전에 이유를 설명해 줘.\n수정 후 바꾼 파일과 이유, 실행한 검사, 아직 하지 못한 시험, 내가 누를 버튼 순서를 적어 줘. 실제 학생 정보·비밀키·인증 토큰은 출력하지 말고 필요한 값은 가려 줘. 내 앱 또는 허락받은 시험 환경만 대상으로 해 줘.","next":"빌드나 실행 오류가 없는지 확인한 뒤 4번으로 진행합니다. 허용해야 할 동작은 정상적으로 되고, 차단해야 할 동작은 막히는지 함께 시험합니다."},{"id":"a14-verify","category":"기본 진행","title":"4 수정 결과 직접 확인하기","when":"구현이 끝났거나 기존 기능이 안전하게 동작하는지 검증할 때 보냅니다.","text":"활동: 비밀번호 저장과 재설정 확인\n앱 이름과 프로젝트: [입력]\n이번 시험 주소: [입력]\n준비 정보: 로그인 제공 방식, 시험 계정, 재설정 기능 유무\n현재 상황: [입력]\n사용할 가상 자료: [입력]\n이번 수정 내용: [입력 또는 기존 기능 검증]\n시험할 버전과 주소: [입력]\n\n다음 조건을 가상 자료로 다시 시험해 줘.\n1. 같은 비밀번호로 만든 서로 다른 시험 계정의 저장값이 같은지 확인하되 실제 비밀번호와 해시 전체를 보고서에 싣지 마.\n2. 틀린 비밀번호·없는 계정에 대한 응답으로 계정 존재를 쉽게 구분할 수 있는지 확인해 줘.\n3. 만료되거나 이미 사용한 재설정 링크가 거부되는지 확인해 줘.\n4. 정상 로그인과 로그아웃, 재설정 이후 로그인이 되는지 가상 계정으로 확인해 줘.\n\n내가 직접 따라 할 수 있도록 준비 계정과 상태 → 클릭 또는 입력 → 확인할 실제 탭·요청·필드 → 기대 결과를 항목마다 적어 줘.\n확인할 위치: 체험 앱에서는 Network → password-record.json → Response로 원문 저장 예시를 봅니다. 해시 비교는 브라우저 계산 예시입니다. 자기 앱의 실제 저장 방식은 서버 코드나 인증 서비스 설정에서 확인하며 F12만으로 판단할 수 없습니다.\n자기 앱에서 이름이 다르면 코드와 실제 요청에서 맞는 이름을 찾아 줘. 실제로 존재하는지 확인하지 않은 요청명을 만들어 내지 마.\n허용해야 할 동작과 차단해야 할 동작을 함께 시험해 줘. 항목마다 실행 여부, 실제 결과, 확인한 화면이나 기록을 적고, 시험하지 못했다면 이유를 설명해 줘. 응답 코드와 실제로 받은 자료를 함께 확인하고, 저장 기능이 있다면 저장된 결과도 확인해 줘.\n이 활동을 완료해도 앱 전체의 안전이 보장된다고 표현하지 마. 실제 학생 정보·비밀키·인증 토큰은 출력하지 말고 필요한 값은 가려 줘. 내 앱 또는 허락받은 시험 환경만 대상으로 해 줘.","next":"기대 결과와 실제 결과가 같으면 활동 기록을 정리합니다. 다르면 “오류 해결” 프롬프트를 사용하고 같은 조건으로 재시험합니다."},{"id":"a14-branch1","category":"상황별 진행","title":"소셜 로그인만 쓰는 경우","when":"기본 순서로 진행하다가 이 상황에 해당하면 사용합니다.","text":"활동: 비밀번호 저장과 재설정 확인\n앱 이름과 프로젝트: [입력]\n이번 시험 주소: [입력]\n준비 정보: 로그인 제공 방식, 시험 계정, 재설정 기능 유무\n현재 상황: [입력]\n사용할 가상 자료: [입력]\n현재 겪는 상황: 소셜 로그인만 쓰는 경우\n이미 한 행동과 나온 결과: [입력]\n\n앱이 비밀번호를 직접 받거나 저장하지 않는지 확인하고 인증 서비스의 세션·권한·계정 삭제 설정에 집중해 줘.\n먼저 관련 코드·화면·설정에서 현재 상태를 확인하고 이 상황이 생긴 이유를 근거와 함께 설명해 줘. 현재 환경에서 확인할 수 없는 것은 따로 표시해 줘.\n이 활동에서 유지할 조건:\n1. 외부 인증 서비스를 사용 중이면 제공 기능을 우선 활용하고 비밀번호 저장 기능을 중복 제작하지 마.\n2. 직접 관리가 꼭 필요한 경우 검증된 비밀번호 전용 해시 라이브러리와 현재 공식 권장 설정을 검토해 줘.\n3. 재설정 토큰을 충분히 예측하기 어렵게 만들고 만료·일회 사용·요청 횟수 제한을 적용해 줘.\n\n진행 순서를 “지금 확인할 것 → 선택 가능한 방법 → 내가 승인할 변경 → 실행 후 다시 확인할 결과”로 정리해 줘. 앱에 필요 없는 기능을 추가하거나 검사를 끄는 방식으로 해결하지 마.\n재시험에서는 다음 조건을 포함해 줘:\n1. 같은 비밀번호로 만든 서로 다른 시험 계정의 저장값이 같은지 확인하되 실제 비밀번호와 해시 전체를 보고서에 싣지 마.\n2. 틀린 비밀번호·없는 계정에 대한 응답으로 계정 존재를 쉽게 구분할 수 있는지 확인해 줘.\n수정이 필요하면 먼저 범위를 제안하고 내 확인 전 운영 설정을 바꾸지 마. 실제 학생 정보·비밀키·인증 토큰은 출력하지 말고 필요한 값은 가려 줘. 내 앱 또는 허락받은 시험 환경만 대상으로 해 줘.","next":"이 상황에 맞는 방법을 선택한 뒤 기본 진행의 구현 또는 재시험 단계로 돌아갑니다. 해당 없음이면 이유를 기록하고 다른 활동을 고릅니다."},{"id":"a14-branch2","category":"상황별 진행","title":"비밀번호 원문 저장을 발견한 경우","when":"기본 순서로 진행하다가 이 상황에 해당하면 사용합니다.","text":"활동: 비밀번호 저장과 재설정 확인\n앱 이름과 프로젝트: [입력]\n이번 시험 주소: [입력]\n준비 정보: 로그인 제공 방식, 시험 계정, 재설정 기능 유무\n현재 상황: [입력]\n사용할 가상 자료: [입력]\n현재 겪는 상황: 비밀번호 원문 저장을 발견한 경우\n이미 한 행동과 나온 결과: [입력]\n\n시험 계정인지 실제 계정인지 먼저 구분해 줘. 원문 출력 없이 노출 위치와 기간을 조사하고 실제 사용자 대응은 운영 책임자 확인 후 진행하도록 계획해 줘.\n먼저 관련 코드·화면·설정에서 현재 상태를 확인하고 이 상황이 생긴 이유를 근거와 함께 설명해 줘. 현재 환경에서 확인할 수 없는 것은 따로 표시해 줘.\n이 활동에서 유지할 조건:\n1. 외부 인증 서비스를 사용 중이면 제공 기능을 우선 활용하고 비밀번호 저장 기능을 중복 제작하지 마.\n2. 직접 관리가 꼭 필요한 경우 검증된 비밀번호 전용 해시 라이브러리와 현재 공식 권장 설정을 검토해 줘.\n3. 재설정 토큰을 충분히 예측하기 어렵게 만들고 만료·일회 사용·요청 횟수 제한을 적용해 줘.\n\n진행 순서를 “지금 확인할 것 → 선택 가능한 방법 → 내가 승인할 변경 → 실행 후 다시 확인할 결과”로 정리해 줘. 앱에 필요 없는 기능을 추가하거나 검사를 끄는 방식으로 해결하지 마.\n재시험에서는 다음 조건을 포함해 줘:\n1. 같은 비밀번호로 만든 서로 다른 시험 계정의 저장값이 같은지 확인하되 실제 비밀번호와 해시 전체를 보고서에 싣지 마.\n2. 틀린 비밀번호·없는 계정에 대한 응답으로 계정 존재를 쉽게 구분할 수 있는지 확인해 줘.\n수정이 필요하면 먼저 범위를 제안하고 내 확인 전 운영 설정을 바꾸지 마. 실제 학생 정보·비밀키·인증 토큰은 출력하지 말고 필요한 값은 가려 줘. 내 앱 또는 허락받은 시험 환경만 대상으로 해 줘.","next":"이 상황에 맞는 방법을 선택한 뒤 기본 진행의 구현 또는 재시험 단계로 돌아갑니다. 해당 없음이면 이유를 기록하고 다른 활동을 고릅니다."},{"id":"a14-locate","category":"확인 위치 도움","title":"안내된 화면이나 요청을 찾지 못할 때","when":"F12에 설명한 파일·요청이 없거나 확인할 곳을 모르겠을 때 보냅니다.","text":"활동: 비밀번호 저장과 재설정 확인\n앱 이름과 프로젝트: [입력]\n이번 시험 주소: [입력]\n준비 정보: 로그인 제공 방식, 시험 계정, 재설정 기능 유무\n현재 상황: [입력]\n사용할 가상 자료: [입력]\n내가 보고 있는 주소와 창: [입력]\n누른 버튼 또는 실행한 동작: [입력]\n열어 둔 개발자 도구 탭과 필터: [입력 또는 모름]\n찾으려는 정보: [입력]\n현재 화면 또는 가린 오류 내용: [붙이기]\n\n참고 안내: 체험 앱에서는 Network → password-record.json → Response로 원문 저장 예시를 봅니다. 해시 비교는 브라우저 계산 예시입니다. 자기 앱의 실제 저장 방식은 서버 코드나 인증 서비스 설정에서 확인하며 F12만으로 판단할 수 없습니다.\n이 안내가 체험 앱의 가상 자료인지 내 앱의 실제 동작인지 먼저 구분해 줘. 프로젝트에서 이 동작이 어떤 요청·파일·저장소로 연결되는지 찾아 줘.\nNetwork라면 동작 전에 열기, 기록 켜기, 목록 지우기, 필터 확인, 같은 동작 다시 하기, 새 요청 선택, Headers·Payload·Response 중 볼 위치를 실제 이름으로 알려 줘. 정적 파일이면 All 필터도 확인해 줘. 새 창을 열었다면 그 창에서 F12를 열어야 하는지 설명해 줘.\n브라우저 검사에서 막아 요청이 없거나 아직 동작을 실행하지 않은 경우도 구분해 줘. 서버에만 있는 정보는 F12에서 찾으라고 하지 말고 코드·관리 화면·시험 환경에서 확인할 방법을 제시해 줘.\n확인할 자료가 실제로 없으면 없다고 말하고 필요한 시험 준비를 설명해 줘. 캡처 요청에는 가려야 할 정보도 알려 줘. 실제 학생 정보·비밀키·인증 토큰은 출력하지 말고 필요한 값은 가려 줘. 내 앱 또는 허락받은 시험 환경만 대상으로 해 줘.","next":"정확한 위치를 찾은 뒤 해당 활동의 4번 프롬프트로 결과를 확인합니다. 없다는 사실 자체가 기대 결과인지 먼저 판단합니다."},{"id":"a14-error","category":"오류 해결","title":"예상과 다른 결과가 나올 때","when":"실행 오류, 정상 기능 실패, 예상한 차단이 되지 않는 경우에 보냅니다.","text":"활동: 비밀번호 저장과 재설정 확인\n앱 이름과 프로젝트: [입력]\n이번 시험 주소: [입력]\n준비 정보: 로그인 제공 방식, 시험 계정, 재설정 기능 유무\n현재 상황: [입력]\n사용할 가상 자료: [입력]\n실행한 단계와 입력: [입력]\n기대한 결과: [입력]\n실제로 나온 결과: [입력]\n오류 문구: [비밀값을 가리고 붙이기]\n직전에 변경한 파일 또는 설정: [입력 또는 모름]\n\n원인을 추측해서 여러 곳을 한꺼번에 바꾸지 말고, 재현 조건과 현재 코드를 비교해 줘. 요청이 만들어지는지, 서버에 도착하는지, 검사와 반환·저장이 어디서 달라지는지 관련 단계만 확인해 줘.\n특히 다음 점검 기준을 다시 봐 줘:\n1. 인증 제공 업체가 관리하는 비밀번호인지 앱이 직접 관리하는지 먼저 확인해 줘.\n2. 원문 비밀번호가 코드·DB·로그·응답에 저장되거나 출력되는지 값은 가린 채 점검해 줘.\n\n가능한 원인마다 그렇게 판단한 이유와 먼저 확인할 방법을 알려 줘. 운영 자료를 삭제하거나 권한·입력 검사를 전체 해제하는 방식은 사용하지 마. 수정이 필요하면 바꿀 내용을 먼저 제안하고 내가 승인한 뒤 적용해 줘.\n수정 후 같은 실패 조건과 다음 정상 조건을 모두 재시험해 줘:\n1. 같은 비밀번호로 만든 서로 다른 시험 계정의 저장값이 같은지 확인하되 실제 비밀번호와 해시 전체를 보고서에 싣지 마.\n2. 틀린 비밀번호·없는 계정에 대한 응답으로 계정 존재를 쉽게 구분할 수 있는지 확인해 줘.\n3. 만료되거나 이미 사용한 재설정 링크가 거부되는지 확인해 줘.\n4. 정상 로그인과 로그아웃, 재설정 이후 로그인이 되는지 가상 계정으로 확인해 줘.\n완료 보고에는 실제 실행한 결과와 실행하지 못한 이유를 구분해 줘.","next":"실패 원인을 확인하고 승인한 수정만 적용합니다. 같은 실패 조건이 해결됐는지와 원래 정상 기능이 유지되는지 함께 봅니다."},{"id":"a14-finish","category":"활동 마무리","title":"확인 기록과 다음 점검 정리하기","when":"직접 시험을 확인한 뒤, 또는 해당 없음·추가 확인으로 종료할 때 보냅니다.","text":"활동: 비밀번호 저장과 재설정 확인\n앱 이름과 프로젝트: [입력]\n이번 시험 주소: [입력]\n준비 정보: 로그인 제공 방식, 시험 계정, 재설정 기능 유무\n현재 상황: [입력]\n사용할 가상 자료: [입력]\n실제로 진행한 단계: [입력]\n확인한 결과 또는 아직 확인하지 못한 내용: [입력]\n\n이번 활동 기록을 Markdown으로 정리해 줘. 항목은 앱과 시험 버전, 점검한 기능, 발견한 문제와 위치, 승인한 수정, 시험 입력과 기대 결과, 실제 결과와 근거, 추가 확인할 일로 구성해 줘.\n앞으로 개발할 때 지킬 기준도 우리 앱의 실제 코드·설정 위치와 연결해 적어 줘:\n1. 외부 인증 서비스를 사용 중이면 제공 기능을 우선 활용하고 비밀번호 저장 기능을 중복 제작하지 마.\n2. 직접 관리가 꼭 필요한 경우 검증된 비밀번호 전용 해시 라이브러리와 현재 공식 권장 설정을 검토해 줘.\n3. 재설정 토큰을 충분히 예측하기 어렵게 만들고 만료·일회 사용·요청 횟수 제한을 적용해 줘.\n4. 비밀번호가 원문으로 저장된 것을 발견하면 저장 방식을 고치는 작업과 함께 노출 범위 조사, 비밀번호 변경 안내 계획도 제시해 줘.\n\n활동 상태는 확인 완료·추가 확인·해당 없음 중 근거에 맞게 적어 줘. 구현만 하고 시험하지 않았다면 확인 완료로 쓰지 마. 문제를 발견하지 못한 것과 충분히 검증한 것을 구분해 줘.\n다음 수정 때 다시 실행할 시험은 다음 내용을 바탕으로 정리해 줘:\n1. 같은 비밀번호로 만든 서로
