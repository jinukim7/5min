보는 교사 화면 만들기\n앱 이름과 프로젝트: [입력]\n이번 시험 주소: [입력]\n준비 정보: 수업 단계, 개인·모둠 단위, 교사가 도와줄 상황, 기존 교사 화면\n현재 상황: [입력]\n사용할 가상 자료: [입력]\n내가 보고 있는 주소와 창: [입력]\n누른 버튼 또는 실행한 동작: [입력]\n열어 둔 개발자 도구 탭과 필터: [입력 또는 모름]\n찾으려는 정보: [입력]\n현재 화면 또는 가린 오류 내용: [붙이기]\n\n참고 안내: 교사 화면을 열고 가상 학생의 별도 브라우저에서 상태를 바꿉니다. F12 → Network에서 갱신 요청 간격과 Response의 상태·학생 범위를 봅니다. WebSocket을 쓰면 WS 메시지도 확인합니다.\n이 안내가 체험 앱의 가상 자료인지 내 앱의 실제 동작인지 먼저 구분해 줘. 프로젝트에서 이 동작이 어떤 요청·파일·저장소로 연결되는지 찾아 줘.\nNetwork라면 동작 전에 열기, 기록 켜기, 목록 지우기, 필터 확인, 같은 동작 다시 하기, 새 요청 선택, Headers·Payload·Response 중 볼 위치를 실제 이름으로 알려 줘. 정적 파일이면 All 필터도 확인해 줘. 새 창을 열었다면 그 창에서 F12를 열어야 하는지 설명해 줘.\n브라우저 검사에서 막아 요청이 없거나 아직 동작을 실행하지 않은 경우도 구분해 줘. 서버에만 있는 정보는 F12에서 찾으라고 하지 말고 코드·관리 화면·시험 환경에서 확인할 방법을 제시해 줘.\n확인할 자료가 실제로 없으면 없다고 말하고 필요한 시험 준비를 설명해 줘. 캡처 요청에는 가려야 할 정보도 알려 줘. 실제 학생 정보·비밀키·인증 토큰은 출력하지 말고 필요한 값은 가려 줘. 내 앱 또는 허락받은 시험 환경만 대상으로 해 줘.","next":"정확한 위치를 찾은 뒤 해당 활동의 4번 프롬프트로 결과를 확인합니다. 없다는 사실 자체가 기대 결과인지 먼저 판단합니다."},{"id":"a20-error","category":"오류 해결","title":"예상과 다른 결과가 나올 때","when":"실행 오류, 정상 기능 실패, 예상한 차단이 되지 않는 경우에 보냅니다.","text":"활동: 학생과 모둠의 활동을 보는 교사 화면 만들기\n앱 이름과 프로젝트: [입력]\n이번 시험 주소: [입력]\n준비 정보: 수업 단계, 개인·모둠 단위, 교사가 도와줄 상황, 기존 교사 화면\n현재 상황: [입력]\n사용할 가상 자료: [입력]\n실행한 단계와 입력: [입력]\n기대한 결과: [입력]\n실제로 나온 결과: [입력]\n오류 문구: [비밀값을 가리고 붙이기]\n직전에 변경한 파일 또는 설정: [입력 또는 모름]\n\n원인을 추측해서 여러 곳을 한꺼번에 바꾸지 말고, 재현 조건과 현재 코드를 비교해 줘. 요청이 만들어지는지, 서버에 도착하는지, 검사와 반환·저장이 어디서 달라지는지 관련 단계만 확인해 줘.\n특히 다음 점검 기준을 다시 봐 줘:\n1. 교사가 알아야 할 참여·진행·완료·도움 요청 상태를 현재 수업 흐름에서 찾아 줘.\n2. 학생의 어떤 행동을 기준으로 참여·진행·완료 상태를 표시하는지 확인해 줘. 페이지를 열었다는 이유만으로 학습 완료로 표시하지 마.\n\n가능한 원인마다 그렇게 판단한 이유와 먼저 확인할 방법을 알려 줘. 운영 자료를 삭제하거나 권한·입력 검사를 전체 해제하는 방식은 사용하지 마. 수정이 필요하면 바꿀 내용을 먼저 제안하고 내가 승인한 뒤 적용해 줘.\n수정 후 같은 실패 조건과 다음 정상 조건을 모두 재시험해 줘:\n1. 가상 학생의 입장·진행·완료·도움 요청이 교사 화면에 맞게 표시되는지 확인해 줘.\n2. 다른 학급 교사와 학생이 해당 교사 화면의 데이터를 직접 요청해도 거부되는지 확인해 줘.\n3. 학생이 접속을 끊거나 새로고침해도 완료 상태가 잘못 바뀌지 않는지 확인해 줘.\n4. F12에서 불필요한 원문 전송과 과도한 자동 요청이 없는지 확인해 줘.\n완료 보고에는 실제 실행한 결과와 실행하지 못한 이유를 구분해 줘.","next":"실패 원인을 확인하고 승인한 수정만 적용합니다. 같은 실패 조건이 해결됐는지와 원래 정상 기능이 유지되는지 함께 봅니다."},{"id":"a20-finish","category":"활동 마무리","title":"확인 기록과 다음 점검 정리하기","when":"직접 시험을 확인한 뒤, 또는 해당 없음·추가 확인으로 종료할 때 보냅니다.","text":"활동: 학생과 모둠의 활동을 보는 교사 화면 만들기\n앱 이름과 프로젝트: [입력]\n이번 시험 주소: [입력]\n준비 정보: 수업 단계, 개인·모둠 단위, 교사가 도와줄 상황, 기존 교사 화면\n현재 상황: [입력]\n사용할 가상 자료: [입력]\n실제로 진행한 단계: [입력]\n확인한 결과 또는 아직 확인하지 못한 내용: [입력]\n\n이번 활동 기록을 Markdown으로 정리해 줘. 항목은 앱과 시험 버전, 점검한 기능, 발견한 문제와 위치, 승인한 수정, 시험 입력과 기대 결과, 실제 결과와 근거, 추가 확인할 일로 구성해 줘.\n앞으로 개발할 때 지킬 기준도 우리 앱의 실제 코드·설정 위치와 연결해 적어 줘:\n1. 모둠 또는 학생별 상태와 도움 요청을 한눈에 보이게 하고 의미가 불분명한 점수는 만들지 마.\n2. 누구를 도와야 하는지 확인할 때 필요한 범위만 펼쳐 보고 원문 열람은 정한 정책과 권한에 따라 제한해 줘.\n3. 진행 상태 계산 기준·마지막 갱신 시각·접속 끊김·자료 없음 상태를 구분해 줘.\n4. 서버에서 교사의 학급 권한을 검사하고 화면을 닫거나 수업이 끝나면 불필요한 갱신을 멈추게 해 줘.\n\n활동 상태는 확인 완료·추가 확인·해당 없음 중 근거에 맞게 적어 줘. 구현만 하고 시험하지 않았다면 확인 완료로 쓰지 마. 문제를 발견하지 못한 것과 충분히 검증한 것을 구분해 줘.\n다음 수정 때 다시 실행할 시험은 다음 내용을 바탕으로 정리해 줘:\n1. 가상 학생의 입장·진행·완료·도움 요청이 교사 화면에 맞게 표시되는지 확인해 줘.\n2. 다른 학급 교사와 학생이 해당 교사 화면의 데이터를 직접 요청해도 거부되는지 확인해 줘.\n보고서에 원문 학생 자료나 비밀값을 넣지 마. 이 기록만으로 학교 승인이나 앱 전체의 안전을 보장한다고 쓰지 마.","next":"기록을 자신의 프로젝트에 보관하고 필요한 다음 활동을 선택합니다. 새로운 대화를 시작할 때는 이 기록과 공통 시작 프롬프트를 함께 제공합니다."}]},{"id":21,"title":"위험 신호를 교사가 확인하는 절차 만들기","group":"학생 수업 운영","slides":"38~41","condition":"입력 검사나 AI 분류 결과를 교사에게 알리는 앱","inputs":"위험 유형, 교사 확인 절차, 보관 정책, 도움 연결 방법","inspect":["어떤 입력이 어떤 이유로 경고가 되는지, 판단 근거와 불확실성을 확인해 줘.","감지 횟수만으로 계정을 잠그거나 처벌하는 기능이 있는지 확인해 줘.","교사에게 보이는 유형·시각·처리 상태·학생 연결 범위가 필요한 수준인지 확인해 줘.","경고 원문 저장 정책과 실제 열람 기능이 서로 모순되는지 확인해 줘."],"requirements":["경미하거나 불확실한 입력은 재입력 안내, 반복되는 경미 신호는 잠시 멈춤과 교사 확인으로 구분해 줘.","협박·위기 등 고위험 신호는 횟수와 관계없이 사람의 확인으로 연결하도록 설계해 줘. AI만으로 위기 여부를 확정하지 마.","이용 제한이 있으면 교사 검토·해제·학생의 설명 기회를 제공해 줘.","원문을 저장하지 않기로 했다면 알림에도 원문을 포함하지 마. 필요한 부분만 짧게 발췌하고 개인정보를 가려 저장하기로 했다면 그 기준에 맞춰 알림과 열람 기능을 만들어 줘."],"tests":["정상·경미·반복·고위험 가상 문장을 넣고 안내와 교사 알림을 각각 확인해 줘.","오탐으로 제한된 가상 학생이 교사 확인 후 다시 이용할 수 있는지 확인해 줘.","다른 교사나 학생이 경고 기록을 조회·해제할 수 없는지 확인해 줘.","원문을 저장하지 않는 설정에서 DB·응답·로그에도 원문이 남지 않는지 확인해 줘."],"location":"학생 안내와 교사 경고 화면을 함께 봅니다. Network → Response에서 경고에 포함된 필드를 확인합니다. 저장·열람 이력과 삭제는 서버·저장소에서 별도로 확인합니다.","links":["https://hitl-chat-gamma.vercel.app/"],"branches":[["3회 자동 잠금이 이미 있는 경우","횟수만으로 처벌하지 않게 현재 분기와 데이터를 조사해 줘. 심각도·일시 중지·교사 검토·해제 경로를 포함한 변경안을 먼저 제시해 줘."],["교사가 즉시 응답하기 어려운 경우","즉시 응답을 보장하는 문구를 쓰지 마. 학교가 정한 담당자·운영 시간·긴급 도움 안내에 따라 실제 가능한 연결 흐름을 제안해 줘."]],"prompts":[{"id":"a21-inspect","category":"기본 진행","title":"1 현재 상태부터 확인하기","when":"프로젝트를 연 뒤 처음 보냅니다. 파일을 고치기 전 단계입니다.","text":"활동: 위험 신호를 교사가 확인하는 절차 만들기\n앱 이름과 프로젝트: [입력]\n이번 시험 주소: [입력]\n준비 정보: 위험 유형, 교사 확인 절차, 보관 정책, 도움 연결 방법\n현재 상황: [입력]\n사용할 가상 자료: [입력]\n\n이 활동에 해당하는지부터 확인해 줘. 아직 파일이나 설정은 수정하지 마.\n1. 어떤 입력이 어떤 이유로 경고가 되는지, 판단 근거와 불확실성을 확인해 줘.\n2. 감지 횟수만으로 계정을 잠그거나 처벌하는 기능이 있는지 확인해 줘.\n3. 교사에게 보이는 유형·시각·처리 상태·학생 연결 범위가 필요한 수준인지 확인해 줘.\n4. 경고 원문 저장 정책과 실제 열람 기능이 서로 모순되는지 확인해 줘.\n\n결과는 표로 정리해 줘. 표에는 확인 항목, 현재 동작, 근거가 있는 파일이나 설정 위치, 발견한 문제와 추가로 확인할 내용을 적어 줘. 코드에서 확인한 사실과 추정은 구분해 줘. 내가 직접 확인할 메뉴·버튼·파일 이름도 알려 줘. 파일을 읽지 못했다면 그 사실을 표시해 줘.\n실제 학생 정보·비밀키·인증 토큰은 출력하지 말고 필요한 값은 가려 줘. 내 앱 또는 허락받은 시험 환경만 대상으로 해 줘.\n참고할 확인 위치: 학생 안내와 교사 경고 화면을 함께 봅니다. Network → Response에서 경고에 포함된 필드를 확인합니다. 저장·열람 이력과 삭제는 서버·저장소에서 별도로 확인합니다.","next":"현재 구조와 해당 여부를 확인합니다. 모르는 정보는 먼저 확인하고, 수정이 필요하면 2번으로 진행합니다."},{"id":"a21-plan","category":"기본 진행","title":"2 수정 방법과 범위 정하기","when":"1번 답변에서 실제로 고칠 항목을 골랐을 때 보냅니다.","text":"활동: 위험 신호를 교사가 확인하는 절차 만들기\n앱 이름과 프로젝트: [입력]\n이번 시험 주소: [입력]\n준비 정보: 위험 유형, 교사 확인 절차, 보관 정책, 도움 연결 방법\n현재 상황: [입력]\n사용할 가상 자료: [입력]\n앞에서 확인한 문제와 근거: [1번 결과 중 해당 부분을 붙이기]\n이번에 고칠 항목: [입력]\n\n구현 전에 다음 조건으로 수정 계획을 만들어 줘.\n1. 경미하거나 불확실한 입력은 재입력 안내, 반복되는 경미 신호는 잠시 멈춤과 교사 확인으로 구분해 줘.\n2. 협박·위기 등 고위험 신호는 횟수와 관계없이 사람의 확인으로 연결하도록 설계해 줘. AI만으로 위기 여부를 확정하지 마.\n3. 이용 제한이 있으면 교사 검토·해제·학생의 설명 기회를 제공해 줘.\n4. 원문을 저장하지 않기로 했다면 알림에도 원문을 포함하지 마. 필요한 부분만 짧게 발췌하고 개인정보를 가려 저장하기로 했다면 그 기준에 맞춰 알림과 열람 기능을 만들어 줘.\n\n기존 기능을 유지하면서 문제를 고칠 방법부터 제안해 줘. 방법이 여러 가지라면 필요한 서비스와 비용, 사용 방법이 달라지는 부분, 이전 상태로 되돌릴 방법을 비교해 줘. 반드시 고쳐야 할 부분과 선택해서 개선할 부분을 구분해 줘.\n변경할 파일, 학생 또는 교사 화면에서 달라질 부분, 필요한 관리 설정, 시험할 가상 입력을 순서대로 적어 줘. 서버가 없는 앱이라면 지금 할 수 있는 것과 서버가 필요한 것을 분리해 줘.\n아직 코드를 수정하거나 서비스를 만들지 마. 내가 결정해야 할 사항이 있으면 선택지와 차이를 설명하고 물어봐 줘.","next":"수정할 내용과 비용, 정보 수집·전송·보관 방식이 달라지는지 확인한 뒤 진행할 방법을 정합니다. 학교가 판단해야 하는 내용은 먼저 확인합니다."},{"id":"a21-implement","category":"기본 진행","title":"3 선택한 범위 구현하기","when":"수정 계획을 검토한 뒤 승인할 범위를 직접 적고 보냅니다.","text":"활동: 위험 신호를 교사가 확인하는 절차 만들기\n앱 이름과 프로젝트: [입력]\n이번 시험 주소: [입력]\n준비 정보: 위험 유형, 교사 확인 절차, 보관 정책, 도움 연결 방법\n현재 상황: [입력]\n사용할 가상 자료: [입력]\n승인한 수정안: [선택한 방법과 항목을 정확히 입력]\n수정할 파일 또는 기능 범위: [입력]\n이번에 제외할 것: [입력]\n\n위에 승인한 범위만 구현해 줘. 시작 전에 현재 변경 파일을 확인해 다른 작업을 보존해 줘.\n1. 경미하거나 불확실한 입력은 재입력 안내, 반복되는 경미 신호는 잠시 멈춤과 교사 확인으로 구분해 줘.\n2. 협박·위기 등 고위험 신호는 횟수와 관계없이 사람의 확인으로 연결하도록 설계해 줘. AI만으로 위기 여부를 확정하지 마.\n3. 이용 제한이 있으면 교사 검토·해제·학생의 설명 기회를 제공해 줘.\n4. 원문을 저장하지 않기로 했다면 알림에도 원문을 포함하지 마. 필요한 부분만 짧게 발췌하고 개인정보를 가려 저장하기로 했다면 그 기준에 맞춰 알림과 열람 기능을 만들어 줘.\n\n한 부분씩 수정하고 실행 결과를 확인해 줘. 기존 디자인과 정상 기능은 유지해 줘. 새 서비스 생성·운영 자료 삭제·유료 호출·커밋·푸시·배포는 이 요청에 구체적으로 승인한 경우에만 실행해 줘. 요청하지 않은 변경이 필요하면 진행 전에 이유를 설명해 줘.\n수정 후 바꾼 파일과 이유, 실행한 검사, 아직 하지 못한 시험, 내가 누를 버튼 순서를 적어 줘. 실제 학생 정보·비밀키·인증 토큰은 출력하지 말고 필요한 값은 가려 줘. 내 앱 또는 허락받은 시험 환경만 대상으로 해 줘.","next":"빌드나 실행 오류가 없는지 확인한 뒤 4번으로 진행합니다. 허용해야 할 동작은 정상적으로 되고, 차단해야 할 동작은 막히는지 함께 시험합니다."},{"id":"a21-verify","category":"기본 진행","title":"4 수정 결과 직접 확인하기","when":"구현이 끝났거나 기존 기능이 안전하게 동작하는지 검증할 때 보냅니다.","text":"활동: 위험 신호를 교사가 확인하는 절차 만들기\n앱 이름과 프로젝트: [입력]\n이번 시험 주소: [입력]\n준비 정보: 위험 유형, 교사 확인 절차, 보관 정책, 도움 연결 방법\n현재 상황: [입력]\n사용할 가상 자료: [입력]\n이번 수정 내용: [입력 또는 기존 기능 검증]\n시험할 버전과 주소: [입력]\n\n다음 조건을 가상 자료로 다시 시험해 줘.\n1. 정상·경미·반복·고위험 가상 문장을 넣고 안내와 교사 알림을 각각 확인해 줘.\n2. 오탐으로 제한된 가상 학생이 교사 확인 후 다시 이용할 수 있는지 확인해 줘.\n3. 다른 교사나 학생이 경고 기록을 조회·해제할 수 없는지 확인해 줘.\n4. 원문을 저장하지 않는 설정에서 DB·응답·로그에도 원문이 남지 않는지 확인해 줘.\n\n내가 직접 따라 할 수 있도록 준비 계정과 상태 → 클릭 또는 입력 → 확인할 실제 탭·요청·필드 → 기대 결과를 항목마다 적어 줘.\n확인할 위치: 학생 안내와 교사 경고 화면을 함께 봅니다. Network → Response에서 경고에 포함된 필드를 확인합니다. 저장·열람 이력과 삭제는 서버·저장소에서 별도로 확인합니다.\n자기 앱에서 이름이 다르면 코드와 실제 요청에서 맞는 이름을 찾아 줘. 실제로 존재하는지 확인하지 않은 요청명을 만들어 내지 마.\n허용해야 할 동작과 차단해야 할 동작을 함께 시험해 줘. 항목마다 실행 여부, 실제 결과, 확인한 화면이나 기록을 적고, 시험하지 못했다면 이유를 설명해 줘. 응답 코드와 실제로 받은 자료를 함께 확인하고, 저장 기능이 있다면 저장된 결과도 확인해 줘.\n이 활동을 완료해도 앱 전체의 안전이 보장된다고 표현하지 마. 실제 학생 정보·비밀키·인증 토큰은 출력하지 말고 필요한 값은 가려 줘. 내 앱 또는 허락받은 시험 환경만 대상으로 해 줘.","next":"기대 결과와 실제 결과가 같으면 활동 기록을 정리합니다. 다르면 “오류 해결” 프롬프트를 사용하고 같은 조건으로 재시험합니다."},{"id":"a21-branch1","category":"상황별 진행","title":"3회 자동 잠금이 이미 있는 경우","when":"기본 순서로 진행하다가 이 상황에 해당하면 사용합니다.","text":"활동: 위험 신호를 교사가 확인하는 절차 만들기\n앱 이름과 프로젝트: [입력]\n이번 시험 주소: [입력]\n준비 정보: 위험 유형, 교사 확인 절차, 보관 정책, 도움 연결 방법\n현재 상황: [입력]\n사용할 가상 자료: [입력]\n현재 겪는 상황: 3회 자동 잠금이 이미 있는 경우\n이미 한 행동과 나온 결과: [입력]\n\n횟수만으로 처벌하지 않게 현재 분기와 데이터를 조사해 줘. 심각도·일시 중지·교사 검토·해제 경로를 포함한 변경안을 먼저 제시해 줘.\n먼저 관련 코드·화면·설정에서 현재 상태를 확인하고 이 상황이 생긴 이유를 근거와 함께 설명해 줘. 현재 환경에서 확인할 수 없는 것은 따로 표시해 줘.\n이 활동에서 유지할 조건:\n1. 경미하거나 불확실한 입력은 재입력 안내, 반복되는 경미 신호는 잠시 멈춤과 교사 확인으로 구분해 줘.\n2. 협박·위기 등 고위험 신호는 횟수와 관계없이 사람의 확인으로 연결하도록 설계해 줘. AI만으로 위기 여부를 확정하지 마.\n3. 이용 제한이 있으면 교사 검토·해제·학생의 설명 기회를 제공해 줘.\n\n진행 순서를 “지금 확인할 것 → 선택 가능한 방법 → 내가 승인할 변경 → 실행 후 다시 확인할 결과”로 정리해 줘. 앱에 필요 없는 기능을 추가하거나 검사를 끄는 방식으로 해결하지 마.\n재시험에서는 다음 조건을 포함해 줘:\n1. 정상·경미·반복·고위험 가상 문장을 넣고 안내와 교사 알림을 각각 확인해 줘.\n2. 오탐으로 제한된 가상 학생이 교사 확인 후 다시 이용할 수 있는지 확인해 줘.\n수정이 필요하면 먼저 범위를 제안하고 내 확인 전 운영 설정을 바꾸지 마. 실제 학생 정보·비밀키·인증 토큰은 출력하지 말고 필요한 값은 가려 줘. 내 앱 또는 허락받은 시험 환경만 대상으로 해 줘.","next":"이 상황에 맞는 방법을 선택한 뒤 기본 진행의 구현 또는 재시험 단계로 돌아갑니다. 해당 없음이면 이유를 기록하고 다른 활동을 고릅니다."},{"id":"a21-branch2","category":"상황별 진행","title":"교사가 즉시 응답하기 어려운 경우","when":"기본 순서로 진행하다가 이 상황에 해당하면 사용합니다.","text":"활동: 위험 신호를 교사가 확인하는 절차 만들기\n앱 이름과 프로젝트: [입력]\n이번 시험 주소: [입력]\n준비 정보: 위험 유형, 교사 확인 절차, 보관 정책, 도움 연결 방법\n현재 상황: [입력]\n사용할 가상 자료: [입력]\n현재 겪는 상황: 교사가 즉시 응답하기 어려운 경우\n이미 한 행동과 나온 결과: [입력]\n\n즉시 응답을 보장하는 문구를 쓰지 마. 학교가 정한 담당자·운영 시간·긴급 도움 안내에 따라 실제 가능한 연결 흐름을 제안해 줘.\n먼저 관련 코드·화면·설정에서 현재 상태를 확인하고 이 상황이 생긴 이유를 근거와 함께 설명해 줘. 현재 환경에서 확인할 수 없는 것은 따로 표시해 줘.\n이 활동에서 유지할 조건:\n1. 경미하거나 불확실한 입력은 재입력 안내, 반복되는 경미 신호는 잠시 멈춤과 교사 확인으로 구분해 줘.\n2. 협박·위기 등 고위험 신호는 횟수와 관계없이 사람의 확인으로 연결하도록 설계해 줘. AI만으로 위기 여부를 확정하지 마.\n3. 이용 제한이 있으면 교사 검토·해제·학생의 설명 기회를 제공해 줘.\n\n진행 순서를 “지금 확인할 것 → 선택 가능한 방법 → 내가 승인할 변경 → 실행 후 다시 확인할 결과”로 정리해 줘. 앱에 필요 없는 기능을 추가하거나 검사를 끄는 방식으로 해결하지 마.\n재시험에서는 다음 조건을 포함해 줘:\n1. 정상·경미·반복·고위험 가상 문장을 넣고 안내와 교사 알림을 각각 확인해 줘.\n2. 오탐으로 제한된 가상 학생이 교사 확인 후 다시 이용할 수 있는지 확인해 줘.\n수정이 필요하면 먼저 범위를 제안하고 내 확인 전 운영 설정을 바꾸지 마. 실제 학생 정보·비밀키·인증 토큰은 출력하지 말고 필요한 값은 가려 줘. 내 앱 또는 허락받은 시험 환경만 대상으로 해 줘.","next":"이 상황에 맞는 방법을 선택한 뒤 기본 진행의 구현 또는 재시험 단계로 돌아갑니다. 해당 없음이면 이유를 기록하고 다른 활동을 고릅니다."},{"id":"a21-locate","category":"확인 위치 도움","title":"안내된 화면이나 요청을 찾지 못할 때","when":"F12에 설명한 파일·요청이 없거나 확인할 곳을 모르겠을 때 보냅니다.","text":"활동: 위험 신호를 교사가 확인하는 절차 만들기\n앱 이름과 프로젝트: [입력]\n이번 시험 주소: [입력]\n준비 정보: 위험 유형, 교사 확인 절차, 보관 정책, 도움 연결 방법\n현재 상황: [입력]\n사용할 가상 자료: [입력]\n내가 보고 있는 주소와 창: [입력]\n누른 버튼 또는 실행한 동작: [입력]\n열어 둔 개발자 도구 탭과 필터: [입력 또는 모름]\n찾으려는 정보: [입력]\n현재 화면 또는 가린 오류 내용: [붙이기]\n\n참고 안내: 학생 안내와 교사 경고 화면을 함께 봅니다. Network → Response에서 경고에 포함된 필드를 확인합니다. 저장·열람 이력과 삭제는 서버·저장소에서 별도로 확인합니다.\n이 안내가 체험 앱의 가상 자료인지 내 앱의 실제 동작인지 먼저 구분해 줘. 프로젝트에서 이 동작이 어떤 요청·파일·저장소로 연결되는지 찾아 줘.\nNetwork라면 동작 전에 열기, 기록 켜기, 목록 지우기, 필터 확인, 같은 동작 다시 하기, 새 요청 선택, Headers·Payload·Response 중 볼 위치를 실제 이름으로 알려 줘. 정적 파일이면 All 필터도 확인해 줘. 새 창을 열었다면 그 창에서 F12를 열어야 하는지 설명해 줘.\n브라우저 검사에서 막아 요청이 없거나 아직 동작을 실행하지 않은 경우도 구분해 줘. 서버에만 있는 정보는 F12에서 찾으라고 하지 말고 코드·관리 화면·시험 환경에서 확인할 방법을 제시해 줘.\n확인할 자료가 실제로 없으면 없다고 말하고 필요한 시험 준비를 설명해 줘. 캡처 요청에는 가려야 할 정보도 알려 줘. 실제 학생 정보·비밀키·인증 토큰은 출력하지 말고 필요한 값은 가려 줘. 내 앱 또는 허락받은 시험 환경만 대상으로 해 줘.","next":"정확한 위치를 찾은 뒤 해당 활동의 4번 프롬프트로 결과를 확인합니다. 없다는 사실 자체가 기대 결과인지 먼저 판단합니다."},{"id":"a21-error","category":"오류 해결","title":"예상과 다른 결과가 나올 때","when":"실행 오류, 정상 기능 실패, 예상한 차단이 되지 않는 경우에 보냅니다.","text":"활동: 위험 신호를 교사가 확인하는 절차 만들기\n앱 이름과 프로젝트: [입력]\n이번 시험 주소: [입력]\n준비 정보: 위험 유형, 교사 확인 절차, 보관 정책, 도움 연결 방법\n현재 상황: [입력]\n사용할 가상 자료: [입력]\n실행한 단계와 입력: [입력]\n기대한 결과: [입력]\n실제로 나온 결과: [입력]\n오류 문구: [비밀값을 가리고 붙이기]\n직전에 변경한 파일 또는 설정: [입력 또는 모름]\n\n원인을 추측해서 여러 곳을 한꺼번에 바꾸지 말고, 재현 조건과 현재 코드를 비교해 줘. 요청이 만들어지는지, 서버에 도착하는지, 검사와 반환·저장이 어디서 달라지는지 관련 단계만 확인해 줘.\n특히 다음 점검 기준을 다시 봐 줘:\n1. 어떤 입력이 어떤 이유로 경고가 되는지, 판단 근거와 불확실성을 확인해 줘.\n2. 감지 횟수만으로 계정을 잠그거나 처벌하는 기능이 있는지 확인해 줘.\n\n가능한 원인마다 그렇게 판단한 이유와 먼저 확인할 방법을 알려 줘. 운영 자료를 삭제하거나 권한·입력 검사를 전체 해제하는 방식은 사용하지 마. 수정이 필요하면 바꿀 내용을 먼저 제안하고 내가 승인한 뒤 적용해 줘.\n수정 후 같은 실패 조건과 다음 정상 조건을 모두 재시험해 줘:\n1. 정상·경미·반복·고위험 가상 문장을 넣고 안내와 교사 알림을 각각 확인해 줘.\n2. 오탐으로 제한된 가상 학생이 교사 확인 후 다시 이용할 수 있는지 확인해 줘.\n3. 다른 교사나 학생이 경고 기록을 조회·해제할 수 없는지 확인해 줘.\n4. 원문을 저장하지 않는 설정에서 DB·응답·로그에도 원문이 남지 않는지 확인해 줘.\n완료 보고에는 실제 실행한 결과와 실행하지 못한 이유를 구분해 줘.","next":"실패 원인을 확인하고 승인한 수정만 적용합니다. 같은 실패 조건이 해결됐는지와 원래 정상 기능이 유지되는지 함께 봅니다."},{"id":"a21-finish","category":"활동 마무리","title":"확인 기록과 다음 점검 정리하기","when":"직접 시험을 확인한 뒤, 또는 해당 없음·추가 확인으로 종료할 때 보냅니다.","text":"활동: 위험 신호를 교사가 확인하는 절차 만들기\n앱 이름과 프로젝트: [입력]\n이번 시험 주소: [입력]\n준비 정보: 위험 유형, 교사 확인 절차, 보관 정책, 도움 연결 방법\n현재 상황: [입력]\n사용할 가상 자료: [입력]\n실제로 진행한 단계: [입력]\n확인한 결과 또는 아직 확인하지 못한 내용: [입력]\n\n이번 활동 기록을 Markdown으로 정리해 줘. 항목은 앱과 시험 버전, 점검한 기능, 발견한 문제와 위치, 승인한 수정, 시험 입력과 기대 결과, 실제 결과와 근거, 추가 확인할 일로 구성해 줘.\n앞으로 개발할 때 지킬 기준도 우리 앱의 실제 코드·설정 위치와 연결해 적어 줘:\n1. 경미하거나 불확실한 입력은 재입력 안내, 반복되는 경미 신호는 잠시 멈춤과 교사 확인으로 구분해 줘.\n2. 협박·위기 등 고위험 신호는 횟수와 관계없이 사람의 확인으로 연결하도록 설계해 줘. AI만으로 위기 여부를 확정하지 마.\n3. 이용 제한이 있으면 교사 검토·해제·학생의 설명 기회를 제공해 줘.\n4. 원문을 저장하지 않기로 했다면 알림에도 원문을 포함하지 마. 필요한 부분만 짧게 발췌하고 개인정보를 가려 저장하기로 했다면 그 기준에 맞춰 알림과 열람 기능을 만들어 줘.\n\n활동 상태는 확인 완료·추가 확인·해당 없음 중 근거에 맞게 적어 줘. 구현만 하고 시험하지 않았다면 확인 완료로 쓰지 마. 문제를 발견하지 못한 것과 충분히 검증한 것을 구분해 줘.\n다음 수정 때 다시 실행할 시험은 다음 내용을 바탕으로 정리해 줘:\n1. 정상·경미·반복·고위험 가상 문장을 넣고 안내와 교사 알림을 각각 확인해 줘.\n2. 오탐으로 제한된 가상 학생이 교사 확인 후 다시 이용할 수 있는지 확인해 줘.\n보고서에 원문 학생 자료나 비밀값을 넣지 마. 이 기록만으로 학교 승인이나 앱 전체의 안전을 보장한다고 쓰지 마.","next":"기록을 자신의 프로젝트에 보관하고 필요한 다음 활동을 선택합니다. 새로운 대화를 시작할 때는 이 기록과 공통 시작 프롬프트를 함께 제공합니다."}]},{"id":22,"title":"자료 보관과 삭제 및 공용 기기 정리","group":"학생 수업 운영","slides":"40, 50~52","condition":"학생 기록이나 이용 기록을 저장하는 앱","inputs":"자료 종류, 보관 목적, 학교가 정한 기간, 백업·외부 서비스 목록","inspect":["브라우저·서버·DB·파일·로그·백업·외부 AI에 남는 자료를 각각 찾아 줘.","로그아웃이나 화면의 삭제 버튼이 실제 어느 저장 위치를 지우는지 확인해 줘.","보관 기간이 문서·코드·운영 설정에서 일치하는지 확인해 줘.","공용 기기에서 다음 사용자가 이전 사용자의 화면이나 저장 자료를 볼 수 있는지 확인해 줘."],"requirements":["자료별 필요한 보관 기간과 삭제 방법을 정하고 기간을 임의의 법정 기간으로 만들어 쓰지 마.","삭제는 사용자 권한을 서버에서 확인하고 원본·연결 자료·파일 처리 범위를 명시해 줘.","로그아웃 때 인증 상태와 필요한 로컬 자료를 정리하되 다른 앱의 자료까지 지우지 마.","백업 보관 주기와 외부 서비스 삭제 한계는 별도로 설명하고 화면에서 즉시 모두 사라진다고 약속하지 마."],"tests":["가상 학생 A 로그아웃 후 B 로그인 시 A의 기록이 화면·응답·저장소에 보이는지 확인해 줘.","가상 자료 삭제 후 새 요청과 직접 파일 접근이 차단되는지 확인해 줘.","보관 기간 경계는 시험용 시각이나 전용 테스트로 검증하고 운영 서버 시간을 바꾸지 마.","삭제 실패 시 사용자 안내·재시도·관리자 확인이 가능한지 확인해 줘."],"location":"F12 → Application → Local Storage·Session Storage·IndexedDB·Cookies에서 해당 앱 자료를 봅니다. 서버 자료와 백업 삭제는 관리 도구에서 별도 확인합니다.","links":["https://webapp-security-lab.vercel.app/#/review/retention"],"branches":[["브라우저에만 저장하는 경우","공용 기기 노출·브라우저 초기화 시 자료 손실·사용자별 구분을 확인해 줘. 브라우저 저장이라는 이유만으로 개인정보 문제가 없다고 판단하지 마."],["삭제 버튼을 새로 만들 때","먼저 가상 자료에만 적용해 줘. 삭제 대상·복구 가능성·권한·확인 문구를 제시한 뒤 실제 삭제 기능을 구현해 줘."]],"prompts":[{"id":"a22-inspect","category":"기본 진행","title":"1 현재 상태부터 확인하기","when":"프로젝트를 연 뒤 처음 보냅니다. 파일을 고치기 전 단계입니다.","text":"활동: 자료 보관과 삭제 및 공용 기기 정리\n앱 이름과 프로젝트: [입력]\n이번 시험 주소: [입력]\n준비 정보: 자료 종류, 보관 목적, 학교가 정한 기간, 백업·외부 서비스 목록\n현재 상황: [입력]\n사용할 가상 자료: [입력]\n\n이 활동에 해당하는지부터 확인해 줘. 아직 파일이나 설정은 수정하지 마.\n1. 브라우저·서버·DB·파일·로그·백업·외부 AI에 남는 자료를 각각 찾아 줘.\n2. 로그아웃이나 화면의 삭제 버튼이 실제 어느 저장 위치를 지우는지 확인해 줘.\n3. 보관 기간이 문서·코드·운영 설정에서 일치하는지 확인해 줘.\n4. 공용 기기에서 다음 사용자가 이전 사용자의 화면이나 저장 자료를 볼 수 있는지 확인해 줘.\n\n결과는 표로 정리해 줘. 표에는 확인 항목, 현재 동작, 근거가 있는 파일이나 설정 위치, 발견한 문제와 추가로 확인할 내용을 적어 줘. 코드에서 확인한 사실과 추정은 구분해 줘. 내가 직접 확인할 메뉴·버튼·파일 이름도 알려 줘. 파일을 읽지 못했다면 그 사실을 표시해 줘.\n실제 학생 정보·비밀키·인증 토큰은 출력하지 말고 필요한 값은 가려 줘. 내 앱 또는 허락받은 시험 환경만 대상으로 해 줘.\n참고할 확인 위치: F12 → Application → Local Storage·Session Storage·IndexedDB·Cookies에서 해당 앱 자료를 봅니다. 서버 자료와 백업 삭제는 관리 도구에서 별도 확인합니다.","next":"현재 구조와 해당 여부를 확인합니다. 모르는 정보는 먼저 확인하고, 수정이 필요하면 2번으로 진행합니다."},{"id":"a22-plan","category":"기본 진행","title":"2 수정 방법과 범위 정하기","when":"1번 답변에서 실제로 고칠 항목을 골랐을 때 보냅니다.","text":"활동: 자료 보관과 삭제 및 공용 기기 정리\n앱 이름과 프로젝트: [입력]\n이번 시험 주소: [입력]\n준비 정보: 자료 종류, 보관 목적, 학교가 정한 기간, 백업·외부 서비스 목록\n현재 상황: [입력]\n사용할 가상 자료: [입력]\n앞에서 확인한 문제와 근거: [1번 결과 중 해당 부분을 붙이기]\n이번에 고칠 항목: [입력]\n\n구현 전에 다음 조건으로 수정 계획을 만들어 줘.\n1. 자료별 필요한 보관 기간과 삭제 방법을 정하고 기간을 임의의 법정 기간으로 만들어 쓰지 마.\n2. 삭제는 사용자 권한을 서버에서 확인하고 원본·연결 자료·파일 처리 범위를 명시해 줘.\n3. 로그아웃 때 인증 상태와 필요한 로컬 자료를 정리하되 다른 앱의 자료까지 지우지 마.\n4. 백업 보관 주기와 외부 서비스 삭제 한계는 별도로 설명하고 화면에서 즉시 모두 사라진다고 약속하지 마.\n\n기존 기능을 유지하면서 문제를 고칠 방법부터 제안해 줘. 방법이 여러 가지라면 필요한 서비스와 비용, 사용 방법이 달라지는 부분, 이전 상태로 되돌릴 방법을 비교해 줘. 반드시 고쳐야 할 부분과 선택해서 개선할 부분을 구분해 줘.\n변경할 파일, 학생 또는 교사 화면에서 달라질 부분, 필요한 관리 설정, 시험할 가상 입력을 순서대로 적어 줘. 서버가 없는 앱이라면 지금 할 수 있는 것과 서버가 필요한 것을 분리해 줘.\n아직 코드를 수정하거나 서비스를 만들지 마. 내가 결정해야 할 사항이 있으면 선택지와 차이를 설명하고 물어봐 줘.","next":"수정할 내용과 비용, 정보 수집·전송·보관 방식이 달라지는지 확인한 뒤 진행할 방법을 정합니다. 학교가 판단해야 하는 내용은 먼저 확인합니다."},{"id":"a22-implement","category":"기본 진행","title":"3 선택한 범위 구현하기","when":"수정 계획을 검토한 뒤 승인할 범위를 직접 적고 보냅니다.","text":"활동: 자료 보관과 삭제 및 공용 기기 정리\n앱 이름과 프로젝트: [입력]\n이번 시험 주소: [입력]\n준비 정보: 자료 종류, 보관 목적, 학교가 정한 기간, 백업·외부 서비스 목록\n현재 상황: [입력]\n사용할 가상 자료: [입력]\n승인한 수정안: [선택한 방법과 항목을 정확히 입력]\n수정할 파일 또는 기능 범위: [입력]\n이번에 제외할 것: [입력]\n\n위에 승인한 범위만 구현해 줘. 시작 전에 현재 변경 파일을 확인해 다른 작업을 보존해 줘.\n1. 자료별 필요한 보관 기간과 삭제 방법을 정하고 기간을 임의의 법정 기간으로 만들어 쓰지 마.\n2. 삭제는 사용자 권한을 서버에서 확인하고 원본·연결 자료·파일 처리 범위를 명시해 줘.\n3. 로그아웃 때 인증 상태와 필요한 로컬 자료를 정리하되 다른 앱의 자료까지 지우지 마.\n4. 백업 보관 주기와 외부 서비스 삭제 한계는 별도로 설명하고 화면에서 즉시 모두 사라진다고 약속하지 마.\n\n한 부분씩 수정하고 실행 결과를 확인해 줘. 기존 디자인과 정상 기능은 유지해 줘. 새 서비스 생성·운영 자료 삭제·유료 호출·커밋·푸시·배포는 이 요청에 구체적으로 승인한 경우에만 실행해 줘. 요청하지 않은 변경이 필요하면 진행 전에 이유를 설명해 줘.\n수정 후 바꾼 파일과 이유, 실행한 검사, 아직 하지 못한 시험, 내가 누를 버튼 순서를 적어 줘. 실제 학생 정보·비밀키·인증 토큰은 출력하지 말고 필요한 값은 가려 줘. 내 앱 또는 허락받은 시험 환경만 대상으로 해 줘.","next":"빌드나 실행 오류가 없는지 확인한 뒤 4번으로 진행합니다. 허용해야 할 동작은 정상적으로 되고, 차단해야 할 동작은 막히는지 함께 시험합니다."},{"id":"a22-verify","category":"기본 진행","title":"4 수정 결과 직접 확인하기","when":"구현이 끝났거나 기존 기능이 안전하게 동작하는지 검증할 때 보냅니다.","text":"활동: 자료 보관과 삭제 및 공용 기기 정리\n앱 이름과 프로젝트: [입력]\n이번 시험 주소: [입력]\n준비 정보: 자료 종류, 보관 목적, 학교가 정한 기간, 백업·외부 서비스 목록\n현재 상황: [입력]\n사용할 가상 자료: [입력]\n이번 수정 내용: [입력 또는 기존 기능 검증]\n시험할 버전과 주소: [입력]\n\n다음 조건을 가상 자료로 다시 시험해 줘.\n1. 가상 학생 A 로그아웃 후 B 로그인 시 A의 기록이 화면·응답·저장소에 보이는지 확인해 줘.\n2. 가상 자료 삭제 후 새 요청과 직접 파일 접근이 차단되는지 확인해 줘.\n3. 보관 기간 경계는 시험용 시각이나 전용 테스트로 검증하고 운영 서버 시간을 바꾸지 마.\n4. 삭제 실패 시 사용자 안내·재시도·관리자 확인이 가능한지 확인해 줘.\n\n내가 직접 따라 할 수 있도록 준비 계정과 상태 → 클릭 또는 입력 → 확인할 실제 탭·요청·필드 → 기대 결과를 항목마다 적어 줘.\n확인할 위치: F12 → Application → Local Storage·Session Storage·IndexedDB·Cookies에서 해당 앱 자료를 봅니다. 서버 자료와 백업 삭제는 관리 도구에서 별도 확인합니다.\n자기 앱에서 이름이 다르면 코드와 실제 요청에서 맞는 이름을 찾아 줘. 실제로 존재하는지 확인하지 않은 요청명을 만들어 내지 마.\n허용해야 할 동작과 차단해야 할 동작을 함께 시험해 줘. 항목마다 실행 여부, 실제 결과, 확인한 화면이나 기록을 적고, 시험하지 못했다면 이유를 설명해 줘. 응답 코드와 실제로 받은 자료를 함께 확인하고, 저장 기능이 있다면 저장된 결과도 확인해 줘.\n이 활동을 완료해도 앱 전체의 안전이 보장된다고 표현하지 마. 실제 학생 정보·비밀키·인증 토큰은 출력하지 말고 필요한 값은 가려 줘. 내 앱 또는 허락받은 시험 환경만 대상으로 해 줘.","next":"기대 결과와 실제 결과가 같으면 활동 기록을 정리합니다. 다르면 “오류 해결” 프롬프트를 사용하고 같은 조건으로 재시험합니다."},{"id":"a22-branch1","category":"상황별 진행","title":"브라우저에만 저장하는 경우","when":"기본 순서로 진행하다가 이 상황에 해당하면 사용합니다.","text":"활동: 자료 보관과 삭제 및 공용 기기 정리\n앱 이름과 프로젝트: [입력]\n이번 시험 주소: [입력]\n준비 정보: 자료 종류, 보관 목적, 학교가 정한 기간, 백업·외부 서비스 목록\n현재 상황: [입력]\n사용할 가상 자료: [입력]\n현재 겪는 상황: 브라우저에만 저장하는 경우\n이미 한 행동과 나온 결과: [입력]\n\n공용 기기 노출·브라우저 초기화 시 자료 손실·사용자별 구분을 확인해 줘. 브라우저 저장이라는 이유만으로 개인정보 문제가 없다고 판단하지 마.\n먼저 관련 코드·화면·설정에서 현재 상태를 확인하고 이 상황이 생긴 이유를 근거와 함께 설명해 줘. 현재 환경에서 확인할 수 없는 것은 따로 표시해 줘.\n이 활동에서 유지할 조건:\n1. 자료별 필요한 보관 기간과 삭제 방법을 정하고 기간을 임의의 법정 기간으로 만들어 쓰지 마.\n2. 삭제는 사용자 권한을 서버에서 확인하고 원본·연결 자료·파일 처리 범위를 명시해 줘.\n3. 로그아웃 때 인증 상태와 필요한 로컬 자료를 정리하되 다른 앱의 자료까지 지우지 마.\n\n진행 순서를 “지금 확인할 것 → 선택 가능한 방법 → 내가 승인할 변경 → 실행 후 다시 확인할 결과”로 정리해 줘. 앱에 필요 없는 기능을 추가하거나 검사를 끄는 방식으로 해결하지 마.\n재시험에서는 다음 조건을 포함해 줘:\n1. 가상 학생 A 로그아웃 후 B 로그인 시 A의 기록이 화면·응답·저장소에 보이는지 확인해 줘.\n2. 가상 자료 삭제 후 새 요청과 직접 파일 접근이 차단되는지 확인해 줘.\n수정이 필요하면 먼저 범위를 제안하고 내 확인 전 운영 설정을 바꾸지 마. 실제 학생 정보·비밀키·인증 토큰은 출력하지 말고 필요한 값은 가려 줘. 내 앱 또는 허락받은 시험 환경만 대상으로 해 줘.","next":"이 상황에 맞는 방법을 선택한 뒤 기본 진행의 구현 또는 재시험 단계로 돌아갑니다. 해당 없음이면 이유를 기록하고 다른 활동을 고릅니다."},{"id":"a22-branch2","category":"상황별 진행","title":"삭제 버튼을 새로 만들 때","when":"기본 순서로 진행하다가 이 상황에 해당하면 사용합니다.","text":"활동: 자료 보관과 삭제 및 공용 기기 정리\n앱 이름과 프로젝트: [입력]\n이번 시험 주소: [입력]\n준비 정보: 자료 종류, 보관 목적, 학교가 정한 기간, 백업·외부 서비스 목록\n현재 상황: [입력]\n사용할 가상 자료: [입력]\n현재 겪는 상황: 삭제 버튼을 새로 만들 때\n이미 한 행동과 나온 결과: [입력]\n\n먼저 가상 자료에만 적용해 줘. 삭제 대상·복구 가능성·권한·확인 문구를 제시한 뒤 실제 삭제 기능을 구현해 줘.\n먼저 관련 코드·화면·설정에서 현재 상태를 확인하고 이 상황이 생긴 이유를 근거와 함께 설명해 줘. 현재 환경에서 확인할 수 없는 것은 따로 표시해 줘.\n이 활동에서 유지할 조건:\n1. 자료별 필요한 보관 기간과 삭제 방법을 정하고 기간을 임의의 법정 기간으로 만들어 쓰지 마.\n2. 삭제는 사용자 권한을 서버에서 확인하고 원본·연결 자료·파일 처리 범위를 명시해 줘.\n3. 로그아웃 때 인증 상태와 필요한 로컬 자료를 정리하되 다른 앱의 자료까지 지우지 마.\n\n진행 순서를 “지금 확인할 것 → 선택 가능한 방법 → 내가 승인할 변경 → 실행 후 다시 확인할 결과”로 정리해 줘. 앱에 필요 없는 기능을 추가하거나 검사를 끄는 방식으로 해결하지 마.\n재시험에서는 다음 조건을 포함해 줘:\n1. 가상 학생 A 로그아웃 후 B 로그인 시 A의 기록이 화면·응답·저장소에 보이는지 확인해 줘.\n2. 가상 자료 삭제 후 새 요청과 직접 파일 접근이 차단되는지 확인해 줘.\n수정이 필요하면 먼저 범위를 제안하고 내 확인 전 운영 설정을 바꾸지 마. 실제 학생 정보·비밀키·인증 토큰은 출력하지 말고 필요한 값은 가려 줘. 내 앱 또는 허락받은 시험 환경만 대상으로 해 줘.","next":"이 상황에 맞는 방법을 선택한 뒤 기본 진행의 구현 또는 재시험 단계로 돌아갑니다. 해당 없음이면 이유를 기록하고 다른 활동을 고릅니다."},{"id":"a22-locate","category":"확인 위치 도움","title":"안내된 화면이나 요청을 찾지 못할 때","when":"F12에 설명한 파일·요청이 없거나 확인할 곳을 모르겠을 때 보냅니다.","text":"활동: 자료 보관과 삭제 및 공용 기기 정리\n앱 이름과 프로젝트: [입력]\n이번 시험 주소: [입력]\n준비 정보: 자료 종류, 보관 목적, 학교가 정한 기간, 백업·외부 서비스 목록\n현재 상황: [입력]\n사용할 가상 자료: [입력]\n내가 보고 있는 주소와 창: [입력]\n누른 버튼 또는 실행한 동작: [입력]\n열어 둔 개발자 도구 탭과 필터: [입력 또는 모름]\n찾으려는 정보: [입력]\n현재 화면 또는 가린 오류 내용: [붙이기]\n\n참고 안내: F12 → Application → Local Storage·Session Storage·IndexedDB·Cookies에서 해당 앱 자료를 봅니다. 서버 자료와 백업 삭제는 관리 도구에서 별도 확인합니다.\n이 안내가 체험 앱의 가상 자료인지 내 앱의 실제 동작인지 먼저 구분해 줘. 프로젝트에서 이 동작이 어떤 요청·파일·저장소로 연결되는지 찾아 줘.\nNetwork라면 동작 전에 열기, 기록 켜기, 목록 지우기, 필터 확인, 같은 동작 다시 하기, 새 요청 선택, Headers·Payload·Response 중 볼 위치를 실제 이름으로 알려 줘. 정적 파일이면 All 필터도 확인해 줘. 새 창을 열었다면 그 창에서 F12를 열어야 하는지 설명해 줘.\n브라우저 검사에서 막아 요청이 없거나 아직 동작을 실행하지 않은 경우도 구분해 줘. 서버에만 있는 정보는 F12에서 찾으라고 하지 말고 코드·관리 화면·시험 환경에서 확인할 방법을 제시해 줘.\n확인할 자료가 실제로 없으면 없다고 말하고 필요한 시험 준비를 설명해 줘. 캡처 요청에는 가려야 할 정보도 알려 줘. 실제 학생 정보·비밀키·인증 토큰은 출력하지 말고 필요한 값은 가려 줘. 내 앱 또는 허락받은 시험 환경만 대상으로 해 줘.","next":"정확한 위치를 찾은 뒤 해당 활동의 4번 프롬프트로 결과를 확인합니다. 없다는 사실 자체가 기대 결과인지 먼저 판단합니다."},{"id":"a22-error","category":"오류 해결","title":"예상과 다른 결과가 나올 때","when":"실행 오류, 정상 기능 실패, 예상한 차단이 되지 않는 경우에 보냅니다.","text":"활동: 자료 보관과 삭제 및 공용 기기 정리\n앱 이름과 프로젝트: [입력]\n이번 시험 주소: [입력]\n준비 정보: 자료 종류, 보관 목적, 학교가 정한 기간, 백업·외부 서비스 목록\n현재 상황: [입력]\n사용할 가상 자료: [입력]\n실행한 단계와 입력: [입력]\n기대한 결과: [입력]\n실제로 나온 결과: [입력]\n오류 문구: [비밀값을 가리고 붙이기]\n직전에 변경한 파일 또는 설정: [입력 또는 모름]\n\n원인을 추측해서 여러 곳을 한꺼번에 바꾸지 말고, 재현 조건과 현재 코드를 비교해 줘. 요청이 만들어지는지, 서버에 도착하는지, 검사와 반환·저장이 어디서 달라지는지 관련 단계만 확인해 줘.\n특히 다음 점검 기준을 다시 봐 줘:\n1. 브라우저·서버·DB·파일·로그·백업·외부 AI에 남는 자료를 각각 찾아 줘.\n2. 로그아웃이나 화면의 삭제 버튼이 실제 어느 저장 위치를 지우는지 확인해 줘.\n\n가능한 원인마다 그렇게 판단한 이유와 먼저 확인할 방법을 알려 줘. 운영 자료를 삭제하거나 권한·입력 검사를 전체 해제하는 방식은 사용하지 마. 수정이 필요하면 바꿀 내용을 먼저 제안하고 내가 승인한 뒤 적용해 줘.\n수정 후 같은 실패 조건과 다음 정상 조건을 모두 재시험해 줘:\n1. 가상 학생 A 로그아웃 후 B 로그인 시 A의 기록이 화면·응답·저장소에 보이는지 확인해 줘.\n2. 가상 자료 삭제 후 새 요청과 직접 파일 접근이 차단되는지 확인해 줘.\n3. 보관 기간 경계는 시험용 시각이나 전용 테스트로 검증하고 운영 서버 시간을 바꾸지 마.\n4. 삭제 실패 시 사용자 안내·재시도·관리자 확인이 가능한지 확인해 줘.\n완료 보고에는 실제 실행한 결과와 실행하지 못한 이유를 구분해 줘.","next":"실패 원인을 확인하고 승인한 수정만 적용합니다. 같은 실패 조건이 해결됐는지와 원래 정상 기능이 유지되는지 함께 봅니다."},{"id":"a22-finish","category":"활동 마무리","title":"확인 기록과 다음 점검 정리하기","when":"직접 시험을 확인한 뒤, 또는 해당 없음·추가 확인으로 종료할 때 보냅니다.","text":"활동: 자료 보관과 삭제 및 공용 기기 정리\n앱 이름과 프로젝트: [입력]\n이번 시험 주소: [입력]\n준비 정보: 자료 종류, 보관 목적, 학교가 정한 기간, 백업·외부 서비스 목록\n현재 상황: [입력]\n사용할 가상 자료: [입력]\n실제로 진행한 단계: [입력]\n확인한 결과 또는 아직 확인하지 못한 내용: [입력]\n\n이번 활동 기록을 Markdown으로 정리해 줘. 항목은 앱과 시험 버전, 점검한 기능, 발견한 문제와 위치, 승인한 수정, 시험 입력과 기대 결과, 실제 결과와 근거, 추가 확인할 일로 구성해 줘.\n앞으로 개발할 때 지킬 기준도 우리 앱의 실제 코드·설정 위치와 연결해 적어 줘:\n1. 자료별 필요한 보관 기간과 삭제 방법을 정하고 기간을 임의의 법정 기간으로 만들어 쓰지 마.\n2. 삭제는 사용자 권한을 서버에서 확인하고 원본·연결 자료·파일 처리 범위를 명시해 줘.\n3. 로그아웃 때 인증 상태와 필요한 로컬 자료를 정리하되 다른 앱의 자료까지 지우지 마.\n4. 백업 보관 주기와 외부 서비스 삭제 한계는 별도로 설명하고 화면에서 즉시 모두 사라진다고 약속하지 마.\n\n활동 상태는 확인 완료·추가 확인·해당 없음 중 근거에 맞게 적어 줘. 구현만 하고 시험하지 않았다면 확인 완료로 쓰지 마. 문제를 발견하지 못한 것과 충분히 검증한 것을 구분해 줘.\n다음 수정 때 다시 실행할 시험은 다음 내용을 바탕으로 정리해 줘:\n1. 가상 학생 A 로그아웃 후 B 로그인 시 A의 기록이 화면·응답·저장소에 보이는지 확인해 줘.\n2. 가상 자료 삭제 후 새 요청과 직접 파일 접근이 차단되는지 확인해 줘.\n보고서에 원문 학생 자료나 비밀값을 넣지 마. 이 기록만으로 학교 승인이나 앱 전체의 안전을 보장한다고 쓰지 마.","next":"기록을 자신의 프로젝트에 보관하고 필요한 다음 활동을 선택합니다. 새로운 대화를 시작할 때는 이 기록과 공통 시작 프롬프트를 함께 제공합니다."}]},{"id":23,"title":"AI 점검 결과를 정리하는 기능 만들기","group":"학생 수업 운영","slides":"35","condition":"AI 검토 결과를 기록하고 교사가 확인하는 앱","inputs":"점검 항목, 판정 기준, 담당자, 현재 결과 형식","inspect":["AI가 지적한 문제를 실제 파일·화면·요청과 연결할 수 있는지 확인해 줘.","같은 문제의 중복 등록, 해결 전후 상태, 확인한 사람을 관리하는 방식을 확인해 줘.","AI가 만든 결과에 개인정보·비밀키·원문 입력이 포함되는지 확인해 줘.","AI가 스스로 안전 판정을 확정하거나 교사의 확인을 대신하는지 확인해 줘."],"requirements":["항목마다 내용·위치·근거·수정 내용·재시험 결과·교사 확인 상태를 저장하도록 설계해 줘.","확인 전·수정 중·재시험 필요·확인 완료·해당 없음 상태와 의미를 명확히 해 줘.","보고서에는 점검 결과를 확인하는 데 필요한 화면이나 기록만 포함하고, 비밀정보는 제외해 줘.","AI 제안과 사람이 확인한 결과를 분리하고 승인 권한을 서버에서 검사해 줘."],"tests":["가상 문제를 등록하고 수정·재시험·완료 처리까지 이어지는지 확인해 줘.","근거가 없거나 시험하지 않은 항목이 자동 완료되지 않는지 확인해 줘.","다른 사용자의 결과를 바꾸거나 열람할 수 없는지 확인해 줘.","출력한 보고서와 실제 저장 상태가 일치하는지 확인해 줘."],"location":"결과 목록과 상세 화면을 확인하고 Network → Payload와 Response에서 상태·근거·권한 처리 결과를 봅니다. 실제 코드 근거는 프로젝트 파일에서 확인합니다.","links":[],"branches":[["관리 기능까지 만들 필요가 없는 경우","별도 웹 기능을 추가하지 말고 Markdown 점검표로 같은 항목과 상태를 관리하게 해 줘."],["AI가 완료라고 했지만 확인하지 못한 경우","완료 표시를 근거 확인 전 상태로 바꾸고 내가 직접 따라 할 재시험 순서를 제시해 줘."]],"prompts":[{"id":"a23-inspect","category":"기본 진행","title":"1 현재 상태부터 확인하기","when":"프로젝트를 연 뒤 처음 보냅니다. 파일을 고치기 전 단계입니다.","text":"활동: AI 점검 결과를 정리하는 기능 만들기\n앱 이름과 프로젝트: [입력]\n이번 시험 주소: [입력]\n준비 정보: 점검 항목, 판정 기준, 담당자, 현재 결과 형식\n현재 상황: [입력]\n사용할 가상 자료: [입력]\n\n이 활동에 해당하는지부터 확인해 줘. 아직 파일이나 설정은 수정하지 마.\n1. AI가 지적한 문제를 실제 파일·화면·요청과 연결할 수 있는지 확인해 줘.\n2. 같은 문제의 중복 등록, 해결 전후 상태, 확인한 사람을 관리하는 방식을 확인해 줘.\n3. AI가 만든 결과에 개인정보·비밀키·원문 입력이 포함되는지 확인해 줘.\n4. AI가 스스로 안전 판정을 확정하거나 교사의 확인을 대신하는지 확인해 줘.\n\n결과는 표로 정리해 줘. 표에는 확인 항목, 현재 동작, 근거가 있는 파일이나 설정 위치, 발견한 문제와 추가로 확인할 내용을 적어 줘. 코드에서 확인한 사실과 추정은 구분해 줘. 내가 직접 확인할 메뉴·버튼·파일 이름도 알려 줘. 파일을 읽지 못했다면 그 사실을 표시해 줘.\n실제 학생 정보·비밀키·인증 토큰은 출력하지 말고 필요한 값은 가려 줘. 내 앱 또는 허락받은 시험 환경만 대상으로 해 줘.\n참고할 확인 위치: 결과 목록과 상세 화면을 확인하고 Network → Payload와 Response에서 상태·근거·권한 처리 결과를 봅니다. 실제 코드 근거는 프로젝트 파일에서 확인합니다.","next":"현재 구조와 해당 여부를 확인합니다. 모르는 정보는 먼저 확인하고, 수정이 필요하면 2번으로 진행합니다."},{"id":"a23-plan","category":"기본 진행","title":"2 수정 방법과 범위 정하기","when":"1번 답변에서 실제로 고칠 항목을 골랐을 때 보냅니다.","text":"활동: AI 점검 결과를 정리하는 기능 만들기\n앱 이름과 프로젝트: [입력]\n이번 시험 주소: [입력]\n준비 정보: 점검 항목, 판정 기준, 담당자, 현재 결과 형식\n현재 상황: [입력]\n사용할 가상 자료: [입력]\n앞에서 확인한 문제와 근거: [1번 결과 중 해당 부분을 붙이기]\n이번에 고칠 항목: [입력]\n\n구현 전에 다음 조건으로 수정 계획을 만들어 줘.\n1. 항목마다 내용·위치·근거·수정 내용·재시험 결과·교사 확인 상태를 저장하도록 설계해 줘.\n2. 확인 전·수정 중·재시험 필요·확인 완료·해당 없음 상태와 의미를 명확히 해 줘.\n3. 보고서에는 점검 결과를 확인하는 데 필요한 화면이나 기록만 포함하고, 비밀정보는 제외해 줘.\n4. AI 제안과 사람이 확인한 결과를 분리하고 승인 권한을 서버에서 검사해 줘.\n\n기존 기능을 유지하면서 문제를 고칠 방법부터 제안해 줘. 방법이 여러 가지라면 필요한 서비스와 비용, 사용 방법이 달라지는 부분, 이전 상태로 되돌릴 방법을 비교해 줘. 반드시 고쳐야 할 부분과 선택해서 개선할 부분을 구분해 줘.\n변경할 파일, 학생 또는 교사 화면에서 달라질 부분, 필요한 관리 설정, 시험할 가상 입력을 순서대로 적어 줘. 서버가 없는 앱이라면 지금 할 수 있는 것과 서버가 필요한 것을 분리해 줘.\n아직 코드를 수정하거나 서비스를 만들지 마. 내가 결정해야 할 사항이 있으면 선택지와 차이를 설명하고 물어봐 줘.","next":"수정할 내용과 비용, 정보 수집·전송·보관 방식이 달라지는지 확인한 뒤 진행할 방법을 정합니다. 학교가 판단해야 하는 내용은 먼저 확인합니다."},{"id":"a23-implement","category":"기본 진행","title":"3 선택한 범위 구현하기","when":"수정 계획을 검토한 뒤 승인할 범위를 직접 적고 보냅니다.","text":"활동: AI 점검 결과를 정리하는 기능 만들기\n앱 이름과 프로젝트: [입력]\n이번 시험 주소: [입력]\n준비 정보: 점검 항목, 판정 기준, 담당자, 현재 결과 형식\n현재 상황: [입력]\n사용할 가상 자료: [입력]\n승인한 수정안: [선택한 방법과 항목을 정확히 입력]\n수정할 파일 또는 기능 범위: [입력]\n이번에 제외할 것: [입력]\n\n위에 승인한 범위만 구현해 줘. 시작 전에 현재 변경 파일을 확인해 다른 작업을 보존해 줘.\n1. 항목마다 내용·위치·근거·수정 내용·재시험 결과·교사 확인 상태를 저장하도록 설계해 줘.\n2. 확인 전·수정 중·재시험 필요·확인 완료·해당 없음 상태와 의미를 명확히 해 줘.\n3. 보고서에는 점검 결과를 확인하는 데 필요한 화면이나 기록만 포함하고, 비밀정보는 제외해 줘.\n4. AI 제안과 사람이 확인한 결과를 분리하고 승인 권한을 서버에서 검사해 줘.\n\n한 부분씩 수정하고 실행 결과를 확인해 줘. 기존 디자인과 정상 기능은 유지해 줘. 새 서비스 생성·운영 자료 삭제·유료 호출·커밋·푸시·배포는 이 요청에 구체적으로 승인한 경우에만 실행해 줘. 요청하지 않은 변경이 필요하면 진행 전에 이유를 설명해 줘.\n수정 후 바꾼 파일과 이유, 실행한 검사, 아직 하지 못한 시험, 내가 누를 버튼 순서를 적어 줘. 실제 학생 정보·비밀키·인증 토큰은 출력하지 말고 필요한 값은 가려 줘. 내 앱 또는 허락받은 시험 환경만 대상으로 해 줘.","next":"빌드나 실행 오류가 없는지 확인한 뒤 4번으로 진행합니다. 허용해야 할 동작은 정상적으로 되고, 차단해야 할 동작은 막히는지 함께 시험합니다."},{"id":"a23-verify","category":"기본 진행","title":"4 수정 결과 직접 확인하기","when":"구현이 끝났거나 기존 기능이 안전하게 동작하는지 검증할 때 보냅니다.","text":"활동: AI 점검 결과를 정리하는 기능 만들기\n앱 이름과 프로젝트: [입력]\n이번 시험 주소: [입력]\n준비 정보: 점검 항목, 판정 기준, 담당자, 현재 결과 형식\n현재 상황: [입력]\n사용할 가상 자료: [입력]\n이번 수정 내용: [입력 또는 기존 기능 검증]\n시험할 버전과 주소: [입력]\n\n다음 조건을 가상 자료로 다시 시험해 줘.\n1. 가상 문제를 등록하고 수정·재시험·완료 처리까지 이어지는지 확인해 줘.\n2. 근거가 없거나 시험하지 않은 항목이 자동 완료되지 않는지 확인해 줘.\n3. 다른 사용자의 결과를 바꾸거나 열람할 수 없는지 확인해 줘.\n4. 출력한 보고서와 실제 저장 상태가 일치하는지 확인해 줘.\n\n내가 직접 따라 할 수 있도록 준비 계정과 상태 → 클릭 또는 입력 → 확인할 실제 탭·요청·필드 → 기대 결과를 항목마다 적어 줘.\n확인할 위치: 결과 목록과 상세 화면을 확인하고 Network → Payload와 Response에서 상태·근거·권한 처리 결과를 봅니다. 실제 코드 근거는 프로젝트 파일에서 확인합니다.\n자기 앱에서 이름이 다르면 코드와 실제 요청에서 맞는 이름을 찾아 줘. 실제로 존재하는지 확인하지 않은 요청명을 만들어 내지 마.\n허용해야 할 동작과 차단해야 할 동작을 함께 시험해 줘. 항목마다 실행 여부, 실제 결과, 확인한 화면이나 기록을 적고, 시험하지 못했다면 이유를 설명해 줘. 응답 코드와 실제로 받은 자료를 함께 확인하고, 저장 기능이 있다면 저장된 결과도 확인해 줘.\n이 활동을 완료해도 앱 전체의 안전이 보장된다고 표현하지 마. 실제 학생 정보·비밀키·인증 토큰은 출력하지 말고 필요한 값은 가려 줘. 내 앱 또는 허락받은 시험 환경만 대상으로 해 줘.","next":"기대 결과와 실제 결과가 같으면 활동 기록을 정리합니다. 다르면 “오류 해결” 프롬프트를 사용하고 같은 조건으로 재시험합니다."},{"id":"a23-branch1","category":"상황별 진행","title":"관리 기능까지 만들 필요가 없는 경우","when":"기본 순서로 진행하다가 이 상황에 해당하면 사용합니다.","text":"활동: AI 점검 결과를 정리하는 기능 만들기\n앱 이름과 프로젝트: [입력]\n이번 시험 주소: [입력]\n준비 정보: 점검 항목, 판정 기준, 담당자, 현재 결과 형식\n현재 상황: [입력]\n사용할 가상 자료: [입력]\n현재 겪는 상황: 관리 기능까지 만들 필요가 없는 경우\n이미 한 행동과 나온 결과: [입력]\n\n별도 웹 기능을 추가하지 말고 Markdown 점검표로 같은 항목과 상태를 관리하게 해 줘.\n먼저 관련 코드·화면·설정에서 현재 상태를 확인하고 이 상황이 생긴 이유를 근거와 함께 설명해 줘. 현재 환경에서 확인할 수 없는 것은 따로 표시해 줘.\n이 활동에서 유지할 조건:\n1. 항목마다 내용·위치·근거·수정 내용·재시험 결과·교사 확인 상태를 저장하도록 설계해 줘.\n2. 확인 전·수정 중·재시험 필요·확인 완료·해당 없음 상태와 의미를 명확히 해 줘.\n3. 보고서에는 점검 결과를 확인하는 데 필요한 화면이나 기록만 포함하고, 비밀정보는 제외해 줘.\n\n진행 순서를 “지금 확인할 것 → 선택 가능한 방법 → 내가 승인할 변경 → 실행 후 다시 확인할 결과”로 정리해 줘. 앱에 필요 없는 기능을 추가하거나 검사를 끄는 방식으로 해결하지 마.\n재시험에서는 다음 조건을 포함해 줘:\n1. 가상 문제를 등록하고 수정·재시험·완료 처리까지 이어지는지 확인해 줘.\n2. 근거가 없거나 시험하지 않은 항목이 자동 완료되지 않는지 확인해 줘.\n수정이 필요하면 먼저 범위를 제안하고 내 확인 전 운영 설정을 바꾸지 마. 실제 학생 정보·비밀키·인증 토큰은 출력하지 말고 필요한 값은 가려 줘. 내 앱 또는 허락받은 시험 환경만 대상으로 해 줘.","next":"이 상황에 맞는 방법을 선택한 뒤 기본 진행의 구현 또는 재시험 단계로 돌아갑니다. 해당 없음이면 이유를 기록하고 다른 활동을 고릅니다."},{"id":"a23-branch2","category":"상황별 진행","title":"AI가 완료라고 했지만 확인하지 못한 경우","when":"기본 순서로 진행하다가 이 상황에 해당하면 사용합니다.","text":"활동: AI 점검 결과를 정리하는 기능 만들기\n앱 이름과 프로젝트: [입력]\n이번 시험 주소: [입력]\n준비 정보: 점검 항목, 판정 기준, 담당자, 현재 결과 형식\n현재 상황: [입력]\n사용할 가상 자료: [입력]\n현재 겪는 상황: AI가 완료라고 했지만 확인하지 못한 경우\n이미 한 행동과 나온 결과: [입력]\n\n완료 표시를 근거 확인 전 상태로 바꾸고 내가 직접 따라 할 재시험 순서를 제시해 줘.\n먼저 관련 코드·화면·설정에서 현재 상태를 확인하고 이 상황이 생긴 이유를 근거와 함께 설명해 줘. 현재 환경에서 확인할 수 없는 것은 따로 표시해 줘.\n이 활동에서 유지할 조건:\n1. 항목마다 내용·위치·근거·수정 내용·재시험 결과·교사 확인 상태를 저장하도록 설계해 줘.\n2. 확인 전·수정 중·재시험 필요·확인 완료·해당 없음 상태와 의미를 명확히 해 줘.\n3. 보고서에는 점검 결과를 확인하는 데 필요한 화면이나 기록만 포함하고, 비밀정보는 제외해 줘.\n\n진행 순서를 “지금 확인할 것 → 선택 가능한 방법 → 내가 승인할 변경 → 실행 후 다시 확인할 결과”로 정리해 줘. 앱에 필요 없는 기능을 추가하거나 검사를 끄는 방식으로 해결하지 마.\n재시험에서는 다음 조건을 포함해 줘:\n1. 가상 문제를 등록하고 수정·재시험·완료 처리까지 이어지는지 확인해 줘.\n2. 근거가 없거나 시험하지 않은 항목이 자동 완료되지 않는지 확인해 줘.\n수정이 필요하면 먼저 범위를 제안하고 내 확인 전 운영 설정을 바꾸지 마. 실제 학생 정보·비밀키·인증 토큰은 출력하지 말고 필요한 값은 가려 줘. 내 앱 또는 허락받은 시험 환경만 대상으로 해 줘.","next":"이 상황에 맞는 방법을 선택한 뒤 기본 진행의 구현 또는 재시험 단계로 돌아갑니다. 해당 없음이면 이유를 기록하고 다른 활동을 고릅니다."},{"id":"a23-locate","category":"확인 위치 도움","title":"안내된 화면이나 요청을 찾지 못할 때","when":"F12에 설명한 파일·요청이 없거나 확인할 곳을 모르겠을 때 보냅니다.","text":"활동: AI 점검 결과를 정리하는 기능 만들기\n앱 이름과 프로젝트: [입력]\n이번 시험 주소: [입력]\n준비 정보: 점검 항목, 판정 기준, 담당자, 현재 결과 형식\n현재 상황: [입력]\n사용할 가상 자료: [입력]\n내가 보고 있는 주소와 창: [입력]\n누른 버튼 또는 실행한 동작: [입력]\n열어 둔 개발자 도구 탭과 필터: [입력 또는 모름]\n찾으려는 정보: [입력]\n현재 화면 또는 가린 오류 내용: [붙이기]\n\n참고 안내: 결과 목록과 상세 화면을 확인하고 Network → Payload와 Response에서 상태·근거·권한 처리 결과를 봅니다. 실제 코드 근거는 프로젝트 파일에서 확인합니다.\n이 안내가 체험 앱의 가상 자료인지 내 앱의 실제 동작인지 먼저 구분해 줘. 프로젝트에서 이 동작이 어떤 요청·파일·저장소로 연결되는지 찾아 줘.\nNetwork라면 동작 전에 열기, 기록 켜기, 목록 지우기, 필터 확인, 같은 동작 다시 하기, 새 요청 선택, Headers·Payload·Response 중 볼 위치를 실제 이름으로 알려 줘. 정적 파일이면 All 필터도 확인해 줘. 새 창을 열었다면 그 창에서 F12를 열어야 하는지 설명해 줘.\n브라우저 검사에서 막아 요청이 없거나 아직 동작을 실행하지 않은 경우도 구분해 줘. 서버에만 있는 정보는 F12에서 찾으라고 하지 말고 코드·관리 화면·시험 환경에서 확인할 방법을 제시해 줘.\n확인할 자료가 실제로 없으면 없다고 말하고 필요한 시험 준비를 설명해 줘. 캡처 요청에는 가려야 할 정보도 알려 줘. 실제 학생 정보·비밀키·인증 토큰은 출력하지 말고 필요한 값은 가려 줘. 내 앱 또는 허락받은 시험 환경만 대상으로 해 줘.","next":"정확한 위치를 찾은 뒤 해당 활동의 4번 프롬프트로 결과를 확인합니다. 없다는 사실 자체가 기대 결과인지 먼저 판단합니다."},{"id":"a23-error","category":"오류 해결","title":"예상과 다른 결과가 나올 때","when":"실행 오류, 정상 기능 실패, 예상한 차단이 되지 않는 경우에 보냅니다.","text":"활동: AI 점검 결과를 정리하는 기능 만들기\n앱 이름과 프로젝트: [입력]\n이번 시험 주소: [입력]\n준비 정보: 점검 항목, 판정 기준, 담당자, 현재 결과 형식\n현재 상황: [입력]\n사용할 가상 자료: [입력]\n실행한 단계와 입력: [입력]\n기대한 결과: [입력]\n실제로 나온 결과: [입력]\n오류 문구: [비밀값을 가리고 붙이기]\n직전에 변경한 파일 또는 설정: [입력 또는 모름]\n\n원인을 추측해서 여러 곳을 한꺼번에 바꾸지 말고, 재현 조건과 현재 코드를 비교해 줘. 요청이 만들어지는지, 서버에 도착하는지, 검사와 반환·저장이 어디서 달라지는지 관련 단계만 확인해 줘.\n특히 다음 점검 기준을 다시 봐 줘:\n1. AI가 지적한 문제를 실제 파일·화면·요청과 연결할 수 있는지 확인해 줘.\n2. 같은 문제의 중복 등록, 해결 전후 상태, 확인한 사람을 관리하는 방식을 확인해 줘.\n\n가능한 원인마다 그렇게 판단한 이유와 먼저 확인할 방법을 알려 줘. 운영 자료를 삭제하거나 권한·입력 검사를 전체 해제하는 방식은 사용하지 마. 수정이 필요하면 바꿀 내용을 먼저 제안하고 내가 승인한 뒤 적용해 줘.\n수정 후 같은 실패 조건과 다음 정상 조건을 모두 재시험해 줘:\n1. 가상 문제를 등록하고 수정·재시험·완료 처리까지 이어지는지 확인해 줘.\n2. 근거가 없거나 시험하지 않은 항목이 자동 완료되지 않는지 확인해 줘.\n3. 다른 사용자의 결과를 바꾸거나 열람할 수 없는지 확인해 줘.\n4. 출력한 보고서와 실제 저장 상태가 일치하는지 확인해 줘.\n완료 보고에는 실제 실행한 결과와 실행하지 못한 이유를 구분해 줘.","next":"실패 원인을 확인하고 승인한 수정만 적용합니다. 같은 실패 조건이 해결됐는지와 원래 정상 기능이 유지되는지 함께 봅니다."},{"id":"a23-finish","category":"활동 마무리","title":"확인 기록과 다음 점검 정리하기","when":"직접 시험을 확인한 뒤, 또는 해당 없음·추가 확인으로 종료할 때 보냅니다.","text":"활동: AI 점검 결과를 정리하는 기능 만들기\n앱 이름과 프로젝트: [입력]\n이번 시험 주소: [입력]\n준비 정보: 점검 항목, 판정 기준, 담당자, 현재 결과 형식\n현재 상황: [입력]\n사용할 가상 자료: [입력]\n실제로 진행한 단계: [입력]\n확인한 결과 또는 아직 확인하지 못한 내용: [입력]\n\n이번 활동 기록을 Markdown으로 정리해 줘. 항목은 앱과 시험 버전, 점검한 기능, 발견한 문제와 위치, 승인한 수정, 시험 입력과 기대 결과, 실제 결과와 근거, 추가 확인할 일로 구성해 줘.\n앞으로 개발할 때 지킬 기준도 우리 앱의 실제 코드·설정 위치와 연결해 적어 줘:\n1. 항목마다 내용·위치·근거·수정 내용·재시험 결과·교사 확인 상태를 저장하도록 설계해 줘.\n2. 확인 전·수정 중·재시험 필요·확인 완료·해당 없음 상태와 의미를 명확히 해 줘.\n3. 보고서에는 점검 결과를 확인하는 데 필요한 화면이나 기록만 포함하고, 비밀정보는 제외해 줘.\n4. AI 제안과 사람이 확인한 결과를 분리하고 승인 권한을 서버에서 검사해 줘.\n\n활동 상태는 확인 완료·추가 확인·해당 없음 중 근거에 맞게 적어 줘. 구현만 하고 시험하지 않았다면 확인 완료로 쓰지 마. 문제를 발견하지 못한 것과 충분히 검증한 것을 구분해 줘.\n다음 수정 때 다시 실행할 시험은 다음 내용을 바탕으로 정리해 줘:\n1. 가상 문제를 등록하고 수정·재시험·완료 처리까지 이어지는지 확인해 줘.\n2. 근거가 없거나 시험하지 않은 항목이 자동 완료되지 않는지 확인해 줘.\n보고서에 원문 학생 자료나 비밀값을 넣지 마. 이 기록만으로 학교 승인이나 앱 전체의 안전을 보장한다고 쓰지 마.","next":"기록을 자신의 프로젝트에 보관하고 필요한 다음 활동을 선택합니다. 새로운 대화를 시작할 때는 이 기록과 공통 시작 프롬프트를 함께 제공합니다."}]},{"id":24,"title":"학생이 읽고 조작할 수 있는 화면인지 확인","group":"학생 수업 운영","slides":"31, 53","condition":"학생과 교사가 직접 사용하는 모든 앱","inputs":"대상 연령, 주요 화면, 사용하는 기기와 브라우저","inspect":["전문 용어·긴 문장·불분명한 버튼 이름을 실제 이용자의 행동에 맞춰 점검해 줘.","키보드 이동 순서·입력칸 이름·오류 안내·초점 위치를 확인해 줘.","작은 화면과 확대 상태에서 글자·버튼이 잘리거나 겹치는지 확인해 줘.","색만으로 완료·위험·선택 상태를 전달하는 부분을 찾아 줘."],"requirements":["앱의 기존 디자인을 유지하면서 다음 행동을 알 수 있는 문장과 버튼 이름으로 고쳐 줘.","입력 오류는 해당 위치와 수정 방법을 함께 설명하고 학생이 쓴 내용을 불필요하게 지우지 마.","라벨·초점 표시·키보드 조작·텍스트 상태 설명을 보완해 줘.","보안 경고 때문에 정상 활동이 막히면 재입력·교사에게 문의·취소 등 실제 가능한 선택을 제공해 줘."],"tests":["마우스 없이 Tab·Enter·Esc로 주요 활동을 완료해 줘.","모바일 폭과 브라우저 확대 상태에서 주요 문장과 버튼을 확인해 줘.","입력 오류 후 초점과 안내가 문제 위치로 연결되는지 확인해 줘.","색을 구분하기 어려워도 상태를 글로 알 수 있는지 확인해 줘."],"location":"실제 화면과 F12의 기기 크기 전환 기능으로 확인합니다. Elements의 접근성 정보와 키보드 직접 조작을 함께 확인하며 자동 검사만으로 접근성 완료를 선언하지 않습니다.","links":[],"branches":[["기술 설명을 짧게 바꾸기 어려운 경우","학생 화면에는 해야 할 행동을 먼저 쓰고 자세한 설명은 접어서 제공해 줘. 중요한 위험과 선택권은 숨기지 마."],["모바일에서는 F12를 쓸 수 없는 경우","학생 이용 화면은 모바일로 확인하고 개발자 도구 점검은 PC 브라우저에서 진행하는 안내를 구분해 줘."]],"prompts":[{"id":"a24-inspect","category":"기본 진행","title":"1 현재 상태부터 확인하기","when":"프로젝트를 연 뒤 처음 보냅니다. 파일을 고치기 전 단계입니다.","text":"활동: 학생이 읽고 조작할 수 있는 화면인지 확인\n앱 이름과 프로젝트: [입력]\n이번 시험 주소: [입력]\n준비 정보: 대상 연령, 주요 화면, 사용하는 기기와 브라우저\n현재 상황: [입력]\n사용할 가상 자료: [입력]\n\n이 활동에 해당하는지부터 확인해 줘. 아직 파일이나 설정은 수정하지 마.\n1. 전문 용어·긴 문장·불분명한 버튼 이름을 실제 이용자의 행동에 맞춰 점검해 줘.\n2. 키보드 이동 순서·입력칸 이름·오류 안내·초점 위치를 확인해 줘.\n3. 작은 화면과 확대 상태에서 글자·버튼이 잘리거나 겹치는지 확인해 줘.\n4. 색만으로 완료·위험·선택 상태를 전달하는 부분을 찾아 줘.\n\n결과는 표로 정리해 줘. 표에는 확인 항목, 현재 동작, 근거가 있는 파일이나 설정 위치, 발견한 문제와 추가로 확인할 내용을 적어 줘. 코드에서 확인한 사실과 추정은 구분해 줘. 내가 직접 확인할 메뉴·버튼·파일 이름도 알려 줘. 파일을 읽지 못했다면 그 사실을 표시해 줘.\n실제 학생 정보·비밀키·인증 토큰은 출력하지 말고 필요한 값은 가려 줘. 내 앱 또는 허락받은 시험 환경만 대상으로 해 줘.\n참고할 확인 위치: 실제 화면과 F12의 기기 크기 전환 기능으로 확인합니다. Elements의 접근성 정보와 키보드 직접 조작을 함께 확인하며 자동 검사만으로 접근성 완료를 선언하지 않습니다.","next":"현재 구조와 해당 여부를 확인합니다. 모르는 정보는 먼저 확인하고, 수정이 필요하면 2번으로 진행합니다."},{"id":"a24-plan","category":"기본 진행","title":"2 수정 방법과 범위 정하기","when":"1번 답변에서 실제로 고칠 항목을 골랐을 때 보냅니다.","text":"활동: 학생이 읽고 조작할 수 있는 화면인지 확인\n앱 이름과 프로젝트: [입력]\n이번 시험 주소: [입력]\n준비 정보: 대상 연령, 주요 화면, 사용하는 기기와 브라우저\n현재 상황: [입력]\n사용할 가상 자료: [입력]\n앞에서 확인한 문제와 근거: [1번 결과 중 해당 부분을 붙이기]\n이번에 고칠 항목: [입력]\n\n구현 전에 다음 조건으로 수정 계획을 만들어 줘.\n1. 앱의 기존 디자인을 유지하면서 다음 행동을 알 수 있는 문장과 버튼 이름으로 고쳐 줘.\n2. 입력 오류는 해당 위치와 수정 방법을 함께 설명하고 학생이 쓴 내용을 불필요하게 지우지 마.\n3. 라벨·초점 표시·키보드 조작·텍스트 상태 설명을 보완해 줘.\n4. 보안 경고 때문에 정상 활동이 막히면 재입력·교사에게 문의·취소 등 실제 가능한 선택을 제공해 줘.\n\n기존 기능을 유지하면서 문제를 고칠 방법부터 제안해 줘. 방법이 여러 가지라면 필요한 서비스와 비용, 사용 방법이 달라지는 부분, 이전 상태로 되돌릴 방법을 비교해 줘. 반드시 고쳐야 할 부분과 선택해서 개선할 부분을 구분해 줘.\n변경할 파일, 학생 또는 교사 화면에서 달라질 부분, 필요한 관리 설정, 시험할 가상 입력을 순서대로 적어 줘. 서버가 없는 앱이라면 지금 할 수 있는 것과 서버가 필요한 것을 분리해 줘.\n아직 코드를 수정하거나 서비스를 만들지 마. 내가 결정해야 할 사항이 있으면 선택지와 차이를 설명하고 물어봐 줘.","next":"수정할 내용과 비용, 정보 수집·전송·보관 방식이 달라지는지 확인한 뒤 진행할 방법을 정합니다. 학교가 판단해야 하는 내용은 먼저 확인합니다."},{"id":"a24-implement","category":"기본 진행","title":"3 선택한 범위 구현하기","when":"수정 계획을 검토한 뒤 승인할 범위를 직접 적고 보냅니다.","text":"활동: 학생이 읽고 조작할 수 있는 화면인지 확인\n앱 이름과 프로젝트: [입력]\n이번 시험 주소: [입력]\n준비 정보: 대상 연령, 주요 화면, 사용하는 기기와 브라우저\n현재 상황: [입력]\n사용할 가상 자료: [입력]\n승인한 수정안: [선택한 방법과 항목을 정확히 입력]\n수정할 파일 또는 기능 범위: [입력]\n이번에 제외할 것: [입력]\n\n위에 승인한 범위만 구현해 줘. 시작 전에 현재 변경 파일을 확인해 다른 작업을 보존해 줘.\n1. 앱의 기존 디자인을 유지하면서 다음 행동을 알 수 있는 문장과 버튼 이름으로 고쳐 줘.\n2. 입력 오류는 해당 위치와 수정 방법을 함께 설명하고 학생이 쓴 내용을 불필요하게 지우지 마.\n3. 라벨·초점 표시·키보드 조작·텍스트 상태 설명을 보완해 줘.\n4. 보안 경고 때문에 정상 활동이 막히면 재입력·교사에게 문의·취소 등 실제 가능한 선택을 제공해 줘.\n\n한 부분씩 수정하고 실행 결과를 확인해 줘. 기존 디자인과 정상 기능은 유지해 줘. 새 서비스 생성·운영 자료 삭제·유료 호출·커밋·푸시·배포는 이 요청에 구체적으로 승인한 경우에만 실행해 줘. 요청하지 않은 변경이 필요하면 진행 전에 이유를 설명해 줘.\n수정 후 바꾼 파일과 이유, 실행한 검사, 아직 하지 못한 시험, 내가 누를 버튼 순서를 적어 줘. 실제 학생 정보·비밀키·인증 토큰은 출력하지 말고 필요한 값은 가려 줘. 내 앱 또는 허락받은 시험 환경만 대상으로 해 줘.","next":"빌드나 실행 오류가 없는지 확인한 뒤 4번으로 진행합니다. 허용해야 할 동작은 정상적으로 되고, 차단해야 할 동작은 막히는지 함께 시험합니다."},{"id":"a24-verify","category":"기본 진행","title":"4 수정 결과 직접 확인하기","when":"구현이 끝났거나 기존 기능이 안전하게 동작하는지 검증할 때 보냅니다.","text":"활동: 학생이 읽고 조작할 수 있는 화면인지 확인\n앱 이름과 프로젝트: [입력]\n이번 시험 주소: [입력]\n준비 정보: 대상 연령, 주요 화면, 사용하는 기기와 브라우저\n현재 상황: [입력]\n사용할 가상 자료: [입력]\n이번 수정 내용: [입력 또는 기존 기능 검증]\n시험할 버전과 주소: [입력]\n\n다음 조건을 가상 자료로 다시 시험해 줘.\n1. 마우스 없이 Tab·Enter·Esc로 주요 활동을 완료해 줘.\n2. 모바일 폭과 브라우저 확대 상태에서 주요 문장과 버튼을 확인해 줘.\n3. 입력 오류 후 초점과 안내가 문제 위치로 연결되는지 확인해 줘.\n4. 색을 구분하기 어려워도 상태를 글로 알 수 있는지 확인해 줘.\n\n내가 직접 따라 할 수 있도록 준비 계정과 상태 → 클릭 또는 입력 → 확인할 실제 탭·요청·필드 → 기대 결과를 항목마다 적어 줘.\n확인할 위치: 실제 화면과 F12의 기기 크기 전환 기능으로 확인합니다. Elements의 접근성 정보와 키보드 직접 조작을 함께 확인하며 자동 검사만으로 접근성 완료를 선언하지 않습니다.\n자기 앱에서 이름이 다르면 코드와 실제 요청에서 맞는 이름을 찾아 줘. 실제로 존재하는지 확인하지 않은 요청명을 만들어 내지 마.\n허용해야 할 동작과 차단해야 할 동작을 함께 시험해 줘. 항목마다 실행 여부, 실제 결과, 확인한 화면이나 기록을 적고, 시험하지 못했다면 이유를 설명해 줘. 응답 코드와 실제로 받은 자료를 함께 확인하고, 저장 기능이 있다면 저장된 결과도 확인해 줘.\n이 활동을 완료해도 앱 전체의 안전이 보장된다고 표현하지 마. 실제 학생 정보·비밀키·인증 토큰은 출력하지 말고 필요한 값은 가려 줘. 내 앱 또는 허락받은 시험 환경만 대상으로 해 줘.","next":"기대 결과와 실제 결과가 같으면 활동 기록을 정리합니다. 다르면 “오류 해결” 프롬프트를 사용하고 같은 조건으로 재시험합니다."},{"id":"a24-branch1","category":"상황별 진행","title":"기술 설명을 짧게 바꾸기 어려운 경우","when":"기본 순서로 진행하다가 이 상황에 해당하면 사용합니다.","text":"활동: 학생이 읽고 조작할 수 있는 화면인지 확인\n앱 이름과 프로젝트: [입력]\n이번 시험 주소: [입력]\n준비 정보: 대상 연령, 주요 화면, 사용하는 기기와 브라우저\n현재 상황: [입력]\n사용할 가상 자료: [입력]\n현재 겪는 상황: 기술 설명을 짧게 바꾸기 어려운 경우\n이미 한 행동과 나온 결과: [입력]\n\n학생 화면에는 해야 할 행동을 먼저 쓰고 자세한 설명은 접어서 제공해 줘. 중요한 위험과 선택권은 숨기지 마.\n먼저 관련 코드·화면·설정에서 현재 상태를 확인하고 이 상황이 생긴 이유를 근거와 함께 설명해 줘. 현재 환경에서 확인할 수 없는 것은 따로 표시해 줘.\n이 활동에서 유지할 조건:\n1. 앱의 기존 디자인을 유지하면서 다음 행동을 알 수 있는 문장과 버튼 이름으로 고쳐 줘.\n2. 입력 오류는 해당 위치와 수정 방법을 함께 설명하고 학생이 쓴 내용을 불필요하게 지우지 마.\n3. 라벨·초점 표시·키보드 조작·텍스트 상태 설명을 보완해 줘.\n\n진행 순서를 “지금 확인할 것 → 선택 가능한 방법 → 내가 승인할 변경 → 실행 후 다시 확인할 결과”로 정리해 줘. 앱에 필요 없는 기능을 추가하거나 검사를 끄는 방식으로 해결하지 마.\n재시험에서는 다음 조건을 포함해 줘:\n1. 마우스 없이 Tab·Enter·Esc로 주요 활동을 완료해 줘.\n2. 모바일 폭과 브라우저 확대 상태에서 주요 문장과 버튼을 확인해 줘.\n수정이 필요하면 먼저 범위를 제안하고 내 확인 전 운영 설정을 바꾸지 마. 실제 학생 정보·비밀키·인증 토큰은 출력하지 말고 필요한 값은 가려 줘. 내 앱 또는 허락받은 시험 환경만 대상으로 해 줘.","next":"이 상황에 맞는 방법을 선택한 뒤 기본 진행의 구현 또는 재시험 단계로 돌아갑니다. 해당 없음이면 이유를 기록하고 다른 활동을 고릅니다."},{"id":"a24-branch2","category":"상황별 진행","title":"모바일에서는 F12를 쓸 수 없는 경우","when":"기본 순서로 진행하다가 이 상황에 해당하면 사용합니다.","text":"활동: 학생이 읽고 조작할 수 있는 화면인지 확인\n앱 이름과 프로젝트: [입력]\n이번 시험 주소: [입력]\n준비 정보: 대상 연령, 주요 화면, 사용하는 기기와 브라우저\n현재 상황: [입력]\n사용할 가상 자료: [입력]\n현재 겪는 상황: 모바일에서는 F12를 쓸 수 없는 경우\n이미 한 행동과 나온 결과: [입력]\n\n학생 이용 화면은 모바일로 확인하고 개발자 도구 점검은 PC 브라우저에서 진행하는 안내를 구분해 줘.\n먼저 관련 코드·화면·설정에서 현재 상태를 확인하고 이 상황이 생긴 이유를 근거와 함께 설명해 줘. 현재 환경에서 확인할 수 없는 것은 따로 표시해 줘.\n이 활동에서 유지할 조건:\n1. 앱의 기존 디자인을 유지하면서 다음 행동을 알 수 있는 문장과 버튼 이름으로 고쳐 줘.\n2. 입력 오류는 해당 위치와 수정 방법을 함께 설명하고 학생이 쓴 내용을 불필요하게 지우지 마.\n3. 라벨·초점 표시·키보드 조작·텍스트 상태 설명을 보완해 줘.\n\n진행 순서를 “지금 확인할 것 → 선택 가능한 방법 → 내가 승인할 변경 → 실행 후 다시 확인할 결과”로 정리해 줘. 앱에 필요 없는 기능을 추가하거나 검사를 끄는 방식으로 해결하지 마.\n재시험에서는 다음 조건을 포함해 줘:\n1. 마우스 없이 Tab·Enter·Esc로 주요 활동을 완료해 줘.\n2. 모바일 폭과 브라우저 확대 상태에서 주요 문장과 버튼을 확인해 줘.\n수정이 필요하면 먼저 범위를 제안하고 내 확인 전 운영 설정을 바꾸지 마. 실제 학생 정보·비밀키·인증 토큰은 출력하지 말고 필요한 값은 가려 줘. 내 앱 또는 허락받은 시험 환경만 대상으로 해 줘.","next":"이 상황에 맞는 방법을 선택한 뒤 기본 진행의 구현 또는 재시험 단계로 돌아갑니다. 해당 없음이면 이유를 기록하고 다른 활동을 고릅니다."},{"id":"a24-locate","category":"확인 위치 도움","title":"안내된 화면이나 요청을 찾지 못할 때","when":"F12에 설명한 파일·요청이 없거나 확인할 곳을 모르겠을 때 보냅니다.","text":"활동: 학생이 읽고 조작할 수 있는 화면인지 확인\n앱 이름과 프로젝트: [입력]\n이번 시험 주소: [입력]\n준비 정보: 대상 연령, 주요 화면, 사용하는 기기와 브라우저\n현재 상황: [입력]\n사용할 가상 자료: [입력]\n내가 보고 있는 주소와 창: [입력]\n누른 버튼 또는 실행한 동작: [입력]\n열어 둔 개발자 도구 탭과 필터: [입력 또는 모름]\n찾으려는 정보: [입력]\n현재 화면 또는 가린 오류 내용: [붙이기]\n\n참고 안내: 실제 화면과 F12의 기기 크기 전환 기능으로 확인합니다. Elements의 접근성 정보와 키보드 직접 조작을 함께 확인하며 자동 검사만으로 접근성 완료를 선언하지 않습니다.\n이 안내가 체험 앱의 가상 자료인지 내 앱의 실제 동작인지 먼저 구분해 줘. 프로젝트에서 이 동작이 어떤 요청·파일·저장소로 연결되는지 찾아 줘.\nNetwork라면 동작 전에 열기, 기록 켜기, 목록 지우기, 필터 확인, 같은 동작 다시 하기, 새 요청 선택, Headers·Payload·Response 중 볼 위치를 실제 이름으로 알려 줘. 정적 파일이면 All 필터도 확인해 줘. 새 창을 열었다면 그 창에서 F12를 열어야 하는지 설명해 줘.\n브라우저 검사에서 막아 요청이 없거나 아직 동작을 실행하지 않은 경우도 구분해 줘. 서버에만 있는 정보는 F12에서 찾으라고 하지 말고 코드·관리 화면·시험 환경에서 확인할 방법을 제시해 줘.\n확인할 자료가 실제로 없으면 없다고 말하고 필요한 시험 준비를 설명해 줘. 캡처 요청에는 가려야 할 정보도 알려 줘. 실제 학생 정보·비밀키·인증 토큰은 출력하지 말고 필요한 값은 가려 줘. 내 앱 또는 허락받은 시험 환경만 대상으로 해 줘.","next":"정확한 위치를 찾은 뒤 해당 활동의 4번 프롬프트로 결과를 확인합니다. 없다는 사실 자체가 기대 결과인지 먼저 판단합니다."},{"id":"a24-error","category":"오류 해결","title":"예상과 다른 결과가 나올 때","when":"실행 오류, 정상 기능 실패, 예상한 차단이 되지 않는 경우에 보냅니다.","text":"활동: 학생이 읽고 조작할 수 있는 화면인지 확인\n앱 이름과 프로젝트: [입력]\n이번 시험 주소: [입력]\n준비 정보: 대상 연령, 주요 화면, 사용하는 기기와 브라우저\n현재 상황: [입력]\n사용할 가상 자료: [입력]\n실행한 단계와 입력: [입력]\n기대한 결과: [입력]\n실제로 나온 결과: [입력]\n오류 문구: [비밀값을 가리고 붙이기]\n직전에 변경한 파일 또는 설정: [입력 또는 모름]\n\n원인을 추측해서 여러 곳을 한꺼번에 바꾸지 말고, 재현 조건과 현재 코드를 비교해 줘. 요청이 만들어지는지, 서버에 도착하는지, 검사와 반환·저장이 어디서 달라지는지 관련 단계만 확인해 줘.\n특히 다음 점검 기준을 다시 봐 줘:\n1. 전문 용어·긴 문장·불분명한 버튼 이름을 실제 이용자의 행동에 맞춰 점검해 줘.\n2. 키보드 이동 순서·입력칸 이름·오류 안내·초점 위치를 확인해 줘.\n\n가능한 원인마다 그렇게 판단한 이유와 먼저 확인할 방법을 알려 줘. 운영 자료를 삭제하거나 권한·입력 검사를 전체 해제하는 방식은 사용하지 마. 수정이 필요하면 바꿀 내용을 먼저 제안하고 내가 승인한 뒤 적용해 줘.\n수정 후 같은 실패 조건과 다음 정상 조건을 모두 재시험해 줘:\n1. 마우스 없이 Tab·Enter·Esc로 주요 활동을 완료해 줘.\n2. 모바일 폭과 브라우저 확대 상태에서 주요 문장과 버튼을 확인해 줘.\n3. 입력 오류 후 초점과 안내가 문제 위치로 연결되는지 확인해 줘.\n4. 색을 구분하기 어려워도 상태를 글로 알 수 있는지 확인해 줘.\n완료 보고에는 실제 실행한 결과와 실행하지 못한 이유를 구분해 줘.","next":"실패 원인을 확인하고 승인한 수정만 적용합니다. 같은 실패 조건이 해결됐는지와 원래 정상 기능이 유지되는지 함께 봅니다."},{"id":"a24-finish","category":"활동 마무리","title":"확인 기록과 다음 점검 정리하기","when":"직접 시험을 확인한 뒤, 또는 해당 없음·추가 확인으로 종료할 때 보냅니다.","text":"활동: 학생이 읽고 조작할 수 있는 화면인지 확인\n앱 이름과 프로젝트: [입력]\n이번 시험 주소: [입력]\n준비 정보: 대상 연령, 주요 화면, 사용하는 기기와 브라우저\n현재 상황: [입력]\n사용할 가상 자료: [입력]\n실제로 진행한 단계: [입력]\n확인한 결과 또는 아직 확인하지 못한 내용: [입력]\n\n이번 활동 기록을 Markdown으로 정리해 줘. 항목은 앱과 시험 버전, 점검한 기능, 발견한 문제와 위치, 승인한 수정, 시험 입력과 기대 결과, 실제 결과와 근거, 추가 확인할 일로 구성해 줘.\n앞으로 개발할 때 지킬 기준도 우리 앱의 실제 코드·설정 위치와 연결해 적어 줘:\n1. 앱의 기존 디자인을 유지하면서 다음 행동을 알 수 있는 문장과 버튼 이름으로 고쳐 줘.\n2. 입력 오류는 해당 위치와 수정 방법을 함께 설명하고 학생이 쓴 내용을 불필요하게 지우지 마.\n3. 라벨·초점 표시·키보드 조작·텍스트 상태 설명을 보완해 줘.\n4. 보안 경고 때문에 정상 활동이 막히면 재입력·교사에게 문의·취소 등 실제 가능한 선택을 제공해 줘.\n\n활동 상태는 확인 완료·추가 확인·해당 없음 중 근거에 맞게 적어 줘. 구현만 하고 시험하지 않았다면 확인 완료로 쓰지 마. 문제를 발견하지 못한 것과 충분히 검증한 것을 구분해 줘.\n다음 수정 때 다시 실행할 시험은 다음 내용을 바탕으로 정리해 줘:\n1. 마우스 없이 Tab·Enter·Esc로 주요 활동을 완료해 줘.\n2. 모바일 폭과 브라우저 확대 상태에서 주요 문장과 버튼을 확인해 줘.\n보고서에 원문 학생 자료나 비밀값을 넣지 마. 이 기록만으로 학교 승인이나 앱 전체의 안전을 보장한다고 쓰지 마.","next":"기록을 자신의 프로젝트에 보관하고 필요한 다음 활동을 선택합니다. 새로운 대화를 시작할 때는 이 기록과 공통 시작 프롬프트를 함께 제공합니다."}]},{"id":25,"title":"학교에서 사용할 소프트웨어의 검토 범위 정리","group":"학교 제출 자료","slides":"42~49","condition":"학교 수업에서 사용할 앱의 선정 자료를 준비하는 경우","inputs":"학교급, 사용 목적, 학생 사용 여부, 처리 정보, 최신 교육청 안내와 학교 서식","inspect":["수업 중 학생 사용, 교사의 수업 준비, 행정업무 사용을 실제 운영 방식에 따라 구분해 줘.","학생 개인정보 처리와 교육과정 운영 지원 콘텐츠 제공 여부를 현재 공식 선정기준의 적용 범위와 대조해 줘.","사용자가 제공한 학교·교육청 자료의 발행일과 적용 대상을 확인해 줘.","학교의 선정·확인·심의 역할과 개발자의 설명·증빙 작성 역할을 구분해 줘."],"requirements":["앱 이름·주소·용도·대상·정보 처리·외부 연동·담당자를 한 장의 기본 정보로 정리해 줘.","확인한 공식 근거와 추가로 학교에 확인할 질문을 나누어 적어 줘.","내부 링크 추가나 모든 기능 업데이트마다 자동으로 재심의해야 한다는 규칙을 근거 없이 만들지 마.","포털이라는 이름만으로 모든 연결 앱의 검토가 면제된다고도 단정하지 마. 실제 사용 범위와 확인 자료를 기준으로 설명해 줘."],"tests":["앱의 실제 사용 목적과 서류의 분류가 일치하는지 확인해 줘.","최신 공식 서식의 필수 항목을 빠짐없이 대응했는지 확인해 줘.","학교가 결정할 항목을 개발자가 확정한 것처럼 쓴 문장이 없는지 확인해 줘.","새로운 의무나 예외를 임의로 만든 문장이 없는지 근거별로 재검토해 줘."],"location":"앱의 화면·처리 기능과 교육부·교육청의 최신 안내 및 학교 서식을 함께 확인합니다. 학교운영위원회 적용 여부는 F12에서 확인하는 항목이 아닙니다.","links":["https://www.moe.go.kr/boardCnts/viewRenew.do?boardID=294&boardSeq=105007&lev=0&m=020","https://edzip.kr/"],"branches":[["교사의 행정업무용 앱인 경우","학생 수업용 소프트웨어 선정과 다른 범위인지 현재 공식 안내로 확인해 줘. 선정기준 적용과 별개인 개인정보·보안 점검은 유지해 줘."],["적용 범위가 모호한 경우","추정으로 해당 또는 면제를 확정하지 말고 앱의 실제 이용 방식과 질문을 정리해 학교 담당자에게 확인할 수 있게 해 줘."]],"prompts":[{"id":"a25-inspect","category":"기본 진행","title":"1 현재 상태부터 확인하기","when":"프로젝트를 연 뒤 처음 보냅니다. 파일을 고치기 전 단계입니다.","text":"활동: 학교에서 사용할 소프트웨어의 검토 범위 정리\n앱 이름과 프로젝트: [입력]\n이번 시험 주소: [입력]\n준비 정보: 학교급, 사용 목적, 학생 사용 여부, 처리 정보, 최신 교육청 안내와 학교 서식\n현재 상황: [입력]\n사용할 가상 자료: [입력]\n\n이 활동에 해당하는지부터 확인해 줘. 아직 파일이나 설정은 수정하지 마.\n1. 수업 중 학생 사용, 교사의 수업 준비, 행정업무 사용을 실제 운영 방식에 따라 구분해 줘.\n2. 학생 개인정보 처리와 교육과정 운영 지원 콘텐츠 제공 여부를 현재 공식 선정기준의 적용 범위와 대조해 줘.\n3. 사용자가 제공한 학교·교육청 자료의 발행일과 적용 대상을 확인해 줘.\n4. 학교의 선정·확인·심의 역할과 개발자의 설명·증빙 작성 역할을 구분해 줘.\n\n결과는 표로 정리해 줘. 표에는 확인 항목, 현재 동작, 근거가 있는 파일이나 설정 위치, 발견한 문제와 추가로 확인할 내용을 적어 줘. 코드에서 확인한 사실과 추정은 구분해 줘. 내가 직접 확인할 메뉴·버튼·파일 이름도 알려 줘. 파일을 읽지 못했다면 그 사실을 표시해 줘.\n실제 학생 정보·비밀키·인증 토큰은 출력하지 말고 필요한 값은 가려 줘. 내 앱 또는 허락받은 시험 환경만 대상으로 해 줘.\n참고할 확인 위치: 앱의 화면·처리 기능과 교육부·교육청의 최신 안내 및 학교 서식을 함께 확인합니다. 학교운영위원회 적용 여부는 F12에서 확인하는 항목이 아닙니다.","next":"현재 구조와 해당 여부를 확인합니다. 모르는 정보는 먼저 확인하고, 수정이 필요하면 2번으로 진행합니다."},{"id":"a25-plan","category":"기본 진행","title":"2 수정 방법과 범위 정하기","when":"1번 답변에서 실제로 고칠 항목을 골랐을 때 보냅니다.","text":"활동: 학교에서 사용할 소프트웨어의 검토 범위 정리\n앱 이름과 프로젝트: [입력]\n이번 시험 주소: [입력]\n준비 정보: 학교급, 사용 목적, 학생 사용 여부, 처리 정보, 최신 교육청 안내와 학교 서식\n현재 상황: [입력]\n사용할 가상 자료: [입력]\n앞에서 확인한 문제와 근거: [1번 결과 중 해당 부분을 붙이기]\n이번에 고칠 항목: [입력]\n\n구현 전에 다음 조건으로 수정 계획을 만들어 줘.\n1. 앱 이름·주소·용도·대상·정보 처리·외부 연동·담당자를 한 장의 기본 정보로 정리해 줘.\n2. 확인한 공식 근거와 추가로 학교에 확인할 질문을 나누어 적어 줘.\n3. 내부 링크 추가나 모든 기능 업데이트마다 자동으로 재심의해야 한다는 규칙을 근거 없이 만들지 마.\n4. 포털이라는 이름만으로 모든 연결 앱의 검토가 면제된다고도 단정하지 마. 실제 사용 범위와 확인 자료를 기준으로 설명해 줘.\n\n기존 기능을 유지하면서 문제를 고칠 방법부터 제안해 줘. 방법이 여러 가지라면 필요한 서비스와 비용, 사용 방법이 달라지는 부분, 이전 상태로 되돌릴 방법을 비교해 줘. 반드시 고쳐야 할 부분과 선택해서 개선할 부분을 구분해 줘.\n변경할 파일, 학생 또는 교사 화면에서 달라질 부분, 필요한 관리 설정, 시험할 가상 입력을 순서대로 적어 줘. 서버가 없는 앱이라면 지금 할 수 있는 것과 서버가 필요한 것을 분리해 줘.\n아직 코드를 수정하거나 서비스를 만들지 마. 내가 결정해야 할 사항이 있으면 선택지와 차이를 설명하고 물어봐 줘.","next":"수정할 내용과 비용, 정보 수집·전송·보관 방식이 달라지는지 확인한 뒤 진행할 방법을 정합니다. 학교가 판단해야 하는 내용은 먼저 확인합니다."},{"id":"a25-implement","category":"기본 진행","title":"3 선택한 범위 구현하기","when":"수정 계획을 검토한 뒤 승인할 범위를 직접 적고 보냅니다.","text":"활동: 학교에서 사용할 소프트웨어의 검토 범위 정리\n앱 이름과 프로젝트: [입력]\n이번 시험 주소: [입력]\n준비 정보: 학교급, 사용 목적, 학생 사용 여부, 처리 정보, 최신 교육청 안내와 학교 서식\n현재 상황: [입력]\n사용할 가상 자료: [입력]\n승인한 수정안: [선택한 방법과 항목을 정확히 입력]\n수정할 파일 또는 기능 범위: [입력]\n이번에 제외할 것: [입력]\n\n위에 승인한 범위만 구현해 줘. 시작 전에 현재 변경 파일을 확인해 다른 작업을 보존해 줘.\n1. 앱 이름·주소·용도·대상·정보 처리·외부 연동·담당자를 한 장의 기본 정보로 정리해 줘.\n2. 확인한 공식 근거와 추가로 학교에 확인할 질문을 나누어 적어 줘.\n3. 내부 링크 추가나 모든 기능 업데이트마다 자동으로 재심의해야 한다는 규칙을 근거 없이 만들지 마.\n4. 포털이라는 이름만으로 모든 연결 앱의 검토가 면제된다고도 단정하지 마. 실제 사용 범위와 확인 자료를 기준으로 설명해 줘.\n\n한 부분씩 수정하고 실행 결과를 확인해 줘. 기존 디자인과 정상 기능은 유지해 줘. 새 서비스 생성·운영 자료 삭제·유료 호출·커밋·푸시·배포는 이 요청에 구체적으로 승인한 경우에만 실행해 줘. 요청하지 않은 변경이 필요하면 진행 전에 이유를 설명해 줘.\n수정 후 바꾼 파일과 이유, 실행한 검사, 아직 하지 못한 시험, 내가 누를 버튼 순서를 적어 줘. 실제 학생 정보·비밀키·인증 토큰은 출력하지 말고 필요한 값은 가려 줘. 내 앱 또는 허락받은 시험 환경만 대상으로 해 줘.","next":"빌드나 실행 오류가 없는지 확인한 뒤 4번으로 진행합니다. 허용해야 할 동작은 정상적으로 되고, 차단해야 할 동작은 막히는지 함께 시험합니다."},{"id":"a25-verify","category":"기본 진행","title":"4 수정 결과 직접 확인하기","when":"구현이 끝났거나 기존 기능이 안전하게 동작하는지 검증할 때 보냅니다.","text":"활동: 학교에서 사용할 소프트웨어의 검토 범위 정리\n앱 이름과 프로젝트: [입력]\n이번 시험 주소: [입력]\n준비 정보: 학교급, 사용 목적, 학생 사용 여부, 처리 정보, 최신 교육청 안내와 학교 서식\n현재 상황: [입력]\n사용할 가상 자료: [입력]\n이번 수정 내용: [입력 또는 기존 기능 검증]\n시험할 버전과 주소: [입력]\n\n다음 조건을 가상 자료로 다시 시험해 줘.\n1. 앱의 실제 사용 목적과 서류의 분류가 일치하는지 확인해 줘.\n2. 최신 공식 서식의 필수 항목을 빠짐없이 대응했는지 확인해 줘.\n3. 학교가 결정할 항목을 개발자가 확정한 것처럼 쓴 문장이 없는지 확인해 줘.\n4. 새로운 의무나 예외를 임의로 만든 문장이 없는지 근거별로 재검토해 줘.\n\n내가 직접 따라 할 수 있도록 준비 계정과 상태 → 클릭 또는 입력 → 확인할 실제 탭·요청·필드 → 기대 결과를 항목마다 적어 줘.\n확인할 위치: 앱의 화면·처리 기능과 교육부·교육청의 최신 안내 및 학교 서식을 함께 확인합니다. 학교운영위원회 적용 여부는 F12에서 확인하는 항목이 아닙니다.\n자기 앱에서 이름이 다르면 코드와 실제 요청에서 맞는 이름을 찾아 줘. 실제로 존재하는지 확인하지 않은 요청명을 만들어 내지 마.\n허용해야 할 동작과 차단해야 할 동작을 함께 시험해 줘. 항목마다 실행 여부, 실제 결과, 확인한 화면이나 기록을 적고, 시험하지 못했다면 이유를 설명해 줘. 응답 코드와 실제로 받은 자료를 함께 확인하고, 저장 기능이 있다면 저장된 결과도 확인해 줘.\n이 활동을 완료해도 앱 전체의 안전이 보장된다고 표현하지 마. 실제 학생 정보·비밀키·인증 토큰은 출력하지 말고 필요한 값은 가려 줘. 내 앱 또는 허락받은 시험 환경만 대상으로 해 줘.","next":"기대 결과와 실제 결과가 같으면 활동 기록을 정리합니다. 다르면 “오류 해결” 프롬프트를 사용하고 같은 조건으로 재시험합니다."},{"id":"a25-branch1","category":"상황별 진행","title":"교사의 행정업무용 앱인 경우","when":"기본 순서로 진행하다가 이 상황에 해당하면 사용합니다.","text":"활동: 학교에서 사용할 소프트웨어의 검토 범위 정리\n앱 이름과 프로젝트: [입력]\n이번 시험 주소: [입력]\n준비 정보: 학교급, 사용 목적, 학생 사용 여부, 처리 정보, 최신 교육청 안내와 학교 서식\n현재 상황: [입력]\n사용할 가상 자료: [입력]\n현재 겪는 상황: 교사의 행정업무용 앱인 경우\n이미 한 행동과 나온 결과: [입력]\n\n학생 수업용 소프트웨어 선정과 다른 범위인지 현재 공식 안내로 확인해 줘. 선정기준 적용과 별개인 개인정보·보안 점검은 유지해 줘.\n먼저 관련 코드·화면·설정에서 현재 상태를 확인하고 이 상황이 생긴 이유를 근거와 함께 설명해 줘. 현재 환경에서 확인할 수 없는 것은 따로 표시해 줘.\n이 활동에서 유지할 조건:\n1. 앱 이름·주소·용도·대상·정보 처리·외부 연동·담당자를 한 장의 기본 정보로 정리해 줘.\n2. 확인한 공식 근거와 추가로 학교에 확인할 질문을 나누어 적어 줘.\n3. 내부 링크 추가나 모든 기능 업데이트마다 자동으로 재심의해야 한다는 규칙을 근거 없이 만들지 마.\n\n진행 순서를 “지금 확인할 것 → 선택 가능한 방법 → 내가 승인할 변경 → 실행 후 다시 확인할 결과”로 정리해 줘. 앱에 필요 없는 기능을 추가하거나 검사를 끄는 방식으로 해결하지 마.\n재시험에서는 다음 조건을 포함해 줘:\n1. 앱의 실제 사용 목적과 서류의 분류가 일치하는지 확인해 줘.\n2. 최신 공식 서식의 필수 항목을 빠짐없이 대응했는지 확인해 줘.\n수정이 필요하면 먼저 범위를 제안하고 내 확인 전 운영 설정을 바꾸지 마. 실제 학생 정보·비밀키·인증 토큰은 출력하지 말고 필요한 값은 가려 줘. 내 앱 또는 허락받은 시험 환경만 대상으로 해 줘.","next":"이 상황에 맞는 방법을 선택한 뒤 기본 진행의 구현 또는 재시험 단계로 돌아갑니다. 해당 없음이면 이유를 기록하고 다른 활동을 고릅니다."},{"id":"a25-branch2","category":"상황별 진행","title":"적용 범위가 모호한 경우","when":"기본 순서로 진행하다가 이 상황에 해당하면 사용합니다.","text":"활동: 학교에서 사용할 소프트웨어의 검토 범위 정리\n앱 이름과 프로젝트: [입력]\n이번 시험 주소: [입력]\n준비 정보: 학교급, 사용 목적, 학생 사용 여부, 처리 정보, 최신 교육청 안내와 학교 서식\n현재 상황: [입력]\n사용할 가상 자료: [입력]\n현재 겪는 상황: 적용 범위가 모호한 경우\n이미 한 행동과 나온 결과: [입력]\n\n추정으로 해당 또는 면제를 확정하지 말고 앱의 실제 이용 방식과 질문을 정리해 학교 담당자에게 확인할 수 있게 해 줘.\n먼저 관련 코드·화면·설정에서 현재 상태를 확인하고 이 상황이 생긴 이유를 근거와 함께 설명해 줘. 현재 환경에서 확인할 수 없는 것은 따로 표시해 줘.\n이 활동에서 유지할 조건:\n1. 앱 이름·주소·용도·대상·정보 처리·외부 연동·담당자를 한 장의 기본 정보로 정리해 줘.\n2. 확인한 공식 근거와 추가로 학교에 확인할 질문을 나누어 적어 줘.\n3. 내부 링크 추가나 모든 기능 업데이트마다 자동으로 재심의해야 한다는 규칙을 근거 없이 만들지 마.\n\n진행 순서를 “지금 확인할 것 → 선택 가능한 방법 → 내가 승인할 변경 → 실행 후 다시 확인할 결과”로 정리해 줘. 앱에 필요 없는 기능을 추가하거나 검사를 끄는 방식으로 해결하지 마.\n재시험에서는 다음 조건을 포함해 줘:\n1. 앱의 실제 사용 목적과 서류의 분류가 일치하는지 확인해 줘.\n2. 최신 공식 서식의 필수 항목을 빠짐없이 대응했는지 확인해 줘.\n수정이 필요하면 먼저 범위를 제안하고 내 확인 전 운영 설정을 바꾸지 마. 실제 학생 정보·비밀키·인증 토큰은 출력하지 말고 필요한 값은 가려 줘. 내 앱 또는 허락받은 시험 환경만 대상으로 해 줘.","next":"이 상황에 맞는 방법을 선택한 뒤 기본 진행의 구현 또는 재시험 단계로 돌아갑니다. 해당 없음이면 이유를 기록하고 다른 활동을 고릅니다."},{"id":"a25-locate","category":"확인 위치 도움","title":"필요한 서식이나 근거 자료를 찾지 못할 때","when":"공식 서식, 운영 정보, 항목별 증빙이 없거나 서로 다를 때 보냅니다.","text":"활동: 학교에서 사용할 소프트웨어의 검토 범위 정리\n앱 이름과 프로젝트: [입력]\n이번 시험 주소: [입력]\n준비 정보: 학교급, 사용 목적, 학생 사용 여부, 처리 정보, 최신 교육청 안내와 학교 서식\n현재 상황: [입력]\n사용할 가상 자료: [입력]\n찾지 못한 자료 또는 항목: [입력]\n현재 가진 문서의 이름과 발행일: [입력]\n학교 또는 담당자가 요청한 내용: [입력]\n\n앱의 화면·처리 기능과 교육부·교육청의 최신 안내 및 학교 서식을 함께 확인합니다. 학교운영위원회 적용 여부는 F12에서 확인하는 항목이 아닙니다.\n이 활동의 서식과 적용 여부는 학교 안내와 공식 문서에서 확인하도록 안내해 줘. F12에서 확인할 수 있는 내용과 구분해 줘.\n제공한 자료에서 해당 항목의 원문과 적용 대상을 찾아 줘. 자료가 없으면 최신 원본을 구할 공식 기관·메뉴·링크와 검색어를 알려 줘. 접근하지 못한 문서를 읽었다고 하거나 학교가 요구하지 않은 서식을 공식 양식처럼 만들지 마.\n각 항목을 문서에서 확인할 것, 앱의 실제 동작으로 증명할 것, 운영자 또는 학교에 물을 것으로 구분해 줘.\n준비된 자료만으로 답할 수 있는 부분과 추가로 필요한 부분을 나누고, 문의할 질문을 구체적으로 작성해 줘. 참고용 예시를 복사했다면 우리 앱과 다른 사실도 표시해 줘.\n실제 학생 정보·비밀키·인증 토큰은 출력하지 말고 필요한 값은 가려 줘. 내 앱 또는 허락받은 시험 환경만 대상으로 해 줘.","next":"공식 서식과 실제 운영 정보를 확보한 뒤 2번의 작성 범위 결정으로 돌아갑니다. 확인하지 못한 항목을 임의로 채우지 않습니다."},{"id":"a25-error","category":"오류 해결","title":"작성 내용이 사실이나 서식과 맞지 않을 때","when":"누락, 항목 불일치, 근거 없는 판정 또는 보완 요청을 발견했을 때 보냅니다.","text":"활동: 학교에서 사용할 소프트웨어의 검토 범위 정리\n앱 이름과 프로젝트: [입력]\n이번 시험 주소: [입력]\n준비 정보: 학교급, 사용 목적, 학생 사용 여부, 처리 정보, 최신 교육청 안내와 학교 서식\n현재 상황: [입력]\n사용할 가상 자료: [입력]\n문제가 있는 문장 또는 항목: [입력]\n비교할 공식 서식과 실제 운영 사실: [입력]\n보완 요청이 있다면 그 원문: [입력]\n\n다음 기준으로 현재 자료의 차이를 확인해 줘.\n1. 수업 중 학생 사용, 교사의 수업 준비, 행정업무 사용을 실제 운영 방식에 따라 구분해 줘.\n2. 학생 개인정보 처리와 교육과정 운영 지원 콘텐츠 제공 여부를 현재 공식 선정기준의 적용 범위와 대조해 줘.\n3. 사용자가 제공한 학교·교육청 자료의 발행일과 적용 대상을 확인해 줘.\n4. 학교의 선정·확인·심의 역할과 개발자의 설명·증빙 작성 역할을 구분해 줘.\n표현 문제, 실제 기능과의 차이, 근거 부족, 학교 확인이 필요한 사항을 구분해 줘. 서식 원문이나 법적 의미를 바꾸지 말고 필요한 최소 수정안을 보여 줘.\n운영 사실을 확인하지 못했으면 없음 또는 적합이라고 채우지 마. 내가 승인한 문서 수정만 적용하고 앱 코드나 운영 설정을 바꾸지 마.\n수정 후 다음 항목을 다시 대조해 줘.\n1. 앱의 실제 사용 목적과 서류의 분류가 일치하는지 확인해 줘.\n2. 최신 공식 서식의 필수 항목을 빠짐없이 대응했는지 확인해 줘.\n3. 학교가 결정할 항목을 개발자가 확정한 것처럼 쓴 문장이 없는지 확인해 줘.\n4. 새로운 의무나 예외를 임의로 만든 문장이 없는지 근거별로 재검토해 줘.\n수정한 문장, 근거 자료, 아직 답하지 못한 질문을 함께 제시해 줘. 실제 제출이나 외부 발송은 하지 마.","next":"실패 원인을 확인하고 승인한 수정만 적용합니다. 같은 실패 조건이 해결됐는지와 원래 정상 기능이 유지되는지 함께 봅니다."},{"id":"a25-finish","category":"활동 마무리","title":"확인 기록과 다음 점검 정리하기","when":"직접 시험을 확인한 뒤, 또는 해당 없음·추가 확인으로 종료할 때 보냅니다.","text":"활동: 학교에서 사용할 소프트웨어의 검토 범위 정리\n앱 이름과 프로젝트: [입력]\n이번 시험 주소: [입력]\n준비 정보: 학교급, 사용 목적, 학생 사용 여부, 처리 정보, 최신 교육청 안내와 학교 서식\n현재 상황: [입력]\n사용할 가상 자료: [입력]\n실제로 진행한 단계: [입력]\n확인한 결과 또는 아직 확인하지 못한 내용: [입력]\n\n이번 활동 기록을 Markdown으로 정리해 줘. 항목은 앱과 시험 버전, 점검한 기능, 발견한 문제와 위치, 승인한 수정, 시험 입력과 기대 결과, 실제 결과와 근거, 추가 확인할 일로 구성해 줘.\n앞으로 개발할 때 지킬 기준도 우리 앱의 실제 코드·설정 위치와 연결해 적어 줘:\n1. 앱 이름·주소·용도·대상·정보 처리·외부 연동·담당자를 한 장의 기본 정보로 정리해 줘.\n2. 확인한 공식 근거와 추가로 학교에 확인할 질문을 나누어 적어 줘.\n3. 내부 링크 추가나 모든 기능 업데이트마다 자동으로 재심의해야 한다는 규칙을 근거 없이 만들지 마.\n4. 포털이라는 이름만으로 모든 연결 앱의 검토가 면제된다고도 단정하지 마. 실제 사용 범위와 확인 자료를 기준으로 설명해 줘.\n\n활동 상태는 확인 완료·추가 확인·해당 없음 중 근거에 맞게 적어 줘. 구현만 하고 시험하지 않았다면 확인 완료로 쓰지 마. 문제를 발견하지 못한 것과 충분히 검증한 것을 구분해 줘.\n다음 수정 때 다시 실행할 시험은 다음 내용을 바탕으로 정리해 줘:\n1. 앱의 실제 사용 목적과 서류의 분류가 일치하는지 확인해 줘.\n2. 최신 공식 서식의 필수 항목을 빠짐없이 대응했는지 확인해 줘.\n보고서에 원문 학생 자료나 비밀값을 넣지 마. 이 기록만으로 학교 승인이나 앱 전체의 안전을 보장한다고 쓰지 마.","next":"기록을 자신의 프로젝트에 보관하고 필요한 다음 활동을 선택합니다. 새로운 대화를 시작할 때는 이 기록과 공통 시작 프롬프트를 함께 제공합니다."}]},{"id":26,"title":"실제 운영에 맞는 이용약관 초안 작성","group":"학교 제출 자료","slides":"58, 60~61","condition":"앱 이용 조건을 안내할 문서가 필요한 경우","inputs":"운영 주체, 대상, 기능, 계정 방식, 비용, 문의 방법, 종료 정책","inspect":["앱에서 실제로 제공하는 기능과 운영자가 실제로 할 수 있는 지원 범위를 정리해 줘.","기존 약관에서 다른 서비스 이름·유료 결제·광고 등 우리 앱에 없는 내용을 찾아 줘.","학생이 작성한 자료의 이용 범위와 계정 제한·종료 절차를 확인해 줘.","개인정보처리방침에 써야 할 내용을 약관의 포괄 동의로 대신하고 있는지 확인해 줘."],"requirements":["목적·이용 대상·제공 기능·이용 시 주의사항·이용 제한과 문의·서비스 변경 및 종료를 실제 운영 방식에 맞춰 초안으로 작성해 줘.","모르는 운영 정보는 그럴듯한 문구로 채우지 말고 확인할 질문으로 분리해 줘.","학생에게 일방적 책임을 떠넘기거나 모든 권리를 포기시키는 문구를 만들지 마.","법적 적합성이 확정된 문서라고 표현하지 말고 학교가 검토할 초안과 확인 항목을 함께 제공해 줘."],"tests":["조항별로 실제 화면·기능·운영 방침 근거를 연결해 줘.","앱에 없는 기능이나 운영 주체가 들어가지 않았는지 확인해 줘.","학생과 보호자가 이해할 수 있는 요약과 상세 문서가 서로 모순되지 않는지 확인해 줘.","게시 전에 작성일·적용일·문의처의 실제 값을 사람이 확인할 목록으로 정리해 줘."],"location":"기존 앱의 푸터 이용약관과 실제 화면을 비교합니다. aiworld의 사례는 형식을 참고하되 운영 주체·처리 방식은 자신의 앱에 맞춰 작성합니다.","links":["https://aiworld-ig.vercel.app/login.html"],"branches":[["다른 앱 약관을 복사한 경우","각 조항이 우리 앱의 기능과 운영 방식에 맞는지 검토해 줘. 해당 없는 내용을 삭제할 때는 이유를 설명하고, 작성에 필요한 정보가 빠져 있으면 질문해 줘."],["운영 주체가 아직 정해지지 않은 경우","실제 주체·문의처·책임 범위가 확정되기 전에는 공개용 최종본을 만들지 말고 확인이 필요한 항목을 표시한 검토 초안만 만들어 줘."]],"prompts":[{"id":"a26-inspect","category":"기본 진행","title":"1 현재 상태부터 확인하기","when":"프로젝트를 연 뒤 처음 보냅니다. 파일을 고치기 전 단계입니다.","text":"활동: 실제 운영에 맞는 이용약관 초안 작성\n앱 이름과 프로젝트: [입력]\n이번 시험 주소: [입력]\n준비 정보: 운영 주체, 대상, 기능, 계정 방식, 비용, 문의 방법, 종료 정책\n현재 상황: [입력]\n사용할 가상 자료: [입력]\n\n이 활동에 해당하는지부터 확인해 줘. 아직 파일이나 설정은 수정하지 마.\n1. 앱에서 실제로 제공하는 기능과 운영자가 실제로 할 수 있는 지원 범위를 정리해 줘.\n2. 기존 약관에서 다른 서비스 이름·유료 결제·광고 등 우리 앱에 없는 내용을 찾아 줘.\n3. 학생이 작성한 자료의 이용 범위와 계정 제한·종료 절차를 확인해 줘.\n4. 개인정보처리방침에 써야 할 내용을 약관의 포괄 동의로 대신하고 있는지 확인해 줘.\n\n결과는 표로 정리해 줘. 표에는 확인 항목, 현재 동작, 근거가 있는 파일이나 설정 위치, 발견한 문제와 추가로 확인할 내용을 적어 줘. 코드에서 확인한 사실과 추정은 구분해 줘. 내가 직접 확인할 메뉴·버튼·파일 이름도 알려 줘. 파일을 읽지 못했다면 그 사실을 표시해 줘.\n실제 학생 정보·비밀키·인증 토큰은 출력하지 말고 필요한 값은 가려 줘. 내 앱 또는 허락받은 시험 환경만 대상으로 해 줘.\n참고할 확인 위치: 기존 앱의 푸터 이용약관과 실제 화면을 비교합니다. aiworld의 사례는 형식을 참고하되 운영 주체·처리 방식은 자신의 앱에 맞춰 작성합니다.","next":"현재 구조와 해당 여부를 확인합니다. 모르는 정보는 먼저 확인하고, 수정이 필요하면 2번으로 진행합니다."},{"id":"a26-plan","category":"기본 진행","title":"2 수정 방법과 범위 정하기","when":"1번 답변에서 실제로 고칠 항목을 골랐을 때 보냅니다.","text":"활동: 실제 운영에 맞는 이용약관 초안 작성\n앱 이름과 프로젝트: [입력]\n이번 시험 주소: [입력]\n준비 정보: 운영 주체, 대상, 기능, 계정 방식, 비용, 문의 방법, 종료 정책\n현재 상황: [입력]\n사용할 가상 자료: [입력]\n앞에서 확인한 문제와 근거: [1번 결과 중 해당 부분을 붙이기]\n이번에 고칠 항목: [입력]\n\n구현 전에 다음 조건으로 수정 계획을 만들어 줘.\n1. 목적·이용 대상·제공 기능·이용 시 주의사항·이용 제한과 문의·서비스 변경 및 종료를 실제 운영 방식에 맞춰 초안으로 작성해 줘.\n2. 모르는 운영 정보는 그럴듯한 문구로 채우지 말고 확인할 질문으로 분리해 줘.\n3. 학생에게 일방적 책임을 떠넘기거나 모든 권리를 포기시키는 문구를 만들지 마.\n4. 법적 적합성이 확정된 문서라고 표현하지 말고 학교가 검토할 초안과 확인 항목을 함께 제공해 줘.\n\n기존 기능을 유지하면서 문제를 고칠 방법부터 제안해 줘. 방법이 여러 가지라면 필요한 서비스와 비용, 사용 방법이 달라지는 부분, 이전 상태로 되돌릴 방법을 비교해 줘. 반드시 고쳐야 할 부분과 선택해서 개선할 부분을 구분해 줘.\n변경할 파일, 학생 또는 교사 화면에서 달라질 부분, 필요한 관리 설정, 시험할 가상 입력을 순서대로 적어 줘. 서버가 없는 앱이라면 지금 할 수 있는 것과 서버가 필요한 것을 분리해 줘.\n아직 코드를 수정하거나 서비스를 만들지 마. 내가 결정해야 할 사항이 있으면 선택지와 차이를 설명하고 물어봐 줘.","next":"수정할 내용과 비용, 정보 수집·전송·보관 방식이 달라지는지 확인한 뒤 진행할 방법을 정합니다. 학교가 판단해야 하는 내용은 먼저 확인합니다."},{"id":"a26-implement","category":"기본 진행","title":"3 선택한 범위 구현하기","when":"수정 계획을 검토한 뒤 승인할 범위를 직접 적고 보냅니다.","text":"활동: 실제 운영에 맞는 이용약관 초안 작성\n앱 이름과 프로젝트: [입력]\n이번 시험 주소: [입력]\n준비 정보: 운영 주체, 대상, 기능, 계정 방식, 비용, 문의 방법, 종료 정책\n현재 상황: [입력]\n사용할 가상 자료: [입력]\n승인한 수정안: [선택한 방법과 항목을 정확히 입력]\n수정할 파일 또는 기능 범위: [입력]\n이번에 제외할 것: [입력]\n\n위에 승인한 범위만 구현해 줘. 시작 전에 현재 변경 파일을 확인해 다른 작업을 보존해 줘.\n1. 목적·이용 대상·제공 기능·이용 시 주의사항·이용 제한과 문의·서비스 변경 및 종료를 실제 운영 방식에 맞춰 초안으로 작성해 줘.\n2. 모르는 운영 정보는 그럴듯한 문구로 채우지 말고 확인할 질문으로 분리해 줘.\n3. 학생에게 일방적 책임을 떠넘기거나 모든 권리를 포기시키는 문구를 만들지 마.\n4. 법적 적합성이 확정된 문서라고 표현하지 말고 학교가 검토할 초안과 확인 항목을 함께 제공해 줘.\n\n한 부분씩 수정하고 실행 결과를 확인해 줘. 기존 디자인과 정상 기능은 유지해 줘. 새 서비스 생성·운영 자료 삭제·유료 호출·커밋·푸시·배포는 이 요청에 구체적으로 승인한 경우에만 실행해 줘. 요청하지 않은 변경이 필요하면 진행 전에 이유를 설명해 줘.\n수정 후 바꾼 파일과 이유, 실행한 검사, 아직 하지 못한 시험, 내가 누를 버튼 순서를 적어 줘. 실제 학생 정보·비밀키·인증 토큰은 출력하지 말고 필요한 값은 가려 줘. 내 앱 또는 허락받은 시험 환경만 대상으로 해 줘.","next":"빌드나 실행 오류가 없는지 확인한 뒤 4번으로 진행합니다. 허용해야 할 동작은 정상적으로 되고, 차단해야 할 동작은 막히는지 함께 시험합니다."},{"id":"a26-verify","category":"기본 진행","title":"4 수정 결과 직접 확인하기","when":"구현이 끝났거나 기존 기능이 안전하게 동작하는지 검증할 때 보냅니다.","text":"활동: 실제 운영에 맞는 이용약관 초안 작성\n앱 이름과 프로젝트: [입력]\n이번 시험 주소: [입력]\n준비 정보: 운영 주체, 대상, 기능, 계정 방식, 비용, 문의 방법, 종료 정책\n현재 상황: [입력]\n사용할 가상 자료: [입력]\n이번 수정 내용: [입력 또는 기존 기능 검증]\n시험할 버전과 주소: [입력]\n\n다음 조건을 가상 자료로 다시 시험해 줘.\n1. 조항별로 실제 화면·기능·운영 방침 근거를 연결해 줘.\n2. 앱에 없는 기능이나 운영 주체가 들어가지 않았는지 확인해 줘.\n3. 학생과 보호자가 이해할 수 있는 요약과 상세 문서가 서로 모순되지 않는지 확인해 줘.\n4. 게시 전에 작성일·적용일·문의처의 실제 값을 사람이 확인할 목록으로 정리해 줘.\n\n내가 직접 따라 할 수 있도록 준비 계정과 상태 → 클릭 또는 입력 → 확인할 실제 탭·요청·필드 → 기대 결과를 항목마다 적어 줘.\n확인할 위치: 기존 앱의 푸터 이용약관과 실제 화면을 비교합니다. aiworld의 사례는 형식을 참고하되 운영 주체·처리 방식은 자신의 앱에 맞춰 작성합니다.\n자기 앱에서 이름이 다르면 코드와 실제 요청에서 맞는 이름을 찾아 줘. 실제로 존재하는지 확인하지 않은 요청명을 만들어 내지 마.\n허용해야 할 동작과 차단해야 할 동작을 함께 시험해 줘. 항목마다 실행 여부, 실제 결과, 확인한 화면이나 기록을 적고, 시험하지 못했다면 이유를 설명해 줘. 응답 코드와 실제로 받은 자료를 함께 확인하고, 저장 기능이 있다면 저장된 결과도 확인해 줘.\n이 활동을 완료해도 앱 전체의 안전이 보장된다고 표현하지 마. 실제 학생 정보·비밀키·인증 토큰은 출력하지 말고 필요한 값은 가려 줘. 내 앱 또는 허락받은 시험 환경만 대상으로 해 줘.","next":"기대 결과와 실제 결과가 같으면 활동 기록을 정리합니다. 다르면 “오류 해결” 프롬프트를 사용하고 같은 조건으로 재시험합니다."},{"id":"a26-branch1","category":"상황별 진행","title":"다른 앱 약관을 복사한 경우","when":"기본 순서로 진행하다가 이 상황에 해당하면 사용합니다.","text":"활동: 실제 운영에 맞는 이용약관 초안 작성\n앱 이름과 프로젝트: [입력]\n이번 시험 주소: [입력]\n준비 정보: 운영 주 한 서식이나 근거 자료를 찾지 못할 때","when":"공식 서식, 운영 정보, 항목별 증빙이 없거나 서로 다를 때 보냅니다.","text":"활동: 실제 운영에 맞는 이용약관 초안 작성\n앱 이름과 프로젝트: [입력]\n이번 시험 주소: [입력]\n준비 정보: 운영 주체, 대상, 기능, 계정 방식, 비용, 문의 방법, 종료 정책\n현재 상황: [입력]\n사용할 가상 자료: [입력]\n찾지 못한 자료 또는 항목: [입력]\n현재 가진 문서의 이름과 발행일: [입력]\n학교 또는 담당자가 요청한 내용: [입력]\n\n기존 앱의 푸터 이용약관과 실제 화면을 비교합니다. aiworld의 사례는 형식을 참고하되 운영 주체·처리 방식은 자신의 앱에 맞춰 작성합니다.\n이 활동의 서식과 적용 여부는 학교 안내와 공식 문서에서 확인하도록 안내해 줘. F12에서 확인할 수 있는 내용과 구분해 줘.\n제공한 자료에서 해당 항목의 원문과 적용 대상을 찾아 줘. 자료가 없으면 최신 원본을 구할 공식 기관·메뉴·링크와 검색어를 알려 줘. 접근하지 못한 문서를 읽었다고 하거나 학교가 요구하지 않은 서식을 공식 양식처럼 만들지 마.\n각 항목을 문서에서 확인할 것, 앱의 실제 동작으로 증명할 것, 운영자 또는 학교에 물을 것으로 구분해 줘.\n준비된 자료만으로 답할 수 있는 부분과 추가로 필요한 부분을 나누고, 문의할 질문을 구체적으로 작성해 줘. 참고용 예시를 복사했다면 우리 앱과 다른 사실도 표시해 줘.\n실제 학생 정보·비밀키·인증 토큰은 출력하지 말고 필요한 값은 가려 줘. 내 앱 또는 허락받은 시험 환경만 대상으로 해 줘.","next":"공식 서식과 실제 운영 정보를 확보한 뒤 2번의 작성 범위 결정으로 돌아갑니다. 확인하지 못한 항목을 임의로 채우지 않습니다."},{"id":"a26-error","category":"오류 해결","title":"작성 내용이 사실이나 서식과 맞지 않을 때","when":"누락, 항목 불일치, 근거 없는 판정 또는 보완 요청을 발견했을 때 보냅니다.","text":"활동: 실제 운영에 맞는 이용약관 초안 작성\n앱 이름과 프로젝트: [입력]\n이번 시험 주소: [입력]\n준비 정보: 운영 주체, 대상, 기능, 계정 방식, 비용, 문의 방법, 종료 정책\n현재 상황: [입력]\n사용할 가상 자료: [입력]\n문제가 있는 문장 또는 항목: [입력]\n비교할 공식 서식과 실제 운영 사실: [입력]\n보완 요청이 있다면 그 원문: [입력]\n\n다음 기준으로 현재 자료의 차이를 확인해 줘.\n1. 앱에서 실제로 제공하는 기능과 운영자가 실제로 할 수 있는 지원 범위를 정리해 줘.\n2. 기존 약관에서 다른 서비스 이름·유료 결제·광고 등 우리 앱에 없는 내용을 찾아 줘.\n3. 학생이 작성한 자료의 이용 범위와 계정 제한·종료 절차를 확인해 줘.\n4. 개인정보처리방침에 써야 할 내용을 약관의 포괄 동의로 대신하고 있는지 확인해 줘.\n표현 문제, 실제 기능과의 차이, 근거 부족, 학교 확인이 필요한 사항을 구분해 줘. 서식 원문이나 법적 의미를 바꾸지 말고 필요한 최소 수정안을 보여 줘.\n운영 사실을 확인하지 못했으면 없음 또는 적합이라고 채우지 마. 내가 승인한 문서 수정만 적용하고 앱 코드나 운영 설정을 바꾸지 마.\n수정 후 다음 항목을 다시 대조해 줘.\n1. 조항별로 실제 화면·기능·운영 방침 근거를 연결해 줘.\n2. 앱에 없는 기능이나 운영 주체가 들어가지 않았는지 확인해 줘.\n3. 학생과 보호자가 이해할 수 있는 요약과 상세 문서가 서로 모순되지 않는지 확인해 줘.\n4. 게시 전에 작성일·적용일·문의처의 실제 값을 사람이 확인할 목록으로 정리해 줘.\n수정한 문장, 근거 자료, 아직 답하지 못한 질문을 함께 제시해 줘. 실제 제출이나 외부 발송은 하지 마.","next":"실패 원인을 확인하고 승인한 수정만 적용합니다. 같은 실패 조건이 해결됐는지와 원래 정상 기능이 유지되는지 함께 봅니다."},{"id":"a26-finish","category":"활동 마무리","title":"확인 기록과 다음 점검 정리하기","when":"직접 시험을 확인한 뒤, 또는 해당 없음·추가 확인으로 종료할 때 보냅니다.","text":"활동: 실제 운영에 맞는 이용약관 초안 작성\n앱 이름과 프로젝트: [입력]\n이번 시험 주소: [입력]\n준비 정보: 운영 주체, 대상, 기능, 계정 방식, 비용, 문의 방법, 종료 정책\n현재 상황: [입력]\n사용할 가상 자료: [입력]\n실제로 진행한 단계: [입력]\n확인한 결과 또는 아직 확인하지 못한 내용: [입력]\n\n이번 활동 기록을 Markdown으로 정리해 줘. 항목은 앱과 시험 버전, 점검한 기능, 발견한 문제와 위치, 승인한 수정, 시험 입력과 기대 결과, 실제 결과와 근거, 추가 확인할 일로 구성해 줘.\n앞으로 개발할 때 지킬 기준도 우리 앱의 실제 코드·설정 위치와 연결해 적어 줘:\n1. 목적·이용 대상·제공 기능·이용 시 주의사항·이용 제한과 문의·서비스 변경 및 종료를 실제 운영 방식에 맞춰 초안으로 작성해 줘.\n2. 모르는 운영 정보는 그럴듯한 문구로 채우지 말고 확인할 질문으로 분리해 줘.\n3. 학생에게 일방적 책임을 떠넘기거나 모든 권리를 포기시키는 문구를 만들지 마.\n4. 법적 적합성이 확정된 문서라고 표현하지 말고 학교가 검토할 초안과 확인 항목을 함께 제공해 줘.\n\n활동 상태는 확인 완료·추가 확인·해당 없음 중 근거에 맞게 적어 줘. 구현만 하고 시험하지 않았다면 확인 완료로 쓰지 마. 문제를 발견하지 못한 것과 충분히 검증한 것을 구분해 줘.\n다음 수정 때 다시 실행할 시험은 다음 내용을 바탕으로 정리해 줘:\n1. 조항별로 실제 화면·기능·운영 방침 근거를 연결해 줘.\n2. 앱에 없는 기능이나 운영 주체가 들어가지 않았는지 확인해 줘.\n보고서에 원문 학생 자료나 비밀값을 넣지 마. 이 기록만으로 학교 승인이나 앱 전체의 안전을 보장한다고 쓰지 마.","next":"기록을 자신의 프로젝트에 보관하고 필요한 다음 활동을 선택합니다. 새로운 대화를 시작할 때는 이 기록과 공통 시작 프롬프트를 함께 제공합니다."}]},{"id":27,"title":"개인정보처리방침 초안 작성","group":"학교 제출 자료","slides":"54, 59~61","condition":"앱에서 개인정보를 처리하는 경우","inputs":"자료별 수집 항목·목적·근거·보관 기간·제공 또는 위탁·국외 이전·문의 창구","inspect":["입력 화면·Network 요청·서버 코드·저장소에서 실제 처리하는 정보 목록을 만들어 줘.","이름을 받지 않아도 식별자·로그·자유 입력으로 개인정보를 처리하는지 확인해 줘.","외부 AI나 저장 서비스의 서비스명·전송 항목·보관·학습 이용 설정을 공식 문서와 실제 설정으로 확인해 줘.","기존 방침의 수집 항목·보관 기간·삭제 방식이 실제 동작과 다른 부분을 찾아 줘."],"requirements":["학교가 확인한 적용 근거와 실제 처리 사실을 바탕으로 개인정보처리방침 초안을 작성해 줘.","처리 목적·항목·기간·파기·권리 행사·문의처·처리 관계 등 현재 적용되는 필수 사항을 공식 안내와 대조해 줘.","국외 이전이 있으면 국가·시기와 방법·이전받는 자·목적·항목·기간·적용 근거·거부 방법과 효과 등 필요한 확인 사항을 별도로 정리해 줘.","확인하지 못한 항목은 없음이라고 채우지 말고 담당자가 확인할 질문으로 분리해 줘. 동의를 모든 처리의 기본 근거로 쓰지 마."],"tests":["입력 항목과 서버에 실제 저장하는 필드를 문서와 대조해 줘.","삭제 버튼·기간 만료·외부 서비스 보관이 문서의 설명과 일치하는지 확인해 줘.","문의·권리 행사 링크가 실제 담당 창구로 연결되는지 확인해 줘.","가상 학생 자료로 확인한 근거와 아직 확인하지 못한 운영 설정을 나누어 보고해 줘."],"location":"F12 → Network → Payload·Response, Application 저장소로 브라우저 쪽을 확인합니다. 서버·외부 AI·백업 처리는 서비스 관리 설정과 계약·공식 문서로 확인합니다.","links":["https://info-detective.vercel.app/privacy","https://webapp-security-lab.vercel.app/#/review/privacy","https://webapp-security-lab.vercel.app/#/review/external-ai"],"branches":[["개인정보를 수집하지 않는다고 써 둔 경우","접속 기록·식별자·오류 기록·외부 AI 전송·학생 자유 입력까지 실제 확인해 줘. 확인 결과에 맞춰 문서를 고쳐 줘."],["외부 서비스의 보관 설정을 모르는 경우","공식 문서 주소와 관리 화면에서 확인할 설정 이름을 알려 줘. 확인하지 못했다면 보관 기간을 임의로 적거나 입력 자료를 AI 학습에 사용하지 않는다고 쓰지 마."]],"prompts":[{"id":"a27-inspect","category":"기본 진행","title":"1 현재 상태부터 확인하기","when":"프로젝트를 연 뒤 처음 보냅니다. 파일을 고치기 전 단계입니다.","text":"활동: 개인정보처리방침 초안 작성\n앱 이름과 프로젝트: [입력]\n이번 시험 주소: [입력]\n준비 정보: 자료별 수집 항목·목적·근거·보관 기간·제공 또는 위탁·국외 이전·문의 창구\n현재 상황: [입력]\n사용할 가상 자료: [입력]\n\n이 활동에 해당하는지부터 확인해 줘. 아직 파일이나 설정은 수정하지 마.\n1. 입력 화면·Network 요청·서버 코드·저장소에서 실제 처리하는 정보 목록을 만들어 줘.\n2. 이름을 받지 않아도 식별자·로그·자유 입력으로 개인정보를 처리하는지 확인해 줘.\n3. 외부 AI나 저장 서비스의 서비스명·전송 항목·보관·학습 이용 설정을 공식 문서와 실제 설정으로 확인해 줘.\n4. 기존 방침의 수집 항목·보관 기간·삭제 방식이 실제 동작과 다른 부분을 찾아 줘.\n\n결과는 표로 정리해 줘. 표에는 확인 항목, 현재 동작, 근거가 있는 파일이나 설정 위치, 발견한 문제와 추가로 확인할 내용을 적어 줘. 코드에서 확인한 사실과 추정은 구분해 줘. 내가 직접 확인할 메뉴·버튼·파일 이름도 알려 줘. 파일을 읽지 못했다면 그 사실을 표시해 줘.\n실제 학생 정보·비밀키·인증 토큰은 출력하지 말고 필요한 값은 가려 줘. 내 앱 또는 허락받은 시험 환경만 대상으로 해 줘.\n참고할 확인 위치: F12 → Network → Payload·Response, Application 저장소로 브라우저 쪽을 확인합니다. 서버·외부 AI·백업 처리는 서비스 관리 설정과 계약·공식 문서로 확인합니다.","next":"현재 구조와 해당 여부를 확인합니다. 모르는 정보는 먼저 확인하고, 수정이 필요하면 2번으로 진행합니다."},{"id":"a27-plan","category":"기본 진행","title":"2 수정 방법과 범위 정하기","when":"1번 답변에서 실제로 고칠 항목을 골랐을 때 보냅니다.","text":"활동: 개인정보처리방침 초안 작성\n앱 이름과 프로젝트: [입력]\n이번 시험 주소: [입력]\n준비 정보: 자료별 수집 항목·목적·근거·보관 기간·제공 또는 위탁·국외 이전·문의 창구\n현재 상황: [입력]\n사용할 가상 자료: [입력]\n앞에서 확인한 문제와 근거: [1번 결과 중 해당 부분을 붙이기]\n이번에 고칠 항목: [입력]\n\n구현 전에 다음 조건으로 수정 계획을 만들어 줘.\n1. 학교가 확인한 적용 근거와 실제 처리 사실을 바탕으로 개인정보처리방침 초안을 작성해 줘.\n2. 처리 목적·항목·기간·파기·권리 행사·문의처·처리 관계 등 현재 적용되는 필수 사항을 공식 안내와 대조해 줘.\n3. 국외 이전이 있으면 국가·시기와 방법·이전받는 자·목적·항목·기간·적용 근거·거부 방법과 효과 등 필요한 확인 사항을 별도로 정리해 줘.\n4. 확인하지 못한 항목은 없음이라고 채우지 말고 담당자가 확인할 질문으로 분리해 줘. 동의를 모든 처리의 기본 근거로 쓰지 마.\n\n기존 기능을 유지하면서 문제를 고칠 방법부터 제안해 줘. 방법이 여러 가지라면 필요한 서비스와 비용, 사용 방법이 달라지는 부분, 이전 상태로 되돌릴 방법을 비교해 줘. 반드시 고쳐야 할 부분과 선택해서 개선할 부분을 구분해 줘.\n변경할 파일, 학생 또는 교사 화면에서 달라질 부분, 필요한 관리 설정, 시험할 가상 입력을 순서대로 적어 줘. 서버가 없는 앱이라면 지금 할 수 있는 것과 서버가 필요한 것을 분리해 줘.\n아직 코드를 수정하거나 서비스를 만들지 마. 내가 결정해야 할 사항이 있으면 선택지와 차이를 설명하고 물어봐 줘.","next":"수정할 내용과 비용, 정보 수집·전송·보관 방식이 달라지는지 확인한 뒤 진행할 방법을 정합니다. 학교가 판단해야 하는 내용은 먼저 확인합니다."},{"id":"a27-implement","category":"기본 진행","title":"3 선택한 범위 구현하기","when":"수정 계획을 검토한 뒤 승인할 범위를 직접 적고 보냅니다.","text":"활동: 개인정보처리방침 초안 작성\n앱 이름과 프로젝트: [입력]\n이번 시험 주소: [입력]\n준비 정보: 자료별 수집 항목·목적·근거·보관 기간·제공 또는 위탁·국외 이전·문의 창구\n현재 상황: [입력]\n사용할 가상 자료: [입력]\n승인한 수정안: [선택한 방법과 항목을 정확히 입력]\n수정할 파일 또는 기능 범위: [입력]\n이번에 제외할 것: [입력]\n\n위에 승인한 범위만 구현해 줘. 시작 전에 현재 변경 파일을 확인해 다른 작업을 보존해 줘.\n1. 학교가 확인한 적용 근거와 실제 처리 사실을 바탕으로 개인정보처리방침 초안을 작성해 줘.\n2. 처리 목적·항목·기간·파기·권리 행사·문의처·처리 관계 등 현재 적용되는 필수 사항을 공식 안내와 대조해 줘.\n3. 국외 이전이 있으면 국가·시기와 방법·이전받는 자·목적·항목·기간·적용 근거·거부 방법과 효과 등 필요한 확인 사항을 별도로 정리해 줘.\n4. 확인하지 못한 항목은 없음이라고 채우지 말고 담당자가 확인할 질문으로 분리해 줘. 동의를 모든 처리의 기본 근거로 쓰지 마.\n\n한 부분씩 수정하고 실행 결과를 확인해 줘. 기존 디자인과 정상 기능은 유지해 줘. 새 서비스 생성·운영 자료 삭제·유료 호출·커밋·푸시·배포는 이 요청에 구체적으로 승인한 경우에만 실행해 줘. 요청하지 않은 변경이 필요하면 진행 전에 이유를 설명해 줘.\n수정 후 바꾼 파일과 이유, 실행한 검사, 아직 하지 못한 시험, 내가 누를 버튼 순서를 적어 줘. 실제 학생 정보·비밀키·인증 토큰은 출력하지 말고 필요한 값은 가려 줘. 내 앱 또는 허락받은 시험 환경만 대상으로 해 줘.","next":"빌드나 실행 오류가 없는지 확인한 뒤 4번으로 진행합니다. 허용해야 할 동작은 정상적으로 되고, 차단해야 할 동작은 막히는지 함께 시험합니다."},{"id":"a27-verify","category":"기본 진행","title":"4 수정 결과 직접 확인하기","when":"구현이 끝났거나 기존 기능이 안전하게 동작하는지 검증할 때 보냅니다.","text":"활동: 개인정보처리방침 초안 작성\n앱 이름과 프로젝트: [입력]\n이번 시험 주소: [입력]\n준비 정보: 자료별 수집 항목·목적·근거·보관 기간·제공 또는 위탁·국외 이전·문의 창구\n현재 상황: [입력]\n사용할 가상 자료: [입력]\n이번 수정 내용: [입력 또는 기존 기능 검증]\n시험할 버전과 주소: [입력]\n\n다음 조건을 가상 자료로 다시 시험해 줘.\n1. 입력 항목과 서버에 실제 저장하는 필드를 문서와 대조해 줘.\n2. 삭제 버튼·기간 만료·외부 서비스 보관이 문서의 설명과 일치하는지 확인해 줘.\n3. 문의·권리 행사 링크가 실제 담당 창구로 연결되는지 확인해 줘.\n4. 가상 학생 자료로 확인한 근거와 아직 확인하지 못한 운영 설정을 나누어 보고해 줘.\n\n내가 직접 따라 할 수 있도록 준비 계정과 상태 → 클릭 또는 입력 → 확인할 실제 탭·요청·필드 → 기대 결과를 항목마다 적어 줘.\n확인할 위치: F12 → Network → Payload·Response, Application 저장소로 브라우저 쪽을 확인합니다. 서버·외부 AI·백업 처리는 서비스 관리 설정과 계약·공식 문서로 확인합니다.\n자기 앱에서 이름이 다르면 코드와 실제 요청에서 맞는 이름을 찾아 줘. 실제로 존재하는지 확인하지 않은 요청명을 만들어 내지 마.\n허용해야 할 동작과 차단해야 할 동작을 함께 시험해 줘. 항목마다 실행 여부, 실제 결과, 확인한 화면이나 기록을 적고, 시험하지 못했다면 이유를 설명해 줘. 응답 코드와 실제로 받은 자료를 함께 확인하고, 저장 기능이 있다면 저장된 결과도 확인해 줘.\n이 활동을 완료해도 앱 전체의 안전이 보장된다고 표현하지 마. 실제 학생 정보·비밀키·인증 토큰은 출력하지 말고 필요한 값은 가려 줘. 내 앱 또는 허락받은 시험 환경만 대상으로 해 줘.","next":"기대 결과와 실제 결과가 같으면 활동 기록을 정리합니다. 다르면 “오류 해결” 프롬프트를 사용하고 같은 조건으로 재시험합니다."},{"id":"a27-branch1","category":"상황별 진행","title":"개인정보를 수집하지 않는다고 써 둔 경우","when":"기본 순서로 진행하다가 이 상황에 해당하면 사용합니다.","text":"활동: 개인정보처리방침 초안 작성\n앱 이름과 프로젝트: [입력]\n이번 시험 주소: [입력]\n준비 정보: 자료별 수집 항목·목적·근거·보관 기간·제공 또는 위탁·국외 이전·문의 창구\n현재 상황: [입력]\n사용할 가상 자료: [입력]\n현재 겪는 상황: 개인정보를 수집하지 않는다고 써 둔 경우\n이미 한 행동과 나온 결과: [입력]\n\n접속 기록·식별자·오류 기록·외부 AI 전송·학생 자유 입력까지 실제 확인해 줘. 확인 결과에 맞춰 문서를 고쳐 줘.\n먼저 관련 코드·화면·설정에서 현재 상태를 확인하고 이 상황이 생긴 이유를 근거와 함께 설명해 줘. 현재 환경에서 확인할 수 없는 것은 따로 표시해 줘.\n이 활동에서 유지할 조건:\n1. 학교가 확인한 적용 근거와 실제 처리 사실을 바탕으로 개인정보처리방침 초안을 작성해 줘.\n2. 처리 목적·항목·기간·파기·권리 행사·문의처·처리 관계 등 현재 적용되는 필수 사항을 공식 안내와 대조해 줘.\n3. 국외 이전이 있으면 국가·시기와 방법·이전받는 자·목적·항목·기간·적용 근거·거부 방법과 효과 등 필요한 확인 사항을 별도로 정리해 줘.\n\n진행 순서를 “지금 확인할 것 → 선택 가능한 방법 → 내가 승인할 변경 → 실행 후 다시 확인할 결과”로 정리해 줘. 앱에 필요 없는 기능을 추가하거나 검사를 끄는 방식으로 해결하지 마.\n재시험에서는 다음 조건을 포함해 줘:\n1. 입력 항목과 서버에 실제 저장하는 필드를 문서와 대조해 줘.\n2. 삭제 버튼·기간 만료·외부 서비스 보관이 문서의 설명과 일치하는지 확인해 줘.\n수정이 필요하면 먼저 범위를 제안하고 내 확인 전 운영 설정을 바꾸지 마. 실제 학생 정보·비밀키·인증 토큰은 출력하지 말고 필요한 값은 가려 줘. 내 앱 또는 허락받은 시험 환경만 대상으로 해 줘.","next":"이 상황에 맞는 방법을 선택한 뒤 기본 진행의 구현 또는 재시험 단계로 돌아갑니다. 해당 없음이면 이유를 기록하고 다른 활동을 고릅니다."},{"id":"a27-branch2","category":"상황별 진행","title":"외부 서비스의 보관 설정을 모르는 경우","when":"기본 순서로 진행하다가 이 상황에 해당하면 사용합니다.","text":"활동: 개인정보처리방침 초안 작성\n앱 이름과 프로젝트: [입력]\n이번 시험 주소: [입력]\n준비 정보: 자료별 수집 항목·목적·근거·보관 기간·제공 또는 위탁·국외 이전·문의 창구\n현재 상황: [입력]\n사용할 가상 자료: [입력]\n현재 겪는 상황: 외부 서비스의 보관 설정을 모르는 경우\n이미 한 행동과 나온 결과: [입력]\n\n공식 문서 주소와 관리 화면에서 확인할 설정 이름을 알려 줘. 확인하지 못했다면 보관 기간을 임의로 적거나 입력 자료를 AI 학습에 사용하지 않는다고 쓰지 마.\n먼저 관련 코드·화면·설정에서 현재 상태를 확인하고 이 상황이 생긴 이유를 근거와 함께 설명해 줘. 현재 환경에서 확인할 수 없는 것은 따로 표시해 줘.\n이 활동에서 유지할 조건:\n1. 학교가 확인한 적용 근거와 실제 처리 사실을 바탕으로 개인정보처리방침 초안을 작성해 줘.\n2. 처리 목적·항목·기간·파기·권리 행사·문의처·처리 관계 등 현재 적용되는 필수 사항을 공식 안내와 대조해 줘.\n3. 국외 이전이 있으면 국가·시기와 방법·이전받는 자·목적·항목·기간·적용 근거·거부 방법과 효과 등 필요한 확인 사항을 별도로 정리해 줘.\n\n진행 순서를 “지금 확인할 것 → 선택 가능한 방법 → 내가 승인할 변경 → 실행 후 다시 확인할 결과”로 정리해 줘. 앱에 필요 없는 기능을 추가하거나 검사를 끄는 방식으로 해결하지 마.\n재시험에서는 다음 조건을 포함해 줘:\n1. 입력 항목과 서버에 실제 저장하는 필드를 문서와 대조해 줘.\n2. 삭제 버튼·기간 만료·외부 서비스 보관이 문서의 설명과 일치하는지 확인해 줘.\n수정이 필요하면 먼저 범위를 제안하고 내 확인 전 운영 설정을 바꾸지 마. 실제 학생 정보·비밀키·인증 토큰은 출력하지 말고 필요한 값은 가려 줘. 내 앱 또는 허락받은 시험 환경만 대상으로 해 줘.","next":"이 상황에 맞는 방법을 선택한 뒤 기본 진행의 구현 또는 재시험 단계로 돌아갑니다. 해당 없음이면 이유를 기록하고 다른 활동을 고릅니다."},{"id":"a27-locate","category":"확인 위치 도움","title":"안내된 화면이나 요청을 찾지 못할 때","when":"F12에 설명한 파일·요청이 없거나 확인할 곳을 모르겠을 때 보냅니다.","text":"활동: 개인정보처리방침 초안 작성\n앱 이름과 프로젝트: [입력]\n이번 시험 주소: [입력]\n준비 정보: 자료별 수집 항목·목적·근거·보관 기간·제공 또는 위탁·국외 이전·문의 창구\n현재 상황: [입력]\n사용할 가상 자료: [입력]\n내가 보고 있는 주소와 창: [입력]\n누른 버튼 또는 실행한 동작: [입력]\n열어 둔 개발자 도구 탭과 필터: [입력 또는 모름]\n찾으려는 정보: [입력]\n현재 화면 또는 가린 오류 내용: [붙이기]\n\n참고 안내: F12 → Network → Payload·Response, Application 저장소로 브라우저 쪽을 확인합니다. 서버·외부 AI·백업 처리는 서비스 관리 설정과 계약·공식 문서로 확인합니다.\n이 안내가 체험 앱의 가상 자료인지 내 앱의 실제 동작인지 먼저 구분해 줘. 프로젝트에서 이 동작이 어떤 요청·파일·저장소로 연결되는지 찾아 줘.\nNetwork라면 동작 전에 열기, 기록 켜기, 목록 지우기, 필터 확인, 같은 동작 다시 하기, 새 요청 선택, Headers·Payload·Response 중 볼 위치를 실제 이름으로 알려 줘. 정적 파일이면 All 필터도 확인해 줘. 새 창을 열었다면 그 창에서 F12를 열어야 하는지 설명해 줘.\n브라우저 검사에서 막아 요청이 없거나 아직 동작을 실행하지 않은 경우도 구분해 줘. 서버에만 있는 정보는 F12에서 찾으라고 하지 말고 코드·관리 화면·시험 환경에서 확인할 방법을 제시해 줘.\n확인할 자료가 실제로 없으면 없다고 말하고 필요한 시험 준비를 설명해 줘. 캡처 요청에는 가려야 할 정보도 알려 줘. 실제 학생 정보·비밀키·인증 토큰은 출력하지 말고 필요한 값은 가려 줘. 내 앱 또는 허락받은 시험 환경만 대상으로 해 줘.","next":"정확한 위치를 찾은 뒤 해당 활동의 4번 프롬프트로 결과를 확인합니다. 없다는 사실 자체가 기대 결과인지 먼저 판단합니다."},{"id":"a27-error","category":"오류 해결","title":"예상과 다른 결과가 나올 때","when":"실행 오류, 정상 기능 실패, 예상한 차단이 되지 않는 경우에 보냅니다.","text":"활동: 개인정보처리방침 초안 작성\n앱 이름과 프로젝트: [입력]\n이번 시험 주소: [입력]\n준비 정보: 자료별 수집 항목·목적·근거·보관 기간·제공 또는 위탁·국외 이전·문의 창구\n현재 상황: [입력]\n사용할 가상 자료: [입력]\n실행한 단계와 입력: [입력]\n기대한 결과: [입력]\n실제로 나온 결과: [입력]\n오류 문구: [비밀값을 가리고 붙이기]\n직전에 변경한 파일 또는 설정: [입력 또는 모름]\n\n원인을 추측해서 여러 곳을 한꺼번에 바꾸지 말고, 재현 조건과 현재 코드를 비교해 줘. 요청이 만들어지는지, 서버에 도착하는지, 검사와 반환·저장이 어디서 달라지는지 관련 단계만 확인해 줘.\n특히 다음 점검 기준을 다시 봐 줘:\n1. 입력 화면·Network 요청·서버 코드·저장소에서 실제 처리하는 정보 목록을 만들어 줘.\n2. 이름을 받지 않아도 식별자·로그·자유 입력으로 개인정보를 처리하는지 확인해 줘.\n\n가능한 원인마다 그렇게 판단한 이유와 먼저 확인할 방법을 알려 줘. 운영 자료를 삭제하거나 권한·입력 검사를 전체 해제하는 방식은 사용하지 마. 수정이 필요하면 바꿀 내용을 먼저 제안하고 내가 승인한 뒤 적용해 줘.\n수정 후 같은 실패 조건과 다음 정상 조건을 모두 재시험해 줘:\n1. 입력 항목과 서버에 실제 저장하는 필드를 문서와 대조해 줘.\n2. 삭제 버튼·기간 만료·외부 서비스 보관이 문서의 설명과 일치하는지 확인해 줘.\n3. 문의·권리 행사 링크가 실제 담당 창구로 연결되는지 확인해 줘.\n4. 가상 학생 자료로 확인한 근거와 아직 확인하지 못한 운영 설정을 나누어 보고해 줘.\n완료 보고에는 실제 실행한 결과와 실행하지 못한 이유를 구분해 줘.","next":"실패 원인을 확인하고 승인한 수정만 적용합니다. 같은 실패 조건이 해결됐는지와 원래 정상 기능이 유지되는지 함께 봅니다."},{"id":"a27-finish","category":"활동 마무리","title":"확인 기록과 다음 점검 정리하기","when":"직접 시험을 확인한 뒤, 또는 해당 없음·추가 확인으로 종료할 때 보냅니다.","text":"활동: 개인정보처리방침 초안 작성\n앱 이름과 프로젝트: [입력]\n이번 시험 주소: [입력]\n준비 정보: 자료별 수집 항목·목적·근거·보관 기간·제공 또는 위탁·국외 이전·문의 창구\n현재 상황: [입력]\n사용할 가상 자료: [입력]\n실제로 진행한 단계: [입력]\n확인한 결과 또는 아직 확인하지 못한 내용: [입력]\n\n이번 활동 기록을 Markdown으로 정리해 줘. 항목은 앱과 시험 버전, 점검한 기능, 발견한 문제와 위치, 승인한 수정, 시험 입력과 기대 결과, 실제 결과와 근거, 추가 확인할 일로 구성해 줘.\n앞으로 개발할 때 지킬 기준도 우리 앱의 실제 코드·설정 위치와 연결해 적어 줘:\n1. 학교가 확인한 적용 근거와 실제 처리 사실을 바탕으로 개인정보처리방침 초안을 작성해 줘.\n2. 처리 목적·항목·기간·파기·권리 행사·문의처·처리 관계 등 현재 적용되는 필수 사항을 공식 안내와 대조해 줘.\n3. 국외 이전이 있으면 국가·시기와 방법·이전받는 자·목적·항목·기간·적용 근거·거부 방법과 효과 등 필요한 확인 사항을 별도로 정리해 줘.\n4. 확인하지 못한 항목은 없음이라고 채우지 말고 담당자가 확인할 질문으로 분리해 줘. 동의를 모든 처리의 기본 근거로 쓰지 마.\n\n활동 상태는 확인 완료·추가 확인·해당 없음 중 근거에 맞게 적어 줘. 구현만 하고 시험하지 않았다면 확인 완료로 쓰지 마. 문제를 발견하지 못한 것과 충분히 검증한 것을 구분해 줘.\n다음 수정 때 다시 실행할 시험은 다음 내용을 바탕으로 정리해 줘:\n1. 입력 항목과 서버에 실제 저장하는 필드를 문서와 대조해 줘.\n2. 삭제 버튼·기간 만료·외부 서비스 보관이 문서의 설명과 일치하는지 확인해 줘.\n보고서에 원문 학생 자료나 비밀값을 넣지 마. 이 기록만으로 학교 승인이나 앱 전체의 안전을 보장한다고 쓰지 마.","next":"기록을 자신의 프로젝트에 보관하고 필요한 다음 활동을 선택합니다. 새로운 대화를 시작할 때는 이 기록과 공통 시작 프롬프트를 함께 제공합니다."}]},{"id":28,"title":"문서와 실제 앱의 설명 일치시키기","group":"학교 제출 자료","slides":"56~57, 61","condition":"약관·방침·등록 자료와 구현을 함께 검토할 때","inputs":"최신 앱, 게시 문서, 에듀집 등록 내용, 보완 요청이 있다면 그 원문","inspect":["문서에 적힌 기능과 정보 처리 방식을 실제 화면·설정·코드에서 확인해 줘. 항목마다 확인한 위치를 적어 줘.","없는 기능을 있다고 설명하거나 외부 전송을 누락한 부분을 찾아 줘.","기능별 처리 정보와 보관·삭제·동의 설명의 차이를 구분해 줘.","보완 요청은 실제 문구를 기준으로 해석하고 에듀집 보완을 학운위 부결로 바꾸어 설명하지 마."],"requirements":["불일치 항목마다 문서를 고칠지 기능을 고칠지 선택안을 제시해 줘.","내가 선택한 방법으로 수정해 줘. 문서에는 실제 제공하는 기능과 확인한 운영 정보만 적어 줘.","관련 약관·방침·체크리스트·등록 설명을 같은 사실에 맞춰 함께 정리해 줘.","보완 답변은 요청 내용·수정 내용·확인 위치·남은 확인 사항 순으로 작성해 줘."],"tests":["수정한 기능을 가상 자료로 실행하고 설명과 다시 대조해 줘.","문서 링크와 적용일이 최신 게시본을 가리키는지 확인해 줘.","보완 사항의 각 항목에 확인 가능한 근거가 있는지 확인해 줘.","등록 승인이나 심의 통과를 보장하는 문장을 제거해 줘."],"location":"문서와 실제 앱을 나란히 열어 확인합니다. 전송·저장 설명은 Network와 서버 설정으로 근거를 보완합니다.","links":["https://edzip.kr/"],"branches":[["문서를 먼저 만들어 실제 구현을 모르는 경우","문서에 적힌 기능과 정보 처리 방식을 목록으로 정리해 줘. 코드에서 확인할 수 있는 항목, 서비스 관리 설정을 봐야 하는 항목, 운영자에게 물어야 하는 항목을 구분해 줘."],["보완 요청을 받은 경우","요청 내용을 하나씩 대응해 줘. 표현 수정으로 해결되는 항목과 실제 기능 변경이 필요한 항목을 구분하고 먼저 수정 계획을 보여 줘."]],"prompts":[{"id":"a28-inspect","category":"기본 진행","title":"1 현재 상태부터 확인하기","when":"프로젝트를 연 뒤 처음 보냅니다. 파일을 고치기 전 단계입니다.","text":"활동: 문서와 실제 앱의 설명 일치시키기\n앱 이름과 프로젝트: [입력]\n이번 시험 주소: [입력]\n준비 정보: 최신 앱, 게시 문서, 에듀집 등록 내용, 보완 요청이 있다면 그 원문\n현재 상황: [입력]\n사용할 가상 자료: [입력]\n\n이 활동에 해당하는지부터 확인해 줘. 아직 파일이나 설정은 수정하지 마.\n1. 문서에 적힌 기능과 정보 처리 방식을 실제 화면·설정·코드에서 확인해 줘. 항목마다 확인한 위치를 적어 줘.\n2. 없는 기능을 있다고 설명하거나 외부 전송을 누락한 부분을 찾아 줘.\n3. 기능별 처리 정보와 보관·삭제·동의 설명의 차이를 구분해 줘.\n4. 보완 요청은 실제 문구를 기준으로 해석하고 에듀집 보완을 학운위 부결로 바꾸어 설명하지 마.\n\n결과는 표로 정리해 줘. 표에는 확인 항목, 현재 동작, 근거가 있는 파일이나 설정 위치, 발견한 문제와 추가로 확인할 내용을 적어 줘. 코드에서 확인한 사실과 추정은 구분해 줘. 내가 직접 확인할 메뉴·버튼·파일 이름도 알려 줘. 파일을 읽지 못했다면 그 사실을 표시해 줘.\n실제 학생 정보·비밀키·인증 토큰은 출력하지 말고 필요한 값은 가려 줘. 내 앱 또는 허락받은 시험 환경만 대상으로 해 줘.\n참고할 확인 위치: 문서와 실제 앱을 나란히 열어 확인합니다. 전송·저장 설명은 Network와 서버 설정으로 근거를 보완합니다.","next":"현재 구조와 해당 여부를 확인합니다. 모르는 정보는 먼저 확인하고, 수정이 필요하면 2번으로 진행합니다."},{"id":"a28-plan","category":"기본 진행","title":"2 수정 방법과 범위 정하기","when":"1번 답변에서 실제로 고칠 항목을 골랐을 때 보냅니다.","text":"활동: 문서와 실제 앱의 설명 일치시키기\n앱 이름과 프로젝트: [입력]\n이번 시험 주소: [입력]\n준비 정보: 최신 앱, 게시 문서, 에듀집 등록 내용, 보완 요청이 있다면 그 원문\n현재 상황: [입력]\n사용할 가상 자료: [입력]\n앞에서 확인한 문제와 근거: [1번 결과 중 해당 부분을 붙이기]\n이번에 고칠 항목: [입력]\n\n구현 전에 다음 조건으로 수정 계획을 만들어 줘.\n1. 불일치 항목마다 문서를 고칠지 기능을 고칠지 선택안을 제시해 줘.\n2. 내가 선택한 방법으로 수정해 줘. 문서에는 실제 제공하는 기능과 확인한 운영 정보만 적어 줘.\n3. 관련 약관·방침·체크리스트·등록 설명을 같은 사실에 맞춰 함께 정리해 줘.\n4. 보완 답변은 요청 내용·수정 내용·확인 위치·남은 확인 사항 순으로 작성해 줘.\n\n기존 기능을 유지하면서 문제를 고칠 방법부터 제안해 줘. 방법이 여러 가지라면 필요한 서비스와 비용, 사용 방법이 달라지는 부분, 이전 상태로 되돌릴 방법을 비교해 줘. 반드시 고쳐야 할 부분과 선택해서 개선할 부분을 구분해 줘.\n변경할 파일, 학생 또는 교사 화면에서 달라질 부분, 필요한 관리 설정, 시험할 가상 입력을 순서대로 적어 줘. 서버가 없는 앱이라면 지금 할 수 있는 것과 서버가 필요한 것을 분리해 줘.\n아직 코드를 수정하거나 서비스를 만들지 마. 내가 결정해야 할 사항이 있으면 선택지와 차이를 설명하고 물어봐 줘.","next":"수정할 내용과 비용, 정보 수집·전송·보관 방식이 달라지는지 확인한 뒤 진행할 방법을 정합니다. 학교가 판단해야 하는 내용은 먼저 확인합니다."},{"id":"a28-implement","category":"기본 진행","title":"3 선택한 범위 구현하기","when":"수정 계획을 검토한 뒤 승인할 범위를 직접 적고 보냅니다.","text":"활동: 문서와 실제 앱의 설명 일치시키기\n앱 이름과 프로젝트: [입력]\n이번 시험 주소: [입력]\n준비 정보: 최신 앱, 게시 문서, 에듀집 등록 내용, 보완 요청이 있다면 그 원문\n현재 상황: [입력]\n사용할 가상 자료: [입력]\n승인한 수정안: [선택한 방법과 항목을 정확히 입력]\n수정할 파일 또는 기능 범위: [입력]\n이번에 제외할 것: [입력]\n\n위에 승인한 범위만 구현해 줘. 시작 전에 현재 변경 파일을 확인해 다른 작업을 보존해 줘.\n1. 불일치 항목마다 문서를 고칠지 기능을 고칠지 선택안을 제시해 줘.\n2. 내가 선택한 방법으로 수정해 줘. 문서에는 실제 제공하는 기능과 확인한 운영 정보만 적어 줘.\n3. 관련 약관·방침·체크리스트·등록 설명을 같은 사실에 맞춰 함께 정리해 줘.\n4. 보완 답변은 요청 내용·수정 내용·확인 위치·남은 확인 사항 순으로 작성해 줘.\n\n한 부분씩 수정하고 실행 결과를 확인해 줘. 기존 디자인과 정상 기능은 유지해 줘. 새 서비스 생성·운영 자료 삭제·유료 호출·커밋·푸시·배포는 이 요청에 구체적으로 승인한 경우에만 실행해 줘. 요청하지 않은 변경이 필요하면 진행 전에 이유를 설명해 줘.\n수정 후 바꾼 파일과 이유, 실행한 검사, 아직 하지 못한 시험, 내가 누를 버튼 순서를 적어 줘. 실제 학생 정보·비밀키·인증 토큰은 출력하지 말고 필요한 값은 가려 줘. 내 앱 또는 허락받은 시험 환경만 대상으로 해 줘.","next":"빌드나 실행 오류가 없는지 확인한 뒤 4번으로 진행합니다. 허용해야 할 동작은 정상적으로 되고, 차단해야 할 동작은 막히는지 함께 시험합니다."},{"id":"a28-verify","category":"기본 진행","title":"4 수정 결과 직접 확인하기","when":"구현이 끝났거나 기존 기능이 안전하게 동작하는지 검증할 때 보냅니다.","text":"활동: 문서와 실제 앱의 설명 일치시키기\n앱 이름과 프로젝트: [입력]\n이번 시험 주소: [입력]\n준비 정보: 최신 앱, 게시 문서, 에듀집 등록 내용, 보완 요청이 있다면 그 원문\n현재 상황: [입력]\n사용할 가상 자료: [입력]\n이번 수정 내용: [입력 또는 기존 기능 검증]\n시험할 버전과 주소: [입력]\n\n다음 조건을 가상 자료로 다시 시험해 줘.\n1. 수정한 기능을 가상 자료로 실행하고 설명과 다시 대조해 줘.\n2. 문서 링크와 적용일이 최신 게시본을 가리키는지 확인해 줘.\n3. 보완 사항의 각 항목에 확인 가능한 근거가 있는지 확인해 줘.\n4. 등록 승인이나 심의 통과를 보장하는 문장을 제거해 줘.\n\n내가 직접 따라 할 수 있도록 준비 계정과 상태 → 클릭 또는 입력 → 확인할 실제 탭·요청·필드 → 기대 결과를 항목마다 적어 줘.\n확인할 위치: 문서와 실제 앱을 나란히 열어 확인합니다. 전송·저장 설명은 Network와 서버 설정으로 근거를 보완합니다.\n자기 앱에서 이름이 다르면 코드와 실제 요청에서 맞는 이름을 찾아 줘. 실제로 존재하는지 확인하지 않은 요청명을 만들어 내지 마.\n허용해야 할 동작과 차단해야 할 동작을 함께 시험해 줘. 항목마다 실행 여부, 실제 결과, 확인한 화면이나 기록을 적고, 시험하지 못했다면 이유를 설명해 줘. 응답 코드와 실제로 받은 자료를 함께 확인하고, 저장 기능이 있다면 저장된 결과도 확인해 줘.\n이 활동을 완료해도 앱 전체의 안전이 보장된다고 표현하지 마. 실제 학생 정보·비밀키·인증 토큰은 출력하지 말고 필요한 값은 가려 줘. 내 앱 또는 허락받은 시험 환경만 대상으로 해 줘.","next":"기대 결과와 실제 결과가 같으면 활동 기록을 정리합니다. 다르면 “오류 해결” 프롬프트를 사용하고 같은 조건으로 재시험합니다."},{"id":"a28-branch1","category":"상황별 진행","title":"문서를 먼저 만들어 실제 구현을 모르는 경우","when":"기본 순서로 진행하다가 이 상황에 해당하면 사용합니다.","text":"활동: 문서와 실제 앱의 설명 일치시키기\n앱 이름과 프로젝트: [입력]\n이번 시험 주소: [입력]\n준비 정보: 최신 앱, 게시 문서, 에듀집 등록 내용, 보완 요청이 있다면 그 원문\n현재 상황: [입력]\n사용할 가상 자료: [입력]\n현재 겪는 상황: 문서를 먼저 만들어 실제 구현을 모르는 경우\n이미 한 행동과 나온 결과: [입력]\n\n문서에 적힌 기능과 정보 처리 방식을 목록으로 정리해 줘. 코드에서 확인할 수 있는 항목, 서비스 관리 설정을 봐야 하는 항목, 운영자에게 물어야 하는 항목을 구분해 줘.\n먼저 관련 코드·화면·설정에서 현재 상태를 확인하고 이 상황이 생긴 이유를 근거와 함께 설명해 줘. 현재 환경에서 확인할 수 없는 것은 따로 표시해 줘.\n이 활동에서 유지할 조건:\n1. 불일치 항목마다 문서를 고칠지 기능을 고칠지 선택안을 제시해 줘.\n2. 내가 선택한 방법으로 수정해 줘. 문서에는 실제 제공하는 기능과 확인한 운영 정보만 적어 줘.\n3. 관련 약관·방침·체크리스트·등록 설명을 같은 사실에 맞춰 함께 정리해 줘.\n\n진행 순서를 “지금 확인할 것 → 선택 가능한 방법 → 내가 승인할 변경 → 실행 후 다시 확인할 결과”로 정리해 줘. 앱에 필요 없는 기능을 추가하거나 검사를 끄는 방식으로 해결하지 마.\n재시험에서는 다음 조건을 포함해 줘:\n1. 수정한 기능을 가상 자료로 실행하고 설명과 다시 대조해 줘.\n2. 문서 링크와 적용일이 최신 게시본을 가리키는지 확인해 줘.\n수정이 필요하면 먼저 범위를 제안하고 내 확인 전 운영 설정을 바꾸지 마. 실제 학생 정보·비밀키·인증 토큰은 출력하지 말고 필요한 값은 가려 줘. 내 앱 또는 허락받은 시험 환경만 대상으로 해 줘.","next":"이 상황에 맞는 방법을 선택한 뒤 기본 진행의 구현 또는 재시험 단계로 돌아갑니다. 해당 없음이면 이유를 기록하고 다른 활동을 고릅니다."},{"id":"a28-branch2","category":"상황별 진행","title":"보완 요청을 받은 경우","when":"기본 순서로 진행하다가 이 상황에 해당하면 사용합니다.","text":"활동: 문서와 실제 앱의 설명 일치시키기\n앱 이름과 프로
