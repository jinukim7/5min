다른 시험 계정의 저장값이 같은지 확인하되 실제 비밀번호와 해시 전체를 보고서에 싣지 마.\n2. 틀린 비밀번호·없는 계정에 대한 응답으로 계정 존재를 쉽게 구분할 수 있는지 확인해 줘.\n보고서에 원문 학생 자료나 비밀값을 넣지 마. 이 기록만으로 학교 승인이나 앱 전체의 안전을 보장한다고 쓰지 마.","next":"기록을 자신의 프로젝트에 보관하고 필요한 다음 활동을 선택합니다. 새로운 대화를 시작할 때는 이 기록과 공통 시작 프롬프트를 함께 제공합니다."}]},{"id":15,"title":"다른 사이트에서 보내는 변경 요청 확인","group":"추가 보안 점검","slides":"25","condition":"로그인 쿠키를 이용해 설정·글·자료를 변경하는 앱","inputs":"인증 방식, 상태를 바꾸는 기능 목록, 가상 계정","inspect":["조회 요청과 저장·삭제·권한 변경 요청을 나누고 변경에 GET 요청을 쓰는지 확인해 줘.","인증 쿠키가 다른 사이트에서 시작한 요청에 자동으로 붙을 수 있는지 설정과 요청 방식을 확인해 줘.","CSRF 토큰·Origin 검사·SameSite 쿠키 등 현재 방어 방식의 적용 범위를 찾아 줘.","화면에 버튼을 숨긴 것, CORS 설정만 둔 것을 변경 요청 보호와 혼동하지 마."],"requirements":["현재 인증 구조에 맞는 CSRF 방어를 선택하고 서버의 각 변경 요청에서 검증해 줘.","쿠키의 Secure·HttpOnly·SameSite 설정을 서비스 흐름과 함께 점검해 줘. 외부 로그인 흐름이 깨지는지 함께 검토해 줘.","조회 요청은 자료를 바꾸지 않도록 정리하고 변경 요청마다 로그인과 권한도 별도로 검사해 줘.","시험은 가상 설정만 바꾸는 로컬 환경에서 하고 운영 사용자 자료는 변경하지 마."],"tests":["정상 화면에서 보낸 변경 요청이 성공하는지 확인해 줘.","토큰이 없거나 틀린 가상 요청, 허용하지 않은 출처의 요청이 거부되는지 확인해 줘.","토큰이 있어도 권한 없는 사용자의 변경이 거부되는지 확인해 줘.","외부 로그인 후 정상 이용과 로그아웃이 유지되는지 확인해 줘."],"location":"F12 → Network → 변경 요청 → Headers에서 요청 방식·Origin·쿠키 관련 표시를 확인합니다. 토큰 위치는 구현에 따라 Headers 또는 Payload입니다. 체험 앱의 csrf 요청은 가상 설정 응답이며 실제 자료를 변경하지 않습니다.","links":["https://webapp-security-lab.vercel.app/#/csrf","https://cheatsheetseries.owasp.org/cheatsheets/Cross-Site_Request_Forgery_Prevention_Cheat_Sheet.html"],"branches":[["쿠키 인증을 사용하지 않는 경우","인증 정보를 요청에 붙이는 실제 방식을 확인하고 CSRF가 해당하는지 근거를 설명해 줘. 해당 없으면 인증정보 유출과 권한 검사를 별도로 점검해 줘."],["방어를 추가한 뒤 로그인이 안 되는 경우","쿠키 범위·SameSite·리디렉션·허용 출처를 정상 요청과 비교해 줘. 문제를 해결하려고 전체 검사를 끄지 마."]],"prompts":[{"id":"a15-inspect","category":"기본 진행","title":"1 현재 상태부터 확인하기","when":"프로젝트를 연 뒤 처음 보냅니다. 파일을 고치기 전 단계입니다.","text":"활동: 다른 사이트에서 보내는 변경 요청 확인\n앱 이름과 프로젝트: [입력]\n이번 시험 주소: [입력]\n준비 정보: 인증 방식, 상태를 바꾸는 기능 목록, 가상 계정\n현재 상황: [입력]\n사용할 가상 자료: [입력]\n\n이 활동에 해당하는지부터 확인해 줘. 아직 파일이나 설정은 수정하지 마.\n1. 조회 요청과 저장·삭제·권한 변경 요청을 나누고 변경에 GET 요청을 쓰는지 확인해 줘.\n2. 인증 쿠키가 다른 사이트에서 시작한 요청에 자동으로 붙을 수 있는지 설정과 요청 방식을 확인해 줘.\n3. CSRF 토큰·Origin 검사·SameSite 쿠키 등 현재 방어 방식의 적용 범위를 찾아 줘.\n4. 화면에 버튼을 숨긴 것, CORS 설정만 둔 것을 변경 요청 보호와 혼동하지 마.\n\n결과는 표로 정리해 줘. 표에는 확인 항목, 현재 동작, 근거가 있는 파일이나 설정 위치, 발견한 문제와 추가로 확인할 내용을 적어 줘. 코드에서 확인한 사실과 추정은 구분해 줘. 내가 직접 확인할 메뉴·버튼·파일 이름도 알려 줘. 파일을 읽지 못했다면 그 사실을 표시해 줘.\n실제 학생 정보·비밀키·인증 토큰은 출력하지 말고 필요한 값은 가려 줘. 내 앱 또는 허락받은 시험 환경만 대상으로 해 줘.\n참고할 확인 위치: F12 → Network → 변경 요청 → Headers에서 요청 방식·Origin·쿠키 관련 표시를 확인합니다. 토큰 위치는 구현에 따라 Headers 또는 Payload입니다. 체험 앱의 csrf 요청은 가상 설정 응답이며 실제 자료를 변경하지 않습니다.","next":"현재 구조와 해당 여부를 확인합니다. 모르는 정보는 먼저 확인하고, 수정이 필요하면 2번으로 진행합니다."},{"id":"a15-plan","category":"기본 진행","title":"2 수정 방법과 범위 정하기","when":"1번 답변에서 실제로 고칠 항목을 골랐을 때 보냅니다.","text":"활동: 다른 사이트에서 보내는 변경 요청 확인\n앱 이름과 프로젝트: [입력]\n이번 시험 주소: [입력]\n준비 정보: 인증 방식, 상태를 바꾸는 기능 목록, 가상 계정\n현재 상황: [입력]\n사용할 가상 자료: [입력]\n앞에서 확인한 문제와 근거: [1번 결과 중 해당 부분을 붙이기]\n이번에 고칠 항목: [입력]\n\n구현 전에 다음 조건으로 수정 계획을 만들어 줘.\n1. 현재 인증 구조에 맞는 CSRF 방어를 선택하고 서버의 각 변경 요청에서 검증해 줘.\n2. 쿠키의 Secure·HttpOnly·SameSite 설정을 서비스 흐름과 함께 점검해 줘. 외부 로그인 흐름이 깨지는지 함께 검토해 줘.\n3. 조회 요청은 자료를 바꾸지 않도록 정리하고 변경 요청마다 로그인과 권한도 별도로 검사해 줘.\n4. 시험은 가상 설정만 바꾸는 로컬 환경에서 하고 운영 사용자 자료는 변경하지 마.\n\n기존 기능을 유지하면서 문제를 고칠 방법부터 제안해 줘. 방법이 여러 가지라면 필요한 서비스와 비용, 사용 방법이 달라지는 부분, 이전 상태로 되돌릴 방법을 비교해 줘. 반드시 고쳐야 할 부분과 선택해서 개선할 부분을 구분해 줘.\n변경할 파일, 학생 또는 교사 화면에서 달라질 부분, 필요한 관리 설정, 시험할 가상 입력을 순서대로 적어 줘. 서버가 없는 앱이라면 지금 할 수 있는 것과 서버가 필요한 것을 분리해 줘.\n아직 코드를 수정하거나 서비스를 만들지 마. 내가 결정해야 할 사항이 있으면 선택지와 차이를 설명하고 물어봐 줘.","next":"수정할 내용과 비용, 정보 수집·전송·보관 방식이 달라지는지 확인한 뒤 진행할 방법을 정합니다. 학교가 판단해야 하는 내용은 먼저 확인합니다."},{"id":"a15-implement","category":"기본 진행","title":"3 선택한 범위 구현하기","when":"수정 계획을 검토한 뒤 승인할 범위를 직접 적고 보냅니다.","text":"활동: 다른 사이트에서 보내는 변경 요청 확인\n앱 이름과 프로젝트: [입력]\n이번 시험 주소: [입력]\n준비 정보: 인증 방식, 상태를 바꾸는 기능 목록, 가상 계정\n현재 상황: [입력]\n사용할 가상 자료: [입력]\n승인한 수정안: [선택한 방법과 항목을 정확히 입력]\n수정할 파일 또는 기능 범위: [입력]\n이번에 제외할 것: [입력]\n\n위에 승인한 범위만 구현해 줘. 시작 전에 현재 변경 파일을 확인해 다른 작업을 보존해 줘.\n1. 현재 인증 구조에 맞는 CSRF 방어를 선택하고 서버의 각 변경 요청에서 검증해 줘.\n2. 쿠키의 Secure·HttpOnly·SameSite 설정을 서비스 흐름과 함께 점검해 줘. 외부 로그인 흐름이 깨지는지 함께 검토해 줘.\n3. 조회 요청은 자료를 바꾸지 않도록 정리하고 변경 요청마다 로그인과 권한도 별도로 검사해 줘.\n4. 시험은 가상 설정만 바꾸는 로컬 환경에서 하고 운영 사용자 자료는 변경하지 마.\n\n한 부분씩 수정하고 실행 결과를 확인해 줘. 기존 디자인과 정상 기능은 유지해 줘. 새 서비스 생성·운영 자료 삭제·유료 호출·커밋·푸시·배포는 이 요청에 구체적으로 승인한 경우에만 실행해 줘. 요청하지 않은 변경이 필요하면 진행 전에 이유를 설명해 줘.\n수정 후 바꾼 파일과 이유, 실행한 검사, 아직 하지 못한 시험, 내가 누를 버튼 순서를 적어 줘. 실제 학생 정보·비밀키·인증 토큰은 출력하지 말고 필요한 값은 가려 줘. 내 앱 또는 허락받은 시험 환경만 대상으로 해 줘.","next":"빌드나 실행 오류가 없는지 확인한 뒤 4번으로 진행합니다. 허용해야 할 동작은 정상적으로 되고, 차단해야 할 동작은 막히는지 함께 시험합니다."},{"id":"a15-verify","category":"기본 진행","title":"4 수정 결과 직접 확인하기","when":"구현이 끝났거나 기존 기능이 안전하게 동작하는지 검증할 때 보냅니다.","text":"활동: 다른 사이트에서 보내는 변경 요청 확인\n앱 이름과 프로젝트: [입력]\n이번 시험 주소: [입력]\n준비 정보: 인증 방식, 상태를 바꾸는 기능 목록, 가상 계정\n현재 상황: [입력]\n사용할 가상 자료: [입력]\n이번 수정 내용: [입력 또는 기존 기능 검증]\n시험할 버전과 주소: [입력]\n\n다음 조건을 가상 자료로 다시 시험해 줘.\n1. 정상 화면에서 보낸 변경 요청이 성공하는지 확인해 줘.\n2. 토큰이 없거나 틀린 가상 요청, 허용하지 않은 출처의 요청이 거부되는지 확인해 줘.\n3. 토큰이 있어도 권한 없는 사용자의 변경이 거부되는지 확인해 줘.\n4. 외부 로그인 후 정상 이용과 로그아웃이 유지되는지 확인해 줘.\n\n내가 직접 따라 할 수 있도록 준비 계정과 상태 → 클릭 또는 입력 → 확인할 실제 탭·요청·필드 → 기대 결과를 항목마다 적어 줘.\n확인할 위치: F12 → Network → 변경 요청 → Headers에서 요청 방식·Origin·쿠키 관련 표시를 확인합니다. 토큰 위치는 구현에 따라 Headers 또는 Payload입니다. 체험 앱의 csrf 요청은 가상 설정 응답이며 실제 자료를 변경하지 않습니다.\n자기 앱에서 이름이 다르면 코드와 실제 요청에서 맞는 이름을 찾아 줘. 실제로 존재하는지 확인하지 않은 요청명을 만들어 내지 마.\n허용해야 할 동작과 차단해야 할 동작을 함께 시험해 줘. 항목마다 실행 여부, 실제 결과, 확인한 화면이나 기록을 적고, 시험하지 못했다면 이유를 설명해 줘. 응답 코드와 실제로 받은 자료를 함께 확인하고, 저장 기능이 있다면 저장된 결과도 확인해 줘.\n이 활동을 완료해도 앱 전체의 안전이 보장된다고 표현하지 마. 실제 학생 정보·비밀키·인증 토큰은 출력하지 말고 필요한 값은 가려 줘. 내 앱 또는 허락받은 시험 환경만 대상으로 해 줘.","next":"기대 결과와 실제 결과가 같으면 활동 기록을 정리합니다. 다르면 “오류 해결” 프롬프트를 사용하고 같은 조건으로 재시험합니다."},{"id":"a15-branch1","category":"상황별 진행","title":"쿠키 인증을 사용하지 않는 경우","when":"기본 순서로 진행하다가 이 상황에 해당하면 사용합니다.","text":"활동: 다른 사이트에서 보내는 변경 요청 확인\n앱 이름과 프로젝트: [입력]\n이번 시험 주소: [입력]\n준비 정보: 인증 방식, 상태를 바꾸는 기능 목록, 가상 계정\n현재 상황: [입력]\n사용할 가상 자료: [입력]\n현재 겪는 상황: 쿠키 인증을 사용하지 않는 경우\n이미 한 행동과 나온 결과: [입력]\n\n인증 정보를 요청에 붙이는 실제 방식을 확인하고 CSRF가 해당하는지 근거를 설명해 줘. 해당 없으면 인증정보 유출과 권한 검사를 별도로 점검해 줘.\n먼저 관련 코드·화면·설정에서 현재 상태를 확인하고 이 상황이 생긴 이유를 근거와 함께 설명해 줘. 현재 환경에서 확인할 수 없는 것은 따로 표시해 줘.\n이 활동에서 유지할 조건:\n1. 현재 인증 구조에 맞는 CSRF 방어를 선택하고 서버의 각 변경 요청에서 검증해 줘.\n2. 쿠키의 Secure·HttpOnly·SameSite 설정을 서비스 흐름과 함께 점검해 줘. 외부 로그인 흐름이 깨지는지 함께 검토해 줘.\n3. 조회 요청은 자료를 바꾸지 않도록 정리하고 변경 요청마다 로그인과 권한도 별도로 검사해 줘.\n\n진행 순서를 “지금 확인할 것 → 선택 가능한 방법 → 내가 승인할 변경 → 실행 후 다시 확인할 결과”로 정리해 줘. 앱에 필요 없는 기능을 추가하거나 검사를 끄는 방식으로 해결하지 마.\n재시험에서는 다음 조건을 포함해 줘:\n1. 정상 화면에서 보낸 변경 요청이 성공하는지 확인해 줘.\n2. 토큰이 없거나 틀린 가상 요청, 허용하지 않은 출처의 요청이 거부되는지 확인해 줘.\n수정이 필요하면 먼저 범위를 제안하고 내 확인 전 운영 설정을 바꾸지 마. 실제 학생 정보·비밀키·인증 토큰은 출력하지 말고 필요한 값은 가려 줘. 내 앱 또는 허락받은 시험 환경만 대상으로 해 줘.","next":"이 상황에 맞는 방법을 선택한 뒤 기본 진행의 구현 또는 재시험 단계로 돌아갑니다. 해당 없음이면 이유를 기록하고 다른 활동을 고릅니다."},{"id":"a15-branch2","category":"상황별 진행","title":"방어를 추가한 뒤 로그인이 안 되는 경우","when":"기본 순서로 진행하다가 이 상황에 해당하면 사용합니다.","text":"활동: 다른 사이트에서 보내는 변경 요청 확인\n앱 이름과 프로젝트: [입력]\n이번 시험 주소: [입력]\n준비 정보: 인증 방식, 상태를 바꾸는 기능 목록, 가상 계정\n현재 상황: [입력]\n사용할 가상 자료: [입력]\n현재 겪는 상황: 방어를 추가한 뒤 로그인이 안 되는 경우\n이미 한 행동과 나온 결과: [입력]\n\n쿠키 범위·SameSite·리디렉션·허용 출처를 정상 요청과 비교해 줘. 문제를 해결하려고 전체 검사를 끄지 마.\n먼저 관련 코드·화면·설정에서 현재 상태를 확인하고 이 상황이 생긴 이유를 근거와 함께 설명해 줘. 현재 환경에서 확인할 수 없는 것은 따로 표시해 줘.\n이 활동에서 유지할 조건:\n1. 현재 인증 구조에 맞는 CSRF 방어를 선택하고 서버의 각 변경 요청에서 검증해 줘.\n2. 쿠키의 Secure·HttpOnly·SameSite 설정을 서비스 흐름과 함께 점검해 줘. 외부 로그인 흐름이 깨지는지 함께 검토해 줘.\n3. 조회 요청은 자료를 바꾸지 않도록 정리하고 변경 요청마다 로그인과 권한도 별도로 검사해 줘.\n\n진행 순서를 “지금 확인할 것 → 선택 가능한 방법 → 내가 승인할 변경 → 실행 후 다시 확인할 결과”로 정리해 줘. 앱에 필요 없는 기능을 추가하거나 검사를 끄는 방식으로 해결하지 마.\n재시험에서는 다음 조건을 포함해 줘:\n1. 정상 화면에서 보낸 변경 요청이 성공하는지 확인해 줘.\n2. 토큰이 없거나 틀린 가상 요청, 허용하지 않은 출처의 요청이 거부되는지 확인해 줘.\n수정이 필요하면 먼저 범위를 제안하고 내 확인 전 운영 설정을 바꾸지 마. 실제 학생 정보·비밀키·인증 토큰은 출력하지 말고 필요한 값은 가려 줘. 내 앱 또는 허락받은 시험 환경만 대상으로 해 줘.","next":"이 상황에 맞는 방법을 선택한 뒤 기본 진행의 구현 또는 재시험 단계로 돌아갑니다. 해당 없음이면 이유를 기록하고 다른 활동을 고릅니다."},{"id":"a15-locate","category":"확인 위치 도움","title":"안내된 화면이나 요청을 찾지 못할 때","when":"F12에 설명한 파일·요청이 없거나 확인할 곳을 모르겠을 때 보냅니다.","text":"활동: 다른 사이트에서 보내는 변경 요청 확인\n앱 이름과 프로젝트: [입력]\n이번 시험 주소: [입력]\n준비 정보: 인증 방식, 상태를 바꾸는 기능 목록, 가상 계정\n현재 상황: [입력]\n사용할 가상 자료: [입력]\n내가 보고 있는 주소와 창: [입력]\n누른 버튼 또는 실행한 동작: [입력]\n열어 둔 개발자 도구 탭과 필터: [입력 또는 모름]\n찾으려는 정보: [입력]\n현재 화면 또는 가린 오류 내용: [붙이기]\n\n참고 안내: F12 → Network → 변경 요청 → Headers에서 요청 방식·Origin·쿠키 관련 표시를 확인합니다. 토큰 위치는 구현에 따라 Headers 또는 Payload입니다. 체험 앱의 csrf 요청은 가상 설정 응답이며 실제 자료를 변경하지 않습니다.\n이 안내가 체험 앱의 가상 자료인지 내 앱의 실제 동작인지 먼저 구분해 줘. 프로젝트에서 이 동작이 어떤 요청·파일·저장소로 연결되는지 찾아 줘.\nNetwork라면 동작 전에 열기, 기록 켜기, 목록 지우기, 필터 확인, 같은 동작 다시 하기, 새 요청 선택, Headers·Payload·Response 중 볼 위치를 실제 이름으로 알려 줘. 정적 파일이면 All 필터도 확인해 줘. 새 창을 열었다면 그 창에서 F12를 열어야 하는지 설명해 줘.\n브라우저 검사에서 막아 요청이 없거나 아직 동작을 실행하지 않은 경우도 구분해 줘. 서버에만 있는 정보는 F12에서 찾으라고 하지 말고 코드·관리 화면·시험 환경에서 확인할 방법을 제시해 줘.\n확인할 자료가 실제로 없으면 없다고 말하고 필요한 시험 준비를 설명해 줘. 캡처 요청에는 가려야 할 정보도 알려 줘. 실제 학생 정보·비밀키·인증 토큰은 출력하지 말고 필요한 값은 가려 줘. 내 앱 또는 허락받은 시험 환경만 대상으로 해 줘.","next":"정확한 위치를 찾은 뒤 해당 활동의 4번 프롬프트로 결과를 확인합니다. 없다는 사실 자체가 기대 결과인지 먼저 판단합니다."},{"id":"a15-error","category":"오류 해결","title":"예상과 다른 결과가 나올 때","when":"실행 오류, 정상 기능 실패, 예상한 차단이 되지 않는 경우에 보냅니다.","text":"활동: 다른 사이트에서 보내는 변경 요청 확인\n앱 이름과 프로젝트: [입력]\n이번 시험 주소: [입력]\n준비 정보: 인증 방식, 상태를 바꾸는 기능 목록, 가상 계정\n현재 상황: [입력]\n사용할 가상 자료: [입력]\n실행한 단계와 입력: [입력]\n기대한 결과: [입력]\n실제로 나온 결과: [입력]\n오류 문구: [비밀값을 가리고 붙이기]\n직전에 변경한 파일 또는 설정: [입력 또는 모름]\n\n원인을 추측해서 여러 곳을 한꺼번에 바꾸지 말고, 재현 조건과 현재 코드를 비교해 줘. 요청이 만들어지는지, 서버에 도착하는지, 검사와 반환·저장이 어디서 달라지는지 관련 단계만 확인해 줘.\n특히 다음 점검 기준을 다시 봐 줘:\n1. 조회 요청과 저장·삭제·권한 변경 요청을 나누고 변경에 GET 요청을 쓰는지 확인해 줘.\n2. 인증 쿠키가 다른 사이트에서 시작한 요청에 자동으로 붙을 수 있는지 설정과 요청 방식을 확인해 줘.\n\n가능한 원인마다 그렇게 판단한 이유와 먼저 확인할 방법을 알려 줘. 운영 자료를 삭제하거나 권한·입력 검사를 전체 해제하는 방식은 사용하지 마. 수정이 필요하면 바꿀 내용을 먼저 제안하고 내가 승인한 뒤 적용해 줘.\n수정 후 같은 실패 조건과 다음 정상 조건을 모두 재시험해 줘:\n1. 정상 화면에서 보낸 변경 요청이 성공하는지 확인해 줘.\n2. 토큰이 없거나 틀린 가상 요청, 허용하지 않은 출처의 요청이 거부되는지 확인해 줘.\n3. 토큰이 있어도 권한 없는 사용자의 변경이 거부되는지 확인해 줘.\n4. 외부 로그인 후 정상 이용과 로그아웃이 유지되는지 확인해 줘.\n완료 보고에는 실제 실행한 결과와 실행하지 못한 이유를 구분해 줘.","next":"실패 원인을 확인하고 승인한 수정만 적용합니다. 같은 실패 조건이 해결됐는지와 원래 정상 기능이 유지되는지 함께 봅니다."},{"id":"a15-finish","category":"활동 마무리","title":"확인 기록과 다음 점검 정리하기","when":"직접 시험을 확인한 뒤, 또는 해당 없음·추가 확인으로 종료할 때 보냅니다.","text":"활동: 다른 사이트에서 보내는 변경 요청 확인\n앱 이름과 프로젝트: [입력]\n이번 시험 주소: [입력]\n준비 정보: 인증 방식, 상태를 바꾸는 기능 목록, 가상 계정\n현재 상황: [입력]\n사용할 가상 자료: [입력]\n실제로 진행한 단계: [입력]\n확인한 결과 또는 아직 확인하지 못한 내용: [입력]\n\n이번 활동 기록을 Markdown으로 정리해 줘. 항목은 앱과 시험 버전, 점검한 기능, 발견한 문제와 위치, 승인한 수정, 시험 입력과 기대 결과, 실제 결과와 근거, 추가 확인할 일로 구성해 줘.\n앞으로 개발할 때 지킬 기준도 우리 앱의 실제 코드·설정 위치와 연결해 적어 줘:\n1. 현재 인증 구조에 맞는 CSRF 방어를 선택하고 서버의 각 변경 요청에서 검증해 줘.\n2. 쿠키의 Secure·HttpOnly·SameSite 설정을 서비스 흐름과 함께 점검해 줘. 외부 로그인 흐름이 깨지는지 함께 검토해 줘.\n3. 조회 요청은 자료를 바꾸지 않도록 정리하고 변경 요청마다 로그인과 권한도 별도로 검사해 줘.\n4. 시험은 가상 설정만 바꾸는 로컬 환경에서 하고 운영 사용자 자료는 변경하지 마.\n\n활동 상태는 확인 완료·추가 확인·해당 없음 중 근거에 맞게 적어 줘. 구현만 하고 시험하지 않았다면 확인 완료로 쓰지 마. 문제를 발견하지 못한 것과 충분히 검증한 것을 구분해 줘.\n다음 수정 때 다시 실행할 시험은 다음 내용을 바탕으로 정리해 줘:\n1. 정상 화면에서 보낸 변경 요청이 성공하는지 확인해 줘.\n2. 토큰이 없거나 틀린 가상 요청, 허용하지 않은 출처의 요청이 거부되는지 확인해 줘.\n보고서에 원문 학생 자료나 비밀값을 넣지 마. 이 기록만으로 학교 승인이나 앱 전체의 안전을 보장한다고 쓰지 마.","next":"기록을 자신의 프로젝트에 보관하고 필요한 다음 활동을 선택합니다. 새로운 대화를 시작할 때는 이 기록과 공통 시작 프롬프트를 함께 제공합니다."}]},{"id":16,"title":"설치한 라이브러리의 취약점 확인","group":"추가 보안 점검","slides":"25, 28","condition":"외부 패키지를 사용하는 프로젝트","inputs":"package 파일과 잠금 파일, 실행 환경, 현재 테스트 명령","inspect":["사용하는 패키지 관리자와 잠금 파일을 확인하고 그 도구에 맞는 읽기 전용 취약점 검사 명령을 제시해 줘.","직접 설치한 패키지와 그 패키지가 가져온 하위 패키지를 구분해 줘.","경고의 영향 버전·수정 버전·실제 앱 사용 경로를 공식 보안 공지와 대조해 줘.","개발 도구 경고와 배포 서버 또는 브라우저 실행 경고를 구분하되 개발 도구 경고도 임의로 무시하지 마."],"requirements":["경고 개수만 줄이려고 강제 전체 업데이트하지 말고 관련 패키지별 최소 수정안을 제시해 줘.","호환성 변경이 있으면 필요한 코드 수정과 되돌릴 방법을 설명해 줘.","수정 버전이 없다면 기능 사용 중지·대체 패키지·노출 제한 등 가능한 임시 조치를 비교해 줘.","승인한 변경만 적용하고 잠금 파일도 함께 관리해 줘."],"tests":["같은 검사 도구로 다시 검사해 해결된 항목, 아직 해결하지 못한 항목, 적용하지 않은 항목과 그 이유를 구분해 줘.","설치와 빌드가 재현되는지 확인해 줘.","영향받은 화면과 서버 기능을 직접 시험해 줘.","자동 검사에서 경고가 사라진 것과 앱 전체가 안전하다는 판단을 구분해 줘."],"location":"체험 앱은 Network → dependency-report.json → Response의 가상 보고서를 봅니다. 자기 앱의 실제 검사는 프로젝트 터미널에서 실행하고 공식 보안 공지와 비교합니다. F12만으로 전체 패키지 취약점을 검사할 수 없습니다.","links":["https://webapp-security-lab.vercel.app/#/dependencies"],"branches":[["자동 수정 명령이 큰 버전 변경을 요구할 때","강제 수정은 실행하지 말고 변경 범위·호환성·수동 수정 대안을 보여 줘. 내가 선택한 경로로만 진행해 줘."],["경고가 있지만 우리 앱에 영향이 불분명할 때","취약 기능을 실제로 호출하는 경로와 외부 입력 도달 여부를 확인해 줘. 확인되지 않은 상태는 안전이 아니라 추가 확인으로 분류해 줘."]],"prompts":[{"id":"a16-inspect","category":"기본 진행","title":"1 현재 상태부터 확인하기","when":"프로젝트를 연 뒤 처음 보냅니다. 파일을 고치기 전 단계입니다.","text":"활동: 설치한 라이브러리의 취약점 확인\n앱 이름과 프로젝트: [입력]\n이번 시험 주소: [입력]\n준비 정보: package 파일과 잠금 파일, 실행 환경, 현재 테스트 명령\n현재 상황: [입력]\n사용할 가상 자료: [입력]\n\n이 활동에 해당하는지부터 확인해 줘. 아직 파일이나 설정은 수정하지 마.\n1. 사용하는 패키지 관리자와 잠금 파일을 확인하고 그 도구에 맞는 읽기 전용 취약점 검사 명령을 제시해 줘.\n2. 직접 설치한 패키지와 그 패키지가 가져온 하위 패키지를 구분해 줘.\n3. 경고의 영향 버전·수정 버전·실제 앱 사용 경로를 공식 보안 공지와 대조해 줘.\n4. 개발 도구 경고와 배포 서버 또는 브라우저 실행 경고를 구분하되 개발 도구 경고도 임의로 무시하지 마.\n\n결과는 표로 정리해 줘. 표에는 확인 항목, 현재 동작, 근거가 있는 파일이나 설정 위치, 발견한 문제와 추가로 확인할 내용을 적어 줘. 코드에서 확인한 사실과 추정은 구분해 줘. 내가 직접 확인할 메뉴·버튼·파일 이름도 알려 줘. 파일을 읽지 못했다면 그 사실을 표시해 줘.\n실제 학생 정보·비밀키·인증 토큰은 출력하지 말고 필요한 값은 가려 줘. 내 앱 또는 허락받은 시험 환경만 대상으로 해 줘.\n참고할 확인 위치: 체험 앱은 Network → dependency-report.json → Response의 가상 보고서를 봅니다. 자기 앱의 실제 검사는 프로젝트 터미널에서 실행하고 공식 보안 공지와 비교합니다. F12만으로 전체 패키지 취약점을 검사할 수 없습니다.","next":"현재 구조와 해당 여부를 확인합니다. 모르는 정보는 먼저 확인하고, 수정이 필요하면 2번으로 진행합니다."},{"id":"a16-plan","category":"기본 진행","title":"2 수정 방법과 범위 정하기","when":"1번 답변에서 실제로 고칠 항목을 골랐을 때 보냅니다.","text":"활동: 설치한 라이브러리의 취약점 확인\n앱 이름과 프로젝트: [입력]\n이번 시험 주소: [입력]\n준비 정보: package 파일과 잠금 파일, 실행 환경, 현재 테스트 명령\n현재 상황: [입력]\n사용할 가상 자료: [입력]\n앞에서 확인한 문제와 근거: [1번 결과 중 해당 부분을 붙이기]\n이번에 고칠 항목: [입력]\n\n구현 전에 다음 조건으로 수정 계획을 만들어 줘.\n1. 경고 개수만 줄이려고 강제 전체 업데이트하지 말고 관련 패키지별 최소 수정안을 제시해 줘.\n2. 호환성 변경이 있으면 필요한 코드 수정과 되돌릴 방법을 설명해 줘.\n3. 수정 버전이 없다면 기능 사용 중지·대체 패키지·노출 제한 등 가능한 임시 조치를 비교해 줘.\n4. 승인한 변경만 적용하고 잠금 파일도 함께 관리해 줘.\n\n기존 기능을 유지하면서 문제를 고칠 방법부터 제안해 줘. 방법이 여러 가지라면 필요한 서비스와 비용, 사용 방법이 달라지는 부분, 이전 상태로 되돌릴 방법을 비교해 줘. 반드시 고쳐야 할 부분과 선택해서 개선할 부분을 구분해 줘.\n변경할 파일, 학생 또는 교사 화면에서 달라질 부분, 필요한 관리 설정, 시험할 가상 입력을 순서대로 적어 줘. 서버가 없는 앱이라면 지금 할 수 있는 것과 서버가 필요한 것을 분리해 줘.\n아직 코드를 수정하거나 서비스를 만들지 마. 내가 결정해야 할 사항이 있으면 선택지와 차이를 설명하고 물어봐 줘.","next":"수정할 내용과 비용, 정보 수집·전송·보관 방식이 달라지는지 확인한 뒤 진행할 방법을 정합니다. 학교가 판단해야 하는 내용은 먼저 확인합니다."},{"id":"a16-implement","category":"기본 진행","title":"3 선택한 범위 구현하기","when":"수정 계획을 검토한 뒤 승인할 범위를 직접 적고 보냅니다.","text":"활동: 설치한 라이브러리의 취약점 확인\n앱 이름과 프로젝트: [입력]\n이번 시험 주소: [입력]\n준비 정보: package 파일과 잠금 파일, 실행 환경, 현재 테스트 명령\n현재 상황: [입력]\n사용할 가상 자료: [입력]\n승인한 수정안: [선택한 방법과 항목을 정확히 입력]\n수정할 파일 또는 기능 범위: [입력]\n이번에 제외할 것: [입력]\n\n위에 승인한 범위만 구현해 줘. 시작 전에 현재 변경 파일을 확인해 다른 작업을 보존해 줘.\n1. 경고 개수만 줄이려고 강제 전체 업데이트하지 말고 관련 패키지별 최소 수정안을 제시해 줘.\n2. 호환성 변경이 있으면 필요한 코드 수정과 되돌릴 방법을 설명해 줘.\n3. 수정 버전이 없다면 기능 사용 중지·대체 패키지·노출 제한 등 가능한 임시 조치를 비교해 줘.\n4. 승인한 변경만 적용하고 잠금 파일도 함께 관리해 줘.\n\n한 부분씩 수정하고 실행 결과를 확인해 줘. 기존 디자인과 정상 기능은 유지해 줘. 새 서비스 생성·운영 자료 삭제·유료 호출·커밋·푸시·배포는 이 요청에 구체적으로 승인한 경우에만 실행해 줘. 요청하지 않은 변경이 필요하면 진행 전에 이유를 설명해 줘.\n수정 후 바꾼 파일과 이유, 실행한 검사, 아직 하지 못한 시험, 내가 누를 버튼 순서를 적어 줘. 실제 학생 정보·비밀키·인증 토큰은 출력하지 말고 필요한 값은 가려 줘. 내 앱 또는 허락받은 시험 환경만 대상으로 해 줘.","next":"빌드나 실행 오류가 없는지 확인한 뒤 4번으로 진행합니다. 허용해야 할 동작은 정상적으로 되고, 차단해야 할 동작은 막히는지 함께 시험합니다."},{"id":"a16-verify","category":"기본 진행","title":"4 수정 결과 직접 확인하기","when":"구현이 끝났거나 기존 기능이 안전하게 동작하는지 검증할 때 보냅니다.","text":"활동: 설치한 라이브러리의 취약점 확인\n앱 이름과 프로젝트: [입력]\n이번 시험 주소: [입력]\n준비 정보: package 파일과 잠금 파일, 실행 환경, 현재 테스트 명령\n현재 상황: [입력]\n사용할 가상 자료: [입력]\n이번 수정 내용: [입력 또는 기존 기능 검증]\n시험할 버전과 주소: [입력]\n\n다음 조건을 가상 자료로 다시 시험해 줘.\n1. 같은 검사 도구로 다시 검사해 해결된 항목, 아직 해결하지 못한 항목, 적용하지 않은 항목과 그 이유를 구분해 줘.\n2. 설치와 빌드가 재현되는지 확인해 줘.\n3. 영향받은 화면과 서버 기능을 직접 시험해 줘.\n4. 자동 검사에서 경고가 사라진 것과 앱 전체가 안전하다는 판단을 구분해 줘.\n\n내가 직접 따라 할 수 있도록 준비 계정과 상태 → 클릭 또는 입력 → 확인할 실제 탭·요청·필드 → 기대 결과를 항목마다 적어 줘.\n확인할 위치: 체험 앱은 Network → dependency-report.json → Response의 가상 보고서를 봅니다. 자기 앱의 실제 검사는 프로젝트 터미널에서 실행하고 공식 보안 공지와 비교합니다. F12만으로 전체 패키지 취약점을 검사할 수 없습니다.\n자기 앱에서 이름이 다르면 코드와 실제 요청에서 맞는 이름을 찾아 줘. 실제로 존재하는지 확인하지 않은 요청명을 만들어 내지 마.\n허용해야 할 동작과 차단해야 할 동작을 함께 시험해 줘. 항목마다 실행 여부, 실제 결과, 확인한 화면이나 기록을 적고, 시험하지 못했다면 이유를 설명해 줘. 응답 코드와 실제로 받은 자료를 함께 확인하고, 저장 기능이 있다면 저장된 결과도 확인해 줘.\n이 활동을 완료해도 앱 전체의 안전이 보장된다고 표현하지 마. 실제 학생 정보·비밀키·인증 토큰은 출력하지 말고 필요한 값은 가려 줘. 내 앱 또는 허락받은 시험 환경만 대상으로 해 줘.","next":"기대 결과와 실제 결과가 같으면 활동 기록을 정리합니다. 다르면 “오류 해결” 프롬프트를 사용하고 같은 조건으로 재시험합니다."},{"id":"a16-branch1","category":"상황별 진행","title":"자동 수정 명령이 큰 버전 변경을 요구할 때","when":"기본 순서로 진행하다가 이 상황에 해당하면 사용합니다.","text":"활동: 설치한 라이브러리의 취약점 확인\n앱 이름과 프로젝트: [입력]\n이번 시험 주소: [입력]\n준비 정보: package 파일과 잠금 파일, 실행 환경, 현재 테스트 명령\n현재 상황: [입력]\n사용할 가상 자료: [입력]\n현재 겪는 상황: 자동 수정 명령이 큰 버전 변경을 요구할 때\n이미 한 행동과 나온 결과: [입력]\n\n강제 수정은 실행하지 말고 변경 범위·호환성·수동 수정 대안을 보여 줘. 내가 선택한 경로로만 진행해 줘.\n먼저 관련 코드·화면·설정에서 현재 상태를 확인하고 이 상황이 생긴 이유를 근거와 함께 설명해 줘. 현재 환경에서 확인할 수 없는 것은 따로 표시해 줘.\n이 활동에서 유지할 조건:\n1. 경고 개수만 줄이려고 강제 전체 업데이트하지 말고 관련 패키지별 최소 수정안을 제시해 줘.\n2. 호환성 변경이 있으면 필요한 코드 수정과 되돌릴 방법을 설명해 줘.\n3. 수정 버전이 없다면 기능 사용 중지·대체 패키지·노출 제한 등 가능한 임시 조치를 비교해 줘.\n\n진행 순서를 “지금 확인할 것 → 선택 가능한 방법 → 내가 승인할 변경 → 실행 후 다시 확인할 결과”로 정리해 줘. 앱에 필요 없는 기능을 추가하거나 검사를 끄는 방식으로 해결하지 마.\n재시험에서는 다음 조건을 포함해 줘:\n1. 같은 검사 도구로 다시 검사해 해결된 항목, 아직 해결하지 못한 항목, 적용하지 않은 항목과 그 이유를 구분해 줘.\n2. 설치와 빌드가 재현되는지 확인해 줘.\n수정이 필요하면 먼저 범위를 제안하고 내 확인 전 운영 설정을 바꾸지 마. 실제 학생 정보·비밀키·인증 토큰은 출력하지 말고 필요한 값은 가려 줘. 내 앱 또는 허락받은 시험 환경만 대상으로 해 줘.","next":"이 상황에 맞는 방법을 선택한 뒤 기본 진행의 구현 또는 재시험 단계로 돌아갑니다. 해당 없음이면 이유를 기록하고 다른 활동을 고릅니다."},{"id":"a16-branch2","category":"상황별 진행","title":"경고가 있지만 우리 앱에 영향이 불분명할 때","when":"기본 순서로 진행하다가 이 상황에 해당하면 사용합니다.","text":"활동: 설치한 라이브러리의 취약점 확인\n앱 이름과 프로젝트: [입력]\n이번 시험 주소: [입력]\n준비 정보: package 파일과 잠금 파일, 실행 환경, 현재 테스트 명령\n현재 상황: [입력]\n사용할 가상 자료: [입력]\n현재 겪는 상황: 경고가 있지만 우리 앱에 영향이 불분명할 때\n이미 한 행동과 나온 결과: [입력]\n\n취약 기능을 실제로 호출하는 경로와 외부 입력 도달 여부를 확인해 줘. 확인되지 않은 상태는 안전이 아니라 추가 확인으로 분류해 줘.\n먼저 관련 코드·화면·설정에서 현재 상태를 확인하고 이 상황이 생긴 이유를 근거와 함께 설명해 줘. 현재 환경에서 확인할 수 없는 것은 따로 표시해 줘.\n이 활동에서 유지할 조건:\n1. 경고 개수만 줄이려고 강제 전체 업데이트하지 말고 관련 패키지별 최소 수정안을 제시해 줘.\n2. 호환성 변경이 있으면 필요한 코드 수정과 되돌릴 방법을 설명해 줘.\n3. 수정 버전이 없다면 기능 사용 중지·대체 패키지·노출 제한 등 가능한 임시 조치를 비교해 줘.\n\n진행 순서를 “지금 확인할 것 → 선택 가능한 방법 → 내가 승인할 변경 → 실행 후 다시 확인할 결과”로 정리해 줘. 앱에 필요 없는 기능을 추가하거나 검사를 끄는 방식으로 해결하지 마.\n재시험에서는 다음 조건을 포함해 줘:\n1. 같은 검사 도구로 다시 검사해 해결된 항목, 아직 해결하지 못한 항목, 적용하지 않은 항목과 그 이유를 구분해 줘.\n2. 설치와 빌드가 재현되는지 확인해 줘.\n수정이 필요하면 먼저 범위를 제안하고 내 확인 전 운영 설정을 바꾸지 마. 실제 학생 정보·비밀키·인증 토큰은 출력하지 말고 필요한 값은 가려 줘. 내 앱 또는 허락받은 시험 환경만 대상으로 해 줘.","next":"이 상황에 맞는 방법을 선택한 뒤 기본 진행의 구현 또는 재시험 단계로 돌아갑니다. 해당 없음이면 이유를 기록하고 다른 활동을 고릅니다."},{"id":"a16-locate","category":"확인 위치 도움","title":"안내된 화면이나 요청을 찾지 못할 때","when":"F12에 설명한 파일·요청이 없거나 확인할 곳을 모르겠을 때 보냅니다.","text":"활동: 설치한 라이브러리의 취약점 확인\n앱 이름과 프로젝트: [입력]\n이번 시험 주소: [입력]\n준비 정보: package 파일과 잠금 파일, 실행 환경, 현재 테스트 명령\n현재 상황: [입력]\n사용할 가상 자료: [입력]\n내가 보고 있는 주소와 창: [입력]\n누른 버튼 또는 실행한 동작: [입력]\n열어 둔 개발자 도구 탭과 필터: [입력 또는 모름]\n찾으려는 정보: [입력]\n현재 화면 또는 가린 오류 내용: [붙이기]\n\n참고 안내: 체험 앱은 Network → dependency-report.json → Response의 가상 보고서를 봅니다. 자기 앱의 실제 검사는 프로젝트 터미널에서 실행하고 공식 보안 공지와 비교합니다. F12만으로 전체 패키지 취약점을 검사할 수 없습니다.\n이 안내가 체험 앱의 가상 자료인지 내 앱의 실제 동작인지 먼저 구분해 줘. 프로젝트에서 이 동작이 어떤 요청·파일·저장소로 연결되는지 찾아 줘.\nNetwork라면 동작 전에 열기, 기록 켜기, 목록 지우기, 필터 확인, 같은 동작 다시 하기, 새 요청 선택, Headers·Payload·Response 중 볼 위치를 실제 이름으로 알려 줘. 정적 파일이면 All 필터도 확인해 줘. 새 창을 열었다면 그 창에서 F12를 열어야 하는지 설명해 줘.\n브라우저 검사에서 막아 요청이 없거나 아직 동작을 실행하지 않은 경우도 구분해 줘. 서버에만 있는 정보는 F12에서 찾으라고 하지 말고 코드·관리 화면·시험 환경에서 확인할 방법을 제시해 줘.\n확인할 자료가 실제로 없으면 없다고 말하고 필요한 시험 준비를 설명해 줘. 캡처 요청에는 가려야 할 정보도 알려 줘. 실제 학생 정보·비밀키·인증 토큰은 출력하지 말고 필요한 값은 가려 줘. 내 앱 또는 허락받은 시험 환경만 대상으로 해 줘.","next":"정확한 위치를 찾은 뒤 해당 활동의 4번 프롬프트로 결과를 확인합니다. 없다는 사실 자체가 기대 결과인지 먼저 판단합니다."},{"id":"a16-error","category":"오류 해결","title":"예상과 다른 결과가 나올 때","when":"실행 오류, 정상 기능 실패, 예상한 차단이 되지 않는 경우에 보냅니다.","text":"활동: 설치한 라이브러리의 취약점 확인\n앱 이름과 프로젝트: [입력]\n이번 시험 주소: [입력]\n준비 정보: package 파일과 잠금 파일, 실행 환경, 현재 테스트 명령\n현재 상황: [입력]\n사용할 가상 자료: [입력]\n실행한 단계와 입력: [입력]\n기대한 결과: [입력]\n실제로 나온 결과: [입력]\n오류 문구: [비밀값을 가리고 붙이기]\n직전에 변경한 파일 또는 설정: [입력 또는 모름]\n\n원인을 추측해서 여러 곳을 한꺼번에 바꾸지 말고, 재현 조건과 현재 코드를 비교해 줘. 요청이 만들어지는지, 서버에 도착하는지, 검사와 반환·저장이 어디서 달라지는지 관련 단계만 확인해 줘.\n특히 다음 점검 기준을 다시 봐 줘:\n1. 사용하는 패키지 관리자와 잠금 파일을 확인하고 그 도구에 맞는 읽기 전용 취약점 검사 명령을 제시해 줘.\n2. 직접 설치한 패키지와 그 패키지가 가져온 하위 패키지를 구분해 줘.\n\n가능한 원인마다 그렇게 판단한 이유와 먼저 확인할 방법을 알려 줘. 운영 자료를 삭제하거나 권한·입력 검사를 전체 해제하는 방식은 사용하지 마. 수정이 필요하면 바꿀 내용을 먼저 제안하고 내가 승인한 뒤 적용해 줘.\n수정 후 같은 실패 조건과 다음 정상 조건을 모두 재시험해 줘:\n1. 같은 검사 도구로 다시 검사해 해결된 항목, 아직 해결하지 못한 항목, 적용하지 않은 항목과 그 이유를 구분해 줘.\n2. 설치와 빌드가 재현되는지 확인해 줘.\n3. 영향받은 화면과 서버 기능을 직접 시험해 줘.\n4. 자동 검사에서 경고가 사라진 것과 앱 전체가 안전하다는 판단을 구분해 줘.\n완료 보고에는 실제 실행한 결과와 실행하지 못한 이유를 구분해 줘.","next":"실패 원인을 확인하고 승인한 수정만 적용합니다. 같은 실패 조건이 해결됐는지와 원래 정상 기능이 유지되는지 함께 봅니다."},{"id":"a16-finish","category":"활동 마무리","title":"확인 기록과 다음 점검 정리하기","when":"직접 시험을 확인한 뒤, 또는 해당 없음·추가 확인으로 종료할 때 보냅니다.","text":"활동: 설치한 라이브러리의 취약점 확인\n앱 이름과 프로젝트: [입력]\n이번 시험 주소: [입력]\n준비 정보: package 파일과 잠금 파일, 실행 환경, 현재 테스트 명령\n현재 상황: [입력]\n사용할 가상 자료: [입력]\n실제로 진행한 단계: [입력]\n확인한 결과 또는 아직 확인하지 못한 내용: [입력]\n\n이번 활동 기록을 Markdown으로 정리해 줘. 항목은 앱과 시험 버전, 점검한 기능, 발견한 문제와 위치, 승인한 수정, 시험 입력과 기대 결과, 실제 결과와 근거, 추가 확인할 일로 구성해 줘.\n앞으로 개발할 때 지킬 기준도 우리 앱의 실제 코드·설정 위치와 연결해 적어 줘:\n1. 경고 개수만 줄이려고 강제 전체 업데이트하지 말고 관련 패키지별 최소 수정안을 제시해 줘.\n2. 호환성 변경이 있으면 필요한 코드 수정과 되돌릴 방법을 설명해 줘.\n3. 수정 버전이 없다면 기능 사용 중지·대체 패키지·노출 제한 등 가능한 임시 조치를 비교해 줘.\n4. 승인한 변경만 적용하고 잠금 파일도 함께 관리해 줘.\n\n활동 상태는 확인 완료·추가 확인·해당 없음 중 근거에 맞게 적어 줘. 구현만 하고 시험하지 않았다면 확인 완료로 쓰지 마. 문제를 발견하지 못한 것과 충분히 검증한 것을 구분해 줘.\n다음 수정 때 다시 실행할 시험은 다음 내용을 바탕으로 정리해 줘:\n1. 같은 검사 도구로 다시 검사해 해결된 항목, 아직 해결하지 못한 항목, 적용하지 않은 항목과 그 이유를 구분해 줘.\n2. 설치와 빌드가 재현되는지 확인해 줘.\n보고서에 원문 학생 자료나 비밀값을 넣지 마. 이 기록만으로 학교 승인이나 앱 전체의 안전을 보장한다고 쓰지 마.","next":"기록을 자신의 프로젝트에 보관하고 필요한 다음 활동을 선택합니다. 새로운 대화를 시작할 때는 이 기록과 공통 시작 프롬프트를 함께 제공합니다."}]},{"id":17,"title":"공유 링크와 시험 자료의 개인정보 확인","group":"추가 보안 점검","slides":"21, 51, 57","condition":"공개 화면·공유 링크·예시 자료가 있는 모든 앱","inputs":"공개할 화면, 공유 대상, 가상 자료, 저장소 공개 여부","inspect":["이름·학번·연락처·사진·학생 작품·자유 입력 내용이 공개 화면과 예시 파일에 있는지 위치 중심으로 찾아 줘.","닉네임이나 가명 값이 교사의 다른 자료와 연결되어 학생을 알아볼 수 있는지 확인해 줘.","공유 링크에 식별정보나 로그인 토큰이 포함되는지 확인하되 값을 출력하지 마.","저장소 이력·README·스크린샷·테스트 파일에 실제 자료를 복사한 흔적이 있는지 점검해 줘."],"requirements":["시험용 계정과 내용은 실제 학생과 무관한 가상 값으로 교체할 계획을 제시해 줘.","공개 범위와 교사만 볼 범위를 분리하고 공개 요청에 보호 자료를 처음부터 포함하지 않게 해 줘.","공유를 종료하거나 철회할 방법을 만들고 필요한 경우 만료를 적용해 줘.","가명 처리한 자료도 연결 가능성이 있으면 개인정보 보호 대상으로 관리하도록 안내해 줘."],"tests":["로그아웃 또는 별도 브라우저에서 공유 링크에 보이는 내용을 확인해 줘.","공유 종료 후 새로 접속한 요청이 거부되는지 확인해 줘.","HTML·Network 응답·내려받은 파일에 화면에서 숨긴 정보가 남는지 확인해 줘.","정상 공개 자료는 계속 열리는지 확인해 줘."],"location":"F12 → Elements와 Network → Response에서 공개 페이지가 내려받은 내용을 봅니다. 브라우저 Application 저장소도 확인합니다. 저장소 이력은 GitHub나 로컬 Git에서 별도로 점검합니다.","links":["https://webapp-security-lab.vercel.app/#/review/public","https://webapp-security-lab.vercel.app/#/review/test-data"],"branches":[["학급 내부에서만 공유한다고 생각했던 경우","링크를 받지 않은 사람과 로그인하지 않은 사람이 접근할 수 있는지 가상 자료로 확인해 줘. 링크 전달 범위와 실제 접근 통제를 나누어 설명해 줘."],["실제 학생 자료가 들어 있는 경우","자료를 AI 대화에 붙이지 않고 위치·유형·접근 범위만 정리해 줘. 삭제·공유 중지·내부 보고가 필요한 범위는 책임자와 확인하도록 제시해 줘."]],"prompts":[{"id":"a17-inspect","category":"기본 진행","title":"1 현재 상태부터 확인하기","when":"프로젝트를 연 뒤 처음 보냅니다. 파일을 고치기 전 단계입니다.","text":"활동: 공유 링크와 시험 자료의 개인정보 확인\n앱 이름과 프로젝트: [입력]\n이번 시험 주소: [입력]\n준비 정보: 공개할 화면, 공유 대상, 가상 자료, 저장소 공개 여부\n현재 상황: [입력]\n사용할 가상 자료: [입력]\n\n이 활동에 해당하는지부터 확인해 줘. 아직 파일이나 설정은 수정하지 마.\n1. 이름·학번·연락처·사진·학생 작품·자유 입력 내용이 공개 화면과 예시 파일에 있는지 위치 중심으로 찾아 줘.\n2. 닉네임이나 가명 값이 교사의 다른 자료와 연결되어 학생을 알아볼 수 있는지 확인해 줘.\n3. 공유 링크에 식별정보나 로그인 토큰이 포함되는지 확인하되 값을 출력하지 마.\n4. 저장소 이력·README·스크린샷·테스트 파일에 실제 자료를 복사한 흔적이 있는지 점검해 줘.\n\n결과는 표로 정리해 줘. 표에는 확인 항목, 현재 동작, 근거가 있는 파일이나 설정 위치, 발견한 문제와 추가로 확인할 내용을 적어 줘. 코드에서 확인한 사실과 추정은 구분해 줘. 내가 직접 확인할 메뉴·버튼·파일 이름도 알려 줘. 파일을 읽지 못했다면 그 사실을 표시해 줘.\n실제 학생 정보·비밀키·인증 토큰은 출력하지 말고 필요한 값은 가려 줘. 내 앱 또는 허락받은 시험 환경만 대상으로 해 줘.\n참고할 확인 위치: F12 → Elements와 Network → Response에서 공개 페이지가 내려받은 내용을 봅니다. 브라우저 Application 저장소도 확인합니다. 저장소 이력은 GitHub나 로컬 Git에서 별도로 점검합니다.","next":"현재 구조와 해당 여부를 확인합니다. 모르는 정보는 먼저 확인하고, 수정이 필요하면 2번으로 진행합니다."},{"id":"a17-plan","category":"기본 진행","title":"2 수정 방법과 범위 정하기","when":"1번 답변에서 실제로 고칠 항목을 골랐을 때 보냅니다.","text":"활동: 공유 링크와 시험 자료의 개인정보 확인\n앱 이름과 프로젝트: [입력]\n이번 시험 주소: [입력]\n준비 정보: 공개할 화면, 공유 대상, 가상 자료, 저장소 공개 여부\n현재 상황: [입력]\n사용할 가상 자료: [입력]\n앞에서 확인한 문제와 근거: [1번 결과 중 해당 부분을 붙이기]\n이번에 고칠 항목: [입력]\n\n구현 전에 다음 조건으로 수정 계획을 만들어 줘.\n1. 시험용 계정과 내용은 실제 학생과 무관한 가상 값으로 교체할 계획을 제시해 줘.\n2. 공개 범위와 교사만 볼 범위를 분리하고 공개 요청에 보호 자료를 처음부터 포함하지 않게 해 줘.\n3. 공유를 종료하거나 철회할 방법을 만들고 필요한 경우 만료를 적용해 줘.\n4. 가명 처리한 자료도 연결 가능성이 있으면 개인정보 보호 대상으로 관리하도록 안내해 줘.\n\n기존 기능을 유지하면서 문제를 고칠 방법부터 제안해 줘. 방법이 여러 가지라면 필요한 서비스와 비용, 사용 방법이 달라지는 부분, 이전 상태로 되돌릴 방법을 비교해 줘. 반드시 고쳐야 할 부분과 선택해서 개선할 부분을 구분해 줘.\n변경할 파일, 학생 또는 교사 화면에서 달라질 부분, 필요한 관리 설정, 시험할 가상 입력을 순서대로 적어 줘. 서버가 없는 앱이라면 지금 할 수 있는 것과 서버가 필요한 것을 분리해 줘.\n아직 코드를 수정하거나 서비스를 만들지 마. 내가 결정해야 할 사항이 있으면 선택지와 차이를 설명하고 물어봐 줘.","next":"수정할 내용과 비용, 정보 수집·전송·보관 방식이 달라지는지 확인한 뒤 진행할 방법을 정합니다. 학교가 판단해야 하는 내용은 먼저 확인합니다."},{"id":"a17-implement","category":"기본 진행","title":"3 선택한 범위 구현하기","when":"수정 계획을 검토한 뒤 승인할 범위를 직접 적고 보냅니다.","text":"활동: 공유 링크와 시험 자료의 개인정보 확인\n앱 이름과 프로젝트: [입력]\n이번 시험 주소: [입력]\n준비 정보: 공개할 화면, 공유 대상, 가상 자료, 저장소 공개 여부\n현재 상황: [입력]\n사용할 가상 자료: [입력]\n승인한 수정안: [선택한 방법과 항목을 정확히 입력]\n수정할 파일 또는 기능 범위: [입력]\n이번에 제외할 것: [입력]\n\n위에 승인한 범위만 구현해 줘. 시작 전에 현재 변경 파일을 확인해 다른 작업을 보존해 줘.\n1. 시험용 계정과 내용은 실제 학생과 무관한 가상 값으로 교체할 계획을 제시해 줘.\n2. 공개 범위와 교사만 볼 범위를 분리하고 공개 요청에 보호 자료를 처음부터 포함하지 않게 해 줘.\n3. 공유를 종료하거나 철회할 방법을 만들고 필요한 경우 만료를 적용해 줘.\n4. 가명 처리한 자료도 연결 가능성이 있으면 개인정보 보호 대상으로 관리하도록 안내해 줘.\n\n한 부분씩 수정하고 실행 결과를 확인해 줘. 기존 디자인과 정상 기능은 유지해 줘. 새 서비스 생성·운영 자료 삭제·유료 호출·커밋·푸시·배포는 이 요청에 구체적으로 승인한 경우에만 실행해 줘. 요청하지 않은 변경이 필요하면 진행 전에 이유를 설명해 줘.\n수정 후 바꾼 파일과 이유, 실행한 검사, 아직 하지 못한 시험, 내가 누를 버튼 순서를 적어 줘. 실제 학생 정보·비밀키·인증 토큰은 출력하지 말고 필요한 값은 가려 줘. 내 앱 또는 허락받은 시험 환경만 대상으로 해 줘.","next":"빌드나 실행 오류가 없는지 확인한 뒤 4번으로 진행합니다. 허용해야 할 동작은 정상적으로 되고, 차단해야 할 동작은 막히는지 함께 시험합니다."},{"id":"a17-verify","category":"기본 진행","title":"4 수정 결과 직접 확인하기","when":"구현이 끝났거나 기존 기능이 안전하게 동작하는지 검증할 때 보냅니다.","text":"활동: 공유 링크와 시험 자료의 개인정보 확인\n앱 이름과 프로젝트: [입력]\n이번 시험 주소: [입력]\n준비 정보: 공개할 화면, 공유 대상, 가상 자료, 저장소 공개 여부\n현재 상황: [입력]\n사용할 가상 자료: [입력]\n이번 수정 내용: [입력 또는 기존 기능 검증]\n시험할 버전과 주소: [입력]\n\n다음 조건을 가상 자료로 다시 시험해 줘.\n1. 로그아웃 또는 별도 브라우저에서 공유 링크에 보이는 내용을 확인해 줘.\n2. 공유 종료 후 새로 접속한 요청이 거부되는지 확인해 줘.\n3. HTML·Network 응답·내려받은 파일에 화면에서 숨긴 정보가 남는지 확인해 줘.\n4. 정상 공개 자료는 계속 열리는지 확인해 줘.\n\n내가 직접 따라 할 수 있도록 준비 계정과 상태 → 클릭 또는 입력 → 확인할 실제 탭·요청·필드 → 기대 결과를 항목마다 적어 줘.\n확인할 위치: F12 → Elements와 Network → Response에서 공개 페이지가 내려받은 내용을 봅니다. 브라우저 Application 저장소도 확인합니다. 저장소 이력은 GitHub나 로컬 Git에서 별도로 점검합니다.\n자기 앱에서 이름이 다르면 코드와 실제 요청에서 맞는 이름을 찾아 줘. 실제로 존재하는지 확인하지 않은 요청명을 만들어 내지 마.\n허용해야 할 동작과 차단해야 할 동작을 함께 시험해 줘. 항목마다 실행 여부, 실제 결과, 확인한 화면이나 기록을 적고, 시험하지 못했다면 이유를 설명해 줘. 응답 코드와 실제로 받은 자료를 함께 확인하고, 저장 기능이 있다면 저장된 결과도 확인해 줘.\n이 활동을 완료해도 앱 전체의 안전이 보장된다고 표현하지 마. 실제 학생 정보·비밀키·인증 토큰은 출력하지 말고 필요한 값은 가려 줘. 내 앱 또는 허락받은 시험 환경만 대상으로 해 줘.","next":"기대 결과와 실제 결과가 같으면 활동 기록을 정리합니다. 다르면 “오류 해결” 프롬프트를 사용하고 같은 조건으로 재시험합니다."},{"id":"a17-branch1","category":"상황별 진행","title":"학급 내부에서만 공유한다고 생각했던 경우","when":"기본 순서로 진행하다가 이 상황에 해당하면 사용합니다.","text":"활동: 공유 링크와 시험 자료의 개인정보 확인\n앱 이름과 프로젝트: [입력]\n이번 시험 주소: [입력]\n준비 정보: 공개할 화면, 공유 대상, 가상 자료, 저장소 공개 여부\n현재 상황: [입력]\n사용할 가상 자료: [입력]\n현재 겪는 상황: 학급 내부에서만 공유한다고 생각했던 경우\n이미 한 행동과 나온 결과: [입력]\n\n링크를 받지 않은 사람과 로그인하지 않은 사람이 접근할 수 있는지 가상 자료로 확인해 줘. 링크 전달 범위와 실제 접근 통제를 나누어 설명해 줘.\n먼저 관련 코드·화면·설정에서 현재 상태를 확인하고 이 상황이 생긴 이유를 근거와 함께 설명해 줘. 현재 환경에서 확인할 수 없는 것은 따로 표시해 줘.\n이 활동에서 유지할 조건:\n1. 시험용 계정과 내용은 실제 학생과 무관한 가상 값으로 교체할 계획을 제시해 줘.\n2. 공개 범위와 교사만 볼 범위를 분리하고 공개 요청에 보호 자료를 처음부터 포함하지 않게 해 줘.\n3. 공유를 종료하거나 철회할 방법을 만들고 필요한 경우 만료를 적용해 줘.\n\n진행 순서를 “지금 확인할 것 → 선택 가능한 방법 → 내가 승인할 변경 → 실행 후 다시 확인할 결과”로 정리해 줘. 앱에 필요 없는 기능을 추가하거나 검사를 끄는 방식으로 해결하지 마.\n재시험에서는 다음 조건을 포함해 줘:\n1. 로그아웃 또는 별도 브라우저에서 공유 링크에 보이는 내용을 확인해 줘.\n2. 공유 종료 후 새로 접속한 요청이 거부되는지 확인해 줘.\n수정이 필요하면 먼저 범위를 제안하고 내 확인 전 운영 설정을 바꾸지 마. 실제 학생 정보·비밀키·인증 토큰은 출력하지 말고 필요한 값은 가려 줘. 내 앱 또는 허락받은 시험 환경만 대상으로 해 줘.","next":"이 상황에 맞는 방법을 선택한 뒤 기본 진행의 구현 또는 재시험 단계로 돌아갑니다. 해당 없음이면 이유를 기록하고 다른 활동을 고릅니다."},{"id":"a17-branch2","category":"상황별 진행","title":"실제 학생 자료가 들어 있는 경우","when":"기본 순서로 진행하다가 이 상황에 해당하면 사용합니다.","text":"활동: 공유 링크와 시험 자료의 개인정보 확인\n앱 이름과 프로젝트: [입력]\n이번 시험 주소: [입력]\n준비 정보: 공개할 화면, 공유 대상, 가상 자료, 저장소 공개 여부\n현재 상황: [입력]\n사용할 가상 자료: [입력]\n현재 겪는 상황: 실제 학생 자료가 들어 있는 경우\n이미 한 행동과 나온 결과: [입력]\n\n자료를 AI 대화에 붙이지 않고 위치·유형·접근 범위만 정리해 줘. 삭제·공유 중지·내부 보고가 필요한 범위는 책임자와 확인하도록 제시해 줘.\n먼저 관련 코드·화면·설정에서 현재 상태를 확인하고 이 상황이 생긴 이유를 근거와 함께 설명해 줘. 현재 환경에서 확인할 수 없는 것은 따로 표시해 줘.\n이 활동에서 유지할 조건:\n1. 시험용 계정과 내용은 실제 학생과 무관한 가상 값으로 교체할 계획을 제시해 줘.\n2. 공개 범위와 교사만 볼 범위를 분리하고 공개 요청에 보호 자료를 처음부터 포함하지 않게 해 줘.\n3. 공유를 종료하거나 철회할 방법을 만들고 필요한 경우 만료를 적용해 줘.\n\n진행 순서를 “지금 확인할 것 → 선택 가능한 방법 → 내가 승인할 변경 → 실행 후 다시 확인할 결과”로 정리해 줘. 앱에 필요 없는 기능을 추가하거나 검사를 끄는 방식으로 해결하지 마.\n재시험에서는 다음 조건을 포함해 줘:\n1. 로그아웃 또는 별도 브라우저에서 공유 링크에 보이는 내용을 확인해 줘.\n2. 공유 종료 후 새로 접속한 요청이 거부되는지 확인해 줘.\n수정이 필요하면 먼저 범위를 제안하고 내 확인 전 운영 설정을 바꾸지 마. 실제 학생 정보·비밀키·인증 토큰은 출력하지 말고 필요한 값은 가려 줘. 내 앱 또는 허락받은 시험 환경만 대상으로 해 줘.","next":"이 상황에 맞는 방법을 선택한 뒤 기본 진행의 구현 또는 재시험 단계로 돌아갑니다. 해당 없음이면 이유를 기록하고 다른 활동을 고릅니다."},{"id":"a17-locate","category":"확인 위치 도움","title":"안내된 화면이나 요청을 찾지 못할 때","when":"F12에 설명한 파일·요청이 없거나 확인할 곳을 모르겠을 때 보냅니다.","text":"활동: 공유 링크와 시험 자료의 개인정보 확인\n앱 이름과 프로젝트: [입력]\n이번 시험 주소: [입력]\n준비 정보: 공개할 화면, 공유 대상, 가상 자료, 저장소 공개 여부\n현재 상황: [입력]\n사용할 가상 자료: [입력]\n내가 보고 있는 주소와 창: [입력]\n누른 버튼 또는 실행한 동작: [입력]\n열어 둔 개발자 도구 탭과 필터: [입력 또는 모름]\n찾으려는 정보: [입력]\n현재 화면 또는 가린 오류 내용: [붙이기]\n\n참고 안내: F12 → Elements와 Network → Response에서 공개 페이지가 내려받은 내용을 봅니다. 브라우저 Application 저장소도 확인합니다. 저장소 이력은 GitHub나 로컬 Git에서 별도로 점검합니다.\n이 안내가 체험 앱의 가상 자료인지 내 앱의 실제 동작인지 먼저 구분해 줘. 프로젝트에서 이 동작이 어떤 요청·파일·저장소로 연결되는지 찾아 줘.\nNetwork라면 동작 전에 열기, 기록 켜기, 목록 지우기, 필터 확인, 같은 동작 다시 하기, 새 요청 선택, Headers·Payload·Response 중 볼 위치를 실제 이름으로 알려 줘. 정적 파일이면 All 필터도 확인해 줘. 새 창을 열었다면 그 창에서 F12를 열어야 하는지 설명해 줘.\n브라우저 검사에서 막아 요청이 없거나 아직 동작을 실행하지 않은 경우도 구분해 줘. 서버에만 있는 정보는 F12에서 찾으라고 하지 말고 코드·관리 화면·시험 환경에서 확인할 방법을 제시해 줘.\n확인할 자료가 실제로 없으면 없다고 말하고 필요한 시험 준비를 설명해 줘. 캡처 요청에는 가려야 할 정보도 알려 줘. 실제 학생 정보·비밀키·인증 토큰은 출력하지 말고 필요한 값은 가려 줘. 내 앱 또는 허락받은 시험 환경만 대상으로 해 줘.","next":"정확한 위치를 찾은 뒤 해당 활동의 4번 프롬프트로 결과를 확인합니다. 없다는 사실 자체가 기대 결과인지 먼저 판단합니다."},{"id":"a17-error","category":"오류 해결","title":"예상과 다른 결과가 나올 때","when":"실행 오류, 정상 기능 실패, 예상한 차단이 되지 않는 경우에 보냅니다.","text":"활동: 공유 링크와 시험 자료의 개인정보 확인\n앱 이름과 프로젝트: [입력]\n이번 시험 주소: [입력]\n준비 정보: 공개할 화면, 공유 대상, 가상 자료, 저장소 공개 여부\n현재 상황: [입력]\n사용할 가상 자료: [입력]\n실행한 단계와 입력: [입력]\n기대한 결과: [입력]\n실제로 나온 결과: [입력]\n오류 문구: [비밀값을 가리고 붙이기]\n직전에 변경한 파일 또는 설정: [입력 또는 모름]\n\n원인을 추측해서 여러 곳을 한꺼번에 바꾸지 말고, 재현 조건과 현재 코드를 비교해 줘. 요청이 만들어지는지, 서버에 도착하는지, 검사와 반환·저장이 어디서 달라지는지 관련 단계만 확인해 줘.\n특히 다음 점검 기준을 다시 봐 줘:\n1. 이름·학번·연락처·사진·학생 작품·자유 입력 내용이 공개 화면과 예시 파일에 있는지 위치 중심으로 찾아 줘.\n2. 닉네임이나 가명 값이 교사의 다른 자료와 연결되어 학생을 알아볼 수 있는지 확인해 줘.\n\n가능한 원인마다 그렇게 판단한 이유와 먼저 확인할 방법을 알려 줘. 운영 자료를 삭제하거나 권한·입력 검사를 전체 해제하는 방식은 사용하지 마. 수정이 필요하면 바꿀 내용을 먼저 제안하고 내가 승인한 뒤 적용해 줘.\n수정 후 같은 실패 조건과 다음 정상 조건을 모두 재시험해 줘:\n1. 로그아웃 또는 별도 브라우저에서 공유 링크에 보이는 내용을 확인해 줘.\n2. 공유 종료 후 새로 접속한 요청이 거부되는지 확인해 줘.\n3. HTML·Network 응답·내려받은 파일에 화면에서 숨긴 정보가 남는지 확인해 줘.\n4. 정상 공개 자료는 계속 열리는지 확인해 줘.\n완료 보고에는 실제 실행한 결과와 실행하지 못한 이유를 구분해 줘.","next":"실패 원인을 확인하고 승인한 수정만 적용합니다. 같은 실패 조건이 해결됐는지와 원래 정상 기능이 유지되는지 함께 봅니다."},{"id":"a17-finish","category":"활동 마무리","title":"확인 기록과 다음 점검 정리하기","when":"직접 시험을 확인한 뒤, 또는 해당 없음·추가 확인으로 종료할 때 보냅니다.","text":"활동: 공유 링크와 시험 자료의 개인정보 확인\n앱 이름과 프로젝트: [입력]\n이번 시험 주소: [입력]\n준비 정보: 공개할 화면, 공유 대상, 가상 자료, 저장소 공개 여부\n현재 상황: [입력]\n사용할 가상 자료: [입력]\n실제로 진행한 단계: [입력]\n확인한 결과 또는 아직 확인하지 못한 내용: [입력]\n\n이번 활동 기록을 Markdown으로 정리해 줘. 항목은 앱과 시험 버전, 점검한 기능, 발견한 문제와 위치, 승인한 수정, 시험 입력과 기대 결과, 실제 결과와 근거, 추가 확인할 일로 구성해 줘.\n앞으로 개발할 때 지킬 기준도 우리 앱의 실제 코드·설정 위치와 연결해 적어 줘:\n1. 시험용 계정과 내용은 실제 학생과 무관한 가상 값으로 교체할 계획을 제시해 줘.\n2. 공개 범위와 교사만 볼 범위를 분리하고 공개 요청에 보호 자료를 처음부터 포함하지 않게 해 줘.\n3. 공유를 종료하거나 철회할 방법을 만들고 필요한 경우 만료를 적용해 줘.\n4. 가명 처리한 자료도 연결 가능성이 있으면 개인정보 보호 대상으로 관리하도록 안내해 줘.\n\n활동 상태는 확인 완료·추가 확인·해당 없음 중 근거에 맞게 적어 줘. 구현만 하고 시험하지 않았다면 확인 완료로 쓰지 마. 문제를 발견하지 못한 것과 충분히 검증한 것을 구분해 줘.\n다음 수정 때 다시 실행할 시험은 다음 내용을 바탕으로 정리해 줘:\n1. 로그아웃 또는 별도 브라우저에서 공유 링크에 보이는 내용을 확인해 줘.\n2. 공유 종료 후 새로 접속한 요청이 거부되는지 확인해 줘.\n보고서에 원문 학생 자료나 비밀값을 넣지 마. 이 기록만으로 학교 승인이나 앱 전체의 안전을 보장한다고 쓰지 마.","next":"기록을 자신의 프로젝트에 보관하고 필요한 다음 활동을 선택합니다. 새로운 대화를 시작할 때는 이 기록과 공통 시작 프롬프트를 함께 제공합니다."}]},{"id":18,"title":"AI 사용 안내와 필요한 동의 화면 만들기","group":"학생 수업 운영","slides":"29~32, 54","condition":"학생이 AI를 이용하거나 개인정보를 입력하는 앱","inputs":"학생 연령, AI 용도, 전송 항목, 적용 근거, 학교 안내 문서","inspect":["학생이 첫 입력을 하기 전에 AI 사용 사실·오류 가능성·입력하면 안 되는 정보를 읽을 수 있는지 확인해 줘.","안내 확인과 개인정보 처리 동의를 한 체크박스로 묶었는지 확인해 줘.","학교가 확인한 개인정보 처리 근거가 있는지 정리하고 모르는 부분은 임의로 동의로 채우지 마.","동의가 필요한 처리에서 거부·철회·대체 활동, 만 14세 미만 법정대리인 확인 방법이 정해졌는지 확인해 줘."],"requirements":["학생이 이해할 짧은 안내와 자세한 설명 링크를 나누어 제안해 줘. 기존 교안의 표현과 일치시켜 줘.","AI 안내 확인과 법적 근거가 동의인 개인정보 처리를 별도로 구현해 줘. 동의를 미리 선택해 두지 마.","안내·동의 내용을 바꿨을 때 버전과 적용일을 관리하고 필요한 기록만 보관하도록 설계해 줘.","학교가 확인하지 않은 법적 판단은 확정 문구로 게시하지 말고 검토할 항목으로 분리해 줘."],"tests":["처음 접속한 가상 학생에게 필요한 안내가 입력 전에 보이는지 확인해 줘.","안내를 읽지 않거나 필요한 동의를 거부한 경우의 흐름과 대체 안내를 확인해 줘.","키보드와 작은 화면으로도 내용을 읽고 선택할 수 있는지 확인해 줘.","기록되는 항목과 보관 기간이 안내와 일치하는지 확인해 줘."],"location":"화면의 첫 이용 안내와 F12 → Network → Payload에서 전송되는 확인 기록을 봅니다. 법적 근거와 보호자 확인의 적절성은 F12로 판단할 수 없으며 학교 자료와 공식 안내를 확인합니다.","links":["https://ai-ethic2.vercel.app/","https://webapp-security-lab.vercel.app/#/review/external-ai"],"branches":[["안내 확인을 이미 동의라고 표시한 경우","어떤 문장이 AI 안내이고 어떤 항목이 개인정보 처리인지 분리해 줘. 실제 처리 근거를 확인하기 전 문구만 바꾸어 적법하다고 결론내리지 마."],["학생 개인정보를 보내지 않는 경우","가명·접속 기록·자유 입력까지 확인한 뒤 실제 처리 범위를 설명해 줘. 필요 없는 개인정보 수집과 동의 절차를 새로 만들지 마."]],"prompts":[{"id":"a18-inspect","category":"기본 진행","title":"1 현재 상태부터 확인하기","when":"프로젝트를 연 뒤 처음 보냅니다. 파일을 고치기 전 단계입니다.","text":"활동: AI 사용 안내와 필요한 동의 화면 만들기\n앱 이름과 프로젝트: [입력]\n이번 시험 주소: [입력]\n준비 정보: 학생 연령, AI 용도, 전송 항목, 적용 근거, 학교 안내 문서\n현재 상황: [입력]\n사용할 가상 자료: [입력]\n\n이 활동에 해당하는지부터 확인해 줘. 아직 파일이나 설정은 수정하지 마.\n1. 학생이 첫 입력을 하기 전에 AI 사용 사실·오류 가능성·입력하면 안 되는 정보를 읽을 수 있는지 확인해 줘.\n2. 안내 확인과 개인정보 처리 동의를 한 체크박스로 묶었는지 확인해 줘.\n3. 학교가 확인한 개인정보 처리 근거가 있는지 정리하고 모르는 부분은 임의로 동의로 채우지 마.\n4. 동의가 필요한 처리에서 거부·철회·대체 활동, 만 14세 미만 법정대리인 확인 방법이 정해졌는지 확인해 줘.\n\n결과는 표로 정리해 줘. 표에는 확인 항목, 현재 동작, 근거가 있는 파일이나 설정 위치, 발견한 문제와 추가로 확인할 내용을 적어 줘. 코드에서 확인한 사실과 추정은 구분해 줘. 내가 직접 확인할 메뉴·버튼·파일 이름도 알려 줘. 파일을 읽지 못했다면 그 사실을 표시해 줘.\n실제 학생 정보·비밀키·인증 토큰은 출력하지 말고 필요한 값은 가려 줘. 내 앱 또는 허락받은 시험 환경만 대상으로 해 줘.\n참고할 확인 위치: 화면의 첫 이용 안내와 F12 → Network → Payload에서 전송되는 확인 기록을 봅니다. 법적 근거와 보호자 확인의 적절성은 F12로 판단할 수 없으며 학교 자료와 공식 안내를 확인합니다.","next":"현재 구조와 해당 여부를 확인합니다. 모르는 정보는 먼저 확인하고, 수정이 필요하면 2번으로 진행합니다."},{"id":"a18-plan","category":"기본 진행","title":"2 수정 방법과 범위 정하기","when":"1번 답변에서 실제로 고칠 항목을 골랐을 때 보냅니다.","text":"활동: AI 사용 안내와 필요한 동의 화면 만들기\n앱 이름과 프로젝트: [입력]\n이번 시험 주소: [입력]\n준비 정보: 학생 연령, AI 용도, 전송 항목, 적용 근거, 학교 안내 문서\n현재 상황: [입력]\n사용할 가상 자료: [입력]\n앞에서 확인한 문제와 근거: [1번 결과 중 해당 부분을 붙이기]\n이번에 고칠 항목: [입력]\n\n구현 전에 다음 조건으로 수정 계획을 만들어 줘.\n1. 학생이 이해할 짧은 안내와 자세한 설명 링크를 나누어 제안해 줘. 기존 교안의 표현과 일치시켜 줘.\n2. AI 안내 확인과 법적 근거가 동의인 개인정보 처리를 별도로 구현해 줘. 동의를 미리 선택해 두지 마.\n3. 안내·동의 내용을 바꿨을 때 버전과 적용일을 관리하고 필요한 기록만 보관하도록 설계해 줘.\n4. 학교가 확인하지 않은 법적 판단은 확정 문구로 게시하지 말고 검토할 항목으로 분리해 줘.\n\n기존 기능을 유지하면서 문제를 고칠 방법부터 제안해 줘. 방법이 여러 가지라면 필요한 서비스와 비용, 사용 방법이 달라지는 부분, 이전 상태로 되돌릴 방법을 비교해 줘. 반드시 고쳐야 할 부분과 선택해서 개선할 부분을 구분해 줘.\n변경할 파일, 학생 또는 교사 화면에서 달라질 부분, 필요한 관리 설정, 시험할 가상 입력을 순서대로 적어 줘. 서버가 없는 앱이라면 지금 할 수 있는 것과 서버가 필요한 것을 분리해 줘.\n아직 코드를 수정하거나 서비스를 만들지 마. 내가 결정해야 할 사항이 있으면 선택지와 차이를 설명하고 물어봐 줘.","next":"수정할 내용과 비용, 정보 수집·전송·보관 방식이 달라지는지 확인한 뒤 진행할 방법을 정합니다. 학교가 판단해야 하는 내용은 먼저 확인합니다."},{"id":"a18-implement","category":"기본 진행","title":"3 선택한 범위 구현하기","when":"수정 계획을 검토한 뒤 승인할 범위를 직접 적고 보냅니다.","text":"활동: AI 사용 안내와 필요한 동의 화면 만들기\n앱 이름과 프로젝트: [입력]\n이번 시험 주소: [입력]\n준비 정보: 학생 연령, AI 용도, 전송 항목, 적용 근거, 학교 안내 문서\n현재 상황: [입력]\n사용할 가상 자료: [입력]\n승인한 수정안: [선택한 방법과 항목을 정확히 입력]\n수정할 파일 또는 기능 범위: [입력]\n이번에 제외할 것: [입력]\n\n위에 승인한 범위만 구현해 줘. 시작 전에 현재 변경 파일을 확인해 다른 작업을 보존해 줘.\n1. 학생이 이해할 짧은 안내와 자세한 설명 링크를 나누어 제안해 줘. 기존 교안의 표현과 일치시켜 줘.\n2. AI 안내 확인과 법적 근거가 동의인 개인정보 처리를 별도로 구현해 줘. 동의를 미리 선택해 두지 마.\n3. 안내·동의 내용을 바꿨을 때 버전과 적용일을 관리하고 필요한 기록만 보관하도록 설계해 줘.\n4. 학교가 확인하지 않은 법적 판단은 확정 문구로 게시하지 말고 검토할 항목으로 분리해 줘.\n\n한 부분씩 수정하고 실행 결과를 확인해 줘. 기존 디자인과 정상 기능은 유지해 줘. 새 서비스 생성·운영 자료 삭제·유료 호출·커밋·푸시·배포는 이 요청에 구체적으로 승인한 경우에만 실행해 줘. 요청하지 않은 변경이 필요하면 진행 전에 이유를 설명해 줘.\n수정 후 바꾼 파일과 이유, 실행한 검사, 아직 하지 못한 시험, 내가 누를 버튼 순서를 적어 줘. 실제 학생 정보·비밀키·인증 토큰은 출력하지 말고 필요한 값은 가려 줘. 내 앱 또는 허락받은 시험 환경만 대상으로 해 줘.","next":"빌드나 실행 오류가 없는지 확인한 뒤 4번으로 진행합니다. 허용해야 할 동작은 정상적으로 되고, 차단해야 할 동작은 막히는지 함께 시험합니다."},{"id":"a18-verify","category":"기본 진행","title":"4 수정 결과 직접 확인하기","when":"구현이 끝났거나 기존 기능이 안전하게 동작하는지 검증할 때 보냅니다.","text":"활동: AI 사용 안내와 필요한 동의 화면 만들기\n앱 이름과 프로젝트: [입력]\n이번 시험 주소: [입력]\n준비 정보: 학생 연령, AI 용도, 전송 항목, 적용 근거, 학교 안내 문서\n현재 상황: [입력]\n사용할 가상 자료: [입력]\n이번 수정 내용: [입력 또는 기존 기능 검증]\n시험할 버전과 주소: [입력]\n\n다음 조건을 가상 자료로 다시 시험해 줘.\n1. 처음 접속한 가상 학생에게 필요한 안내가 입력 전에 보이는지 확인해 줘.\n2. 안내를 읽지 않거나 필요한 동의를 거부한 경우의 흐름과 대체 안내를 확인해 줘.\n3. 키보드와 작은 화면으로도 내용을 읽고 선택할 수 있는지 확인해 줘.\n4. 기록되는 항목과 보관 기간이 안내와 일치하는지 확인해 줘.\n\n내가 직접 따라 할 수 있도록 준비 계정과 상태 → 클릭 또는 입력 → 확인할 실제 탭·요청·필드 → 기대 결과를 항목마다 적어 줘.\n확인할 위치: 화면의 첫 이용 안내와 F12 → Network → Payload에서 전송되는 확인 기록을 봅니다. 법적 근거와 보호자 확인의 적절성은 F12로 판단할 수 없으며 학교 자료와 공식 안내를 확인합니다.\n자기 앱에서 이름이 다르면 코드와 실제 요청에서 맞는 이름을 찾아 줘. 실제로 존재하는지 확인하지 않은 요청명을 만들어 내지 마.\n허용해야 할 동작과 차단해야 할 동작을 함께 시험해 줘. 항목마다 실행 여부, 실제 결과, 확인한 화면이나 기록을 적고, 시험하지 못했다면 이유를 설명해 줘. 응답 코드와 실제로 받은 자료를 함께 확인하고, 저장 기능이 있다면 저장된 결과도 확인해 줘.\n이 활동을 완료해도 앱 전체의 안전이 보장된다고 표현하지 마. 실제 학생 정보·비밀키·인증 토큰은 출력하지 말고 필요한 값은 가려 줘. 내 앱 또는 허락받은 시험 환경만 대상으로 해 줘.","next":"기대 결과와 실제 결과가 같으면 활동 기록을 정리합니다. 다르면 “오류 해결” 프롬프트를 사용하고 같은 조건으로 재시험합니다."},{"id":"a18-branch1","category":"상황별 진행","title":"안내 확인을 이미 동의라고 표시한 경우","when":"기본 순서로 진행하다가 이 상황에 해당하면 사용합니다.","text":"활동: AI 사용 안내와 필요한 동의 화면 만들기\n앱 이름과 프로젝트: [입력]\n이번 시험 주소: [입력]\n준비 정보: 학생 연령, AI 용도, 전송 항목, 적용 근거, 학교 안내 문서\n현재 상황: [입력]\n사용할 가상 자료: [입력]\n현재 겪는 상황: 안내 확인을 이미 동의라고 표시한 경우\n이미 한 행동과 나온 결과: [입력]\n\n어떤 문장이 AI 안내이고 어떤 항목이 개인정보 처리인지 분리해 줘. 실제 처리 근거를 확인하기 전 문구만 바꾸어 적법하다고 결론내리지 마.\n먼저 관련 코드·화면·설정에서 현재 상태를 확인하고 이 상황이 생긴 이유를 근거와 함께 설명해 줘. 현재 환경에서 확인할 수 없는 것은 따로 표시해 줘.\n이 활동에서 유지할 조건:\n1. 학생이 이해할 짧은 안내와 자세한 설명 링크를 나누어 제안해 줘. 기존 교안의 표현과 일치시켜 줘.\n2. AI 안내 확인과 법적 근거가 동의인 개인정보 처리를 별도로 구현해 줘. 동의를 미리 선택해 두지 마.\n3. 안내·동의 내용을 바꿨을 때 버전과 적용일을 관리하고 필요한 기록만 보관하도록 설계해 줘.\n\n진행 순서를 “지금 확인할 것 → 선택 가능한 방법 → 내가 승인할 변경 → 실행 후 다시 확인할 결과”로 정리해 줘. 앱에 필요 없는 기능을 추가하거나 검사를 끄는 방식으로 해결하지 마.\n재시험에서는 다음 조건을 포함해 줘:\n1. 처음 접속한 가상 학생에게 필요한 안내가 입력 전에 보이는지 확인해 줘.\n2. 안내를 읽지 않거나 필요한 동의를 거부한 경우의 흐름과 대체 안내를 확인해 줘.\n수정이 필요하면 먼저 범위를 제안하고 내 확인 전 운영 설정을 바꾸지 마. 실제 학생 정보·비밀키·인증 토큰은 출력하지 말고 필요한 값은 가려 줘. 내 앱 또는 허락받은 시험 환경만 대상으로 해 줘.","next":"이 상황에 맞는 방법을 선택한 뒤 기본 진행의 구현 또는 재시험 단계로 돌아갑니다. 해당 없음이면 이유를 기록하고 다른 활동을 고릅니다."},{"id":"a18-branch2","category":"상황별 진행","title":"학생 개인정보를 보내지 않는 경우","when":"기본 순서로 진행하다가 이 상황에 해당하면 사용합니다.","text":"활동: AI 사용 안내와 필요한 동의 화면 만들기\n앱 이름과 프로젝트: [입력]\n이번 시험 주소: [입력]\n준비 정보: 학생 연령, AI 용도, 전송 항목, 적용 근거, 학교 안내 문서\n현재 상황: [입력]\n사용할 가상 자료: [입력]\n현재 겪는 상황: 학생 개인정보를 보내지 않는 경우\n이미 한 행동과 나온 결과: [입력]\n\n가명·접속 기록·자유 입력까지 확인한 뒤 실제 처리 범위를 설명해 줘. 필요 없는 개인정보 수집과 동의 절차를 새로 만들지 마.\n먼저 관련 코드·화면·설정에서 현재 상태를 확인하고 이 상황이 생긴 이유를 근거와 함께 설명해 줘. 현재 환경에서 확인할 수 없는 것은 따로 표시해 줘.\n이 활동에서 유지할 조건:\n1. 학생이 이해할 짧은 안내와 자세한 설명 링크를 나누어 제안해 줘. 기존 교안의 표현과 일치시켜 줘.\n2. AI 안내 확인과 법적 근거가 동의인 개인정보 처리를 별도로 구현해 줘. 동의를 미리 선택해 두지 마.\n3. 안내·동의 내용을 바꿨을 때 버전과 적용일을 관리하고 필요한 기록만 보관하도록 설계해 줘.\n\n진행 순서를 “지금 확인할 것 → 선택 가능한 방법 → 내가 승인할 변경 → 실행 후 다시 확인할 결과”로 정리해 줘. 앱에 필요 없는 기능을 추가하거나 검사를 끄는 방식으로 해결하지 마.\n재시험에서는 다음 조건을 포함해 줘:\n1. 처음 접속한 가상 학생에게 필요한 안내가 입력 전에 보이는지 확인해 줘.\n2. 안내를 읽지 않거나 필요한 동의를 거부한 경우의 흐름과 대체 안내를 확인해 줘.\n수정이 필요하면 먼저 범위를 제안하고 내 확인 전 운영 설정을 바꾸지 마. 실제 학생 정보·비밀키·인증 토큰은 출력하지 말고 필요한 값은 가려 줘. 내 앱 또는 허락받은 시험 환경만 대상으로 해 줘.","next":"이 상황에 맞는 방법을 선택한 뒤 기본 진행의 구현 또는 재시험 단계로 돌아갑니다. 해당 없음이면 이유를 기록하고 다른 활동을 고릅니다."},{"id":"a18-locate","category":"확인 위치 도움","title":"안내된 화면이나 요청을 찾지 못할 때","when":"F12에 설명한 파일·요청이 없거나 확인할 곳을 모르겠을 때 보냅니다.","text":"활동: AI 사용 안내와 필요한 동의 화면 만들기\n앱 이름과 프로젝트: [입력]\n이번 시험 주소: [입력]\n준비 정보: 학생 연령, AI 용도, 전송 항목, 적용 근거, 학교 안내 문서\n현재 상황: [입력]\n사용할 가상 자료: [입력]\n내가 보고 있는 주소와 창: [입력]\n누른 버튼 또는 실행한 동작: [입력]\n열어 둔 개발자 도구 탭과 필터: [입력 또는 모름]\n찾으려는 정보: [입력]\n현재 화면 또는 가린 오류 내용: [붙이기]\n\n참고 안내: 화면의 첫 이용 안내와 F12 → Network → Payload에서 전송되는 확인 기록을 봅니다. 법적 근거와 보호자 확인의 적절성은 F12로 판단할 수 없으며 학교 자료와 공식 안내를 확인합니다.\n이 안내가 체험 앱의 가상 자료인지 내 앱의 실제 동작인지 먼저 구분해 줘. 프로젝트에서 이 동작이 어떤 요청·파일·저장소로 연결되는지 찾아 줘.\nNetwork라면 동작 전에 열기, 기록 켜기, 목록 지우기, 필터 확인, 같은 동작 다시 하기, 새 요청 선택, Headers·Payload·Response 중 볼 위치를 실제 이름으로 알려 줘. 정적 파일이면 All 필터도 확인해 줘. 새 창을 열었다면 그 창에서 F12를 열어야 하는지 설명해 줘.\n브라우저 검사에서 막아 요청이 없거나 아직 동작을 실행하지 않은 경우도 구분해 줘. 서버에만 있는 정보는 F12에서 찾으라고 하지 말고 코드·관리 화면·시험 환경에서 확인할 방법을 제시해 줘.\n확인할 자료가 실제로 없으면 없다고 말하고 필요한 시험 준비를 설명해 줘. 캡처 요청에는 가려야 할 정보도 알려 줘. 실제 학생 정보·비밀키·인증 토큰은 출력하지 말고 필요한 값은 가려 줘. 내 앱 또는 허락받은 시험 환경만 대상으로 해 줘.","next":"정확한 위치를 찾은 뒤 해당 활동의 4번 프롬프트로 결과를 확인합니다. 없다는 사실 자체가 기대 결과인지 먼저 판단합니다."},{"id":"a18-error","category":"오류 해결","title":"예상과 다른 결과가 나올 때","when":"실행 오류, 정상 기능 실패, 예상한 차단이 되지 않는 경우에 보냅니다.","text":"활동: AI 사용 안내와 필요한 동의 화면 만들기\n앱 이름과 프로젝트: [입력]\n이번 시험 주소: [입력]\n준비 정보: 학생 연령, AI 용도, 전송 항목, 적용 근거, 학교 안내 문서\n현재 상황: [입력]\n사용할 가상 자료: [입력]\n실행한 단계와 입력: [입력]\n기대한 결과: [입력]\n실제로 나온 결과: [입력]\n오류 문구: [비밀값을 가리고 붙이기]\n직전에 변경한 파일 또는 설정: [입력 또는 모름]\n\n원인을 추측해서 여러 곳을 한꺼번에 바꾸지 말고, 재현 조건과 현재 코드를 비교해 줘. 요청이 만들어지는지, 서버에 도착하는지, 검사와 반환·저장이 어디서 달라지는지 관련 단계만 확인해 줘.\n특히 다음 점검 기준을 다시 봐 줘:\n1. 학생이 첫 입력을 하기 전에 AI 사용 사실·오류 가능성·입력하면 안 되는 정보를 읽을 수 있는지 확인해 줘.\n2. 안내 확인과 개인정보 처리 동의를 한 체크박스로 묶었는지 확인해 줘.\n\n가능한 원인마다 그렇게 판단한 이유와 먼저 확인할 방법을 알려 줘. 운영 자료를 삭제하거나 권한·입력 검사를 전체 해제하는 방식은 사용하지 마. 수정이 필요하면 바꿀 내용을 먼저 제안하고 내가 승인한 뒤 적용해 줘.\n수정 후 같은 실패 조건과 다음 정상 조건을 모두 재시험해 줘:\n1. 처음 접속한 가상 학생에게 필요한 안내가 입력 전에 보이는지 확인해 줘.\n2. 안내를 읽지 않거나 필요한 동의를 거부한 경우의 흐름과 대체 안내를 확인해 줘.\n3. 키보드와 작은 화면으로도 내용을 읽고 선택할 수 있는지 확인해 줘.\n4. 기록되는 항목과 보관 기간이 안내와 일치하는지 확인해 줘.\n완료 보고에는 실제 실행한 결과와 실행하지 못한 이유를 구분해 줘.","next":"실패 원인을 확인하고 승인한 수정만 적용합니다. 같은 실패 조건이 해결됐는지와 원래 정상 기능이 유지되는지 함께 봅니다."},{"id":"a18-finish","category":"활동 마무리","title":"확인 기록과 다음 점검 정리하기","when":"직접 시험을 확인한 뒤, 또는 해당 없음·추가 확인으로 종료할 때 보냅니다.","text":"활동: AI 사용 안내와 필요한 동의 화면 만들기\n앱 이름과 프로젝트: [입력]\n이번 시험 주소: [입력]\n준비 정보: 학생 연령, AI 용도, 전송 항목, 적용 근거, 학교 안내 문서\n현재 상황: [입력]\n사용할 가상 자료: [입력]\n실제로 진행한 단계: [입력]\n확인한 결과 또는 아직 확인하지 못한 내용: [입력]\n\n이번 활동 기록을 Markdown으로 정리해 줘. 항목은 앱과 시험 버전, 점검한 기능, 발견한 문제와 위치, 승인한 수정, 시험 입력과 기대 결과, 실제 결과와 근거, 추가 확인할 일로 구성해 줘.\n앞으로 개발할 때 지킬 기준도 우리 앱의 실제 코드·설정 위치와 연결해 적어 줘:\n1. 학생이 이해할 짧은 안내와 자세한 설명 링크를 나누어 제안해 줘. 기존 교안의 표현과 일치시켜 줘.\n2. AI 안내 확인과 법적 근거가 동의인 개인정보 처리를 별도로 구현해 줘. 동의를 미리 선택해 두지 마.\n3. 안내·동의 내용을 바꿨을 때 버전과 적용일을 관리하고 필요한 기록만 보관하도록 설계해 줘.\n4. 학교가 확인하지 않은 법적 판단은 확정 문구로 게시하지 말고 검토할 항목으로 분리해 줘.\n\n활동 상태는 확인 완료·추가 확인·해당 없음 중 근거에 맞게 적어 줘. 구현만 하고 시험하지 않았다면 확인 완료로 쓰지 마. 문제를 발견하지 못한 것과 충분히 검증한 것을 구분해 줘.\n다음 수정 때 다시 실행할 시험은 다음 내용을 바탕으로 정리해 줘:\n1. 처음 접속한 가상 학생에게 필요한 안내가 입력 전에 보이는지 확인해 줘.\n2. 안내를 읽지 않거나 필요한 동의를 거부한 경우의 흐름과 대체 안내를 확인해 줘.\n보고서에 원문 학생 자료나 비밀값을 넣지 마. 이 기록만으로 학교 승인이나 앱 전체의 안전을 보장한다고 쓰지 마.","next":"기록을 자신의 프로젝트에 보관하고 필요한 다음 활동을 선택합니다. 새로운 대화를 시작할 때는 이 기록과 공통 시작 프롬프트를 함께 제공합니다."}]},{"id":19,"title":"학생용 AI의 답변과 수업 적합성 점검","group":"학생 수업 운영","slides":"33~34, 55","condition":"AI 답변을 학생에게 제공하는 앱","inputs":"수업 목표, 학생 연령, 정상·경계·위험 가상 입력, 현재 AI 지시문","inspect":["AI가 하는 일과 교사가 판단할 일을 수업 목표에 맞춰 구분해 줘.","정답을 단정하거나 학생을 평가·낙인찍는 표현, 위험한 내용, 출처 없는 주장을 만들 수 있는 경로를 점검해 줘.","시스템 지시문·사용자 입력·첨부 자료가 섞일 때 첨부 자료의 지시를 그대로 따르는지 시험 계획을 세워 줘.","AI 출력의 개인정보·부적절 내용·사실성 확인을 어디서 하는지 정리해 줘."],"requirements":["연령에 맞는 어휘, 모르면 모른다고 알리는 방식, 교사에게 질문할 상황을 지시문에 반영해 줘.","학습자의 사고를 돕는 질문과 힌트를 제공하고 정답 대필 여부는 수업 목적에 따라 설정해 줘.","학생 평가·징계·위기 판단을 AI 단독 결정으로 구현하지 마.","외부 자료는 검토할 자료로 취급하고 자료 속 지시가 앱 정책을 바꾸지 못하도록 처리해 줘."],"tests":["정상 질문·정보가 부족한 질문·잘못된 전제·부적절한 요구를 가상 자료로 비교해 줘.","정책을 무시하라는 입력과 문서 속 지시를 넣어도 앱의 역할이 유지되는지 확인해 줘.","반복 실행 결과가 달라질 수 있으므로 한 번 통과한 것을 완전한 안전으로 표현하지 마.","실제 외부 AI 호출이 필요한 시험은 예상 비용과 전송 항목을 먼저 확인하고 승인 후 실행해 줘."],"location":"학생 화면의 답변과 서버의 AI 요청 구성 코드를 함께 확인합니다. F12에는 브라우저와 앱 서버 사이의 통신만 보일 수 있으며 외부 AI에 보낸 실제 전체 요청은 서버 쪽에서 별도로 확인합니다.","links":["https://webapp-security-lab.vercel.app/#/input","https://hitl-chat-gamma.vercel.app/"],"branches":[["현재 앱에 AI 기능이 없는 경우","수업에 필요한지부터 검토해 줘. 이 점검을 위해 AI 기능이나 유료 API를 새로 추가하지 마."],["차단이 지나쳐 정상 수업 질문도 막히는 경우","오탐 사례를 가상 문장으로 분류하고 정상 질문을 허용하면서 고위험 처리 규칙을 유지하는 수정안을 제시해 줘."]],"prompts":[{"id":"a19-inspect","category":"기본 진행","title":"1 현재 상태부터 확인하기","when":"프로젝트를 연 뒤 처음 보냅니다. 파일을 고치기 전 단계입니다.","text":"활동: 학생용 AI의 답변과 수업 적합성 점검\n앱 이름과 프로젝트: [입력]\n이번 시험 주소: [입력]\n준비 정보: 수업 목표, 학생 연령, 정상·경계·위험 가상 입력, 현재 AI 지시문\n현재 상황: [입력]\n사용할 가상 자료: [입력]\n\n이 활동에 해당하는지부터 확인해 줘. 아직 파일이나 설정은 수정하지 마.\n1. AI가 하는 일과 교사가 판단할 일을 수업 목표에 맞춰 구분해 줘.\n2. 정답을 단정하거나 학생을 평가·낙인찍는 표현, 위험한 내용, 출처 없는 주장을 만들 수 있는 경로를 점검해 줘.\n3. 시스템 지시문·사용자 입력·첨부 자료가 섞일 때 첨부 자료의 지시를 그대로 따르는지 시험 계획을 세워 줘.\n4. AI 출력의 개인정보·부적절 내용·사실성 확인을 어디서 하는지 정리해 줘.\n\n결과는 표로 정리해 줘. 표에는 확인 항목, 현재 동작, 근거가 있는 파일이나 설정 위치, 발견한 문제와 추가로 확인할 내용을 적어 줘. 코드에서 확인한 사실과 추정은 구분해 줘. 내가 직접 확인할 메뉴·버튼·파일 이름도 알려 줘. 파일을 읽지 못했다면 그 사실을 표시해 줘.\n실제 학생 정보·비밀키·인증 토큰은 출력하지 말고 필요한 값은 가려 줘. 내 앱 또는 허락받은 시험 환경만 대상으로 해 줘.\n참고할 확인 위치: 학생 화면의 답변과 서버의 AI 요청 구성 코드를 함께 확인합니다. F12에는 브라우저와 앱 서버 사이의 통신만 보일 수 있으며 외부 AI에 보낸 실제 전체 요청은 서버 쪽에서 별도로 확인합니다.","next":"현재 구조와 해당 여부를 확인합니다. 모르는 정보는 먼저 확인하고, 수정이 필요하면 2번으로 진행합니다."},{"id":"a19-plan","category":"기본 진행","title":"2 수정 방법과 범위 정하기","when":"1번 답변에서 실제로 고칠 항목을 골랐을 때 보냅니다.","text":"활동: 학생용 AI의 답변과 수업 적합성 점검\n앱 이름과 프로젝트: [입력]\n이번 시험 주소: [입력]\n준비 정보: 수업 목표, 학생 연령, 정상·경계·위험 가상 입력, 현재 AI 지시문\n현재 상황: [입력]\n사용할 가상 자료: [입력]\n앞에서 확인한 문제와 근거: [1번 결과 중 해당 부분을 붙이기]\n이번에 고칠 항목: [입력]\n\n구현 전에 다음 조건으로 수정 계획을 만들어 줘.\n1. 연령에 맞는 어휘, 모르면 모른다고 알리는 방식, 교사에게 질문할 상황을 지시문에 반영해 줘.\n2. 학습자의 사고를 돕는 질문과 힌트를 제공하고 정답 대필 여부는 수업 목적에 따라 설정해 줘.\n3. 학생 평가·징계·위기 판단을 AI 단독 결정으로 구현하지 마.\n4. 외부 자료는 검토할 자료로 취급하고 자료 속 지시가 앱 정책을 바꾸지 못하도록 처리해 줘.\n\n기존 기능을 유지하면서 문제를 고칠 방법부터 제안해 줘. 방법이 여러 가지라면 필요한 서비스와 비용, 사용 방법이 달라지는 부분, 이전 상태로 되돌릴 방법을 비교해 줘. 반드시 고쳐야 할 부분과 선택해서 개선할 부분을 구분해 줘.\n변경할 파일, 학생 또는 교사 화면에서 달라질 부분, 필요한 관리 설정, 시험할 가상 입력을 순서대로 적어 줘. 서버가 없는 앱이라면 지금 할 수 있는 것과 서버가 필요한 것을 분리해 줘.\n아직 코드를 수정하거나 서비스를 만들지 마. 내가 결정해야 할 사항이 있으면 선택지와 차이를 설명하고 물어봐 줘.","next":"수정할 내용과 비용, 정보 수집·전송·보관 방식이 달라지는지 확인한 뒤 진행할 방법을 정합니다. 학교가 판단해야 하는 내용은 먼저 확인합니다."},{"id":"a19-implement","category":"기본 진행","title":"3 선택한 범위 구현하기","when":"수정 계획을 검토한 뒤 승인할 범위를 직접 적고 보냅니다.","text":"활동: 학생용 AI의 답변과 수업 적합성 점검\n앱 이름과 프로젝트: [입력]\n이번 시험 주소: [입력]\n준비 정보: 수업 목표, 학생 연령, 정상·경계·위험 가상 입력, 현재 AI 지시문\n현재 상황: [입력]\n사용할 가상 자료: [입력]\n승인한 수정안: [선택한 방법과 항목을 정확히 입력]\n수정할 파일 또는 기능 범위: [입력]\n이번에 제외할 것: [입력]\n\n위에 승인한 범위만 구현해 줘. 시작 전에 현재 변경 파일을 확인해 다른 작업을 보존해 줘.\n1. 연령에 맞는 어휘, 모르면 모른다고 알리는 방식, 교사에게 질문할 상황을 지시문에 반영해 줘.\n2. 학습자의 사고를 돕는 질문과 힌트를 제공하고 정답 대필 여부는 수업 목적에 따라 설정해 줘.\n3. 학생 평가·징계·위기 판단을 AI 단독 결정으로 구현하지 마.\n4. 외부 자료는 검토할 자료로 취급하고 자료 속 지시가 앱 정책을 바꾸지 못하도록 처리해 줘.\n\n한 부분씩 수정하고 실행 결과를 확인해 줘. 기존 디자인과 정상 기능은 유지해 줘. 새 서비스 생성·운영 자료 삭제·유료 호출·커밋·푸시·배포는 이 요청에 구체적으로 승인한 경우에만 실행해 줘. 요청하지 않은 변경이 필요하면 진행 전에 이유를 설명해 줘.\n수정 후 바꾼 파일과 이유, 실행한 검사, 아직 하지 못한 시험, 내가 누를 버튼 순서를 적어 줘. 실제 학생 정보·비밀키·인증 토큰은 출력하지 말고 필요한 값은 가려 줘. 내 앱 또는 허락받은 시험 환경만 대상으로 해 줘.","next":"빌드나 실행 오류가 없는지 확인한 뒤 4번으로 진행합니다. 허용해야 할 동작은 정상적으로 되고, 차단해야 할 동작은 막히는지 함께 시험합니다."},{"id":"a19-verify","category":"기본 진행","title":"4 수정 결과 직접 확인하기","when":"구현이 끝났거나 기존 기능이 안전하게 동작하는지 검증할 때 보냅니다.","text":"활동: 학생용 AI의 답변과 수업 적합성 점검\n앱 이름과 프로젝트: [입력]\n이번 시험 주소: [입력]\n준비 정보: 수업 목표, 학생 연령, 정상·경계·위험 가상 입력, 현재 AI 지시문\n현재 상황: [입력]\n사용할 가상 자료: [입력]\n이번 수정 내용: [입력 또는 기존 기능 검증]\n시험할 버전과 주소: [입력]\n\n다음 조건을 가상 자료로 다시 시험해 줘.\n1. 정상 질문·정보가 부족한 질문·잘못된 전제·부적절한 요구를 가상 자료로 비교해 줘.\n2. 정책을 무시하라는 입력과 문서 속 지시를 넣어도 앱의 역할이 유지되는지 확인해 줘.\n3. 반복 실행 결과가 달라질 수 있으므로 한 번 통과한 것을 완전한 안전으로 표현하지 마.\n4. 실제 외부 AI 호출이 필요한 시험은 예상 비용과 전송 항목을 먼저 확인하고 승인 후 실행해 줘.\n\n내가 직접 따라 할 수 있도록 준비 계정과 상태 → 클릭 또는 입력 → 확인할 실제 탭·요청·필드 → 기대 결과를 항목마다 적어 줘.\n확인할 위치: 학생 화면의 답변과 서버의 AI 요청 구성 코드를 함께 확인합니다. F12에는 브라우저와 앱 서버 사이의 통신만 보일 수 있으며 외부 AI에 보낸 실제 전체 요청은 서버 쪽에서 별도로 확인합니다.\n자기 앱에서 이름이 다르면 코드와 실제 요청에서 맞는 이름을 찾아 줘. 실제로 존재하는지 확인하지 않은 요청명을 만들어 내지 마.\n허용해야 할 동작과 차단해야 할 동작을 함께 시험해 줘. 항목마다 실행 여부, 실제 결과, 확인한 화면이나 기록을 적고, 시험하지 못했다면 이유를 설명해 줘. 응답 코드와 실제로 받은 자료를 함께 확인하고, 저장 기능이 있다면 저장된 결과도 확인해 줘.\n이 활동을 완료해도 앱 전체의 안전이 보장된다고 표현하지 마. 실제 학생 정보·비밀키·인증 토큰은 출력하지 말고 필요한 값은 가려 줘. 내 앱 또는 허락받은 시험 환경만 대상으로 해 줘.","next":"기대 결과와 실제 결과가 같으면 활동 기록을 정리합니다. 다르면 “오류 해결” 프롬프트를 사용하고 같은 조건으로 재시험합니다."},{"id":"a19-branch1","category":"상황별 진행","title":"현재 앱에 AI 기능이 없는 경우","when":"기본 순서로 진행하다가 이 상황에 해당하면 사용합니다.","text":"활동: 학생용 AI의 답변과 수업 적합성 점검\n앱 이름과 프로젝트: [입력]\n이번 시험 주 tle":"안내된 화면이나 요청을 찾지 못할 때","when":"F12에 설명한 파일·요청이 없거나 확인할 곳을 모르겠을 때 보냅니다.","text":"활동: 학생용 AI의 답변과 수업 적합성 점검\n앱 이름과 프로젝트: [입력]\n이번 시험 주소: [입력]\n준비 정보: 수업 목표, 학생 연령, 정상·경계·위험 가상 입력, 현재 AI 지시문\n현재 상황: [입력]\n사용할 가상 자료: [입력]\n내가 보고 있는 주소와 창: [입력]\n누른 버튼 또는 실행한 동작: [입력]\n열어 둔 개발자 도구 탭과 필터: [입력 또는 모름]\n찾으려는 정보: [입력]\n현재 화면 또는 가린 오류 내용: [붙이기]\n\n참고 안내: 학생 화면의 답변과 서버의 AI 요청 구성 코드를 함께 확인합니다. F12에는 브라우저와 앱 서버 사이의 통신만 보일 수 있으며 외부 AI에 보낸 실제 전체 요청은 서버 쪽에서 별도로 확인합니다.\n이 안내가 체험 앱의 가상 자료인지 내 앱의 실제 동작인지 먼저 구분해 줘. 프로젝트에서 이 동작이 어떤 요청·파일·저장소로 연결되는지 찾아 줘.\nNetwork라면 동작 전에 열기, 기록 켜기, 목록 지우기, 필터 확인, 같은 동작 다시 하기, 새 요청 선택, Headers·Payload·Response 중 볼 위치를 실제 이름으로 알려 줘. 정적 파일이면 All 필터도 확인해 줘. 새 창을 열었다면 그 창에서 F12를 열어야 하는지 설명해 줘.\n브라우저 검사에서 막아 요청이 없거나 아직 동작을 실행하지 않은 경우도 구분해 줘. 서버에만 있는 정보는 F12에서 찾으라고 하지 말고 코드·관리 화면·시험 환경에서 확인할 방법을 제시해 줘.\n확인할 자료가 실제로 없으면 없다고 말하고 필요한 시험 준비를 설명해 줘. 캡처 요청에는 가려야 할 정보도 알려 줘. 실제 학생 정보·비밀키·인증 토큰은 출력하지 말고 필요한 값은 가려 줘. 내 앱 또는 허락받은 시험 환경만 대상으로 해 줘.","next":"정확한 위치를 찾은 뒤 해당 활동의 4번 프롬프트로 결과를 확인합니다. 없다는 사실 자체가 기대 결과인지 먼저 판단합니다."},{"id":"a19-error","category":"오류 해결","title":"예상과 다른 결과가 나올 때","when":"실행 오류, 정상 기능 실패, 예상한 차단이 되지 않는 경우에 보냅니다.","text":"활동: 학생용 AI의 답변과 수업 적합성 점검\n앱 이름과 프로젝트: [입력]\n이번 시험 주소: [입력]\n준비 정보: 수업 목표, 학생 연령, 정상·경계·위험 가상 입력, 현재 AI 지시문\n현재 상황: [입력]\n사용할 가상 자료: [입력]\n실행한 단계와 입력: [입력]\n기대한 결과: [입력]\n실제로 나온 결과: [입력]\n오류 문구: [비밀값을 가리고 붙이기]\n직전에 변경한 파일 또는 설정: [입력 또는 모름]\n\n원인을 추측해서 여러 곳을 한꺼번에 바꾸지 말고, 재현 조건과 현재 코드를 비교해 줘. 요청이 만들어지는지, 서버에 도착하는지, 검사와 반환·저장이 어디서 달라지는지 관련 단계만 확인해 줘.\n특히 다음 점검 기준을 다시 봐 줘:\n1. AI가 하는 일과 교사가 판단할 일을 수업 목표에 맞춰 구분해 줘.\n2. 정답을 단정하거나 학생을 평가·낙인찍는 표현, 위험한 내용, 출처 없는 주장을 만들 수 있는 경로를 점검해 줘.\n\n가능한 원인마다 그렇게 판단한 이유와 먼저 확인할 방법을 알려 줘. 운영 자료를 삭제하거나 권한·입력 검사를 전체 해제하는 방식은 사용하지 마. 수정이 필요하면 바꿀 내용을 먼저 제안하고 내가 승인한 뒤 적용해 줘.\n수정 후 같은 실패 조건과 다음 정상 조건을 모두 재시험해 줘:\n1. 정상 질문·정보가 부족한 질문·잘못된 전제·부적절한 요구를 가상 자료로 비교해 줘.\n2. 정책을 무시하라는 입력과 문서 속 지시를 넣어도 앱의 역할이 유지되는지 확인해 줘.\n3. 반복 실행 결과가 달라질 수 있으므로 한 번 통과한 것을 완전한 안전으로 표현하지 마.\n4. 실제 외부 AI 호출이 필요한 시험은 예상 비용과 전송 항목을 먼저 확인하고 승인 후 실행해 줘.\n완료 보고에는 실제 실행한 결과와 실행하지 못한 이유를 구분해 줘.","next":"실패 원인을 확인하고 승인한 수정만 적용합니다. 같은 실패 조건이 해결됐는지와 원래 정상 기능이 유지되는지 함께 봅니다."},{"id":"a19-finish","category":"활동 마무리","title":"확인 기록과 다음 점검 정리하기","when":"직접 시험을 확인한 뒤, 또는 해당 없음·추가 확인으로 종료할 때 보냅니다.","text":"활동: 학생용 AI의 답변과 수업 적합성 점검\n앱 이름과 프로젝트: [입력]\n이번 시험 주소: [입력]\n준비 정보: 수업 목표, 학생 연령, 정상·경계·위험 가상 입력, 현재 AI 지시문\n현재 상황: [입력]\n사용할 가상 자료: [입력]\n실제로 진행한 단계: [입력]\n확인한 결과 또는 아직 확인하지 못한 내용: [입력]\n\n이번 활동 기록을 Markdown으로 정리해 줘. 항목은 앱과 시험 버전, 점검한 기능, 발견한 문제와 위치, 승인한 수정, 시험 입력과 기대 결과, 실제 결과와 근거, 추가 확인할 일로 구성해 줘.\n앞으로 개발할 때 지킬 기준도 우리 앱의 실제 코드·설정 위치와 연결해 적어 줘:\n1. 연령에 맞는 어휘, 모르면 모른다고 알리는 방식, 교사에게 질문할 상황을 지시문에 반영해 줘.\n2. 학습자의 사고를 돕는 질문과 힌트를 제공하고 정답 대필 여부는 수업 목적에 따라 설정해 줘.\n3. 학생 평가·징계·위기 판단을 AI 단독 결정으로 구현하지 마.\n4. 외부 자료는 검토할 자료로 취급하고 자료 속 지시가 앱 정책을 바꾸지 못하도록 처리해 줘.\n\n활동 상태는 확인 완료·추가 확인·해당 없음 중 근거에 맞게 적어 줘. 구현만 하고 시험하지 않았다면 확인 완료로 쓰지 마. 문제를 발견하지 못한 것과 충분히 검증한 것을 구분해 줘.\n다음 수정 때 다시 실행할 시험은 다음 내용을 바탕으로 정리해 줘:\n1. 정상 질문·정보가 부족한 질문·잘못된 전제·부적절한 요구를 가상 자료로 비교해 줘.\n2. 정책을 무시하라는 입력과 문서 속 지시를 넣어도 앱의 역할이 유지되는지 확인해 줘.\n보고서에 원문 학생 자료나 비밀값을 넣지 마. 이 기록만으로 학교 승인이나 앱 전체의 안전을 보장한다고 쓰지 마.","next":"기록을 자신의 프로젝트에 보관하고 필요한 다음 활동을 선택합니다. 새로운 대화를 시작할 때는 이 기록과 공통 시작 프롬프트를 함께 제공합니다."}]},{"id":20,"title":"학생과 모둠의 활동을 보는 교사 화면 만들기","group":"학생 수업 운영","slides":"36~38","condition":"여러 학생이 동시에 활동하는 앱","inputs":"수업 단계, 개인·모둠 단위, 교사가 도와줄 상황, 기존 교사 화면","inspect":["교사가 알아야 할 참여·진행·완료·도움 요청 상태를 현재 수업 흐름에서 찾아 줘.","학생의 어떤 행동을 기준으로 참여·진행·완료 상태를 표시하는지 확인해 줘. 페이지를 열었다는 이유만으로 학습 완료로 표시하지 마.","학생 입력 원문을 모두 보지 않고도 필요한 지원을 할 수 있는지 검토해 줘.","교사별 학급 접근, 갱신 방식, 불필요한 반복 요청과 비용을 확인해 줘."],"requirements":["모둠 또는 학생별 상태와 도움 요청을 한눈에 보이게 하고 의미가 불분명한 점수는 만들지 마.","누구를 도와야 하는지 확인할 때 필요한 범위만 펼쳐 보고 원문 열람은 정한 정책과 권한에 따라 제한해 줘.","진행 상태 계산 기준·마지막 갱신 시각·접속 끊김·자료 없음 상태를 구분해 줘.","서버에서 교사의 학급 권한을 검사하고 화면을 닫거나 수업이 끝나면 불필요한 갱신을 멈추게 해 줘."],"tests":["가상 학생의 입장·진행·완료·도움 요청이 교사 화면에 맞게 표시되는지 확인해 줘.","다른 학급 교사와 학생이 해당 교사 화면의 데이터를 직접 요청해도 거부되는지 확인해 줘.","학생이 접속을 끊거나 새로고침해도 완료 상태가 잘못 바뀌지 않는지 확인해 줘.","F12에서 불필요한 원문 전송과 과도한 자동 요청이 없는지 확인해 줘."],"location":"교사 화면을 열고 가상 학생의 별도 브라우저에서 상태를 바꿉니다. F12 → Network에서 갱신 요청 간격과 Response의 상태·학생 범위를 봅니다. WebSocket을 쓰면 WS 메시지도 확인합니다.","links":["https://hitl-chat-gamma.vercel.app/","https://info-detective.vercel.app/"],"branches":[["교사 화면이 없는 경우","현재 수업에서 필요한 상태 세 가지 이내로 먼저 제안해 줘. 기존 학생 화면과 데이터 구조를 유지한 최소 화면부터 만들고 추가 분석은 선택 사항으로 남겨 줘."],["모둠 활동인 경우","개인 순위를 만들지 말고 모둠의 진행 상태와 도움 요청 중심으로 설계해 줘. 모둠 이동이나 중복 접속 때 집계 기준도 정해 줘."],["실시간 화면 때문에 요청이 너무 많은 경우","현재 갱신 간격·사용자 수·요청 횟수를 계산하고 수동 갱신 또는 수업 중 제한된 주기 갱신 등 작은 변경부터 제안해 줘."]],"prompts":[{"id":"a20-inspect","category":"기본 진행","title":"1 현재 상태부터 확인하기","when":"프로젝트를 연 뒤 처음 보냅니다. 파일을 고치기 전 단계입니다.","text":"활동: 학생과 모둠의 활동을 보는 교사 화면 만들기\n앱 이름과 프로젝트: [입력]\n이번 시험 주소: [입력]\n준비 정보: 수업 단계, 개인·모둠 단위, 교사가 도와줄 상황, 기존 교사 화면\n현재 상황: [입력]\n사용할 가상 자료: [입력]\n\n이 활동에 해당하는지부터 확인해 줘. 아직 파일이나 설정은 수정하지 마.\n1. 교사가 알아야 할 참여·진행·완료·도움 요청 상태를 현재 수업 흐름에서 찾아 줘.\n2. 학생의 어떤 행동을 기준으로 참여·진행·완료 상태를 표시하는지 확인해 줘. 페이지를 열었다는 이유만으로 학습 완료로 표시하지 마.\n3. 학생 입력 원문을 모두 보지 않고도 필요한 지원을 할 수 있는지 검토해 줘.\n4. 교사별 학급 접근, 갱신 방식, 불필요한 반복 요청과 비용을 확인해 줘.\n\n결과는 표로 정리해 줘. 표에는 확인 항목, 현재 동작, 근거가 있는 파일이나 설정 위치, 발견한 문제와 추가로 확인할 내용을 적어 줘. 코드에서 확인한 사실과 추정은 구분해 줘. 내가 직접 확인할 메뉴·버튼·파일 이름도 알려 줘. 파일을 읽지 못했다면 그 사실을 표시해 줘.\n실제 학생 정보·비밀키·인증 토큰은 출력하지 말고 필요한 값은 가려 줘. 내 앱 또는 허락받은 시험 환경만 대상으로 해 줘.\n참고할 확인 위치: 교사 화면을 열고 가상 학생의 별도 브라우저에서 상태를 바꿉니다. F12 → Network에서 갱신 요청 간격과 Response의 상태·학생 범위를 봅니다. WebSocket을 쓰면 WS 메시지도 확인합니다.","next":"현재 구조와 해당 여부를 확인합니다. 모르는 정보는 먼저 확인하고, 수정이 필요하면 2번으로 진행합니다."},{"id":"a20-plan","category":"기본 진행","title":"2 수정 방법과 범위 정하기","when":"1번 답변에서 실제로 고칠 항목을 골랐을 때 보냅니다.","text":"활동: 학생과 모둠의 활동을 보는 교사 화면 만들기\n앱 이름과 프로젝트: [입력]\n이번 시험 주소: [입력]\n준비 정보: 수업 단계, 개인·모둠 단위, 교사가 도와줄 상황, 기존 교사 화면\n현재 상황: [입력]\n사용할 가상 자료: [입력]\n앞에서 확인한 문제와 근거: [1번 결과 중 해당 부분을 붙이기]\n이번에 고칠 항목: [입력]\n\n구현 전에 다음 조건으로 수정 계획을 만들어 줘.\n1. 모둠 또는 학생별 상태와 도움 요청을 한눈에 보이게 하고 의미가 불분명한 점수는 만들지 마.\n2. 누구를 도와야 하는지 확인할 때 필요한 범위만 펼쳐 보고 원문 열람은 정한 정책과 권한에 따라 제한해 줘.\n3. 진행 상태 계산 기준·마지막 갱신 시각·접속 끊김·자료 없음 상태를 구분해 줘.\n4. 서버에서 교사의 학급 권한을 검사하고 화면을 닫거나 수업이 끝나면 불필요한 갱신을 멈추게 해 줘.\n\n기존 기능을 유지하면서 문제를 고칠 방법부터 제안해 줘. 방법이 여러 가지라면 필요한 서비스와 비용, 사용 방법이 달라지는 부분, 이전 상태로 되돌릴 방법을 비교해 줘. 반드시 고쳐야 할 부분과 선택해서 개선할 부분을 구분해 줘.\n변경할 파일, 학생 또는 교사 화면에서 달라질 부분, 필요한 관리 설정, 시험할 가상 입력을 순서대로 적어 줘. 서버가 없는 앱이라면 지금 할 수 있는 것과 서버가 필요한 것을 분리해 줘.\n아직 코드를 수정하거나 서비스를 만들지 마. 내가 결정해야 할 사항이 있으면 선택지와 차이를 설명하고 물어봐 줘.","next":"수정할 내용과 비용, 정보 수집·전송·보관 방식이 달라지는지 확인한 뒤 진행할 방법을 정합니다. 학교가 판단해야 하는 내용은 먼저 확인합니다."},{"id":"a20-implement","category":"기본 진행","title":"3 선택한 범위 구현하기","when":"수정 계획을 검토한 뒤 승인할 범위를 직접 적고 보냅니다.","text":"활동: 학생과 모둠의 활동을 보는 교사 화면 만들기\n앱 이름과 프로젝트: [입력]\n이번 시험 주소: [입력]\n준비 정보: 수업 단계, 개인·모둠 단위, 교사가 도와줄 상황, 기존 교사 화면\n현재 상황: [입력]\n사용할 가상 자료: [입력]\n승인한 수정안: [선택한 방법과 항목을 정확히 입력]\n수정할 파일 또는 기능 범위: [입력]\n이번에 제외할 것: [입력]\n\n위에 승인한 범위만 구현해 줘. 시작 전에 현재 변경 파일을 확인해 다른 작업을 보존해 줘.\n1. 모둠 또는 학생별 상태와 도움 요청을 한눈에 보이게 하고 의미가 불분명한 점수는 만들지 마.\n2. 누구를 도와야 하는지 확인할 때 필요한 범위만 펼쳐 보고 원문 열람은 정한 정책과 권한에 따라 제한해 줘.\n3. 진행 상태 계산 기준·마지막 갱신 시각·접속 끊김·자료 없음 상태를 구분해 줘.\n4. 서버에서 교사의 학급 권한을 검사하고 화면을 닫거나 수업이 끝나면 불필요한 갱신을 멈추게 해 줘.\n\n한 부분씩 수정하고 실행 결과를 확인해 줘. 기존 디자인과 정상 기능은 유지해 줘. 새 서비스 생성·운영 자료 삭제·유료 호출·커밋·푸시·배포는 이 요청에 구체적으로 승인한 경우에만 실행해 줘. 요청하지 않은 변경이 필요하면 진행 전에 이유를 설명해 줘.\n수정 후 바꾼 파일과 이유, 실행한 검사, 아직 하지 못한 시험, 내가 누를 버튼 순서를 적어 줘. 실제 학생 정보·비밀키·인증 토큰은 출력하지 말고 필요한 값은 가려 줘. 내 앱 또는 허락받은 시험 환경만 대상으로 해 줘.","next":"빌드나 실행 오류가 없는지 확인한 뒤 4번으로 진행합니다. 허용해야 할 동작은 정상적으로 되고, 차단해야 할 동작은 막히는지 함께 시험합니다."},{"id":"a20-verify","category":"기본 진행","title":"4 수정 결과 직접 확인하기","when":"구현이 끝났거나 기존 기능이 안전하게 동작하는지 검증할 때 보냅니다.","text":"활동: 학생과 모둠의 활동을 보는 교사 화면 만들기\n앱 이름과 프로젝트: [입력]\n이번 시험 주소: [입력]\n준비 정보: 수업 단계, 개인·모둠 단위, 교사가 도와줄 상황, 기존 교사 화면\n현재 상황: [입력]\n사용할 가상 자료: [입력]\n이번 수정 내용: [입력 또는 기존 기능 검증]\n시험할 버전과 주소: [입력]\n\n다음 조건을 가상 자료로 다시 시험해 줘.\n1. 가상 학생의 입장·진행·완료·도움 요청이 교사 화면에 맞게 표시되는지 확인해 줘.\n2. 다른 학급 교사와 학생이 해당 교사 화면의 데이터를 직접 요청해도 거부되는지 확인해 줘.\n3. 학생이 접속을 끊거나 새로고침해도 완료 상태가 잘못 바뀌지 않는지 확인해 줘.\n4. F12에서 불필요한 원문 전송과 과도한 자동 요청이 없는지 확인해 줘.\n\n내가 직접 따라 할 수 있도록 준비 계정과 상태 → 클릭 또는 입력 → 확인할 실제 탭·요청·필드 → 기대 결과를 항목마다 적어 줘.\n확인할 위치: 교사 화면을 열고 가상 학생의 별도 브라우저에서 상태를 바꿉니다. F12 → Network에서 갱신 요청 간격과 Response의 상태·학생 범위를 봅니다. WebSocket을 쓰면 WS 메시지도 확인합니다.\n자기 앱에서 이름이 다르면 코드와 실제 요청에서 맞는 이름을 찾아 줘. 실제로 존재하는지 확인하지 않은 요청명을 만들어 내지 마.\n허용해야 할 동작과 차단해야 할 동작을 함께 시험해 줘. 항목마다 실행 여부, 실제 결과, 확인한 화면이나 기록을 적고, 시험하지 못했다면 이유를 설명해 줘. 응답 코드와 실제로 받은 자료를 함께 확인하고, 저장 기능이 있다면 저장된 결과도 확인해 줘.\n이 활동을 완료해도 앱 전체의 안전이 보장된다고 표현하지 마. 실제 학생 정보·비밀키·인증 토큰은 출력하지 말고 필요한 값은 가려 줘. 내 앱 또는 허락받은 시험 환경만 대상으로 해 줘.","next":"기대 결과와 실제 결과가 같으면 활동 기록을 정리합니다. 다르면 “오류 해결” 프롬프트를 사용하고 같은 조건으로 재시험합니다."},{"id":"a20-branch1","category":"상황별 진행","title":"교사 화면이 없는 경우","when":"기본 순서로 진행하다가 이 상황에 해당하면 사용합니다.","text":"활동: 학생과 모둠의 활동을 보는 교사 화면 만들기\n앱 이름과 프로젝트: [입력]\n이번 시험 주소: [입력]\n준비 정보: 수업 단계, 개인·모둠 단위, 교사가 도와줄 상황, 기존 교사 화면\n현재 상황: [입력]\n사용할 가상 자료: [입력]\n현재 겪는 상황: 교사 화면이 없는 경우\n이미 한 행동과 나온 결과: [입력]\n\n현재 수업에서 필요한 상태 세 가지 이내로 먼저 제안해 줘. 기존 학생 화면과 데이터 구조를 유지한 최소 화면부터 만들고 추가 분석은 선택 사항으로 남겨 줘.\n먼저 관련 코드·화면·설정에서 현재 상태를 확인하고 이 상황이 생긴 이유를 근거와 함께 설명해 줘. 현재 환경에서 확인할 수 없는 것은 따로 표시해 줘.\n이 활동에서 유지할 조건:\n1. 모둠 또는 학생별 상태와 도움 요청을 한눈에 보이게 하고 의미가 불분명한 점수는 만들지 마.\n2. 누구를 도와야 하는지 확인할 때 필요한 범위만 펼쳐 보고 원문 열람은 정한 정책과 권한에 따라 제한해 줘.\n3. 진행 상태 계산 기준·마지막 갱신 시각·접속 끊김·자료 없음 상태를 구분해 줘.\n\n진행 순서를 “지금 확인할 것 → 선택 가능한 방법 → 내가 승인할 변경 → 실행 후 다시 확인할 결과”로 정리해 줘. 앱에 필요 없는 기능을 추가하거나 검사를 끄는 방식으로 해결하지 마.\n재시험에서는 다음 조건을 포함해 줘:\n1. 가상 학생의 입장·진행·완료·도움 요청이 교사 화면에 맞게 표시되는지 확인해 줘.\n2. 다른 학급 교사와 학생이 해당 교사 화면의 데이터를 직접 요청해도 거부되는지 확인해 줘.\n수정이 필요하면 먼저 범위를 제안하고 내 확인 전 운영 설정을 바꾸지 마. 실제 학생 정보·비밀키·인증 토큰은 출력하지 말고 필요한 값은 가려 줘. 내 앱 또는 허락받은 시험 환경만 대상으로 해 줘.","next":"이 상황에 맞는 방법을 선택한 뒤 기본 진행의 구현 또는 재시험 단계로 돌아갑니다. 해당 없음이면 이유를 기록하고 다른 활동을 고릅니다."},{"id":"a20-branch2","category":"상황별 진행","title":"모둠 활동인 경우","when":"기본 순서로 진행하다가 이 상황에 해당하면 사용합니다.","text":"활동: 학생과 모둠의 활동을 보는 교사 화면 만들기\n앱 이름과 프로젝트: [입력]\n이번 시험 주소: [입력]\n준비 정보: 수업 단계, 개인·모둠 단위, 교사가 도와줄 상황, 기존 교사 화면\n현재 상황: [입력]\n사용할 가상 자료: [입력]\n현재 겪는 상황: 모둠 활동인 경우\n이미 한 행동과 나온 결과: [입력]\n\n개인 순위를 만들지 말고 모둠의 진행 상
