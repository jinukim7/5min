2. 커밋 메시지에 실제 변경과 검증 내용을 담고 비밀정보를 넣지 마.\n3. 푸시·배포는 내가 지정한 대상과 범위를 확인한 뒤 명시적으로 요청했을 때만 실행해 줘.\n\n진행 순서를 “지금 확인할 것 → 선택 가능한 방법 → 내가 승인할 변경 → 실행 후 다시 확인할 결과”로 정리해 줘. 앱에 필요 없는 기능을 추가하거나 검사를 끄는 방식으로 해결하지 마.\n재시험에서는 다음 조건을 포함해 줘:\n1. 빌드와 관련 테스트를 실행하고 실패가 남아 있으면 완료라고 하지 마.\n2. 승인 후 배포했다면 배포 결과와 실제 URL을 확인해 줘.\n수정이 필요하면 먼저 범위를 제안하고 내 확인 전 운영 설정을 바꾸지 마. 실제 학생 정보·비밀키·인증 토큰은 출력하지 말고 필요한 값은 가려 줘. 내 앱 또는 허락받은 시험 환경만 대상으로 해 줘.","next":"이 상황에 맞는 방법을 선택한 뒤 기본 진행의 구현 또는 재시험 단계로 돌아갑니다. 해당 없음이면 이유를 기록하고 다른 활동을 고릅니다."},{"id":"a36-branch2","category":"상황별 진행","title":"로컬에서는 되는데 배포에서 실패하는 경우","when":"기본 순서로 진행하다가 이 상황에 해당하면 사용합니다.","text":"활동: 변경 내용을 저장하고 배포 환경 확인\n앱 이름과 프로젝트: [입력]\n이번 시험 주소: [입력]\n준비 정보: 대상 저장소·브랜치·Vercel 프로젝트, 변경 파일, 시험 결과, 배포 승인 범위\n현재 상황: [입력]\n사용할 가상 자료: [입력]\n현재 겪는 상황: 로컬에서는 되는데 배포에서 실패하는 경우\n이미 한 행동과 나온 결과: [입력]\n\n배포 로그·환경 변수 이름과 적용 범위·빌드 명령·경로 대소문자·직접 URL 새로고침을 확인해 줘. 비밀값을 보여 달라고 하지 마.\n먼저 관련 코드·화면·설정에서 현재 상태를 확인하고 이 상황이 생긴 이유를 근거와 함께 설명해 줘. 현재 환경에서 확인할 수 없는 것은 따로 표시해 줘.\n이 활동에서 유지할 조건:\n1. 내가 지정한 변경 파일만 커밋 대상으로 선택하고 다른 작업의 변경을 덮어쓰거나 포함하지 마.\n2. 커밋 메시지에 실제 변경과 검증 내용을 담고 비밀정보를 넣지 마.\n3. 푸시·배포는 내가 지정한 대상과 범위를 확인한 뒤 명시적으로 요청했을 때만 실행해 줘.\n\n진행 순서를 “지금 확인할 것 → 선택 가능한 방법 → 내가 승인할 변경 → 실행 후 다시 확인할 결과”로 정리해 줘. 앱에 필요 없는 기능을 추가하거나 검사를 끄는 방식으로 해결하지 마.\n재시험에서는 다음 조건을 포함해 줘:\n1. 빌드와 관련 테스트를 실행하고 실패가 남아 있으면 완료라고 하지 마.\n2. 승인 후 배포했다면 배포 결과와 실제 URL을 확인해 줘.\n수정이 필요하면 먼저 범위를 제안하고 내 확인 전 운영 설정을 바꾸지 마. 실제 학생 정보·비밀키·인증 토큰은 출력하지 말고 필요한 값은 가려 줘. 내 앱 또는 허락받은 시험 환경만 대상으로 해 줘.","next":"이 상황에 맞는 방법을 선택한 뒤 기본 진행의 구현 또는 재시험 단계로 돌아갑니다. 해당 없음이면 이유를 기록하고 다른 활동을 고릅니다."},{"id":"a36-branch3","category":"상황별 진행","title":"수정 전 버전으로 되돌려야 하는 경우","when":"기본 순서로 진행하다가 이 상황에 해당하면 사용합니다.","text":"활동: 변경 내용을 저장하고 배포 환경 확인\n앱 이름과 프로젝트: [입력]\n이번 시험 주소: [입력]\n준비 정보: 대상 저장소·브랜치·Vercel 프로젝트, 변경 파일, 시험 결과, 배포 승인 범위\n현재 상황: [입력]\n사용할 가상 자료: [입력]\n현재 겪는 상황: 수정 전 버전으로 되돌려야 하는 경우\n이미 한 행동과 나온 결과: [입력]\n\n대상 커밋과 배포, 자료 구조 변경 여부를 먼저 확인해 줘. 강제 푸시나 전체 초기화 대신 영향이 작은 복구 방법을 제시하고 승인 후 실행해 줘.\n먼저 관련 코드·화면·설정에서 현재 상태를 확인하고 이 상황이 생긴 이유를 근거와 함께 설명해 줘. 현재 환경에서 확인할 수 없는 것은 따로 표시해 줘.\n이 활동에서 유지할 조건:\n1. 내가 지정한 변경 파일만 커밋 대상으로 선택하고 다른 작업의 변경을 덮어쓰거나 포함하지 마.\n2. 커밋 메시지에 실제 변경과 검증 내용을 담고 비밀정보를 넣지 마.\n3. 푸시·배포는 내가 지정한 대상과 범위를 확인한 뒤 명시적으로 요청했을 때만 실행해 줘.\n\n진행 순서를 “지금 확인할 것 → 선택 가능한 방법 → 내가 승인할 변경 → 실행 후 다시 확인할 결과”로 정리해 줘. 앱에 필요 없는 기능을 추가하거나 검사를 끄는 방식으로 해결하지 마.\n재시험에서는 다음 조건을 포함해 줘:\n1. 빌드와 관련 테스트를 실행하고 실패가 남아 있으면 완료라고 하지 마.\n2. 승인 후 배포했다면 배포 결과와 실제 URL을 확인해 줘.\n수정이 필요하면 먼저 범위를 제안하고 내 확인 전 운영 설정을 바꾸지 마. 실제 학생 정보·비밀키·인증 토큰은 출력하지 말고 필요한 값은 가려 줘. 내 앱 또는 허락받은 시험 환경만 대상으로 해 줘.","next":"이 상황에 맞는 방법을 선택한 뒤 기본 진행의 구현 또는 재시험 단계로 돌아갑니다. 해당 없음이면 이유를 기록하고 다른 활동을 고릅니다."},{"id":"a36-locate","category":"확인 위치 도움","title":"안내된 화면이나 요청을 찾지 못할 때","when":"F12에 설명한 파일·요청이 없거나 확인할 곳을 모르겠을 때 보냅니다.","text":"활동: 변경 내용을 저장하고 배포 환경 확인\n앱 이름과 프로젝트: [입력]\n이번 시험 주소: [입력]\n준비 정보: 대상 저장소·브랜치·Vercel 프로젝트, 변경 파일, 시험 결과, 배포 승인 범위\n현재 상황: [입력]\n사용할 가상 자료: [입력]\n내가 보고 있는 주소와 창: [입력]\n누른 버튼 또는 실행한 동작: [입력]\n열어 둔 개발자 도구 탭과 필터: [입력 또는 모름]\n찾으려는 정보: [입력]\n현재 화면 또는 가린 오류 내용: [붙이기]\n\n참고 안내: 프로젝트 터미널의 Git 상태와 Vercel 배포 화면을 확인합니다. 배포 후 F12에서 실제 사이트의 요청·오류를 다시 확인합니다. 로컬 성공만으로 운영 성공을 판단하지 않습니다.\n이 안내가 체험 앱의 가상 자료인지 내 앱의 실제 동작인지 먼저 구분해 줘. 프로젝트에서 이 동작이 어떤 요청·파일·저장소로 연결되는지 찾아 줘.\nNetwork라면 동작 전에 열기, 기록 켜기, 목록 지우기, 필터 확인, 같은 동작 다시 하기, 새 요청 선택, Headers·Payload·Response 중 볼 위치를 실제 이름으로 알려 줘. 정적 파일이면 All 필터도 확인해 줘. 새 창을 열었다면 그 창에서 F12를 열어야 하는지 설명해 줘.\n브라우저 검사에서 막아 요청이 없거나 아직 동작을 실행하지 않은 경우도 구분해 줘. 서버에만 있는 정보는 F12에서 찾으라고 하지 말고 코드·관리 화면·시험 환경에서 확인할 방법을 제시해 줘.\n확인할 자료가 실제로 없으면 없다고 말하고 필요한 시험 준비를 설명해 줘. 캡처 요청에는 가려야 할 정보도 알려 줘. 실제 학생 정보·비밀키·인증 토큰은 출력하지 말고 필요한 값은 가려 줘. 내 앱 또는 허락받은 시험 환경만 대상으로 해 줘.","next":"정확한 위치를 찾은 뒤 해당 활동의 4번 프롬프트로 결과를 확인합니다. 없다는 사실 자체가 기대 결과인지 먼저 판단합니다."},{"id":"a36-error","category":"오류 해결","title":"예상과 다른 결과가 나올 때","when":"실행 오류, 정상 기능 실패, 예상한 차단이 되지 않는 경우에 보냅니다.","text":"활동: 변경 내용을 저장하고 배포 환경 확인\n앱 이름과 프로젝트: [입력]\n이번 시험 주소: [입력]\n준비 정보: 대상 저장소·브랜치·Vercel 프로젝트, 변경 파일, 시험 결과, 배포 승인 범위\n현재 상황: [입력]\n사용할 가상 자료: [입력]\n실행한 단계와 입력: [입력]\n기대한 결과: [입력]\n실제로 나온 결과: [입력]\n오류 문구: [비밀값을 가리고 붙이기]\n직전에 변경한 파일 또는 설정: [입력 또는 모름]\n\n원인을 추측해서 여러 곳을 한꺼번에 바꾸지 말고, 재현 조건과 현재 코드를 비교해 줘. 요청이 만들어지는지, 서버에 도착하는지, 검사와 반환·저장이 어디서 달라지는지 관련 단계만 확인해 줘.\n특히 다음 점검 기준을 다시 봐 줘:\n1. 현재 저장소와 브랜치, 수정 파일, 원격 저장소를 읽기 전용으로 확인해 줘.\n2. 새 파일과 변경 내용에 키·실제 학생 자료·불필요한 캡처·임시 파일이 포함되는지 확인해 줘.\n\n가능한 원인마다 그렇게 판단한 이유와 먼저 확인할 방법을 알려 줘. 운영 자료를 삭제하거나 권한·입력 검사를 전체 해제하는 방식은 사용하지 마. 수정이 필요하면 바꿀 내용을 먼저 제안하고 내가 승인한 뒤 적용해 줘.\n수정 후 같은 실패 조건과 다음 정상 조건을 모두 재시험해 줘:\n1. 빌드와 관련 테스트를 실행하고 실패가 남아 있으면 완료라고 하지 마.\n2. 승인 후 배포했다면 배포 결과와 실제 URL을 확인해 줘.\n3. 배포된 앱에서 로그인·권한·문서 링크·수정 기능을 가상 자료로 재시험해 줘.\n4. 배포 버전과 커밋을 연결하고 롤백이 필요한 경우의 구체적 절차를 설명해 줘.\n완료 보고에는 실제 실행한 결과와 실행하지 못한 이유를 구분해 줘.","next":"실패 원인을 확인하고 승인한 수정만 적용합니다. 같은 실패 조건이 해결됐는지와 원래 정상 기능이 유지되는지 함께 봅니다."},{"id":"a36-finish","category":"활동 마무리","title":"확인 기록과 다음 점검 정리하기","when":"직접 시험을 확인한 뒤, 또는 해당 없음·추가 확인으로 종료할 때 보냅니다.","text":"활동: 변경 내용을 저장하고 배포 환경 확인\n앱 이름과 프로젝트: [입력]\n이번 시험 주소: [입력]\n준비 정보: 대상 저장소·브랜치·Vercel 프로젝트, 변경 파일, 시험 결과, 배포 승인 범위\n현재 상황: [입력]\n사용할 가상 자료: [입력]\n실제로 진행한 단계: [입력]\n확인한 결과 또는 아직 확인하지 못한 내용: [입력]\n\n이번 활동 기록을 Markdown으로 정리해 줘. 항목은 앱과 시험 버전, 점검한 기능, 발견한 문제와 위치, 승인한 수정, 시험 입력과 기대 결과, 실제 결과와 근거, 추가 확인할 일로 구성해 줘.\n앞으로 개발할 때 지킬 기준도 우리 앱의 실제 코드·설정 위치와 연결해 적어 줘:\n1. 내가 지정한 변경 파일만 커밋 대상으로 선택하고 다른 작업의 변경을 덮어쓰거나 포함하지 마.\n2. 커밋 메시지에 실제 변경과 검증 내용을 담고 비밀정보를 넣지 마.\n3. 푸시·배포는 내가 지정한 대상과 범위를 확인한 뒤 명시적으로 요청했을 때만 실행해 줘.\n4. 새 유료 서비스 생성·환경 변수 교체·운영 자료 삭제가 필요하면 그 작업은 별도로 확인해 줘.\n\n활동 상태는 확인 완료·추가 확인·해당 없음 중 근거에 맞게 적어 줘. 구현만 하고 시험하지 않았다면 확인 완료로 쓰지 마. 문제를 발견하지 못한 것과 충분히 검증한 것을 구분해 줘.\n다음 수정 때 다시 실행할 시험은 다음 내용을 바탕으로 정리해 줘:\n1. 빌드와 관련 테스트를 실행하고 실패가 남아 있으면 완료라고 하지 마.\n2. 승인 후 배포했다면 배포 결과와 실제 URL을 확인해 줘.\n보고서에 원문 학생 자료나 비밀값을 넣지 마. 이 기록만으로 학교 승인이나 앱 전체의 안전을 보장한다고 쓰지 마.","next":"기록을 자신의 프로젝트에 보관하고 필요한 다음 활동을 선택합니다. 새로운 대화를 시작할 때는 이 기록과 공통 시작 프롬프트를 함께 제공합니다."}]},{"id":37,"title":"배포 전 자기점검과 발표 준비","group":"마지막 점검과 배포","slides":"70","condition":"배포 여부를 판단하고 자신의 점검 내용을 설명할 때","inputs":"활동별 확인 기록, 실제 배포 주소, 문서 링크, 해결하지 못한 항목","inspect":["내 앱에 해당하는 활동과 해당 없는 활동을 근거와 함께 정리해 줘.","공통 보안·학생 수업 운영·문서·학교 제출·배포 결과 중 빠진 영역을 찾아 줘.","완료 표시와 실제 재시험 근거가 일치하는지 확인해 줘.","실제 학생 사용 전에 해결해야 할 문제와 사용 중 관리할 항목을 구분해 줘."],"requirements":["현재 상태를 사용 가능·조건을 정해 사용·수정 후 재확인·판단 보류로 나누되 근거와 결정할 사람을 함께 적어 줘.","내 앱에서 확인한 문제 하나와 수정·재시험 과정을 설명할 짧은 발표 메모를 만들어 줘.","실제로 적용하고 확인한 활동만 완료한 것으로 적고, 나중에 확인할 활동은 별도로 정리해 줘.","가상 자료 화면과 링크를 사용하고 학생 정보·키·내부 관리 주소를 공개 발표 자료에 넣지 마."],"tests":["발표에 쓰는 캡처가 설명하는 기능과 실제로 맞는지 확인해 줘.","링크가 최신 배포본과 문서로 연결되는지 확인해 줘.","미확인 고위험 항목을 안전으로 표시하지 않았는지 확인해 줘.","다음 점검 때 다시 사용할 항목별 기록과 재시험 순서를 정리해 줘."],"location":"자가점검표와 실제 앱을 함께 확인합니다. 필요한 체험 활동만 다시 선택해 확인하며, 모든 활동을 순서대로 수행할 필요는 없습니다.","links":["https://webapp-security-lab.vercel.app/#/checklist"],"branches":[["아직 배포하기 어려운 경우","막연히 미완성이라고 쓰지 말고 사용을 미룰 구체적 이유·수정 항목·재시험 방법을 정리해 줘."],["필요한 일부 활동만 수행한 경우","수행한 범위 안에서만 결과를 설명해 줘. 나머지는 해당 없음 또는 미확인으로 나누고 완료하지 않은 항목을 완료로 처리하지 마."]],"prompts":[{"id":"a37-inspect","category":"기본 진행","title":"1 현재 상태부터 확인하기","when":"프로젝트를 연 뒤 처음 보냅니다. 파일을 고치기 전 단계입니다.","text":"활동: 배포 전 자기점검과 발표 준비\n앱 이름과 프로젝트: [입력]\n이번 시험 주소: [입력]\n준비 정보: 활동별 확인 기록, 실제 배포 주소, 문서 링크, 해결하지 못한 항목\n현재 상황: [입력]\n사용할 가상 자료: [입력]\n\n이 활동에 해당하는지부터 확인해 줘. 아직 파일이나 설정은 수정하지 마.\n1. 내 앱에 해당하는 활동과 해당 없는 활동을 근거와 함께 정리해 줘.\n2. 공통 보안·학생 수업 운영·문서·학교 제출·배포 결과 중 빠진 영역을 찾아 줘.\n3. 완료 표시와 실제 재시험 근거가 일치하는지 확인해 줘.\n4. 실제 학생 사용 전에 해결해야 할 문제와 사용 중 관리할 항목을 구분해 줘.\n\n결과는 표로 정리해 줘. 표에는 확인 항목, 현재 동작, 근거가 있는 파일이나 설정 위치, 발견한 문제와 추가로 확인할 내용을 적어 줘. 코드에서 확인한 사실과 추정은 구분해 줘. 내가 직접 확인할 메뉴·버튼·파일 이름도 알려 줘. 파일을 읽지 못했다면 그 사실을 표시해 줘.\n실제 학생 정보·비밀키·인증 토큰은 출력하지 말고 필요한 값은 가려 줘. 내 앱 또는 허락받은 시험 환경만 대상으로 해 줘.\n참고할 확인 위치: 자가점검표와 실제 앱을 함께 확인합니다. 필요한 체험 활동만 다시 선택해 확인하며, 모든 활동을 순서대로 수행할 필요는 없습니다.","next":"현재 구조와 해당 여부를 확인합니다. 모르는 정보는 먼저 확인하고, 수정이 필요하면 2번으로 진행합니다."},{"id":"a37-plan","category":"기본 진행","title":"2 수정 방법과 범위 정하기","when":"1번 답변에서 실제로 고칠 항목을 골랐을 때 보냅니다.","text":"활동: 배포 전 자기점검과 발표 준비\n앱 이름과 프로젝트: [입력]\n이번 시험 주소: [입력]\n준비 정보: 활동별 확인 기록, 실제 배포 주소, 문서 링크, 해결하지 못한 항목\n현재 상황: [입력]\n사용할 가상 자료: [입력]\n앞에서 확인한 문제와 근거: [1번 결과 중 해당 부분을 붙이기]\n이번에 고칠 항목: [입력]\n\n구현 전에 다음 조건으로 수정 계획을 만들어 줘.\n1. 현재 상태를 사용 가능·조건을 정해 사용·수정 후 재확인·판단 보류로 나누되 근거와 결정할 사람을 함께 적어 줘.\n2. 내 앱에서 확인한 문제 하나와 수정·재시험 과정을 설명할 짧은 발표 메모를 만들어 줘.\n3. 실제로 적용하고 확인한 활동만 완료한 것으로 적고, 나중에 확인할 활동은 별도로 정리해 줘.\n4. 가상 자료 화면과 링크를 사용하고 학생 정보·키·내부 관리 주소를 공개 발표 자료에 넣지 마.\n\n기존 기능을 유지하면서 문제를 고칠 방법부터 제안해 줘. 방법이 여러 가지라면 필요한 서비스와 비용, 사용 방법이 달라지는 부분, 이전 상태로 되돌릴 방법을 비교해 줘. 반드시 고쳐야 할 부분과 선택해서 개선할 부분을 구분해 줘.\n변경할 파일, 학생 또는 교사 화면에서 달라질 부분, 필요한 관리 설정, 시험할 가상 입력을 순서대로 적어 줘. 서버가 없는 앱이라면 지금 할 수 있는 것과 서버가 필요한 것을 분리해 줘.\n아직 코드를 수정하거나 서비스를 만들지 마. 내가 결정해야 할 사항이 있으면 선택지와 차이를 설명하고 물어봐 줘.","next":"수정할 내용과 비용, 정보 수집·전송·보관 방식이 달라지는지 확인한 뒤 진행할 방법을 정합니다. 학교가 판단해야 하는 내용은 먼저 확인합니다."},{"id":"a37-implement","category":"기본 진행","title":"3 선택한 범위 구현하기","when":"수정 계획을 검토한 뒤 승인할 범위를 직접 적고 보냅니다.","text":"활동: 배포 전 자기점검과 발표 준비\n앱 이름과 프로젝트: [입력]\n이번 시험 주소: [입력]\n준비 정보: 활동별 확인 기록, 실제 배포 주소, 문서 링크, 해결하지 못한 항목\n현재 상황: [입력]\n사용할 가상 자료: [입력]\n승인한 수정안: [선택한 방법과 항목을 정확히 입력]\n수정할 파일 또는 기능 범위: [입력]\n이번에 제외할 것: [입력]\n\n위에 승인한 범위만 구현해 줘. 시작 전에 현재 변경 파일을 확인해 다른 작업을 보존해 줘.\n1. 현재 상태를 사용 가능·조건을 정해 사용·수정 후 재확인·판단 보류로 나누되 근거와 결정할 사람을 함께 적어 줘.\n2. 내 앱에서 확인한 문제 하나와 수정·재시험 과정을 설명할 짧은 발표 메모를 만들어 줘.\n3. 실제로 적용하고 확인한 활동만 완료한 것으로 적고, 나중에 확인할 활동은 별도로 정리해 줘.\n4. 가상 자료 화면과 링크를 사용하고 학생 정보·키·내부 관리 주소를 공개 발표 자료에 넣지 마.\n\n한 부분씩 수정하고 실행 결과를 확인해 줘. 기존 디자인과 정상 기능은 유지해 줘. 새 서비스 생성·운영 자료 삭제·유료 호출·커밋·푸시·배포는 이 요청에 구체적으로 승인한 경우에만 실행해 줘. 요청하지 않은 변경이 필요하면 진행 전에 이유를 설명해 줘.\n수정 후 바꾼 파일과 이유, 실행한 검사, 아직 하지 못한 시험, 내가 누를 버튼 순서를 적어 줘. 실제 학생 정보·비밀키·인증 토큰은 출력하지 말고 필요한 값은 가려 줘. 내 앱 또는 허락받은 시험 환경만 대상으로 해 줘.","next":"빌드나 실행 오류가 없는지 확인한 뒤 4번으로 진행합니다. 허용해야 할 동작은 정상적으로 되고, 차단해야 할 동작은 막히는지 함께 시험합니다."},{"id":"a37-verify","category":"기본 진행","title":"4 수정 결과 직접 확인하기","when":"구현이 끝났거나 기존 기능이 안전하게 동작하는지 검증할 때 보냅니다.","text":"활동: 배포 전 자기점검과 발표 준비\n앱 이름과 프로젝트: [입력]\n이번 시험 주소: [입력]\n준비 정보: 활동별 확인 기록, 실제 배포 주소, 문서 링크, 해결하지 못한 항목\n현재 상황: [입력]\n사용할 가상 자료: [입력]\n이번 수정 내용: [입력 또는 기존 기능 검증]\n시험할 버전과 주소: [입력]\n\n다음 조건을 가상 자료로 다시 시험해 줘.\n1. 발표에 쓰는 캡처가 설명하는 기능과 실제로 맞는지 확인해 줘.\n2. 링크가 최신 배포본과 문서로 연결되는지 확인해 줘.\n3. 미확인 고위험 항목을 안전으로 표시하지 않았는지 확인해 줘.\n4. 다음 점검 때 다시 사용할 항목별 기록과 재시험 순서를 정리해 줘.\n\n내가 직접 따라 할 수 있도록 준비 계정과 상태 → 클릭 또는 입력 → 확인할 실제 탭·요청·필드 → 기대 결과를 항목마다 적어 줘.\n확인할 위치: 자가점검표와 실제 앱을 함께 확인합니다. 필요한 체험 활동만 다시 선택해 확인하며, 모든 활동을 순서대로 수행할 필요는 없습니다.\n자기 앱에서 이름이 다르면 코드와 실제 요청에서 맞는 이름을 찾아 줘. 실제로 존재하는지 확인하지 않은 요청명을 만들어 내지 마.\n허용해야 할 동작과 차단해야 할 동작을 함께 시험해 줘. 항목마다 실행 여부, 실제 결과, 확인한 화면이나 기록을 적고, 시험하지 못했다면 이유를 설명해 줘. 응답 코드와 실제로 받은 자료를 함께 확인하고, 저장 기능이 있다면 저장된 결과도 확인해 줘.\n이 활동을 완료해도 앱 전체의 안전이 보장된다고 표현하지 마. 실제 학생 정보·비밀키·인증 토큰은 출력하지 말고 필요한 값은 가려 줘. 내 앱 또는 허락받은 시험 환경만 대상으로 해 줘.","next":"기대 결과와 실제 결과가 같으면 활동 기록을 정리합니다. 다르면 “오류 해결” 프롬프트를 사용하고 같은 조건으로 재시험합니다."},{"id":"a37-branch1","category":"상황별 진행","title":"아직 배포하기 어려운 경우","when":"기본 순서로 진행하다가 이 상황에 해당하면 사용합니다.","text":"활동: 배포 전 자기점검과 발표 준비\n앱 이름과 프로젝트: [입력]\n이번 시험 주소: [입력]\n준비 정보: 활동별 확인 기록, 실제 배포 주소, 문서 링크, 해결하지 못한 항목\n현재 상황: [입력]\n사용할 가상 자료: [입력]\n현재 겪는 상황: 아직 배포하기 어려운 경우\n이미 한 행동과 나온 결과: [입력]\n\n막연히 미완성이라고 쓰지 말고 사용을 미룰 구체적 이유·수정 항목·재시험 방법을 정리해 줘.\n먼저 관련 코드·화면·설정에서 현재 상태를 확인하고 이 상황이 생긴 이유를 근거와 함께 설명해 줘. 현재 환경에서 확인할 수 없는 것은 따로 표시해 줘.\n이 활동에서 유지할 조건:\n1. 현재 상태를 사용 가능·조건을 정해 사용·수정 후 재확인·판단 보류로 나누되 근거와 결정할 사람을 함께 적어 줘.\n2. 내 앱에서 확인한 문제 하나와 수정·재시험 과정을 설명할 짧은 발표 메모를 만들어 줘.\n3. 실제로 적용하고 확인한 활동만 완료한 것으로 적고, 나중에 확인할 활동은 별도로 정리해 줘.\n\n진행 순서를 “지금 확인할 것 → 선택 가능한 방법 → 내가 승인할 변경 → 실행 후 다시 확인할 결과”로 정리해 줘. 앱에 필요 없는 기능을 추가하거나 검사를 끄는 방식으로 해결하지 마.\n재시험에서는 다음 조건을 포함해 줘:\n1. 발표에 쓰는 캡처가 설명하는 기능과 실제로 맞는지 확인해 줘.\n2. 링크가 최신 배포본과 문서로 연결되는지 확인해 줘.\n수정이 필요하면 먼저 범위를 제안하고 내 확인 전 운영 설정을 바꾸지 마. 실제 학생 정보·비밀키·인증 토큰은 출력하지 말고 필요한 값은 가려 줘. 내 앱 또는 허락받은 시험 환경만 대상으로 해 줘.","next":"이 상황에 맞는 방법을 선택한 뒤 기본 진행의 구현 또는 재시험 단계로 돌아갑니다. 해당 없음이면 이유를 기록하고 다른 활동을 고릅니다."},{"id":"a37-branch2","category":"상황별 진행","title":"필요한 일부 활동만 수행한 경우","when":"기본 순서로 진행하다가 이 상황에 해당하면 사용합니다.","text":"활동: 배포 전 자기점검과 발표 준비\n앱 이름과 프로젝트: [입력]\n이번 시험 주소: [입력]\n준비 정보: 활동별 확인 기록, 실제 배포 주소, 문서 링크, 해결하지 못한 항목\n현재 상황: [입력]\n사용할 가상 자료: [입력]\n현재 겪는 상황: 필요한 일부 활동만 수행한 경우\n이미 한 행동과 나온 결과: [입력]\n\n수행한 범위 안에서만 결과를 설명해 줘. 나머지는 해당 없음 또는 미확인으로 나누고 완료하지 않은 항목을 완료로 처리하지 마.\n먼저 관련 코드·화면·설정에서 현재 상태를 확인하고 이 상황이 생긴 이유를 근거와 함께 설명해 줘. 현재 환경에서 확인할 수 없는 것은 따로 표시해 줘.\n이 활동에서 유지할 조건:\n1. 현재 상태를 사용 가능·조건을 정해 사용·수정 후 재확인·판단 보류로 나누되 근거와 결정할 사람을 함께 적어 줘.\n2. 내 앱에서 확인한 문제 하나와 수정·재시험 과정을 설명할 짧은 발표 메모를 만들어 줘.\n3. 실제로 적용하고 확인한 활동만 완료한 것으로 적고, 나중에 확인할 활동은 별도로 정리해 줘.\n\n진행 순서를 “지금 확인할 것 → 선택 가능한 방법 → 내가 승인할 변경 → 실행 후 다시 확인할 결과”로 정리해 줘. 앱에 필요 없는 기능을 추가하거나 검사를 끄는 방식으로 해결하지 마.\n재시험에서는 다음 조건을 포함해 줘:\n1. 발표에 쓰는 캡처가 설명하는 기능과 실제로 맞는지 확인해 줘.\n2. 링크가 최신 배포본과 문서로 연결되는지 확인해 줘.\n수정이 필요하면 먼저 범위를 제안하고 내 확인 전 운영 설정을 바꾸지 마. 실제 학생 정보·비밀키·인증 토큰은 출력하지 말고 필요한 값은 가려 줘. 내 앱 또는 허락받은 시험 환경만 대상으로 해 줘.","next":"이 상황에 맞는 방법을 선택한 뒤 기본 진행의 구현 또는 재시험 단계로 돌아갑니다. 해당 없음이면 이유를 기록하고 다른 활동을 고릅니다."},{"id":"a37-locate","category":"확인 위치 도움","title":"안내된 화면이나 요청을 찾지 못할 때","when":"F12에 설명한 파일·요청이 없거나 확인할 곳을 모르겠을 때 보냅니다.","text":"활동: 배포 전 자기점검과 발표 준비\n앱 이름과 프로젝트: [입력]\n이번 시험 주소: [입력]\n준비 정보: 활동별 확인 기록, 실제 배포 주소, 문서 링크, 해결하지 못한 항목\n현재 상황: [입력]\n사용할 가상 자료: [입력]\n내가 보고 있는 주소와 창: [입력]\n누른 버튼 또는 실행한 동작: [입력]\n열어 둔 개발자 도구 탭과 필터: [입력 또는 모름]\n찾으려는 정보: [입력]\n현재 화면 또는 가린 오류 내용: [붙이기]\n\n참고 안내: 자가점검표와 실제 앱을 함께 확인합니다. 필요한 체험 활동만 다시 선택해 확인하며, 모든 활동을 순서대로 수행할 필요는 없습니다.\n이 안내가 체험 앱의 가상 자료인지 내 앱의 실제 동작인지 먼저 구분해 줘. 프로젝트에서 이 동작이 어떤 요청·파일·저장소로 연결되는지 찾아 줘.\nNetwork라면 동작 전에 열기, 기록 켜기, 목록 지우기, 필터 확인, 같은 동작 다시 하기, 새 요청 선택, Headers·Payload·Response 중 볼 위치를 실제 이름으로 알려 줘. 정적 파일이면 All 필터도 확인해 줘. 새 창을 열었다면 그 창에서 F12를 열어야 하는지 설명해 줘.\n브라우저 검사에서 막아 요청이 없거나 아직 동작을 실행하지 않은 경우도 구분해 줘. 서버에만 있는 정보는 F12에서 찾으라고 하지 말고 코드·관리 화면·시험 환경에서 확인할 방법을 제시해 줘.\n확인할 자료가 실제로 없으면 없다고 말하고 필요한 시험 준비를 설명해 줘. 캡처 요청에는 가려야 할 정보도 알려 줘. 실제 학생 정보·비밀키·인증 토큰은 출력하지 말고 필요한 값은 가려 줘. 내 앱 또는 허락받은 시험 환경만 대상으로 해 줘.","next":"정확한 위치를 찾은 뒤 해당 활동의 4번 프롬프트로 결과를 확인합니다. 없다는 사실 자체가 기대 결과인지 먼저 판단합니다."},{"id":"a37-error","category":"오류 해결","title":"예상과 다른 결과가 나올 때","when":"실행 오류, 정상 기능 실패, 예상한 차단이 되지 않는 경우에 보냅니다.","text":"활동: 배포 전 자기점검과 발표 준비\n앱 이름과 프로젝트: [입력]\n이번 시험 주소: [입력]\n준비 정보: 활동별 확인 기록, 실제 배포 주소, 문서 링크, 해결하지 못한 항목\n현재 상황: [입력]\n사용할 가상 자료: [입력]\n실행한 단계와 입력: [입력]\n기대한 결과: [입력]\n실제로 나온 결과: [입력]\n오류 문구: [비밀값을 가리고 붙이기]\n직전에 변경한 파일 또는 설정: [입력 또는 모름]\n\n원인을 추측해서 여러 곳을 한꺼번에 바꾸지 말고, 재현 조건과 현재 코드를 비교해 줘. 요청이 만들어지는지, 서버에 도착하는지, 검사와 반환·저장이 어디서 달라지는지 관련 단계만 확인해 줘.\n특히 다음 점검 기준을 다시 봐 줘:\n1. 내 앱에 해당하는 활동과 해당 없는 활동을 근거와 함께 정리해 줘.\n2. 공통 보안·학생 수업 운영·문서·학교 제출·배포 결과 중 빠진 영역을 찾아 줘.\n\n가능한 원인마다 그렇게 판단한 이유와 먼저 확인할 방법을 알려 줘. 운영 자료를 삭제하거나 권한·입력 검사를 전체 해제하는 방식은 사용하지 마. 수정이 필요하면 바꿀 내용을 먼저 제안하고 내가 승인한 뒤 적용해 줘.\n수정 후 같은 실패 조건과 다음 정상 조건을 모두 재시험해 줘:\n1. 발표에 쓰는 캡처가 설명하는 기능과 실제로 맞는지 확인해 줘.\n2. 링크가 최신 배포본과 문서로 연결되는지 확인해 줘.\n3. 미확인 고위험 항목을 안전으로 표시하지 않았는지 확인해 줘.\n4. 다음 점검 때 다시 사용할 항목별 기록과 재시험 순서를 정리해 줘.\n완료 보고에는 실제 실행한 결과와 실행하지 못한 이유를 구분해 줘.","next":"실패 원인을 확인하고 승인한 수정만 적용합니다. 같은 실패 조건이 해결됐는지와 원래 정상 기능이 유지되는지 함께 봅니다."},{"id":"a37-finish","category":"활동 마무리","title":"확인 기록과 다음 점검 정리하기","when":"직접 시험을 확인한 뒤, 또는 해당 없음·추가 확인으로 종료할 때 보냅니다.","text":"활동: 배포 전 자기점검과 발표 준비\n앱 이름과 프로젝트: [입력]\n이번 시험 주소: [입력]\n준비 정보: 활동별 확인 기록, 실제 배포 주소, 문서 링크, 해결하지 못한 항목\n현재 상황: [입력]\n사용할 가상 자료: [입력]\n실제로 진행한 단계: [입력]\n확인한 결과 또는 아직 확인하지 못한 내용: [입력]\n\n이번 활동 기록을 Markdown으로 정리해 줘. 항목은 앱과 시험 버전, 점검한 기능, 발견한 문제와 위치, 승인한 수정, 시험 입력과 기대 결과, 실제 결과와 근거, 추가 확인할 일로 구성해 줘.\n앞으로 개발할 때 지킬 기준도 우리 앱의 실제 코드·설정 위치와 연결해 적어 줘:\n1. 현재 상태를 사용 가능·조건을 정해 사용·수정 후 재확인·판단 보류로 나누되 근거와 결정할 사람을 함께 적어 줘.\n2. 내 앱에서 확인한 문제 하나와 수정·재시험 과정을 설명할 짧은 발표 메모를 만들어 줘.\n3. 실제로 적용하고 확인한 활동만 완료한 것으로 적고, 나중에 확인할 활동은 별도로 정리해 줘.\n4. 가상 자료 화면과 링크를 사용하고 학생 정보·키·내부 관리 주소를 공개 발표 자료에 넣지 마.\n\n활동 상태는 확인 완료·추가 확인·해당 없음 중 근거에 맞게 적어 줘. 구현만 하고 시험하지 않았다면 확인 완료로 쓰지 마. 문제를 발견하지 못한 것과 충분히 검증한 것을 구분해 줘.\n다음 수정 때 다시 실행할 시험은 다음 내용을 바탕으로 정리해 줘:\n1. 발표에 쓰는 캡처가 설명하는 기능과 실제로 맞는지 확인해 줘.\n2. 링크가 최신 배포본과 문서로 연결되는지 확인해 줘.\n보고서에 원문 학생 자료나 비밀값을 넣지 마. 이 기록만으로 학교 승인이나 앱 전체의 안전을 보장한다고 쓰지 마.","next":"기록을 자신의 프로젝트에 보관하고 필요한 다음 활동을 선택합니다. 새로운 대화를 시작할 때는 이 기록과 공통 시작 프롬프트를 함께 제공합니다."}]},{"id":38,"title":"수업 종료와 재개 기능 확인","group":"사용 종료와 서비스 정리","slides":"71~72","condition":"앱 전체는 계속 운영하면서 특정 수업의 새 참여·제출·AI 요청만 끝내려는 경우","inputs":"대상 수업, 교사 권한, 미제출 입력 처리, 진행 중 요청 처리, 기존 기록 조회 범위, 가상 계정","inspect":["대상 수업의 상태를 저장하는 위치와 참여·제출·AI 요청을 처리하는 서버 경로를 찾아 줘. 종료 기능이 이미 있는지부터 확인해 줘.","교사가 종료할 때 새 요청과 이미 처리 중인 요청, 학생 창의 미제출 입력을 각각 어떻게 처리하는지 확인해 줘.","수업 종료와 앱 전체 중단을 구분하고, 다른 수업·기존 답안·교사 결과 조회에 미칠 영향을 설명해 줘.","종료·재개 권한을 서버에서 확인하는지 살펴봐 줘. 기능이 없다는 사실만으로 취약점이나 필수 조치라고 단정하지 마."],"requirements":["종료할 수업과 안내 문구, 미제출 입력의 보존·폐기, 진행 중 요청의 완료·취소 중 내가 선택할 내용을 먼저 물어봐 줘.","기존 종료 기능이 충분하면 유지해 줘. 기능이 없고 내가 추가를 선택했을 때만 최소 수정안을 구현해 줘.","종료 상태를 서버에서 검사해 새 참여·제출·AI 요청을 막고, 이미 열린 창과 화면을 거치지 않는 요청도 검사해 줘.","담당 교사만 종료·재개할 수 있게 하고 기존 기록과 다른 수업은 유지해 줘. 이미 시작한 외부 호출의 취소 가능 여부와 발생 비용은 별도 확인해 줘."],"tests":["가상 교사와 학생으로 종료 전 정상 제출, 종료 후 새 참여·제출·AI 요청 거부, 재개 후 정상 제출을 비교해 줘.","종료 전에 열어 둔 학생 창과 시험용 직접 요청도 확인하고 응답 문구뿐 아니라 실제 기록 추가와 서버 처리 여부를 확인해 줘.","다른 교사의 종료·재개 요청은 거부되는지, 다른 수업과 기존 결과 조회는 정상인지 확인해 줘.","외부 AI는 모의 호출 횟수로 우선 시험하고 실제 외부 호출 여부를 확인하지 못했다면 미확인으로 적어 줘."],"location":"가상 학생 창에서 F12 → Network → Fetch/XHR을 연 뒤 제출합니다. 방금 생긴 실제 요청의 Headers와 Response를 비교합니다. 교사 창에서 대상 수업을 종료한 뒤 기존 학생 창에서 다시 제출합니다. 기록 추가와 외부 AI 호출 여부는 서버·저장소·호출 기록에서 따로 확인합니다. 버튼이 사라져도 서버 차단이 확인된 것은 아닙니다.","links":[],"branches":[["종료 기능이 없는 경우","필요한 운영 방식부터 확인하고 내가 기능 추가를 선택하면 설계해 줘. 전체 서비스를 닫는 목적이면 활동 39 또는 40으로 안내해 줘."],["이미 열려 있던 창에서는 계속 제출되는 경우","클라이언트의 오래된 상태와 서버의 현재 상태를 비교해 줘. 새 요청 처리 시 종료 상태를 검사하는지 확인하고 가상 요청으로 재시험할 최소 수정안을 제시해 줘."],["작성 중인 답안이나 진행 중 AI 요청이 있는 경우","저장 전 입력과 이미 서버가 받은 작업을 구분해 줘. 유실 방지와 종료 시점 중 선택할 정책을 물어봐 줘. 진행 중 외부 호출을 취소했다고 근거 없이 보고하지 마."],["교사가 다시 수업을 열어야 하는 경우","재개 권한과 대상 수업을 확인하고 가상 환경에서 재개 후 정상 제출을 시험해 줘. 전체 서버·구독을 다시 켜는 작업으로 확대하지 마."]],"prompts":[{"id":"a38-inspect","category":"기본 진행","title":"1 현재 상태부터 확인하기","when":"프로젝트를 연 뒤 처음 보냅니다. 파일을 고치기 전 단계입니다.","text":"활동: 수업 종료와 재개 기능 확인\n앱 이름과 프로젝트: [입력]\n이번 시험 주소: [입력]\n준비 정보: 대상 수업, 교사 권한, 미제출 입력 처리, 진행 중 요청 처리, 기존 기록 조회 범위, 가상 계정\n현재 상황: [입력]\n사용할 가상 자료: [입력]\n\n이 활동에 해당하는지부터 확인해 줘. 아직 파일이나 설정은 수정하지 마.\n1. 대상 수업의 상태를 저장하는 위치와 참여·제출·AI 요청을 처리하는 서버 경로를 찾아 줘. 종료 기능이 이미 있는지부터 확인해 줘.\n2. 교사가 종료할 때 새 요청과 이미 처리 중인 요청, 학생 창의 미제출 입력을 각각 어떻게 처리하는지 확인해 줘.\n3. 수업 종료와 앱 전체 중단을 구분하고, 다른 수업·기존 답안·교사 결과 조회에 미칠 영향을 설명해 줘.\n4. 종료·재개 권한을 서버에서 확인하는지 살펴봐 줘. 기능이 없다는 사실만으로 취약점이나 필수 조치라고 단정하지 마.\n\n결과는 표로 정리해 줘. 표에는 확인 항목, 현재 동작, 근거가 있는 파일이나 설정 위치, 발견한 문제와 추가로 확인할 내용을 적어 줘. 코드에서 확인한 사실과 추정은 구분해 줘. 내가 직접 확인할 메뉴·버튼·파일 이름도 알려 줘. 파일을 읽지 못했다면 그 사실을 표시해 줘.\n실제 학생 정보·비밀키·인증 토큰은 출력하지 말고 필요한 값은 가려 줘. 내 앱 또는 허락받은 시험 환경만 대상으로 해 줘.\n참고할 확인 위치: 가상 학생 창에서 F12 → Network → Fetch/XHR을 연 뒤 제출합니다. 방금 생긴 실제 요청의 Headers와 Response를 비교합니다. 교사 창에서 대상 수업을 종료한 뒤 기존 학생 창에서 다시 제출합니다. 기록 추가와 외부 AI 호출 여부는 서버·저장소·호출 기록에서 따로 확인합니다. 버튼이 사라져도 서버 차단이 확인된 것은 아닙니다.","next":"현재 구조와 해당 여부를 확인합니다. 모르는 정보는 먼저 확인하고, 수정이 필요하면 2번으로 진행합니다."},{"id":"a38-plan","category":"기본 진행","title":"2 수정 방법과 범위 정하기","when":"1번 답변에서 실제로 고칠 항목을 골랐을 때 보냅니다.","text":"활동: 수업 종료와 재개 기능 확인\n앱 이름과 프로젝트: [입력]\n이번 시험 주소: [입력]\n준비 정보: 대상 수업, 교사 권한, 미제출 입력 처리, 진행 중 요청 처리, 기존 기록 조회 범위, 가상 계정\n현재 상황: [입력]\n사용할 가상 자료: [입력]\n앞에서 확인한 문제와 근거: [1번 결과 중 해당 부분을 붙이기]\n이번에 고칠 항목: [입력]\n\n구현 전에 다음 조건으로 수정 계획을 만들어 줘.\n1. 종료할 수업과 안내 문구, 미제출 입력의 보존·폐기, 진행 중 요청의 완료·취소 중 내가 선택할 내용을 먼저 물어봐 줘.\n2. 기존 종료 기능이 충분하면 유지해 줘. 기능이 없고 내가 추가를 선택했을 때만 최소 수정안을 구현해 줘.\n3. 종료 상태를 서버에서 검사해 새 참여·제출·AI 요청을 막고, 이미 열린 창과 화면을 거치지 않는 요청도 검사해 줘.\n4. 담당 교사만 종료·재개할 수 있게 하고 기존 기록과 다른 수업은 유지해 줘. 이미 시작한 외부 호출의 취소 가능 여부와 발생 비용은 별도 확인해 줘.\n\n기존 기능을 유지하면서 문제를 고칠 방법부터 제안해 줘. 방법이 여러 가지라면 필요한 서비스와 비용, 사용 방법이 달라지는 부분, 이전 상태로 되돌릴 방법을 비교해 줘. 반드시 고쳐야 할 부분과 선택해서 개선할 부분을 구분해 줘.\n변경할 파일, 학생 또는 교사 화면에서 달라질 부분, 필요한 관리 설정, 시험할 가상 입력을 순서대로 적어 줘. 서버가 없는 앱이라면 지금 할 수 있는 것과 서버가 필요한 것을 분리해 줘.\n아직 코드를 수정하거나 서비스를 만들지 마. 내가 결정해야 할 사항이 있으면 선택지와 차이를 설명하고 물어봐 줘.","next":"수정할 내용과 비용, 정보 수집·전송·보관 방식이 달라지는지 확인한 뒤 진행할 방법을 정합니다. 학교가 판단해야 하는 내용은 먼저 확인합니다."},{"id":"a38-implement","category":"기본 진행","title":"3 선택한 범위 구현하기","when":"수정 계획을 검토한 뒤 승인할 범위를 직접 적고 보냅니다.","text":"활동: 수업 종료와 재개 기능 확인\n앱 이름과 프로젝트: [입력]\n이번 시험 주소: [입력]\n준비 정보: 대상 수업, 교사 권한, 미제출 입력 처리, 진행 중 요청 처리, 기존 기록 조회 범위, 가상 계정\n현재 상황: [입력]\n사용할 가상 자료: [입력]\n승인한 수정안: [선택한 방법과 항목을 정확히 입력]\n수정할 파일 또는 기능 범위: [입력]\n이번에 제외할 것: [입력]\n\n위에 승인한 범위만 구현해 줘. 시작 전에 현재 변경 파일을 확인해 다른 작업을 보존해 줘.\n1. 종료할 수업과 안내 문구, 미제출 입력의 보존·폐기, 진행 중 요청의 완료·취소 중 내가 선택할 내용을 먼저 물어봐 줘.\n2. 기존 종료 기능이 충분하면 유지해 줘. 기능이 없고 내가 추가를 선택했을 때만 최소 수정안을 구현해 줘.\n3. 종료 상태를 서버에서 검사해 새 참여·제출·AI 요청을 막고, 이미 열린 창과 화면을 거치지 않는 요청도 검사해 줘.\n4. 담당 교사만 종료·재개할 수 있게 하고 기존 기록과 다른 수업은 유지해 줘. 이미 시작한 외부 호출의 취소 가능 여부와 발생 비용은 별도 확인해 줘.\n\n한 부분씩 수정하고 실행 결과를 확인해 줘. 기존 디자인과 정상 기능은 유지해 줘. 새 서비스 생성·운영 자료 삭제·유료 호출·커밋·푸시·배포는 이 요청에 구체적으로 승인한 경우에만 실행해 줘. 요청하지 않은 변경이 필요하면 진행 전에 이유를 설명해 줘.\n수정 후 바꾼 파일과 이유, 실행한 검사, 아직 하지 못한 시험, 내가 누를 버튼 순서를 적어 줘. 실제 학생 정보·비밀키·인증 토큰은 출력하지 말고 필요한 값은 가려 줘. 내 앱 또는 허락받은 시험 환경만 대상으로 해 줘.","next":"빌드나 실행 오류가 없는지 확인한 뒤 4번으로 진행합니다. 허용해야 할 동작은 정상적으로 되고, 차단해야 할 동작은 막히는지 함께 시험합니다."},{"id":"a38-verify","category":"기본 진행","title":"4 수정 결과 직접 확인하기","when":"구현이 끝났거나 기존 기능이 안전하게 동작하는지 검증할 때 보냅니다.","text":"활동: 수업 종료와 재개 기능 확인\n앱 이름과 프로젝트: [입력]\n이번 시험 주소: [입력]\n준비 정보: 대상 수업, 교사 권한, 미제출 입력 처리, 진행 중 요청 처리, 기존 기록 조회 범위, 가상 계정\n현재 상황: [입력]\n사용할 가상 자료: [입력]\n이번 수정 내용: [입력 또는 기존 기능 검증]\n시험할 버전과 주소: [입력]\n\n다음 조건을 가상 자료로 다시 시험해 줘.\n1. 가상 교사와 학생으로 종료 전 정상 제출, 종료 후 새 참여·제출·AI 요청 거부, 재개 후 정상 제출을 비교해 줘.\n2. 종료 전에 열어 둔 학생 창과 시험용 직접 요청도 확인하고 응답 문구뿐 아니라 실제 기록 추가와 서버 처리 여부를 확인해 줘.\n3. 다른 교사의 종료·재개 요청은 거부되는지, 다른 수업과 기존 결과 조회는 정상인지 확인해 줘.\n4. 외부 AI는 모의 호출 횟수로 우선 시험하고 실제 외부 호출 여부를 확인하지 못했다면 미확인으로 적어 줘.\n\n내가 직접 따라 할 수 있도록 준비 계정과 상태 → 클릭 또는 입력 → 확인할 실제 탭·요청·필드 → 기대 결과를 항목마다 적어 줘.\n확인할 위치: 가상 학생 창에서 F12 → Network → Fetch/XHR을 연 뒤 제출합니다. 방금 생긴 실제 요청의 Headers와 Response를 비교합니다. 교사 창에서 대상 수업을 종료한 뒤 기존 학생 창에서 다시 제출합니다. 기록 추가와 외부 AI 호출 여부는 서버·저장소·호출 기록에서 따로 확인합니다. 버튼이 사라져도 서버 차단이 확인된 것은 아닙니다.\n자기 앱에서 이름이 다르면 코드와 실제 요청에서 맞는 이름을 찾아 줘. 실제로 존재하는지 확인하지 않은 요청명을 만들어 내지 마.\n허용해야 할 동작과 차단해야 할 동작을 함께 시험해 줘. 항목마다 실행 여부, 실제 결과, 확인한 화면이나 기록을 적고, 시험하지 못했다면 이유를 설명해 줘. 응답 코드와 실제로 받은 자료를 함께 확인하고, 저장 기능이 있다면 저장된 결과도 확인해 줘.\n이 활동을 완료 밀키·인증 토큰은 출력하지 말고 필요한 값은 가려 줘. 내 앱 또는 허락받은 시험 환경만 대상으로 해 줘.","next":"정확한 위치를 찾은 뒤 해당 활동의 4번 프롬프트로 결과를 확인합니다. 없다는 사실 자체가 기대 결과인지 먼저 판단합니다."},{"id":"a38-error","category":"오류 해결","title":"예상과 다른 결과가 나올 때","when":"실행 오류, 정상 기능 실패, 예상한 차단이 되지 않는 경우에 보냅니다.","text":"활동: 수업 종료와 재개 기능 확인\n앱 이름과 프로젝트: [입력]\n이번 시험 주소: [입력]\n준비 정보: 대상 수업, 교사 권한, 미제출 입력 처리, 진행 중 요청 처리, 기존 기록 조회 범위, 가상 계정\n현재 상황: [입력]\n사용할 가상 자료: [입력]\n실행한 단계와 입력: [입력]\n기대한 결과: [입력]\n실제로 나온 결과: [입력]\n오류 문구: [비밀값을 가리고 붙이기]\n직전에 변경한 파일 또는 설정: [입력 또는 모름]\n\n원인을 추측해서 여러 곳을 한꺼번에 바꾸지 말고, 재현 조건과 현재 코드를 비교해 줘. 요청이 만들어지는지, 서버에 도착하는지, 검사와 반환·저장이 어디서 달라지는지 관련 단계만 확인해 줘.\n특히 다음 점검 기준을 다시 봐 줘:\n1. 대상 수업의 상태를 저장하는 위치와 참여·제출·AI 요청을 처리하는 서버 경로를 찾아 줘. 종료 기능이 이미 있는지부터 확인해 줘.\n2. 교사가 종료할 때 새 요청과 이미 처리 중인 요청, 학생 창의 미제출 입력을 각각 어떻게 처리하는지 확인해 줘.\n\n가능한 원인마다 그렇게 판단한 이유와 먼저 확인할 방법을 알려 줘. 운영 자료를 삭제하거나 권한·입력 검사를 전체 해제하는 방식은 사용하지 마. 수정이 필요하면 바꿀 내용을 먼저 제안하고 내가 승인한 뒤 적용해 줘.\n수정 후 같은 실패 조건과 다음 정상 조건을 모두 재시험해 줘:\n1. 가상 교사와 학생으로 종료 전 정상 제출, 종료 후 새 참여·제출·AI 요청 거부, 재개 후 정상 제출을 비교해 줘.\n2. 종료 전에 열어 둔 학생 창과 시험용 직접 요청도 확인하고 응답 문구뿐 아니라 실제 기록 추가와 서버 처리 여부를 확인해 줘.\n3. 다른 교사의 종료·재개 요청은 거부되는지, 다른 수업과 기존 결과 조회는 정상인지 확인해 줘.\n4. 외부 AI는 모의 호출 횟수로 우선 시험하고 실제 외부 호출 여부를 확인하지 못했다면 미확인으로 적어 줘.\n완료 보고에는 실제 실행한 결과와 실행하지 못한 이유를 구분해 줘.","next":"실패 원인을 확인하고 승인한 수정만 적용합니다. 같은 실패 조건이 해결됐는지와 원래 정상 기능이 유지되는지 함께 봅니다."},{"id":"a38-finish","category":"활동 마무리","title":"확인 기록과 다음 점검 정리하기","when":"직접 시험을 확인한 뒤, 또는 해당 없음·추가 확인으로 종료할 때 보냅니다.","text":"활동: 수업 종료와 재개 기능 확인\n앱 이름과 프로젝트: [입력]\n이번 시험 주소: [입력]\n준비 정보: 대상 수업, 교사 권한, 미제출 입력 처리, 진행 중 요청 처리, 기존 기록 조회 범위, 가상 계정\n현재 상황: [입력]\n사용할 가상 자료: [입력]\n실제로 진행한 단계: [입력]\n확인한 결과 또는 아직 확인하지 못한 내용: [입력]\n\n이번 활동 기록을 Markdown으로 정리해 줘. 항목은 앱과 시험 버전, 점검한 기능, 발견한 문제와 위치, 승인한 수정, 시험 입력과 기대 결과, 실제 결과와 근거, 추가 확인할 일로 구성해 줘.\n앞으로 개발할 때 지킬 기준도 우리 앱의 실제 코드·설정 위치와 연결해 적어 줘:\n1. 종료할 수업과 안내 문구, 미제출 입력의 보존·폐기, 진행 중 요청의 완료·취소 중 내가 선택할 내용을 먼저 물어봐 줘.\n2. 기존 종료 기능이 충분하면 유지해 줘. 기능이 없고 내가 추가를 선택했을 때만 최소 수정안을 구현해 줘.\n3. 종료 상태를 서버에서 검사해 새 참여·제출·AI 요청을 막고, 이미 열린 창과 화면을 거치지 않는 요청도 검사해 줘.\n4. 담당 교사만 종료·재개할 수 있게 하고 기존 기록과 다른 수업은 유지해 줘. 이미 시작한 외부 호출의 취소 가능 여부와 발생 비용은 별도 확인해 줘.\n\n활동 상태는 확인 완료·추가 확인·해당 없음 중 근거에 맞게 적어 줘. 구현만 하고 시험하지 않았다면 확인 완료로 쓰지 마. 문제를 발견하지 못한 것과 충분히 검증한 것을 구분해 줘.\n다음 수정 때 다시 실행할 시험은 다음 내용을 바탕으로 정리해 줘:\n1. 가상 교사와 학생으로 종료 전 정상 제출, 종료 후 새 참여·제출·AI 요청 거부, 재개 후 정상 제출을 비교해 줘.\n2. 종료 전에 열어 둔 학생 창과 시험용 직접 요청도 확인하고 응답 문구뿐 아니라 실제 기록 추가와 서버 처리 여부를 확인해 줘.\n보고서에 원문 학생 자료나 비밀값을 넣지 마. 이 기록만으로 학교 승인이나 앱 전체의 안전을 보장한다고 쓰지 마.","next":"기록을 자신의 프로젝트에 보관하고 필요한 다음 활동을 선택합니다. 새로운 대화를 시작할 때는 이 기록과 공통 시작 프롬프트를 함께 제공합니다."}]},{"id":39,"title":"웹앱 서비스를 일시 중단하고 재개","group":"사용 종료와 서비스 정리","slides":"73~74","condition":"나중에 다시 쓸 가능성이 있어 자료와 복구 가능성을 유지하면서 서비스를 잠시 중단하려는 경우","inputs":"대상 팀·프로젝트·운영 주소, 중단 이유와 예정일, 재개 예정일, 보관할 자료, 연결 서비스, 승인 범위","inspect":["현재 팀·프로젝트·운영 주소와 미리보기 주소를 대조해 줘. 저장소를 지우거나 링크를 내리는 것과 실제 운영 중단을 구분해 줘.","배포, 서버, DB, 파일 저장소, 외부 AI, 예약 작업, 외부에서 들어오는 자동 요청을 찾아 앱 전용·공유·미확인으로 나눠 줘.","현재 공식 문서와 내 관리 화면을 확인해 자원별 중단 메뉴·권한·영향·재개 방법을 설명해 줘. 메뉴를 못 봤다면 문서 안내와 실제 확인을 구분해 줘.","진행 중 작업, 유지할 데이터, 중단 중 계속 청구될 수 있는 자원과 구독을 확인해 줘. 비용이 0이 된다고 보장하지 마."],"requirements":["이용자 안내, 신규 요청 차단, 진행 중 작업 처리, 필요한 기록 내보내기, 자원별 중단 순서를 계획해 줘. 내보낸 학생 자료를 공개 GitHub에 올리지 마.","일시 중단에서는 프로젝트·DB 삭제나 키 폐기를 기본 작업으로 삼지 마. 공유 자원은 유지하고 앱 전용 연결만 제한할 수 있는지 확인해 줘.","각 작업의 대상과 영향, 보관되는 자료, 재개 방법, 예상되는 비용을 설명하고 구체적으로 승인한 중단만 실행해 줘.","재개도 사용자 접속과 과금을 다시 시작할 수 있으므로 별도 요청을 확인해 줘. 예상과 다른 대상·영향이 나오면 다음 변경을 멈추고 알려 줘."],"tests":["승인 후 중단한 운영 주소를 새 창에서 확인하고 관리 화면의 프로젝트 상태와 대조해 줘. Vercel의 수동 중단이면 503 DEPLOYMENT_PAUSED가 기대되는지 최신 공식 문서로 확인해 줘.","기존에 열려 있던 창, 직접 데이터 요청, 별도 서버·DB 접근, 예약 작업과 AI 호출이 각 계획대로 처리되는지 확인해 줘. 시험 때문에 실제 유료 호출을 새로 발생시키지 마.","기존 자료와 공유 자원이 유지되는지, 중단하지 못한 자원과 비용 확인 위치가 무엇인지 기록해 줘.","재개를 요청한 경우에만 실행하고 정상 접속·권한·가상 제출을 확인해 줘. 비용과 외부 작업 재시작 여부도 확인해 줘."],"location":"Vercel은 올바른 팀과 프로젝트 → Settings → General → Pause Project에서 중단 영향을 확인합니다. 재개는 같은 화면의 Resume Project입니다. 이 경로는 2026-09-12 공식 문서 확인 기준이며 실행 때 현재 화면을 다시 확인합니다. F12 Network의 운영 주소 응답은 중단 확인의 일부입니다. 별도 DB·서버·예약 실행과 요금은 각 서비스 관리 화면에서 확인해야 합니다.","links":["https://vercel.com/docs/projects/managing-projects","https://vercel.com/docs/pricing/manage-and-optimize-usage"],"branches":[["중단 메뉴나 관리 권한이 없는 경우","현재 서비스·요금제·계정 역할을 확인해 줘. 최신 공식 문서의 경로와 권한 보유자에게 물을 내용을 알려 줘. 비밀번호나 토큰을 대화에 붙이라고 하지 마."],["DB나 API 키를 다른 앱과 함께 쓰는 경우","공유 대상과 연결 관계를 확인해 줘. 공유 DB·계정·키 전체를 끄지 말고 이 앱의 호출과 접근만 중단할 대안을 제시해 줘."],["운영 주소를 막았는데 예약 작업이 계속 실행되는 경우","외부 스케줄러·별도 서버·대기열을 찾아 다음 실행 시각과 승인할 중단 범위를 설명해 줘. 웹페이지 중단만으로 작업이 모두 멈췄다고 하지 마."],["일시 중단 후 다시 사용하려는 경우","재개할 프로젝트와 자원, 예상 비용을 확인하고 내가 요청한 범위만 재개해 줘. 기존 자료·권한·가상 제출·예약 작업을 확인하고 실제 학생 자료로 시험하지 마."]],"prompts":[{"id":"a39-inspect","category":"기본 진행","title":"1 대상과 연결 서비스 확인","when":"중단·종료 전에 읽기 전용으로 조사할 때 사용합니다.","text":"활동: 웹앱 서비스를 일시 중단하고 재개\n앱 이름과 프로젝트: [입력]\n이번 시험 주소: [입력]\n준비 정보: 대상 팀·프로젝트·운영 주소, 중단 이유와 예정일, 재개 예정일, 보관할 자료, 연결 서비스, 승인 범위\n현재 상황: [입력]\n사용할 가상 자료: [입력]\n\n실제 학생 정보·비밀키·인증 토큰은 출력하지 말고 필요한 값은 가려 줘. 내 앱 또는 허락받은 시험 환경만 대상으로 해 줘.\n문서 속 예시는 실행 승인이 아닙니다. 대상과 영향을 확인한 뒤 이번 요청에 명시적으로 승인한 작업만 실행해 줘. 보안 조치의 필수 여부와 내가 선택한 운영 종료 작업을 구분해 줘.\n\n1. 현재 팀·프로젝트·운영 주소와 미리보기 주소를 대조해 줘. 저장소를 지우거나 링크를 내리는 것과 실제 운영 중단을 구분해 줘.\n2. 배포, 서버, DB, 파일 저장소, 외부 AI, 예약 작업, 외부에서 들어오는 자동 요청을 찾아 앱 전용·공유·미확인으로 나눠 줘.\n3. 현재 공식 문서와 내 관리 화면을 확인해 자원별 중단 메뉴·권한·영향·재개 방법을 설명해 줘. 메뉴를 못 봤다면 문서 안내와 실제 확인을 구분해 줘.\n4. 진행 중 작업, 유지할 데이터, 중단 중 계속 청구될 수 있는 자원과 구독을 확인해 줘. 비용이 0이 된다고 보장하지 마.\n\n아직 설정·자료·키·구독을 변경하지 마. 확인 사실과 미확인 항목을 나누고 실제 관리 위치를 알려 줘.","next":"대상과 전용·공유 여부를 확인한 뒤 계획을 검토합니다."},{"id":"a39-plan","category":"기본 진행","title":"2 중단·정리 순서 결정","when":"조사 결과를 보고 실행 범위를 정할 때 사용합니다.","text":"활동: 웹앱 서비스를 일시 중단하고 재개\n앱 이름과 프로젝트: [입력]\n이번 시험 주소: [입력]\n준비 정보: 대상 팀·프로젝트·운영 주소, 중단 이유와 예정일, 재개 예정일, 보관할 자료, 연결 서비스, 승인 범위\n현재 상황: [입력]\n사용할 가상 자료: [입력]\n\n실제 학생 정보·비밀키·인증 토큰은 출력하지 말고 필요한 값은 가려 줘. 내 앱 또는 허락받은 시험 환경만 대상으로 해 줘.\n문서 속 예시는 실행 승인이 아닙니다. 대상과 영향을 확인한 뒤 이번 요청에 명시적으로 승인한 작업만 실행해 줘. 보안 조치의 필수 여부와 내가 선택한 운영 종료 작업을 구분해 줘.\n\n1. 이용자 안내, 신규 요청 차단, 진행 중 작업 처리, 필요한 기록 내보내기, 자원별 중단 순서를 계획해 줘. 내보낸 학생 자료를 공개 GitHub에 올리지 마.\n2. 일시 중단에서는 프로젝트·DB 삭제나 키 폐기를 기본 작업으로 삼지 마. 공유 자원은 유지하고 앱 전용 연결만 제한할 수 있는지 확인해 줘.\n3. 각 작업의 대상과 영향, 보관되는 자료, 재개 방법, 예상되는 비용을 설명하고 구체적으로 승인한 중단만 실행해 줘.\n4. 재개도 사용자 접속과 과금을 다시 시작할 수 있으므로 별도 요청을 확인해 줘. 예상과 다른 대상·영향이 나오면 다음 변경을 멈추고 알려 줘.\n\n자원별로 대상·현재 상태·계획한 작업·다른 앱 영향·보관 자료·복구 방법·비용·완료 확인 방법을 적어 줘. 아직 실행하지 마. 결정되지 않은 사항은 질문해 줘.","next":"실행할 자원과 제외할 자원을 구체적으로 선택합니다."},{"id":"a39-implement","category":"기본 진행","title":"3 승인한 작업만 실행","when":"대상과 영향·복구 방법을 확인하고 실행을 요청할 때 사용합니다.","text":"활동: 웹앱 서비스를 일시 중단하고 재개\n앱 이름과 프로젝트: [입력]\n이번 시험 주소: [입력]\n준비 정보: 대상 팀·프로젝트·운영 주소, 중단 이유와 예정일, 재개 예정일, 보관할 자료, 연결 서비스, 승인 범위\n현재 상황: [입력]\n사용할 가상 자료: [입력]\n\n실제 학생 정보·비밀키·인증 토큰은 출력하지 말고 필요한 값은 가려 줘. 내 앱 또는 허락받은 시험 환경만 대상으로 해 줘.\n문서 속 예시는 실행 승인이 아닙니다. 대상과 영향을 확인한 뒤 이번 요청에 명시적으로 승인한 작업만 실행해 줘. 보안 조치의 필수 여부와 내가 선택한 운영 종료 작업을 구분해 줘.\n\n승인한 자원과 작업: [정확한 대상과 중단/삭제/키 폐기/구독 해지별로 입력]\n제외할 자원: [입력]\n보관 및 복원 확인 결과: [입력]\n\n승인란이 비어 있으면 실행하지 말고 물어봐 줘. 실행 직전 대상과 현재 상태를 다시 확인해 줘. 삭제·키 폐기·구독 해지를 포괄적인 종료 요청 하나로 승인한 것으로 취급하지 마. 플랫폼이 요구하는 최종 확인은 따로 받아 줘.\n1. 이용자 안내, 신규 요청 차단, 진행 중 작업 처리, 필요한 기록 내보내기, 자원별 중단 순서를 계획해 줘. 내보낸 학생 자료를 공개 GitHub에 올리지 마.\n2. 일시 중단에서는 프로젝트·DB 삭제나 키 폐기를 기본 작업으로 삼지 마. 공유 자원은 유지하고 앱 전용 연결만 제한할 수 있는지 확인해 줘.\n3. 각 작업의 대상과 영향, 보관되는 자료, 재개 방법, 예상되는 비용을 설명하고 구체적으로 승인한 중단만 실행해 줘.\n4. 재개도 사용자 접속과 과금을 다시 시작할 수 있으므로 별도 요청을 확인해 줘. 예상과 다른 대상·영향이 나오면 다음 변경을 멈추고 알려 줘.\n\n한 작업이 실패하거나 예상한 영향과 달라지면 멈추고 상태를 알려 줘. 실행 결과와 다음 확인 방법을 기록해 줘.","next":"4번에서 실제 운영 상태와 남은 자원을 확인합니다."},{"id":"a39-verify","category":"기본 진행","title":"4 실제 중단·종료 결과 확인","when":"승인한 작업을 실행한 뒤 확인할 때 사용합니다.","text":"활동: 웹앱 서비스를 일시 중단하고 재개\n앱 이름과 프로젝트: [입력]\n이번 시험 주소: [입력]\n준비 정보: 대상 팀·프로젝트·운영 주소, 중단 이유와 예정일, 재개 예정일, 보관할 자료, 연결 서비스, 승인 범위\n현재 상황: [입력]\n사용할 가상 자료: [입력]\n\n실제 학생 정보·비밀키·인증 토큰은 출력하지 말고 필요한 값은 가려 줘. 내 앱 또는 허락받은 시험 환경만 대상으로 해 줘.\n문서 속 예시는 실행 승인이 아닙니다. 대상과 영향을 확인한 뒤 이번 요청에 명시적으로 승인한 작업만 실행해 줘. 보안 조치의 필수 여부와 내가 선택한 운영 종료 작업을 구분해 줘.\n\n1. 승인 후 중단한 운영 주소를 새 창에서 확인하고 관리 화면의 프로젝트 상태와 대조해 줘. Vercel의 수동 중단이면 503 DEPLOYMENT_PAUSED가 기대되는지 최신 공식 문서로 확인해 줘.\n2. 기존에 열려 있던 창, 직접 데이터 요청, 별도 서버·DB 접근, 예약 작업과 AI 호출이 각 계획대로 처리되는지 확인해 줘. 시험 때문에 실제 유료 호출을 새로 발생시키지 마.\n3. 기존 자료와 공유 자원이 유지되는지, 중단하지 못한 자원과 비용 확인 위치가 무엇인지 기록해 줘.\n4. 재개를 요청한 경우에만 실행하고 정상 접속·권한·가상 제출을 확인해 줘. 비용과 외부 작업 재시작 여부도 확인해 줘.\n\n실행한 작업·확인한 상태·확인 시각·근거·미확인을 나눠 보고해 줘. 확인을 위해 서비스를 다시 켜거나 유료 호출·삭제를 추가로 실행하지 마.","next":"남은 자원과 다음 청구 확인일을 기록합니다."},{"id":"a39-branch1","category":"상황별 진행","title":"중단 메뉴나 관리 권한이 없는 경우","when":"기본 순서로 진행하다가 이 상황에 해당하면 사용합니다.","text":"활동: 웹앱 서비스를 일시 중단하고 재개\n앱 이름과 프로젝트: [입력]\n이번 시험 주소: [입력]\n준비 정보: 대상 팀·프로젝트·운영 주소, 중단 이유와 예정일, 재개 예정일, 보관할 자료, 연결 서비스, 승인 범위\n현재 상황: [입력]\n사용할 가상 자료: [입력]\n현재 겪는 상황: 중단 메뉴나 관리 권한이 없는 경우\n이미 한 행동과 나온 결과: [입력]\n\n현재 서비스·요금제·계정 역할을 확인해 줘. 최신 공식 문서의 경로와 권한 보유자에게 물을 내용을 알려 줘. 비밀번호나 토큰을 대화에 붙이라고 하지 마.\n먼저 관련 코드·화면·설정에서 현재 상태를 확인하고 이 상황이 생긴 이유를 근거와 함께 설명해 줘. 현재 환경에서 확인할 수 없는 것은 따로 표시해 줘.\n이 활동에서 유지할 조건:\n1. 이용자 안내, 신규 요청 차단, 진행 중 작업 처리, 필요한 기록 내보내기, 자원별 중단 순서를 계획해 줘. 내보낸 학생 자료를 공개 GitHub에 올리지 마.\n2. 일시 중단에서는 프로젝트·DB 삭제나 키 폐기를 기본 작업으로 삼지 마. 공유 자원은 유지하고 앱 전용 연결만 제한할 수 있는지 확인해 줘.\n3. 각 작업의 대상과 영향, 보관되는 자료, 재개 방법, 예상되는 비용을 설명하고 구체적으로 승인한 중단만 실행해 줘.\n\n진행 순서를 “지금 확인할 것 → 선택 가능한 방법 → 내가 승인할 변경 → 실행 후 다시 확인할 결과”로 정리해 줘. 앱에 필요 없는 기능을 추가하거나 검사를 끄는 방식으로 해결하지 마.\n재시험에서는 다음 조건을 포함해 줘:\n1. 승인 후 중단한 운영 주소를 새 창에서 확인하고 관리 화면의 프로젝트 상태와 대조해 줘. Vercel의 수동 중단이면 503 DEPLOYMENT_PAUSED가 기대되는지 최신 공식 문서로 확인해 줘.\n2. 기존에 열려 있던 창, 직접 데이터 요청, 별도 서버·DB 접근, 예약 작업과 AI 호출이 각 계획대로 처리되는지 확인해 줘. 시험 때문에 실제 유료 호출을 새로 발생시키지 마.\n수정이 필요하면 먼저 범위를 제안하고 내 확인 전 운영 설정을 바꾸지 마. 실제 학생 정보·비밀키·인증 토큰은 출력하지 말고 필요한 값은 가려 줘. 내 앱 또는 허락받은 시험 환경만 대상으로 해 줘.","next":"이 상황에 맞는 방법을 선택한 뒤 기본 진행의 구현 또는 재시험 단계로 돌아갑니다. 해당 없음이면 이유를 기록하고 다른 활동을 고릅니다."},{"id":"a39-branch2","category":"상황별 진행","title":"DB나 API 키를 다른 앱과 함께 쓰는 경우","when":"기본 순서로 진행하다가 이 상황에 해당하면 사용합니다.","text":"활동: 웹앱 서비스를 일시 중단하고 재개\n앱 이름과 프로젝트: [입력]\n이번 시험 주소: [입력]\n준비 정보: 대상 팀·프로젝트·운영 주소, 중단 이유와 예정일, 재개 예정일, 보관할 자료, 연결 서비스, 승인 범위\n현재 상황: [입력]\n사용할 가상 자료: [입력]\n현재 겪는 상황: DB나 API 키를 n문서 속 예시는 실행 승인이 아닙니다. 대상과 영향을 확인한 뒤 이번 요청에 명시적으로 승인한 작업만 실행해 줘. 보안 조치의 필수 여부와 내가 선택한 운영 종료 작업을 구분해 줘.\n\nVercel은 올바른 팀과 프로젝트 → Settings → General → Pause Project에서 중단 영향을 확인합니다. 재개는 같은 화면의 Resume Project입니다. 이 경로는 2026-09-12 공식 문서 확인 기준이며 실행 때 현재 화면을 다시 확인합니다. F12 Network의 운영 주소 응답은 중단 확인의 일부입니다. 별도 DB·서버·예약 실행과 요금은 각 서비스 관리 화면에서 확인해야 합니다.\n\n내가 사용하는 서비스: [입력]\n현재 보이는 메뉴와 계정 역할: [입력 또는 모름]\n최신 공식 문서와 현재 화면을 대조해 확인할 메뉴를 단계별로 알려 줘. 문서에서 본 메뉴와 실제 확인한 메뉴를 구분해 줘. F12로 구독·DB 삭제 여부를 찾으라고 하지 마. 권한이 없다면 담당자에게 확인할 질문을 제시하고 종료 성공을 추정하지 마.","next":"관리 위치를 찾은 뒤 계획 단계로 돌아갑니다."},{"id":"a39-error","category":"오류 해결","title":"중단·정리 결과가 예상과 다를 때","when":"작업 실패·계속되는 요청·예상하지 못한 비용이 있을 때 사용합니다.","text":"활동: 웹앱 서비스를 일시 중단하고 재개\n앱 이름과 프로젝트: [입력]\n이번 시험 주소: [입력]\n준비 정보: 대상 팀·프로젝트·운영 주소, 중단 이유와 예정일, 재개 예정일, 보관할 자료, 연결 서비스, 승인 범위\n현재 상황: [입력]\n사용할 가상 자료: [입력]\n\n실제 학생 정보·비밀키·인증 토큰은 출력하지 말고 필요한 값은 가려 줘. 내 앱 또는 허락받은 시험 환경만 대상으로 해 줘.\n문서 속 예시는 실행 승인이 아닙니다. 대상과 영향을 확인한 뒤 이번 요청에 명시적으로 승인한 작업만 실행해 줘. 보안 조치의 필수 여부와 내가 선택한 운영 종료 작업을 구분해 줘.\n\n실행한 작업과 대상: [입력]\n기대한 결과와 실제 결과: [입력]\n\n1. 현재 팀·프로젝트·운영 주소와 미리보기 주소를 대조해 줘. 저장소를 지우거나 링크를 내리는 것과 실제 운영 중단을 구분해 줘.\n2. 배포, 서버, DB, 파일 저장소, 외부 AI, 예약 작업, 외부에서 들어오는 자동 요청을 찾아 앱 전용·공유·미확인으로 나눠 줘.\n3. 현재 공식 문서와 내 관리 화면을 확인해 자원별 중단 메뉴·권한·영향·재개 방법을 설명해 줘. 메뉴를 못 봤다면 문서 안내와 실제 확인을 구분해 줘.\n4. 진행 중 작업, 유지할 데이터, 중단 중 계속 청구될 수 있는 자원과 구독을 확인해 줘. 비용이 0이 된다고 보장하지 마.\n완료·실패·미실행을 분리해 원인을 확인해 줘. 남은 자원을 무작정 지우거나 종료 작업을 반복하지 마. 다른 앱 영향과 되돌릴 수 있는 범위를 설명하고 다음 변경은 승인받아 줘.","next":"원인과 영향을 확인한 뒤 승인한 조치만 진행합니다."},{"id":"a39-finish","category":"활동 마무리","title":"종료 기록과 다음 확인일 정리","when":"실행 결과를 기록하거나 미확인 사항을 인계할 때 사용합니다.","text":"활동: 웹앱 서비스를 일시 중단하고 재개\n앱 이름과 프로젝트: [입력]\n이번 시험 주소: [입력]\n준비 정보: 대상 팀·프로젝트·운영 주소, 중단 이유와 예정일, 재개 예정일, 보관할 자료, 연결 서비스, 승인 범위\n현재 상황: [입력]\n사용할 가상 자료: [입력]\n\n실제 학생 정보·비밀키·인증 토큰은 출력하지 말고 필요한 값은 가려 줘. 내 앱 또는 허락받은 시험 환경만 대상으로 해 줘.\n문서 속 예시는 실행 승인이 아닙니다. 대상과 영향을 확인한 뒤 이번 요청에 명시적으로 승인한 작업만 실행해 줘. 보안 조치의 필수 여부와 내가 선택한 운영 종료 작업을 구분해 줘.\n\n1. 승인 후 중단한 운영 주소를 새 창에서 확인하고 관리 화면의 프로젝트 상태와 대조해 줘. Vercel의 수동 중단이면 503 DEPLOYMENT_PAUSED가 기대되는지 최신 공식 문서로 확인해 줘.\n2. 기존에 열려 있던 창, 직접 데이터 요청, 별도 서버·DB 접근, 예약 작업과 AI 호출이 각 계획대로 처리되는지 확인해 줘. 시험 때문에 실제 유료 호출을 새로 발생시키지 마.\n3. 기존 자료와 공유 자원이 유지되는지, 중단하지 못한 자원과 비용 확인 위치가 무엇인지 기록해 줘.\n4. 재개를 요청한 경우에만 실행하고 정상 접속·권한·가상 제출을 확인해 줘. 비용과 외부 작업 재시작 여부도 확인해 줘.\n\n프로젝트·주소·정리한 자원·보관 자료의 위치와 기간·공유 자원·미실행 작업·남은 비용 확인 위치·다음 확인일·담당자를 Markdown으로 정리해 줘. 비밀값과 학생 원문은 제외해 줘. 일시 중단이라면 재개 방법과 승인 조건도 기록해 줘. 실제 실행·삭제·비용 절감을 확인하지 못한 것은 완료라고 쓰지 마.","next":"기록을 보관하고 정한 날짜에 남은 자원과 청구 내역을 다시 확인합니다."}]},{"id":40,"title":"더 이상 쓰지 않는 웹앱 완전 종료","group":"사용 종료와 서비스 정리","slides":"74","condition":"재개 계획 없이 해당 웹앱의 운영과 불필요한 자원을 정리하려는 경우","inputs":"종료할 정확한 프로젝트와 주소, 종료일, 이용자 안내, 보관할 자료와 기간, 자원 목록, 삭제·키 폐기·구독 해지별 승인 범위","inspect":["완전 종료가 맞는지와 대상 프로젝트를 확인해 줘. 배포·서버·DB·파일·백업·AI 키·예약 작업·도메인·구독의 전용 여부와 다른 앱 사용처를 읽기 전용으로 확인해 줘.","남길 코드와 필요한 기록, 삭제할 개인정보, 백업의 보관 기간·접근 권한을 구분해 줘. 목적과 보관 기준이 불명확한 자료는 임의로 삭제하지 마.","공식 문서에서 자원별 삭제·해지 영향, 복구 가능 여부, 비용 정산 시점과 보관료를 확인해 줘. 확인하지 못한 항목은 미확인으로 적어 줘.","학생 접속, 포털·공유 링크, 자동 배포, 외부 자동 요청과 예약 실행이 다시 서비스를 이용하거나 되살릴 수 있는지 확인해 줘."],"requirements":["이용자 안내와 신규 요청 차단부터 계획해 줘. 진행 중 작업 처리와 필요한 자료 내보내기를 마친 뒤 삭제를 검토해 줘.","백업 파일의 존재만 확인하지 말고 안전한 위치에서 열거나 복원 가능한지 확인할 방법을 제시해 줘. 백업에 담긴 개인정보의 권한과 정리 시점도 정해 줘.","정확한 자원별로 삭제·키 폐기·구독 해지 대상을 나눠 영향과 복구 가능성을 설명하고 각각 명시적으로 승인받아 줘. 공유 자원과 미확인 자원은 제외해 줘.","승인한 자원만 순서대로 정리하고 매 단계 결과를 확인해 줘. 예상 밖의 실패나 다른 앱 영향이 발견되면 반복 삭제나 다른 자원 정리로 넘어가지 말고 멈춰 줘."],"tests":["운영 주소와 알려진 별도 접근 경로가 계획대로 닫혔는지 확인해 줘. 홈페이지 오류 하나만으로 DB 삭제나 모든 서비스 종료를 확정하지 마.","관리 화면에서 승인한 자원 삭제·키 폐기·구독 해지 상태를 각각 확인하고 확인 시각과 근거를 기록해 줘. 키를 노출하거나 유료 호출로 폐기를 시험하지 마.","예약 실행·외부 자동 요청·자동 배포가 남았는지, 보관 자료와 다른 앱의 공유 자원은 유지되는지 확인해 줘.","이미 발생한 비용과 남은 보관료·구독, 다음 청구 확인일을 정리해 줘. 삭제·해지 또는 비용 절감을 확인하지 못했다면 완료로 표시하지 마."],"location":"각 서비스의 프로젝트 설정·데이터 관리·키 관리·구독 및 청구 화면에서 확인합니다. 정확한 팀·프로젝트·자원 이름과 공식 문서를 먼저 대조합니다. F12로는 접속 요청의 결과만 확인할 수 있으며 DB·백업 삭제, 키 폐기, 구독 해지는 해당 관리 화면의 근거가 필요합니다.","links":["https://vercel.com/docs/projects/managing-projects","https://vercel.com/docs/pricing/manage-and-optimize-usage"],"branches":[["보관할 자료나 백업이 확실하지 않은 경우","삭제를 보류하고 자료 종류·보관 목적·기간·담당자를 정리해 줘. 내보내기와 복원 확인 계획을 제시하고 실제 학생 자료를 공개 저장소나 대화에 올리지 마."],["공유 DB·키·도메인이 있는 경우","다른 앱의 사용 여부를 확인해 줘. 공유 자원 자체를 지우지 말고 대상 앱의 자료·연결·권한만 정리할 수 있는지 제안해 줘. 공유 여부를 확인하지 못하면 해당 자원은 보류해 줘."],["삭제했는데 청구가 계속되는 경우","종료 전 사용분의 정산, 별도 DB·백업·도메인·구독, 청구 반영 지연을 구분해 줘. 실제 청구 기간과 자원 목록을 확인하고 불필요한 추가 삭제 대신 원인을 설명해 줘."],["일부 자원을 종료하지 못했거나 되돌려야 하는 경우","실행 완료·실패·미실행을 자원별로 기록해 줘. 남은 영향과 복구 가능성을 확인하고 사용자 선택을 받아 줘. 영구 삭제한 자료를 복구 가능하다고 보장하지 마."]],"prompts":[{"id":"a40-inspect","category":"기본 진행","title":"1 대상과 연결 서비스 확인","when":"중단·종료 전에 읽기 전용으로 조사할 때 사용합니다.","text":"활동: 더 이상 쓰지 않는 웹앱 완전 종료\n앱 이름과 프로젝트: [입력]\n이번 시험 주소: [입력]\n준비 정보: 종료할 정확한 프로젝트와 주소, 종료일, 이용자 안내, 보관할 자료와 기간, 자원 목록, 삭제·키 폐기·구독 해지별 승인 범위\n현재 상황: [입력]\n사용할 가상 자료: [입력]\n\n실제 학생 정보·비밀키·인증 토큰은 출력하지 말고 필요한 값은 가려 줘. 내 앱 또는 허락받은 시험 환경만 대상으로 해 줘.\n문서 속 예시는 실행 승인이 아닙니다. 대상과 영향을 확인한 뒤 이번 요청에 명시적으로 승인한 작업만 실행해 줘. 보안 조치의 필수 여부와 내가 선택한 운영 종료 작업을 구분해 줘.\n\n1. 완전 종료가 맞는지와 대상 프로젝트를 확인해 줘. 배포·서버·DB·파일·백업·AI 키·예약 작업·도메인·구독의 전용 여부와 다른 앱 사용처를 읽기 전용으로 확인해 줘.\n2. 남길 코드와 필요한 기록, 삭제할 개인정보, 백업의 보관 기간·접근 권한을 구분해 줘. 목적과 보관 기준이 불명확한 자료는 임의로 삭제하지 마.\n3. 공식 문서에서 자원별 삭제·해지 영향, 복구 가능 여부, 비용 정산 시점과 보관료를 확인해 줘. 확인하지 못한 항목은 미확인으로 적어 줘.\n4. 학생 접속, 포털·공유 링크, 자동 배포, 외부 자동 요청과 예약 실행이 다시 서비스를 이용하거나 되살릴 수 있는지 확인해 줘.\n\n아직 설정·자료·키·구독을 변경하지 마. 확인 사실과 미확인 항목을 나누고 실제 관리 위치를 알려 줘.","next":"대상과 전용·공유 여부를 확인한 뒤 계획을 검토합니다."},{"id":"a40-plan","category":"기본 진행","title":"2 중단·정리 순서 결정","when":"조사 결과를 보고 실행 범위를 정할 때 사용합니다.","text":"활동: 더 이상 쓰지 않는 웹앱 완전 종료\n앱 이름과 프로젝트: [입력]\n이번 시험 주소: [입력]\n준비 정보: 종료할 정확한 프로젝트와 주소, 종료일, 이용자 안내, 보관할 자료와 기간, 자원 목록, 삭제·키 폐기·구독 해지별 승인 범위\n현재 상황: [입력]\n사용할 가상 자료: [입력]\n\n실제 학생 정보·비밀키·인증 토큰은 출력하지 말고 필요한 값은 가려 줘. 내 앱 또는 허락받은 시험 환경만 대상으로 해 줘.\n문서 속 예시는 실행 승인이 아닙니다. 대상과 영향을 확인한 뒤 이번 요청에 명시적으로 승인한 작업만 실행해 줘. 보안 조치의 필수 여부와 내가 선택한 운영 종료 작업을 구분해 줘.\n\n1. 이용자 안내와 신규 요청 차단부터 계획해 줘. 진행 중 작업 처리와 필요한 자료 내보내기를 마친 뒤 삭제를 검토해 줘.\n2. 백업 파일의 존재만 확인하지 말고 안전한 위치에서 열거나 복원 가능한지 확인할 방법을 제시해 줘. 백업에 담긴 개인정보의 권한과 정리 시점도 정해 줘.\n3. 정확한 자원별로 삭제·키 폐기·구독 해지 대상을 나눠 영향과 복구 가능성을 설명하고 각각 명시적으로 승인받아 줘. 공유 자원과 미확인 자원은 제외해 줘.\n4. 승인한 자원만 순서대로 정리하고 매 단계 결과를 확인해 줘. 예상 밖의 실패나 다른 앱 영향이 발견되면 반복 삭제나 다른 자원 정리로 넘어가지 말고 멈춰 줘.\n\n자원별로 대상·현재 상태·계획한 작업·다른 앱 영향·보관 자료·복구 방법·비용·완료 확인 방법을 적어 줘. 아직 실행하지 마. 결정되지 않은 사항은 질문해 줘.","next":"실행할 자원과 제외할 자원을 구체적으로 선택합니다."},{"id":"a40-implement","category":"기본 진행","title":"3 승인한 작업만 실행","when":"대상과 영향·복구 방법을 확인하고 실행을 요청할 때 사용합니다.","text":"활동: 더 이상 쓰지 않는 웹앱 완전 종료\n앱 이름과 프로젝트: [입력]\n이번 시험 주소: [입력]\n준비 정보: 종료할 정확한 프로젝트와 주소, 종료일, 이용자 안내, 보관할 자료와 기간, 자원 목록, 삭제·키 폐기·구독 해지별 승인 범위\n현재 상황: [입력]\n사용할 가상 자료: [입력]\n\n실제 학생 정보·비밀키·인증 토큰은 출력하지 말고 필요한 값은 가려 줘. 내 앱 또는 허락받은 시험 환경만 대상으로 해 줘.\n문서 속 예시는 실행 승인이 아닙니다. 대상과 영향을 확인한 뒤 이번 요청에 명시적으로 승인한 작업만 실행해 줘. 보안 조치의 필수 여부와 내가 선택한 운영 종료 작업을 구분해 줘.\n\n승인한 자원과 작업: [정확한 대상과 중단/삭제/키 폐기/구독 해지별로 입력]\n제외할 자원: [입력]\n보관 및 복원 확인 결과: [입력]\n\n승인란이 비어 있으면 실행하지 말고 물어봐 줘. 실행 직전 대상과 현재 상태를 다시 확인해 줘. 삭제·키 폐기·구독 해지를 포괄적인 종료 요청 하나로 승인한 것으로 취급하지 마. 플랫폼이 요구하는 최종 확인은 따로 받아 줘.\n1. 이용자 안내와 신규 요청 차단부터 계획해 줘. 진행 중 작업 처리와 필요한 자료 내보내기를 마친 뒤 삭제를 검토해 줘.\n2. 백업 파일의 존재만 확인하지 말고 안전한 위치에서 열거나 복원 가능한지 확인할 방법을 제시해 줘. 백업에 담긴 개인정보의 권한과 정리 시점도 정해 줘.\n3. 정확한 자원별로 삭제·키 폐기·구독 해지 대상을 나눠 영향과 복구 가능성을 설명하고 각각 명시적으로 승인받아 줘. 공유 자원과 미확인 자원은 제외해 줘.\n4. 승인한 자원만 순서대로 정리하고 매 단계 결과를 확인해 줘. 예상 밖의 실패나 다른 앱 영향이 발견되면 반복 삭제나 다른 자원 정리로 넘어가지 말고 멈춰 줘.\n\n한 작업이 실패하거나 예상한 영향과 달라지면 멈추고 상태를 알려 줘. 실행 결과와 다음 확인 방법을 기록해 줘.","next":"4번에서 실제 운영 상태와 남은 자원을 확인합니다."},{"id":"a40-verify","category":"기본 진행","title":"4 실제 중단·종료 결과 확인","when":"승인한 작업을 실행한 뒤 확인할 때 사용합니다.","text":"활동: 더 이상 쓰지 않는 웹앱 완전 종료\n앱 이름과 프로젝트: [입력]\n이번 시험 주소: [입력]\n준비 정보: 종료할 정확한 프로젝트와 주소, 종료일, 이용자 안내, 보관할 자료와 기간, 자원 목록, 삭제·키 폐기·구독 해지별 승인 범위\n현재 상황: [입력]\n사용할 가상 자료: [입력]\n\n실제 학생 정보·비밀키·인증 토큰은 출력하지 말고 필요한 값은 가려 줘. 내 앱 또는 허락받은 시험 환경만 대상으로 해 줘.\n문서 속 예시는 실행 승인이 아닙니다. 대상과 영향을 확인한 뒤 이번 요청에 명시적으로 승인한 작업만 실행해 줘. 보안 조치의 필수 여부와 내가 선택한 운영 종료 작업을 구분해 줘.\n\n1. 운영 주소와 알려진 별도 접근 경로가 계획대로   if(!choices.includes(selected))selected='기본 진행';
  const filtered=a.prompts.filter(p=>p.category===selected||(p.category==='상황별 진행'&&p.title===selected));
  main.innerHTML=`<div class="eyebrow">${esc(a.group)} · 활동 ${a.id}</div><h1>${esc(a.title)}</h1><p class="intro">필요한 상황을 선택하고 한 단계씩 진행하세요. 다른 활동을 먼저 완료할 필요는 없습니다.</p><dl class="metadata"><div class="meta"><dt>사용하는 경우</dt><dd>${esc(a.condition)}</dd></div><div class="meta"><dt>준비할 정보</dt><dd>${esc(a.inputs)}</dd></div></dl><section class="location"><h2>어디서 확인하나요</h2><p>${esc(a.location)}</p></section><div class="links">${a.links.map((u,i)=>`<a href="${esc(u)}" target="_blank" rel="noopener noreferrer">${u.includes('webapp-security-lab')?'체험 또는 자기점검 안내':'관련 사례 또는 공식 자료'} ${i+1} ↗</a>`).join('')}</div><h2>지금 상황을 선택하세요</h2><div class="scenario-nav" aria-label="상황 선택">${choices.map(c=>`<button data-scenario="${esc(c)}" aria-pressed="${c===selected}">${esc(c)}</button>`).join('')}</div><section id="prompts" aria-label="선택한 상황의 프롬프트">${filtered.map(promptCard).join('')}</section><details class="guidance"><summary>구현할 때 적용할 조건</summary><ul>${a.requirements.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></details>`+footer();
 }else if(hash==='#references'){
  main.innerHTML='<div class="eyebrow">참고 자료</div><h1>공식 안내와 체험 자료</h1><p class="intro">학교 서식과 서비스 설정은 실제 적용 시점의 자료로 다시 확인하세요.</p>'+BOOK.references.map(([n,u,d])=>`<section class="guidance"><h2><a href="${esc(u)}" target="_blank" rel="noopener noreferrer">${esc(n)} ↗</a></h2><p>${esc(d)}</p></section>`).join('')+footer();
 }else{
  main.innerHTML=`<div class="eyebrow">연수 후 자기 웹앱에 적용하는 부록</div><h1>${esc(BOOK.title)}</h1><p class="intro">${BOOK.activities.length}개 활동 · ${BOOK.promptCount}개 복사 프롬프트<br>자기 앱에 필요한 활동을 골라 점검하고 수정합니다.</p><h2>전체 목차</h2>${BOOK.groups.map(g=>`<section><h3>${esc(g)}</h3><ul class="toc">${BOOK.activities.filter(a=>a.group===g).map(a=>`<li><a href="#activity-${a.id}">${a.id}. ${esc(a.title)}</a></li>`).join('')}</ul></section>`).join('')}${BOOK.intro.map(([h,ps])=>`<section class="guidance"><h2>${esc(h)}</h2>${ps.map(p=>`<p>${esc(p)}</p>`).join('')}</section>`).join('')}<h2>새 대화에서 먼저 보낼 공통 프롬프트</h2>${promptCard({id:'common',title:'프로젝트와 작업 범위 알려 주기',when:'새로운 AI 대화를 시작할 때 먼저 보냅니다.',text:BOOK.commonPrompt})}`+footer();
 }
}
async function copyText(id,button){
 const value=allPrompts.get(id);if(!value)return;
 let ok=false;try{if(navigator.clipboard&&window.isSecureContext){await navigator.clipboard.writeText(value);ok=true}}catch{}
 if(!ok){const el=document.createElement('textarea');el.value=value;el.style.cssText='position:fixed;left:-9999px;top:0';document.body.append(el);el.select();try{ok=document.execCommand('copy')}catch{}el.remove();button.focus()}
 if(ok){button.textContent='복사됨';tell('프롬프트를 복사했습니다. AI 도구에 붙여 넣고 입력칸을 바꾸세요.');setTimeout(()=>{if(button.isConnected)button.textContent='복사'},1800)}
 else{document.querySelector('#fallbackText').value=value;document.querySelector('#copyFallback').showModal();document.querySelector('#fallbackText').select()}
}
main.addEventListener('click',e=>{const copy=e.target.closest('[data-copy]');if(copy){copyText(copy.dataset.copy,copy);return}const s=e.target.closest('[data-scenario]');if(s){selected=s.dataset.scenario;render();main.querySelectorAll('[data-scenario]').forEach(b=>{if(b.dataset.scenario===selected)b.focus()})}});
document.querySelector('#menuToggle').addEventListener('click',()=>{const open=document.body.classList.toggle('menu-open');document.querySelector('#menuToggle').setAttribute('aria-expanded',String(open))});
document.querySelector('#selectText').onclick=()=>document.querySelector('#fallbackText').select();
document.querySelector('#closeDialog').onclick=()=>document.querySelector('#copyFallback').close();
document.addEventListener('keydown',e=>{if(e.key==='Escape'){document.body.classList.remove('menu-open');document.querySelector('#menuToggle').setAttribute('aria-expanded','false')}});
window.addEventListener('hashchange',()=>{selected='기본 진행';render();document.body.classList.remove('menu-open');document.querySelector('#menuToggle').setAttribute('aria-expanded','false');window.scrollTo(0,0);main.focus({preventScroll:true})});
render();
</script>
</body></html>
