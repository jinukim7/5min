<!DOCTYPE html>

  <!-- Stylesheets -->
  <link rel="stylesheet" href="./src/css/variables.css">
  <link rel="stylesheet" href="./src/css/reset.css">
  <link rel="stylesheet" href="./src/css/style.css">

  <link rel="stylesheet" href="./src/css/typing.css">
  <link rel="stylesheet" href="./src/css/etiquette.css">

<body>

      <div class="brand-logo" data-view="home">

        <span>바름 5분</span>

      <span class="brand-sub" id="header-school-class">올바른 루틴 프로젝트</span>

        <svg width="14" height="14" viewBox="0 0 24 24">

      <button class="btn btn-mode-toggle" id="btn-mode-toggle">

  </main>

  <footer style="background: var(--bg-dark); color: #FFFFFF; padding: 4.5rem 1.5rem 3rem; text-align: center; border-top: 1px solid var(--border-dark); margin-top: 4rem;">
    <div style="max-width: 800px; margin: 0 auto;">
      <div style="display: inline-flex; align-items: center; justify-content: center; width: 44px; height: 44px; background: #FFFFFF; color: #111827; border-radius: 12px; font-weight: 800; font-size: 1.4rem; margin-bottom: 1.25rem;">

        </div>
        <div>
          © 2026 바름 5분 · 제작: jinukim
        </div>
      </div>
    </div>

  <div class="toast-container" id="toast-container"></div>
